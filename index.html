/* =============================================================================
   SPIN — identité "Affiche de match" (trame halftone).
   Chaque écran est traité comme une affiche / un programme de match imprimé
   dans les années 70 : papier journal avec son grain, impression en deux
   encres (la couleur officielle du tournoi + sa seconde couleur, utilisée
   comme "deuxième plaque" légèrement décalée), et des trames de points dont
   chaque point est littéralement une balle de ping-pong.
   Règles du système :
   - Le ton ne passe QUE par des trames de points (pas de dégradé lisse, pas
     d'ombre floue). Les trames "vraies" (points qui grossissent) sont de
     petits SVG générés (--ht-*), utilisés en mask-image : leur couleur vient
     de background-color, donc chaque thème de tournoi les recolore seul.
   - Contours à l'encre (--rule), coins presque droits pour les blocs
     imprimés ; rond uniquement pour ce qui est une balle (tampons, pastilles
     de série, boutons de mise, médailles).
   - Décalage de repérage (--accent2) sur les éléments d'action et les gros
     titres, jamais d'ombre noire.
   - Capitales uniquement pour les titres d'affiche (bandeaux de tournoi,
     fiche joueur, récap, connexion) ; tout le reste en casse normale.
   ========================================================================== */

/* Jetons dérivés : redéclarés sur chaque élément qui porte ses propres
   couleurs de tournoi (style="--paper:…" posé par themeVarsCss), sinon ils
   garderaient les couleurs de la page. */
:root,[style*="--ink:"]{
  --rule:color-mix(in srgb,var(--ink) 84%,transparent);
  --rule-2:color-mix(in srgb,var(--ink) 34%,transparent);
  --rule-3:color-mix(in srgb,var(--ink) 18%,transparent);
  --tint:color-mix(in srgb,var(--accent) 20%,transparent);
  --sun:color-mix(in srgb,var(--accent) 26%,transparent);
  --wash:color-mix(in srgb,var(--paper) 58%,var(--card));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{
  margin:0;min-height:100vh;color:var(--ink);font:400 15.5px/1.5 var(--f-body);
  background:var(--paper);font-variant-numeric:tabular-nums;
  transition:background-color .3s var(--ease);
}
/* Grain du papier : taches d'encre éparses posées par-dessus TOUT l'écran,
   comme sur une vraie feuille imprimée. Très discret, jamais cliquable. */
body::after{
  content:"";position:fixed;inset:0;z-index:90;pointer-events:none;
  background:var(--ink);opacity:.06;
  -webkit-mask:var(--grain);mask:var(--grain);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--accent-ink);outline-offset:2px;border-radius:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* --- Trame réutilisable : un calque ::before teinté, masqué par une trame.
   Le parent fixe la couleur (--ht-c) et la trame (--ht-m). --- */
.ht{position:relative;isolation:isolate}
.ht::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:var(--ht-c,var(--accent2));-webkit-mask:var(--ht-m);mask:var(--ht-m)}

/* --- Balle de ping-pong en trame : disque papier, contour encre, ombre
   propre en points. Signature de l'identité (connexion, chargement, vide,
   récap). La taille vient de width/height. --- */
.ball{display:inline-block;flex:none;border-radius:50%;position:relative;overflow:hidden;
  background:var(--card-top);box-shadow:inset 0 0 0 2px var(--ink)}
.ball::after{content:"";position:absolute;inset:0;background:var(--ball-ink,var(--accent));
  -webkit-mask:var(--ht-ball) center/100% 100%;mask:var(--ht-ball) center/100% 100%}
.ball.s::after{-webkit-mask-image:var(--ht-ball-s);mask-image:var(--ht-ball-s)}

/* Le logo peint en aplat avec la couleur d'accent du moment. C'est le VRAI
   logo (PNG détouré, voir LOGO) utilisé comme masque CSS : il se recolore
   donc automatiquement avec --accent, y compris en mode Halloween — jamais
   remplacé par un autre dessin. */
.mark{flex:none;display:inline-block;background-color:var(--accent);
  -webkit-mask-image:var(--logo);mask-image:var(--logo);
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;
  transition:background-color .3s var(--ease)}
.mark.light{background-color:var(--on-accent)}
.spooky .mark{filter:drop-shadow(0 0 5px rgba(224,122,46,.65)) drop-shadow(0 0 11px rgba(140,95,201,.32))}
@media (prefers-reduced-motion:no-preference){ .spooky .mark{animation:markflicker 3.6s ease-in-out infinite} }
@keyframes markflicker{
  0%,100%{filter:drop-shadow(0 0 5px rgba(224,122,46,.65)) drop-shadow(0 0 11px rgba(140,95,201,.3))}
  18%{filter:drop-shadow(0 0 7px rgba(224,122,46,.85)) drop-shadow(0 0 13px rgba(140,95,201,.4))}
  41%{filter:drop-shadow(0 0 4px rgba(224,122,46,.5)) drop-shadow(0 0 8px rgba(140,95,201,.24))}
  63%{filter:drop-shadow(0 0 6.5px rgba(224,122,46,.78)) drop-shadow(0 0 10px rgba(140,95,201,.34))}
  82%{filter:drop-shadow(0 0 4.5px rgba(224,122,46,.56)) drop-shadow(0 0 9px rgba(140,95,201,.28))}
}

/* -----------------------------------------------------------------------
   Ossature : barre d'onglets en bas sur mobile, rail à gauche sur grand
   écran. Derrière tout le contenu, un grand "soleil" de trame dans l'angle
   haut-droit de l'écran, à la couleur du tournoi : l'ambiance d'affiche.
   ----------------------------------------------------------------------- */
.shell{max-width:1180px;margin:0 auto;min-height:100vh;position:relative;z-index:2}
.shell::before{content:none;position:fixed;top:-60px;right:-120px;width:760px;aspect-ratio:1;z-index:-1;pointer-events:none;
  background:var(--sun);-webkit-mask:var(--ht-sun) top right/100% 100% no-repeat;mask:var(--ht-sun) top right/100% 100% no-repeat}
.content{padding:0 14px 104px;min-width:0}
@media (min-width:860px){
  .shell{display:grid;grid-template-columns:84px minmax(0,1fr)}
  .content{padding:0 40px 56px}
  .shell::before{content:""}
}
@media (min-width:1180px){ .shell{grid-template-columns:232px minmax(0,1fr)} }

@media (prefers-reduced-motion:no-preference){
  button,.scorebtn,.btn,input,select,.pillbtn,.jchip,.lbrow{transition:background-color .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease),transform .12s var(--ease)}
}

/* --- Navigation --- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:2px solid var(--rule);
  padding:5px 4px calc(5px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}
.nav::before{content:"";position:absolute;left:0;right:0;bottom:calc(100% + 2px);height:18px;pointer-events:none;background:var(--paper);
  -webkit-mask:var(--ht-edge) bottom left/60px 28px repeat-x;mask:var(--ht-edge) bottom left/60px 28px repeat-x}
.navbrand,.navfoot{display:none}
.navitem{flex:1;max-width:92px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:4px 2px 3px;color:var(--ink-soft);position:relative;isolation:isolate}
.navitem svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;margin:6px 0 3px}
.navitem span{font:600 11px/1 var(--f-body);letter-spacing:.005em}
.navitem[aria-current="page"]{color:var(--ink)}
.navitem[aria-current="page"] svg{color:var(--on-accent);stroke-width:2.1}
.navitem[aria-current="page"]::before{content:"";position:absolute;top:1px;left:50%;width:36px;height:36px;margin-left:-18px;z-index:-1;border-radius:50%;
  background:var(--accent);box-shadow:2.5px 2.5px 0 var(--accent2)}
.navitem[aria-current="page"] span{font-weight:700}
.navdot{position:absolute;top:0;left:calc(50% + 6px);min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:var(--live);
  color:#fff;font:800 12.5px/19px var(--f-display);text-align:center;box-shadow:0 0 0 2px var(--paper)}
@media (min-width:860px){
  .nav{position:sticky;top:0;left:auto;right:auto;bottom:auto;height:100vh;flex-direction:column;justify-content:flex-start;
    align-items:stretch;width:84px;padding:22px 10px;border-top:0;border-right:2px solid var(--rule);gap:6px}
  .nav::before{display:none}
  .navbrand{display:flex;justify-content:center;margin:0 0 26px}
  .navitem{flex:none;max-width:none;padding:6px 4px 8px}
  .navdot{left:calc(50% + 8px)}
  .navfoot{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:auto;padding-top:16px;
    background:radial-gradient(circle,var(--rule-2) 1.1px,transparent 1.5px) top/6px 4px repeat-x}
  .navfoot .linkbtn{font-size:10px;padding:2px}
  .navfoot .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;
    justify-content:center;font:800 17px/1 var(--f-display);box-shadow:2px 2px 0 var(--accent2)}
}
@media (min-width:1180px){
  .nav{width:232px;padding:26px 16px}
  .navbrand{justify-content:flex-start;align-items:center;gap:10px;font:900 34px/1 var(--f-display);letter-spacing:.02em;padding:0 8px;
    text-shadow:2px 2px 0 var(--accent2)}
  .navbrand::after{content:"SPIN"}
  .navitem{flex-direction:row;justify-content:flex-start;gap:14px;padding:8px 10px}
  .navitem svg{margin:0}
  .navitem[aria-current="page"]::before{left:3px;top:50%;margin:-18px 0 0}
  .navitem{gap:18px}
  .navitem span{font:700 20px/1 var(--f-display);letter-spacing:.01em}
  .navdot{position:static;margin-left:auto;box-shadow:none}
  .navfoot{flex-direction:row;justify-content:space-between;padding:16px 8px 0}
}

/* --- Barre du haut (mobile) : manchette du journal + ticker du direct.
   Le bas se dissout en points quand la liste défile dessous. --- */
.topbar{position:sticky;top:0;z-index:10;background:var(--paper);padding-top:env(safe-area-inset-top);isolation:isolate}
.topbar::before{content:"";position:absolute;top:0;right:-14px;width:min(340px,80vw);height:100%;z-index:-1;pointer-events:none;background:var(--sun);
  -webkit-mask:var(--ht-sun) top right/340px 340px no-repeat;mask:var(--ht-sun) top right/340px 340px no-repeat}
.topbar::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;pointer-events:none;background:var(--paper);
  transform:scaleY(-1);-webkit-mask:var(--ht-edge) bottom left/60px 28px repeat-x;mask:var(--ht-edge) bottom left/60px 28px repeat-x}
.topbar-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;border-bottom:2px solid var(--rule);margin-bottom:10px}
.brand{font:900 34px/.85 var(--f-display);letter-spacing:.02em;display:flex;align-items:center;gap:9px;color:var(--ink);
  text-transform:uppercase;text-shadow:2px 2px 0 var(--accent2)}
.topbar-row .me{display:flex;align-items:center;gap:6px;color:var(--ink-soft);font:600 13px/1 var(--f-body)}
.topbar-row .me > span{max-width:7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--accent-ink);font:700 inherit/1.2 var(--f-body);font-size:inherit;
  text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.linkbtn:hover{color:var(--ink)}
.linkbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;display:block}
.themetoggle,.soundtoggle{display:inline-flex;align-items:center;padding:5px;text-decoration:none;color:var(--ink)}
@media (min-width:860px){ .topbar-row{display:none} .topbar{padding-top:18px} .topbar::before{display:none} }

.content > main{padding-top:10px}
@media (min-width:860px){ .content > main,.content > .topbar{max-width:900px} }
.ticker{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 0 10px;margin:0}
.ticker::-webkit-scrollbar{display:none}
.tickeritem{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);border-radius:3px;
  padding:7px 12px 7px 10px;font:700 15px/1 var(--f-display);letter-spacing:.01em;white-space:nowrap;box-shadow:2.5px 2.5px 0 var(--live)}
.tickerdot{width:8px;height:8px;border-radius:50%;background:var(--live);flex:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--live) 35%,transparent)}
@media (prefers-reduced-motion:no-preference){ .tickerdot{animation:blink 1.3s step-end infinite} }
.tickerscore{font:900 17px/1 var(--f-display);color:var(--paper);padding:0 2px}

/* --- Tuiles de stats : des tickets de match, avec leurs encoches
   découpées et un coin de trame qui monte vers le chiffre. --- */
.statrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 16px}
.stattile{position:relative;isolation:isolate;overflow:hidden;background:var(--card);border:2px solid var(--rule);border-radius:var(--radius);
  padding:12px 14px 12px 16px;
  -webkit-mask:radial-gradient(circle at 0 50%,transparent 7px,#000 7.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 7px,#000 7.5px) right/51% 100% no-repeat;
  mask:radial-gradient(circle at 0 50%,transparent 7px,#000 7.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 7px,#000 7.5px) right/51% 100% no-repeat}
.stattile::before{content:"";position:absolute;right:0;bottom:0;width:150px;height:150px;z-index:-1;background:var(--tint);transform:scaleY(-1);
  -webkit-mask:var(--ht-sun) top right/100% 100% no-repeat;mask:var(--ht-sun) top right/100% 100% no-repeat}
.stattile b{display:block;font:800 44px/.9 var(--f-display);color:var(--ink);letter-spacing:-.005em;margin-bottom:4px}
.stattile b.accent{color:var(--accent-ink);text-shadow:2px 2px 0 color-mix(in srgb,var(--accent2) 55%,transparent)}
.stattile span{display:block;font:600 12.5px/1.3 var(--f-body);color:var(--ink-soft)}

/* --- Bandeau "le récap est prêt" : une mini-affiche aux couleurs du
   tournoi terminé, avec l'incrustation REC du récap et ses lignes de
   balayage — l'avant-goût de l'écran de bilan. --- */
.recapnotice{position:relative;isolation:isolate;overflow:hidden;margin:0 0 18px;padding:12px 52px 15px 15px;background:var(--accent);color:var(--on-accent);
  border:2px solid var(--rule);border-radius:var(--radius-lg);box-shadow:4px 4px 0 var(--accent2)}
.recapnotice::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--accent2);
  -webkit-mask:var(--ht-fade) right center/480px 80px repeat-y;mask:var(--ht-fade) right center/480px 80px repeat-y}
.recapnotice::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.13) 0 1px,transparent 1px 3px)}
.recapnotice-rec{display:inline-flex;align-items:center;gap:6px;font:800 12px/1 var(--f-display);letter-spacing:.16em}
.recapnotice-rec i{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--on-accent) 60%,transparent)}
@media (prefers-reduced-motion:no-preference){ .recapnotice-rec i{animation:blink 1.4s step-end infinite} }
.recapnotice-kicker{margin:9px 0 3px;font:700 13px/1.2 var(--f-body);opacity:.92}
.recapnotice-title{margin:0;font:900 28px/.92 var(--f-display);text-transform:uppercase;letter-spacing:.015em;
  text-shadow:2px 0 rgba(255,40,80,.55),-2px 0 rgba(40,220,255,.5)}
.recapnotice-sub{margin:7px 0 0;font:500 13.5px/1.35 var(--f-body);opacity:.92;max-width:34ch}
.recapnotice .btn{margin-top:12px;background:var(--card-top);color:var(--ink);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.recapnotice .btn:hover{background:var(--paper)}
.recapnotice-close{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);background:var(--card-top);
  color:var(--ink);font:800 22px/1 var(--f-display);display:grid;place-items:center;padding:0 0 3px}
.recapnotice-close:hover{background:var(--ink);color:var(--paper)}

/* --- Filtres : pastilles encrées ; la choisie est imprimée à l'encre pleine. --- */
.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.pillbtn,.jchip{background:var(--card-top);border:2px solid var(--rule);border-radius:999px;padding:6px 14px 7px;
  font:700 17px/1 var(--f-display);letter-spacing:.015em;color:var(--ink);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.pillbtn:hover,.jchip:hover{border-color:var(--ink)}
.pillbtn[aria-pressed="true"],.jchip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:2.5px 2.5px 0 var(--accent)}
.pillbtn .cnt{display:inline-grid;place-items:center;min-width:21px;height:21px;padding:0 5px;border-radius:11px;background:var(--rule-3);
  font:800 13px/1 var(--f-display);color:inherit}
.pillbtn[aria-pressed="true"] .cnt{background:var(--accent);color:var(--on-accent)}
.journeerow{display:flex;gap:7px;margin:0 0 14px;padding:2px 3px 9px 1px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.journeerow::-webkit-scrollbar{height:4px}
.jchip{flex:0 0 auto;font-size:16px;padding:5px 13px 6px}

/* -----------------------------------------------------------------------
   Liste de matchs : chaque tournoi est une affiche collée sur la page —
   bloc à ses propres couleurs officielles (posées sur .compgroup), bandeau
   d'en-tête imprimé dont la trame grossit vers la droite, puis les rangées.
   ----------------------------------------------------------------------- */
.compgroup{margin:22px 0 8px;background:var(--card);color:var(--ink);border:2px solid var(--rule);border-radius:var(--radius-lg);
  overflow:hidden;box-shadow:4px 4px 0 var(--accent2)}
.compgroup:first-of-type{margin-top:6px}
.complabel{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;gap:10px;margin:0;padding:13px 14px 12px 15px;
  background:var(--accent);color:var(--on-accent);border-bottom:2px solid var(--rule)}
.complabel::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--accent2);
  -webkit-mask:var(--ht-fade) right center/480px 80px repeat-y;mask:var(--ht-fade) right center/480px 80px repeat-y}
.complabel > div{min-width:0}
.compbar{display:none}
.complabel b{display:block;font:800 23px/.95 var(--f-display);text-transform:uppercase;letter-spacing:.015em}
.complabel small{display:block;font:600 12.5px/1.2 var(--f-body);margin-top:4px;opacity:.88}
.complist{background:var(--wash);padding:2px 10px 14px}
.day{font:700 16px/1.1 var(--f-display);letter-spacing:.01em;margin:0;color:var(--ink);padding:14px 4px 0}
.day::first-letter{text-transform:uppercase}
.day::after{content:"";display:block;height:4px;margin-top:8px;background:radial-gradient(circle,var(--rule-2) 1.1px,transparent 1.5px) 0 50%/6px 4px repeat-x}

/* Un match = un ticket : bord encré, coins nets, espace franc avec le
   suivant. Le pronostic est le talon du ticket, séparé par une ligne de
   perforation et deux encoches. */
.mrow{position:relative;margin-top:12px;background:var(--card);border:2px solid var(--rule);border-radius:var(--radius);
  box-shadow:3px 3px 0 var(--rule-3)}
.day + .mrow{margin-top:10px}
.mrow.islive .mrowhead{position:relative;isolation:isolate;overflow:hidden;border-radius:2px 2px 0 0}
.mrow.islive .mrowhead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:170px;z-index:-1;pointer-events:none;
  background:color-mix(in srgb,var(--live) 42%,transparent);transform:scaleX(-1);
  -webkit-mask:var(--ht-fade-s) right center/170px 80px repeat-y;mask:var(--ht-fade-s) right center/170px 80px repeat-y}
.mrow.islive{border-color:var(--live);box-shadow:inset 4px 0 0 var(--live),3px 3px 0 color-mix(in srgb,var(--live) 45%,transparent)}
@media (prefers-reduced-motion:no-preference){ .mrow.enter{animation:rowIn .32s var(--ease) both} }
.mrowhead{display:flex;align-items:stretch;gap:0;width:100%;background:none;border:0;padding:0;text-align:left;color:inherit}
.mtime{flex:0 0 62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 4px;
  font:700 18px/1 var(--f-display);color:var(--ink);letter-spacing:.01em}
.mtime .liv{color:#fff;background:var(--live);font:800 14px/1 var(--f-display);letter-spacing:.08em;display:flex;align-items:center;gap:5px;
  padding:4px 6px 3px;border-radius:2px;box-shadow:2px 2px 0 var(--ink)}
.mtime .livedotsm{width:6px;height:6px;border-radius:50%;background:#fff}
@media (prefers-reduced-motion:no-preference){ .mtime .livedotsm{animation:blink 1.3s step-end infinite} }
.msides{flex:1;min-width:0;padding:11px 6px;display:flex;flex-direction:column;gap:6px}
.mside{display:flex;align-items:center;gap:8px;min-width:0}
.mside.lose{opacity:.5}
.mname{flex:1;min-width:0;font:700 18px/1.05 var(--f-display);letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:flex;align-items:center;gap:7px;color:var(--ink)}
.flag{width:1.15em;height:.82em;flex:none;border-radius:1px;box-shadow:0 0 0 1.5px var(--rule)}
.mname .flag{font-size:16px}
.mrk{font:600 11.5px/1 var(--f-body);color:var(--ink-soft);flex:none}
.mrk strong{font:800 14px/1 var(--f-display);color:var(--accent-ink);letter-spacing:.02em}
.mrk .seed{color:var(--accent-ink);font-weight:700}
.msc{flex:0 0 30px;text-align:right;font:800 28px/.9 var(--f-display);color:var(--ink-soft)}
.msc.win{color:var(--ink)}
.mright{flex:0 0 86px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:5px;padding:8px 12px 8px 2px;text-align:right}
.mround{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.mround b{font:700 15px/1 var(--f-display);color:var(--ink);letter-spacing:.01em}
.mround small{font:600 10.5px/1.15 var(--f-body);color:var(--ink-soft)}
.statuspill{font:800 12px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);
  border:1.5px solid currentColor;border-radius:2px;padding:3px 5px 2px}
.statuspill.live{color:#fff;background:var(--live);border-color:var(--live)}
.statuspill.wait{color:var(--ink);border-style:dashed;letter-spacing:.02em;text-transform:none;font-size:11.5px;white-space:nowrap;padding:3px 3px 2px}
@media (prefers-reduced-motion:no-preference){ .statuspill.live{animation:blink 1.4s step-end infinite} }
.namebtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.namebtn:hover,.namebtn:focus-visible{color:var(--accent-ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

/* --- Panneau de pronostic : la grille de scores comme une planche de
   tampons ; le score choisi est imprimé en couleur, avec sa trame et son
   décalage de repérage. --- */
.predpanel{position:relative;padding:10px 14px 15px;background:color-mix(in srgb,var(--wash) 55%,var(--card));border-radius:0 0 2px 2px;
  background-image:radial-gradient(circle,var(--rule-2) 1.2px,transparent 1.6px);background-size:7px 4px;background-repeat:repeat-x;background-position:10px 0}
.predpanel::before,.predpanel::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;
  background:var(--wash);border:2px solid var(--rule);clip-path:inset(0 0 0 50%)}
.predpanel::before{left:-10px}
.predpanel::after{right:-10px;clip-path:inset(0 50% 0 0)}
.predpanel.locked{padding-top:12px}
.pickgrid{display:flex;flex-direction:column;gap:8px;margin:8px 0 2px}
.pickside{display:flex;align-items:center;gap:10px}
.pickside .pslabel{flex:0 0 104px;font:700 16px/1.1 var(--f-display);letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:flex;align-items:center;gap:6px;color:var(--ink)}
.scores{display:flex;gap:6px;flex:1}
.scorebtn{position:relative;isolation:isolate;overflow:hidden;flex:1;max-width:56px;height:40px;background:var(--card-top);border:2px solid var(--rule);
  border-radius:var(--radius);font:800 20px/1 var(--f-display);letter-spacing:.02em;color:var(--ink)}
.scorebtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--ink);box-shadow:3px 3px 0 var(--accent2)}
.scorebtn:not(:disabled):hover{border-color:var(--accent-ink)}
.scorebtn:not(:disabled):active,.pillbtn:active,.jchip:active{transform:translate(2px,2px);box-shadow:none}
.scorebtn:disabled{opacity:.36;cursor:not-allowed}
.scorebtn[aria-pressed="true"]:disabled{opacity:1}
.predstatus{font:500 13.5px/1.35 var(--f-body);color:var(--ink-soft);margin:11px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.predstatus b{font:800 18px/1 var(--f-display);color:var(--ink);letter-spacing:.02em}

/* Jauge de probabilité : rail en pointillés, remplissage plein. */
.oddsgauge{display:flex;align-items:center;gap:10px;margin-top:10px}
.oddsgauge .bar{flex:1;height:8px;border-radius:0;background:radial-gradient(circle,var(--rule-2) 1.2px,transparent 1.6px) 0 50%/5px 8px repeat-x;overflow:hidden}
.oddsgauge .bar i{display:block;height:100%;width:var(--w);background:var(--accent);box-shadow:2px 0 0 var(--ink)}
@media (prefers-reduced-motion:no-preference){ .oddsgauge .bar i{animation:barfill .5s var(--ease)} }
.oddsgauge b{font:800 19px/1 var(--f-display);color:var(--accent-ink);flex:none}

/* Tampon de résultat : un vrai coup de tampon encreur rond, double filet,
   encre un peu irrégulière (grain retiré du tampon), légèrement de travers. */
.stamp{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:62px;height:62px;border-radius:50%;border:2.5px solid currentColor;outline:1.5px solid currentColor;outline-offset:-7px;
  transform:rotate(-9deg);
  background-image:radial-gradient(circle,color-mix(in srgb,currentColor 30%,transparent) 1.1px,transparent 1.5px);background-size:5px 5px;
  -webkit-mask:linear-gradient(#000 0 0),var(--grain);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) exclude,var(--grain)}
.stamp b{font:900 25px/.85 var(--f-display);letter-spacing:.01em}
.stamp span{font:800 9.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.12em;margin-top:2px}
.stamp.p3{color:var(--accent-ink)}
.stamp.p1{color:var(--good)}
.stamp.p0{color:var(--ink-soft);border-style:dashed;outline-color:transparent;transform:rotate(0)}
.stamp.big{width:76px;height:76px}
.stamp.big b{font-size:31px}

/* --- "Mon compte" --- */
.gaugetile{padding-bottom:16px}
.minibar{margin-top:10px;height:8px;background:radial-gradient(circle,var(--rule-2) 1.2px,transparent 1.6px) 0 50%/5px 8px repeat-x;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--good);box-shadow:2px 0 0 var(--ink)}
.minibar.accent i{background:var(--accent)}
.streakrow{display:flex;flex-wrap:wrap;gap:7px}
.streaktile{position:relative;overflow:hidden;width:28px;height:28px;border-radius:50%;border:2px dashed var(--rule-2);font-size:0;color:transparent;font-style:normal}
.streaktile.hit{border:0;background:var(--card-top);box-shadow:inset 0 0 0 2px var(--ink)}
.streaktile.hit::after{content:"";position:absolute;inset:0;background:var(--good);-webkit-mask:var(--ht-ball-s) center/100% 100%;mask:var(--ht-ball-s) center/100% 100%}

/* Bonus de série : pastille flamme (couleurs de palier fixes, voir
   FLAME_COLORS, indépendantes du thème : c'est une mécanique de jeu). */
.streakbadge{display:inline-flex;align-items:center;gap:5px;font:800 15px/1 var(--f-display);letter-spacing:.02em;
  padding:4px 10px 4px 7px;border-radius:999px;background:var(--card-top);border:2px solid var(--rule);color:var(--ink);vertical-align:middle}
.streakbadge.t1{border-color:#2E9C58;color:#2E9C58}
.streakbadge.t2{border-color:#D9761C;color:#D9761C}
.streakbadge.t3{border-color:#8B4FD6;color:#8B4FD6}
.streakbadge.t4{border-color:#2F86D6;color:#2F86D6}
.streakbadge small{font:700 11px/1 var(--f-body);margin-left:1px}
.flameicon{flex:none;display:block}
@media (prefers-reduced-motion:no-preference){ .flameflick{animation:flameflick 1.7s ease-in-out infinite} }

/* --- Balles (mise par tournoi) : les boutons +/- sont de vraies balles. --- */
.ballesrow{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap}
.balleslabel{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--f-body);color:var(--ink-soft)}
.ballesstepper{display:inline-flex;align-items:center;gap:8px;background:var(--card-top);border:2px solid var(--rule);
  border-radius:999px;padding:3px 4px}
.ballesstepper b{font:800 19px/1 var(--f-display);color:var(--ink);min-width:12px;text-align:center}
.ballesbtn{position:relative;flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);border:0;
  font:800 18px/1 var(--f-display);display:flex;align-items:center;justify-content:center;padding:0 0 1px;box-shadow:inset 0 0 0 1.5px var(--ink)}
.ballesbtn:disabled{opacity:.28;cursor:not-allowed}
.ballespct{font:700 13px/1.2 var(--f-body);color:var(--ink-soft)}
.ballesbudget{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:5px;font:800 15px/1 var(--f-display);letter-spacing:.03em;
  color:inherit;white-space:nowrap;border:1.5px solid currentColor;border-radius:999px;padding:4px 9px 4px 7px}
.laddwrap{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.laddwrap.compact{gap:9px}
.laddwrap.compact .laddrow{padding:10px 12px}
.subh{display:flex;align-items:center;gap:10px;font:700 17px/1 var(--f-display);letter-spacing:.01em;color:var(--ink);margin:18px 0 10px}
.subh::after{content:"";flex:1;height:4px;background:radial-gradient(circle,var(--rule-2) 1.1px,transparent 1.5px) 0 50%/6px 4px repeat-x}
.subh:first-of-type{margin-top:4px}
.spark{width:100%;height:64px;display:block;margin-top:12px}
.sparklegend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font:600 12px/1 var(--f-body);color:var(--ink-soft)}
.sparklegend span{display:flex;align-items:center;gap:6px}
.sparklegend .dot{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1.5px var(--rule)}
.laddrow{position:relative;padding:12px 14px;border-radius:var(--radius);background:var(--card-top);border:2px solid var(--rule);border-left:7px solid var(--ladcol)}
.laddhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.laddname{font:700 18px/1.1 var(--f-display);letter-spacing:.01em;color:var(--ink)}
.laddpts{font:800 26px/1 var(--f-display);color:var(--ladcol)}
.laddpts small{font:600 11px/1 var(--f-body);color:var(--ink-soft);margin-left:3px}
.laddbar{margin-top:9px;height:9px;background:radial-gradient(circle,var(--rule-2) 1.2px,transparent 1.6px) 0 50%/5px 9px repeat-x;overflow:hidden}
.laddbar i{display:block;height:100%;background:var(--ladcol);box-shadow:2px 0 0 var(--ink)}
.laddsub{margin-top:6px;font:500 12.5px/1.3 var(--f-body);color:var(--ink-soft)}
.recapbtn{margin-top:6px;font-size:13.5px}
.friendstoggle{background:none;border:0;color:var(--accent-ink);font:700 13px/1.2 var(--f-body);padding:0;
  text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.friends{list-style:none;margin:12px 0 0;padding:8px 0 0;font:500 13.5px/1.3 var(--f-body);
  background:radial-gradient(circle,var(--rule-2) 1.1px,transparent 1.5px) 0 0/6px 4px repeat-x}
.friends li{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.friends li span:last-child{font:700 16px/1 var(--f-display);letter-spacing:.02em}

/* -----------------------------------------------------------------------
   Classements : tableau de résultats façon page sports du journal — rang
   en gros chiffres, médailles en trame pour le podium, ta ligne tramée.
   ----------------------------------------------------------------------- */
.standings{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:2px solid var(--rule);border-radius:var(--radius-lg);
  overflow:hidden;box-shadow:4px 4px 0 var(--accent2)}
.standings thead th{position:relative;text-align:left;font:700 16px/1 var(--f-display);letter-spacing:.03em;color:var(--on-accent);
  padding:11px 12px 10px;background:var(--accent);border-bottom:2px solid var(--rule)}
.standings thead th.num{text-align:right}
.standings thead tr{background:var(--accent)}
.standings tbody tr + tr td{background-image:radial-gradient(circle,var(--rule-2) 1.1px,transparent 1.5px);background-size:6px 4px;background-repeat:repeat-x}
.standings tbody tr.lbrow{cursor:pointer}
.standings tbody tr.lbrow:hover td{background-color:var(--tint)}
.standings tbody tr.me td{background-color:color-mix(in srgb,var(--accent) 9%,transparent)}
.standings tbody tr.me td:first-child{box-shadow:inset 5px 0 0 var(--accent)}
.standings td{padding:12px 12px;vertical-align:middle}
.rankcell{width:52px;text-align:center;font:800 26px/1 var(--f-display);color:var(--ink-soft)}
.rankcell.top1,.rankcell.top2,.rankcell.top3{color:#2B1A0E;
  background-image:radial-gradient(circle at 50% 50%,var(--medal) 0 15.5px,var(--ink) 16px 17.5px,transparent 18px)!important;background-size:auto!important;background-repeat:no-repeat!important;background-position:center!important}
.rankcell.top1{--medal:#F0C544}
.rankcell.top2{--medal:#CBD3DC}
.rankcell.top3{--medal:#D79A6B}
.namecell{min-width:0}
.lbname{font:700 19px/1.1 var(--f-display);letter-spacing:.01em;color:var(--ink);display:flex;align-items:center;gap:7px;overflow-wrap:anywhere}
.lbsub{font:500 12px/1.3 var(--f-body);color:var(--ink-soft);margin-top:3px}
.lbfollow{color:var(--accent-ink);font-weight:700;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:2px}
.ptscell{text-align:right;font:800 28px/1 var(--f-display);color:var(--accent-ink);white-space:nowrap}
.ptscell small{font:600 11px/1 var(--f-body);color:var(--ink-soft);margin-left:3px}
.rules{color:var(--ink-soft);font:500 12.5px/1.6 var(--f-body);margin:20px 2px 4px;max-width:70ch}

/* --- Fiche joueur / équipe : une affiche en tête (nom en grandes capitales
   décalées, soleil de trame), le détail imprimé dessous. --- */
.modalbackdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;
  background-color:color-mix(in srgb,var(--ink) 38%,transparent);
  background-image:radial-gradient(circle,color-mix(in srgb,var(--ink) 55%,transparent) 1.4px,transparent 1.9px);background-size:6px 6px}
@media (prefers-reduced-motion:no-preference){ .modalbackdrop{animation:fadeIn .15s var(--ease)} }
@media (min-width:640px){ .modalbackdrop{align-items:center;padding:24px} }
.modal{position:relative;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--paper);color:var(--ink);
  border:2px solid var(--rule);border-bottom:0;border-radius:6px 6px 0 0;box-shadow:0 -5px 0 var(--accent2)}
@media (prefers-reduced-motion:no-preference){ .modal{animation:modalIn .24s var(--ease-spring)} }
@media (min-width:640px){ .modal{border-bottom:2px solid var(--rule);border-radius:6px;box-shadow:6px 6px 0 var(--accent2)} }
.modalclose{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:var(--card-top);
  color:var(--ink);font:800 24px/1 var(--f-display);cursor:pointer;z-index:2;display:grid;place-items:center;padding:0 0 3px}
.modalclose:hover{background:var(--ink);color:var(--paper)}
.modalhead{position:relative;isolation:isolate;overflow:hidden;padding:26px 56px 20px 20px;background:var(--accent);color:var(--on-accent);border-bottom:2px solid var(--rule)}
.modalhead::before{content:"";position:absolute;top:0;right:0;width:420px;height:420px;z-index:-1;background:var(--accent2);
  -webkit-mask:var(--ht-sun) top right/100% 100% no-repeat;mask:var(--ht-sun) top right/100% 100% no-repeat}
.modalname{font:900 36px/.92 var(--f-display);text-transform:uppercase;letter-spacing:.015em;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  text-shadow:3px 3px 0 color-mix(in srgb,var(--ink) 55%,transparent)}
.modalname .flag{font-size:22px}
.modalsub{font:600 13.5px/1.3 var(--f-body);opacity:.9;margin-top:8px}
.modalstats{display:flex;gap:22px;margin-top:18px}
.statbox{display:flex;flex-direction:column;gap:2px}
.statbox b{font:800 34px/.9 var(--f-display)}
.statbox span{font:600 11.5px/1.2 var(--f-body);opacity:.85}
.modalbody{padding:6px 20px 24px}
.modalsec{padding:16px 0 2px}
.modalsec h3{display:flex;align-items:center;gap:9px;font:700 19px/1 var(--f-display);letter-spacing:.01em;color:var(--ink);margin:0 0 10px}
.modalsec h3::after{content:"";flex:1;height:4px;background:radial-gradient(circle,var(--rule-2) 1.1px,transparent 1.5px) 0 50%/6px 4px repeat-x}
.secdot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--accent-ink);box-shadow:1.5px 1.5px 0 var(--accent2)}
.sec-empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:16px 0}
.cmlist{list-style:none;margin:0;padding:0}
.cmrow{padding:9px 0;background:radial-gradient(circle,var(--rule-2) 1.1px,transparent 1.5px) 0 0/6px 4px repeat-x}
.cmlist li:first-child{background:none;padding-top:2px}
.cmopp{font:700 17px/1.15 var(--f-display);letter-spacing:.01em;color:var(--ink)}
.cmmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.cmdate{font:500 12.5px/1.3 var(--f-body);color:var(--ink-soft)}
.cmdate::first-letter{text-transform:uppercase}
.cmres{flex:0 0 auto;font:800 14px/1 var(--f-display);letter-spacing:.04em;padding:3px 6px 2px;border-radius:2px;border:1.5px solid currentColor;color:var(--ink-soft)}
.cmres.win{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.cmres.loss{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.roster{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px}
.roster li{background:var(--card-top);border:2px solid var(--rule-2);border-radius:var(--radius);padding:8px 10px;font:700 16px/1.15 var(--f-display);letter-spacing:.01em;color:var(--ink)}

/* --- Badge en grand : plaqué comme un autocollant sur une explosion de
   points à ses propres couleurs (colorA / colorB de BADGE_DEFS). --- */
.badgemodal{max-width:400px;text-align:center}
.badgezoom{position:relative;isolation:isolate;overflow:hidden;display:grid;place-items:center;padding:34px 20px 26px;background:var(--ba,var(--accent));
  border-bottom:2px solid var(--rule)}
.badgezoom::before{content:"";position:absolute;inset:-60px;z-index:-1;background:var(--bb,var(--accent2));
  -webkit-mask:var(--ht-burst) center/560px 560px no-repeat;mask:var(--ht-burst) center/560px 560px no-repeat}
.badgezoom.locked{background:var(--paper-deep)}
.badgezoom.locked::before{background:var(--rule-2)}
.badgezoom-img{position:relative;width:200px;height:200px;filter:drop-shadow(5px 6px 0 rgba(0,0,0,.28))}
.badgezoom-img img{width:100%;height:100%;display:block;object-fit:contain}
.badgezoom.locked .badgezoom-img img{filter:grayscale(1) contrast(.85) brightness(.92);opacity:.6}
.badgezoom-img .badgelock{width:48px;height:48px;right:8px;bottom:8px;box-shadow:0 0 0 3px var(--paper)}
.badgezoom-img .badgelock svg{width:24px;height:24px}
@media (prefers-reduced-motion:no-preference){ .badgezoom-img{animation:badgePop .55s var(--ease-spring) both} }
@keyframes badgePop{from{opacity:0;transform:scale(.3) rotate(-18deg)}to{opacity:1;transform:none}}
.badgemodal-body{padding:18px 22px 26px}
.badgestatus{display:inline-block;font:800 13px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px 3px;border:1.5px dashed var(--rule-2);
  border-radius:2px;color:var(--ink-soft)}
.badgestatus.on{border-style:solid;border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.badgetitle{margin:12px 0 0;font:900 40px/.92 var(--f-display);text-transform:uppercase;letter-spacing:.015em;color:var(--ink);
  text-shadow:2.5px 2.5px 0 color-mix(in srgb,var(--accent2) 70%,transparent)}
.badgehow{margin:16px 0 4px;font:700 13px/1.2 var(--f-body);color:var(--ink-soft)}
.badgedesc{margin:0 auto;font:600 17px/1.4 var(--f-body);color:var(--ink);max-width:28ch}

/* --- Panneaux, formulaires, admin --- */
.panel{position:relative;background:var(--card);border:2px solid var(--rule);border-radius:var(--radius-lg);padding:18px 18px 20px;margin:0 0 18px}
.panel h2{font:900 34px/.92 var(--f-display);text-transform:uppercase;letter-spacing:.015em;margin:0 0 8px;color:var(--ink);
  text-shadow:2.5px 2.5px 0 color-mix(in srgb,var(--accent2) 70%,transparent)}
.panel h3{font:800 22px/1 var(--f-display);letter-spacing:.01em;margin:0;color:var(--ink)}
.hint{color:var(--ink-soft);font:500 13px/1.45 var(--f-body);margin:5px 0 0}
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:16px 12px;margin-top:14px}
.badgecell{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;background:none;border:0;padding:4px 2px;margin:0;
  font:inherit;color:inherit;cursor:pointer;border-radius:6px}
button.badgecell:hover .badgeicon{transform:translateY(-2px) rotate(-3deg)}
button.badgecell:active .badgeicon{transform:scale(.94)}
@media (prefers-reduced-motion:no-preference){ .badgeicon{transition:transform .18s var(--ease-spring)} }
.badgeicon{width:62px;height:62px;position:relative;filter:drop-shadow(2px 2px 0 var(--rule-3))}
.badgeicon img{width:100%;height:100%;display:block;object-fit:contain}
.badgecell.locked .badgeicon img{filter:grayscale(1) contrast(.85) brightness(.9);opacity:.5}
.badgelock{position:absolute;right:-3px;bottom:-3px;width:21px;height:21px;background:#2B1A0E;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--card)}
.badgelock svg{width:11px;height:11px}
.badgename{font:700 14px/1.05 var(--f-display);letter-spacing:.01em;color:var(--ink-soft)}
.badgecell.unlocked .badgename{color:var(--ink)}
label{display:block;font:700 13px/1.2 var(--f-body);margin:14px 0 6px;color:var(--ink)}
input,select,textarea{width:100%;background:var(--card-top);border:2px solid var(--rule);border-radius:var(--radius);padding:11px 12px;font:500 16px/1.3 var(--f-body);color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--ink-soft);opacity:.75}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--accent-ink);box-shadow:3px 3px 0 var(--accent2)}
textarea{resize:vertical}
.btn{position:relative;display:block;background:var(--accent);color:var(--on-accent);border:2px solid var(--ink);border-radius:var(--radius);
  padding:12px 18px 13px;font:800 20px/1 var(--f-display);letter-spacing:.03em;margin-top:18px;width:100%;box-shadow:4px 4px 0 var(--accent2)}
.btn:hover{background:var(--accent-deep)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--accent2)}
.btn:disabled{opacity:.6;cursor:progress}
.btn.sec{background:var(--card-top);color:var(--ink);box-shadow:3px 3px 0 var(--rule-2)}
.btn.sec:hover{background:var(--tint)}
.btn.small{display:inline-block;width:auto;margin-top:0;padding:8px 13px 9px;font-size:16px;box-shadow:3px 3px 0 var(--accent2)}
.btn.small.sec{box-shadow:3px 3px 0 var(--rule-2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.adm-item{padding:14px 0;background:radial-gradient(circle,var(--rule-2) 1.1px,transparent 1.5px) 0 0/6px 4px repeat-x}
.adm-item:first-of-type{background:none}
.adm-title{font:700 18px/1.15 var(--f-display);letter-spacing:.01em;color:var(--ink)}
.adm-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.scorein{width:56px;text-align:center;font:800 22px/1 var(--f-display);padding:7px 5px}
.vs{font:800 20px/1 var(--f-display);color:var(--ink-soft)}
details summary{list-style-position:outside}

/* --- Connexion : l'affiche du jeu. Grand titre en capitales imprimé en
   deux passes décalées, une balle de ping-pong en trame qui se lève comme
   un soleil, et l'explosion de points derrière. --- */
.authshell{min-height:100vh;display:flex;flex-direction:column}
.authposter{position:relative;isolation:isolate;overflow:hidden;padding:30px 24px 118px;color:var(--on-accent);background:var(--accent);border-bottom:2px solid var(--rule)}
.authposter::before{content:"";position:absolute;right:-180px;top:-160px;width:620px;height:620px;z-index:-2;background:var(--accent2);
  -webkit-mask:var(--ht-burst) center/100% 100% no-repeat;mask:var(--ht-burst) center/100% 100% no-repeat}
.authball{position:absolute;z-index:-1;right:22px;bottom:-84px;width:180px;height:180px;--ball-ink:var(--accent);box-shadow:inset 0 0 0 3px var(--ink),6px 6px 0 var(--accent2)}
.authposter-in{position:relative;max-width:440px}
.authlogo{display:flex;align-items:center;gap:10px;font:700 13px/1.2 var(--f-body);letter-spacing:.01em;opacity:.95}
.authtitle{font:900 128px/.8 var(--f-display);letter-spacing:.01em;text-transform:uppercase;margin:18px 0 18px -4px;
  text-shadow:5px 5px 0 var(--accent2),5px 5px 0 var(--accent2)}
.authposter p{font:500 16px/1.5 var(--f-body);margin:0;max-width:30ch}
.authform-col{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:30px 18px 56px}
@media (min-width:900px){
  .authshell{flex-direction:row}
  .authposter{flex:1 1 48%;padding:0 64px 40px;display:flex;align-items:center;border-bottom:0;border-right:2px solid var(--rule)}
  .authposter::before{width:980px;height:980px;right:-320px;top:-200px}
  .authball{width:340px;height:340px;right:-70px;bottom:-60px}
  .authtitle{font-size:220px;margin-bottom:26px;text-shadow:8px 8px 0 var(--accent2)}
  .authposter p{font-size:18px}
  .authform-col{flex:1 1 52%;align-items:center}
}
.auth{max-width:390px;width:100%}
.auth .panel{box-shadow:5px 5px 0 var(--accent2)}
.auth h1{font:900 46px/1 var(--f-display);text-transform:uppercase}
.lead{color:var(--ink-soft);margin:0 0 20px;font-size:15.5px}
.ferr{color:var(--bad);font:600 13.5px/1.4 var(--f-body);margin-top:12px;min-height:1.2em}
.fok{color:var(--good)}
.switch{text-align:center;color:var(--ink-soft);font:500 14px/1.4 var(--f-body);margin-top:16px}

/* --- Messages éphémères, états vides et chargement --- */
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px 11px;border-radius:3px;
  font:700 17px/1.15 var(--f-display);letter-spacing:.02em;z-index:30;max-width:90vw;text-align:center;box-shadow:3px 3px 0 var(--accent)}
@media (min-width:860px){ .toast{bottom:28px} }
@media (prefers-reduced-motion:no-preference){ .toast{animation:toastIn .22s var(--ease-spring)} }
.toast.leaving{animation:toastOut .18s ease-in forwards}
.toast.err{background:var(--live);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.empty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:34px 12px 30px;text-align:center;color:var(--ink-soft);font:500 15px/1.45 var(--f-body);
  max-width:34ch;margin:0 auto}
.empty::before{content:"";width:46px;height:46px;border-radius:50%;background:var(--card-top);box-shadow:inset 0 0 0 2px var(--ink),3px 3px 0 var(--accent2);
  background-image:none}
.loading{padding:80px 0;text-align:center;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:16px;font:700 18px/1 var(--f-display);letter-spacing:.03em}
.loading::before{content:"";width:40px;height:40px;border-radius:50%;background:var(--card-top);box-shadow:inset 0 0 0 2px var(--ink),3px 3px 0 var(--accent2)}
@media (prefers-reduced-motion:no-preference){ .loading::before{animation:bounce .62s cubic-bezier(.5,0,.5,1) infinite alternate} }

/* -----------------------------------------------------------------------
   Bilan de tournoi ("récap") : la seule touche Retro VHS de l'appli, posée
   sur la même affiche halftone — "re-diffusion" d'un moment déjà joué :
   lignes de balayage, titre à couches RVB décalées, incrustations REC /
   REPLAY façon caméscope, une ligne de "tracking" qui passe.
   ----------------------------------------------------------------------- */
.recapmodal{overflow-x:hidden}
.recapbanner{position:relative;isolation:isolate;overflow:hidden;padding:42px 20px 26px;color:var(--on-accent);background:var(--accent);border-bottom:2px solid var(--rule)}
.recapbanner::before{content:"";position:absolute;inset:-30px -60px -30px 20%;z-index:-1;background:var(--accent2);
  -webkit-mask:var(--ht-burst) center/560px 560px no-repeat;mask:var(--ht-burst) center/560px 560px no-repeat}
.recapbanner::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
.recaprec{position:absolute;top:13px;left:20px;z-index:2;display:flex;align-items:center;gap:6px;font:800 13px/1 var(--f-display);letter-spacing:.14em}
.recaprec i{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 6px var(--live)}
@media (prefers-reduced-motion:no-preference){ .recaprec i{animation:blink 1.4s step-end infinite} }
.recaptc{position:absolute;bottom:10px;right:18px;z-index:2;font:800 13px/1 var(--f-display);letter-spacing:.14em;opacity:.8}
.recapkicker{position:relative;z-index:2;font:700 13px/1 var(--f-body);letter-spacing:.02em;opacity:.9;margin:0 0 8px}
.recapname{position:relative;z-index:2;font:900 44px/.9 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:0;max-width:12ch;
  text-shadow:2px 0 rgba(255,40,80,.75),-2px 0 rgba(40,220,255,.7)}
.recapsub{position:relative;z-index:2;font:600 13.5px/1.3 var(--f-body);opacity:.9;margin-top:10px}
.recapbody{position:relative}
.recapbody::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:repeating-linear-gradient(to bottom,color-mix(in srgb,var(--ink) 5%,transparent) 0 1px,transparent 1px 3px)}
.recapbody .stattile b{font-size:54px}
.recapmodal .modalclose{z-index:4}
@media (prefers-reduced-motion:no-preference){
  .recap-step{animation:recapIn .5s var(--ease-spring) both}
  .recapmodal::after{content:"";position:absolute;left:0;right:0;top:0;height:14px;z-index:3;pointer-events:none;
    background:linear-gradient(to bottom,transparent,rgba(255,255,255,.16) 40%,rgba(255,255,255,.05) 60%,transparent);
    animation:tracking 5.5s linear infinite}
}
@keyframes recapIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes tracking{0%{transform:translateY(-20px)}70%{transform:translateY(620px)}100%{transform:translateY(620px)}}
.recap-podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:6px;padding-bottom:2px;border-bottom:2px solid var(--rule)}
.podiumcol{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;max-width:112px;min-width:0}
.podiumname{font:700 17px/1.05 var(--f-display);letter-spacing:.01em;color:var(--ink);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.podiumpts{font:800 22px/1 var(--f-display);color:var(--accent-ink)}
.podiumpts small{font:600 10.5px/1 var(--f-body);margin-left:2px;color:var(--ink-soft)}
.podiumbar{position:relative;isolation:isolate;overflow:hidden;width:100%;border:2px solid var(--ink);border-bottom:0;border-radius:3px 3px 0 0;
  display:flex;align-items:flex-start;justify-content:center;padding-top:7px;background-color:var(--pcol)}
.podiumbar::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(0,0,0,.22);
  -webkit-mask:var(--ht-rise) bottom left/80px 260px repeat-x;mask:var(--ht-rise) bottom left/80px 260px repeat-x}
.podiumbar span{font:900 26px/1 var(--f-display);color:#2B1A0E}

@keyframes rowIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (min-width:640px){ @keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}} }
@keyframes barfill{from{width:0}to{width:var(--w)}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.3}100%{opacity:1}}
@keyframes flameflick{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.1) rotate(-2deg)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,8px)}}
@keyframes bounce{from{transform:translateY(-18px)}to{transform:translateY(0) scale(1.06,.94)}}
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;animation:none!important;transition:none!important}
  ::view-transition-old(root),::view-transition-new(root){animation:none!important}
}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s;animation-timing-function:cubic-bezier(.2,.65,.2,1)}

/* =============================================================================
   Mode Halloween — habillage décoratif, posé sur la classe .spooky (html).
   Palette : pumpkin #E07A2E, witch-violet #8C5FC9, grave-plum #1B1322,
   bone-ink #F1E4C8. Ne touche à AUCUNE couleur fonctionnelle par tournoi
   (THEME.WTT_*/PRO_A) ni aux paliers de flamme : il ajoute une texture
   "carnet de bord hanté" par-dessus l'affiche.
   ========================================================================== */
.spooky body{position:relative}
.spooky body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 85% -6%, rgba(241,228,200,.10), transparent 60%),
    radial-gradient(ellipse 70% 50% at 8% 108%, rgba(224,122,46,.14), transparent 62%),
    radial-gradient(ellipse 90% 60% at 50% 0%, rgba(140,95,201,.10), transparent 65%);
}
.spooky .scorebtn::before{
  content:"";position:absolute;top:-1px;left:-1px;width:13px;height:13px;pointer-events:none;opacity:.42;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g fill='none' stroke='%23B9A68A' stroke-width='1.1'><path d='M0 0 L24 24M0 8 L10 10M0 16 L13 15M8 0 L10 10M16 0 L15 13'/><path d='M0 0 Q7 7 2 13M0 0 Q9 6 10 16M0 0 Q4 10 16 10' /></g></svg>");
  background-repeat:no-repeat;background-size:13px 13px;
}
.spooky .scorebtn[aria-pressed="true"]::before{opacity:.22;filter:brightness(2)}
.spooky .stamp{border-radius:50% 12px 50% 12px;transform:rotate(-12deg)}
.spooky .stamp.p0{border-radius:12px;transform:rotate(0)}
.spooky .standings tbody tr + tr td{background-image:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),linear-gradient(rgba(255,255,255,.05),rgba(255,255,255,.05));
  background-size:100% 1px,100% 1px;background-position:0 0,0 1px}
.spooky .navdot{background:#E07A2E;box-shadow:0 0 7px rgba(224,122,46,.75)}
@media (prefers-reduced-motion:no-preference){ .spooky .navdot{animation:candleflicker 2.4s ease-in-out infinite} }
@keyframes candleflicker{0%,100%{opacity:1;box-shadow:0 0 7px rgba(224,122,46,.75)}45%{opacity:.82;box-shadow:0 0 4px rgba(224,122,46,.5)}70%{opacity:1;box-shadow:0 0 10px rgba(224,122,46,.9)}}
#spookyfx{display:none}
.spooky #spookyfx{display:block;position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.ghost{position:absolute;width:86px;height:104px;opacity:.09;
  background-repeat:no-repeat;background-size:contain;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 120'><path d='M50 4C26 4 10 24 10 52v50c4-8 10-8 14 0 4-8 10-8 14 0 4-8 10-8 14 0 4-8 10-8 14 0 4-8 10-8 14 0V52C90 24 74 4 50 4Z' fill='%23F1E4C8'/><circle cx='38' cy='50' r='5' fill='%231B1322'/><circle cx='62' cy='50' r='5' fill='%231B1322'/></svg>")}
.ghost.g1{top:8%;left:-14%}
.ghost.g2{top:46%;left:-18%;width:64px;height:78px;opacity:.07}
.ghost.g3{top:74%;left:-10%;width:104px;height:126px;opacity:.06}
@media (prefers-reduced-motion:no-preference){
  .ghost.g1{animation:ghostdrift1 48s linear infinite}
  .ghost.g2{animation:ghostdrift2 63s linear infinite}
  .ghost.g3{animation:ghostdrift3 71s linear infinite}
}
@keyframes ghostdrift1{0%{transform:translate(0,0)}25%{transform:translate(40vw,-10px)}50%{transform:translate(85vw,6px)}75%{transform:translate(105vw,-4px)}100%{transform:translate(130vw,0)}}
@keyframes ghostdrift2{0%{transform:translate(0,0)}30%{transform:translate(50vw,8px)}60%{transform:translate(95vw,-6px)}100%{transform:translate(130vw,2px)}}
@keyframes ghostdrift3{0%{transform:translate(0,0)}20%{transform:translate(30vw,-6px)}55%{transform:translate(80vw,10px)}80%{transform:translate(110vw,-3px)}100%{transform:translate(130vw,0)}}
.mist{position:absolute;left:-20%;right:-20%;bottom:0;height:34vh;min-height:160px;
  background:linear-gradient(0deg, rgba(140,95,201,.16), rgba(224,122,46,.08) 45%, transparent 85%);
  filter:blur(18px);opacity:.55}
@media (prefers-reduced-motion:no-preference){ .mist{animation:mistdrift 22s ease-in-out infinite alternate} }
@keyframes mistdrift{0%{transform:translateX(-3%) translateY(0)}100%{transform:translateX(3%) translateY(-2%)}}
</style>

// Design sonore minimal : quelques bips courts (80-250ms) générés à la
// volée avec des oscillateurs, pour un fichier unique sans ressource externe
// à héberger/licencier. Le contexte audio n'est créé qu'au premier appel de
// playSound(), jamais avant : les navigateurs bloquent toute lecture audio
// avant un geste réel de la personne (clic, appui...), et on respecte cette
// règle plutôt que d'essayer de la contourner. Tout est "best effort" :
// Web Audio peut être indisponible ou lever une erreur dans certains
// contextes restrictifs (vieux navigateur, certaines webviews...) — jamais
// cela ne doit faire planter le reste de l'appli (render, toast, pick...),
// d'où les try/catch à chaque étage.
let _actx = null;
function getAudioCtx() {
  if (_actx) return _actx;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    _actx = new Ctx();
    return _actx;
  } catch (e) { return null; }

// Une tonalité brève : fréquence fixe ou glissée (freq -> freqEnd), durée,
// forme d'onde, volume de pointe modeste. Enveloppe attaque rapide /
// relâchement exponentiel doux pour éviter tout "clic" de coupure brutale.
function tone(ctx, { freq, freqEnd, dur = 0.12, type = 'sine', gain = 0.08, delay = 0 }) {
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const amp = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (freqEnd != null) osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), t0 + dur);
  amp.gain.setValueAtTime(0, t0);
  amp.gain.linearRampToValueAtTime(gain, t0 + Math.min(0.015, dur / 4));
  amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(amp).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}
// Bibliothèque de sons courts, un par moment clé (voir playSound()). Les
// variantes "Halloween" (grincement/whoosh grave au lieu d'une petite
// fanfare) ne sont utilisées que quand S.themeMode === 'halloween' — même
// système playSound()/SOUNDS, juste des paramètres de synthèse différents,
// plutôt qu'un second système de sons à maintenir.
const SOUNDS = {
  // Pronostic confirmé / toast de succès : petit blip à deux tons, net et bref.
  confirm(ctx) {
    tone(ctx, { freq: 660, dur: 0.07, type: 'sine', gain: 0.07 });
    tone(ctx, { freq: 880, dur: 0.09, type: 'sine', gain: 0.07, delay: 0.06 });
  },
  // Toast d'erreur : tonalité courte et descendante, nettement distincte du succès.
  error(ctx) {
    tone(ctx, { freq: 340, freqEnd: 180, dur: 0.18, type: 'square', gain: 0.05 });
  },
  // Tap sur un score de la "fiche de match" / changement d'onglet : tick
  // discret, presque un murmure, pour rester agréable même répété vite.
  tick(ctx) {
    tone(ctx, { freq: 520, dur: 0.035, type: 'sine', gain: 0.035 });
  },
  // Nouveau palier de série franchi (vert -> orange -> violet -> bleu) :
  // petite fanfare montante à 3 notes, un peu plus marquée (c'est rare).
  milestone(ctx) {
    if (S.themeMode === 'halloween') { SOUNDS.milestoneSpooky(ctx); return; }
    [523.25, 659.25, 783.99].forEach((f, i) => tone(ctx, { freq: f, dur: 0.14, type: 'triangle', gain: 0.09, delay: i * 0.08 }));
  },
  // Variante Halloween du palier de série : un whoosh grave qui glisse vers
  // l'aigu, façon grincement de porte/esprit qui passe — plus en phase avec
  // l'ambiance fantomatique que la fanfare habituelle.
  milestoneSpooky(ctx) {
    tone(ctx, { freq: 110, freqEnd: 330, dur: 0.4, type: 'sawtooth', gain: 0.05 });
    tone(ctx, { freq: 90, freqEnd: 60, dur: 0.3, type: 'sine', gain: 0.06, delay: 0.05 });
  },
};
// Point d'entrée unique, à appeler partout dans l'appli : no-op silencieux
// si le son est coupé (S.soundOn) ou si Web Audio est indisponible/a levé
// une erreur — ne lève jamais d'exception vers l'appelant.
function playSound(name) {
  try {
    if (!S.soundOn) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume().catch(() => {});
    const fn = SOUNDS[name];
    if (fn) fn(ctx);

function friendlyError(e) {
  const msg = (e && e.message) || String(e);
  if (/Invalid login credentials/i.test(msg)) return 'Email ou mot de passe incorrect.';
  if (/Database error saving new user|invitation/i.test(msg)) return "Inscription refusée : vérifie le code d'invitation, et choisis un pseudo de 2 à 20 caractères qui n'est pas déjà pris.";
  if (/already (been )?registered/i.test(msg)) return 'Cet email a déjà un compte. Connecte-toi.';
  if (/at least \d+ characters/i.test(msg)) return 'Le mot de passe doit faire au moins 6 caractères.';
  if (/Email not confirmed/i.test(msg)) return "Ton email n'est pas encore confirmé. Vérifie ta boîte mail.";
  if (/Score impossible/i.test(msg)) return msg;
  if (/row-level security/i.test(msg)) return "Action refusée : le match a peut-être déjà commencé, ou tu n'as pas les droits.";
  if (/duplicate key/i.test(msg)) return 'Cet élément existe déjà.';

/* Estimation simple : classement + forme récente + face-à-face.
   Ce n'est pas une certitude, juste une tendance. */
function binom(n, k) { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; }
function winProb(q, n) { let s = 0; for (let k = 0; k < n; k++) s += binom(n - 1 + k, k) * Math.pow(q, n) * Math.pow(1 - q, k); return s; }
function setProbFromMatchProb(p, n) {
  let lo = 0.001, hi = 0.999;
  for (let i = 0; i < 50; i++) { const mid = (lo + hi) / 2; if (winProb(mid, n) < p) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
function bestScore(q, n) {
  let best = null;
  for (let k = 0; k < n; k++) {
    const pa = binom(n - 1 + k, k) * Math.pow(q, n) * Math.pow(1 - q, k);
    const pb = binom(n - 1 + k, k) * Math.pow(1 - q, n) * Math.pow(q, k);
    if (!best || pa > best.p) best = { p: pa, a: n, b: k };
    if (pb > best.p) best = { p: pb, a: k, b: n };
  }
  return best;
}
function recentForm(id) {
  const games = S.matches
    .filter(m => m.status === 'finished' && (m.competitor_a_id === id || m.competitor_b_id === id))
    .sort((x, y) => new Date(y.starts_at) - new Date(x.starts_at)).slice(0, 5);
  if (games.length < 2) return null;
  const wins = games.filter(m => (m.competitor_a_id === id) === (m.score_a > m.score_b)).length;
  return wins / games.length;
}
function headToHead(a, b) {
  let wa = 0, wb = 0;
  for (const m of S.matches) {
    if (m.status !== 'finished') continue;
    if (m.competitor_a_id === a && m.competitor_b_id === b) { if (m.score_a > m.score_b) wa++; else wb++; }
    else if (m.competitor_a_id === b && m.competitor_b_id === a) { if (m.score_a > m.score_b) wb++; else wa++; }
  }
  return { wa, wb };
}
function trend(m) {
  const a = S.competitors[m.competitor_a_id], b = S.competitors[m.competitor_b_id];
  if (!a || !b || !a.ranking || !b.ranking) return null;
  let z = 0.45 * (Math.log(b.ranking) - Math.log(a.ranking));
  const fa = recentForm(a.id), fb = recentForm(b.id);
  if (fa !== null && fb !== null) z += 1.2 * (fa - fb);
  const h = headToHead(a.id, b.id);
  if (h.wa + h.wb > 0) z += 0.5 * (h.wa - h.wb) / (h.wa + h.wb);
  const pA = 1 / (1 + Math.exp(-z));
  const q = setProbFromMatchProb(pA, m.wins_needed);
  return { pA, q, score: bestScore(q, m.wins_needed) };
}

// gagner une manche pour le côté A) : sert à afficher "X % de chances" sur le
// score sélectionné, plutôt qu'un pourcentage global de victoire par côté.
function scoreProb(q, n, a, b) {
  if (a === n) return binom(n - 1 + b, b) * Math.pow(q, n) * Math.pow(1 - q, b);
  if (b === n) return binom(n - 1 + a, a) * Math.pow(1 - q, n) * Math.pow(q, a);
  return 0;
}
// Bonus "outsider" (WTT uniquement) : un pronostic gagnant sur le joueur le moins bien classé
// au tirage au sort rapporte un supplément, d'autant plus grand que l'écart est important.
// Basé sur la tête de série figée à la création du match : elle ne bouge jamais après coup,
// même si le classement du joueur change ensuite (pour son tournoi suivant, par exemple).
function outsiderBonus(m, bonVainqueur) {
  if (!bonVainqueur || m.circuit !== 'WTT' || m.seed_a == null || m.seed_b == null) return 0;
  const aGagne = m.score_a > m.score_b;
  const outsiderGagne = aGagne ? m.seed_a > m.seed_b : m.seed_b > m.seed_a;
  if (!outsiderGagne) return 0;
  return Math.min(Math.floor(Math.abs(m.seed_a - m.seed_b) / 4), 5);
