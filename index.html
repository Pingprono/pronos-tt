<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EAE0C8">
<title>SPIN</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SPIN">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css">
<style>
:root{
  /* Jetons de couleur : IMPOSÉS, hérités du thème (voir THEME dans le JS) —
     --accent/--paper/--ink/etc. sont réécrits en JS selon le circuit/tournoi
     affiché. Le CSS ci-dessous ne lit QUE ces variables, jamais une couleur
     fixe, pour suivre automatiquement le thème du moment. */
  --paper:#EAE0C8;
  --paper-deep:#DECBA0;
  --card:#FBF4E4;
  --card-top:#FFFCF4;
  --ink:#2E1B12;
  --ink-soft:#7A6349;
  --accent:#6B1C2A;
  --accent-rgb:107,28,42;
  --accent-deep:#4E121C;
  --accent2:#B8532F;
  --accent2-rgb:184,83,47;
  --paper-glow:rgba(255,252,240,.55);
  --line-soft:rgba(46,27,18,.14);
  --good:#4B6B3E;
  --good-rgb:75,107,62;
  --bad:#A23327;
  --bad-rgb:162,51,39;
  --ease:cubic-bezier(.2,.65,.2,1);
  --ease-spring:cubic-bezier(.3,1.4,.4,1);
  /* Typographie : une condensée d'affichage (tableau de score / affiche de
     match), une monospace tabulaire pour tout ce qui est chiffré (scores,
     rangs, points, heures), une neutre pour le texte courant. */
  --f-display:'Oswald',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --f-body:'Work Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--ink);font:400 16px/1.55 var(--f-body);
  background:var(--paper);font-variant-numeric:tabular-nums;
  transition:background-color .3s var(--ease);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

/* Le logo : un pochoir CSS (mask) rempli avec la couleur d'accent du moment. */
.mark{flex:none;display:inline-block;background-color:var(--accent);
  -webkit-mask-image:var(--logo);mask-image:var(--logo);
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;
  transition:background-color .3s var(--ease)}
.mark.light{background-color:#F8EFE2}

@media (prefers-reduced-motion:no-preference){
  button,.tile,.btn,input,select,.tab,.stamp,.jtag,.linkbtn,.rung{transition:background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease),transform .15s var(--ease)}
}
.tile:not(:disabled):active,.jtag:active,.stamp:active{transform:scale(.96)}

/* ===== Ossature : masthead + onglets de classeur en haut, toujours — jamais
   de colonne latérale, jamais de barre d'icônes en bas. Un seul mécanisme de
   navigation, du téléphone au grand écran. ===== */
.board-app{min-height:100vh;display:flex;flex-direction:column}
.masthead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;background:var(--card);border-bottom:1px solid var(--line-soft)}
.mastbrand{display:flex;align-items:center;gap:9px;font:700 19px/1 var(--f-display);letter-spacing:.01em;color:var(--ink)}
.mastme{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:13px}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--accent);font-size:inherit;font-weight:600}
.linkbtn:hover{color:var(--accent-deep)}

.tabs{display:flex;gap:0;padding:0 14px;background:var(--paper-deep);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:0 0 auto;padding:11px 20px 9px;font:600 14.5px/1 var(--f-display);color:var(--ink-soft);background:var(--paper-deep);border:0;
  clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);margin-right:-8px}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{background:var(--card);color:var(--ink);z-index:1}
.tabdot{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;margin-left:5px;border-radius:50%;background:var(--accent2);color:#fff;font:700 10.5px/1 var(--f-mono)}

/* Bandeau "en direct" : le seul endroit où quelque chose défile en continu. */
.ticker{background:var(--accent2);color:#fff;overflow:hidden;white-space:nowrap}
.tickertrack{display:inline-flex;width:max-content;animation:tickerScroll 16s linear infinite}
.tickertrack span{padding:6px 50px 6px 0;font:600 12.5px/1 var(--f-mono);letter-spacing:.02em}
@media (prefers-reduced-motion:reduce){ .tickertrack{animation:none} }

.pages{width:100%;max-width:720px;margin:0 auto;padding:18px 16px 96px;flex:1}
@media (min-width:720px){ .pages{padding:30px 20px 72px} }

/* ===== Billet à souche (bandeau d'accueil de l'onglet Matchs) : un coupon
   détachable plutôt qu'une carte de stats colorée. ===== */
.stub{position:relative;display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line-soft);border-radius:4px;padding:18px 20px;margin:0 0 22px}
.stubnotch{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--paper);transform:translateY(-50%)}
.stubnotch.l{left:-9px}
.stubnotch.r{right:-9px}
.stubleft{flex:1;min-width:0}
.stubgreet{font:600 20px/1.25 var(--f-display);color:var(--ink)}
.stubsub{font-size:13.5px;color:var(--ink-soft);margin-top:4px;max-width:40ch;line-height:1.45}
.perf{align-self:stretch;width:0;border-left:2px dashed var(--line-soft);flex:none}
.perf-v{display:none}
@media (min-width:480px){ .perf-v{display:block} }
.stubright{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.stubright b{font:700 30px/1 var(--f-mono);color:var(--accent)}
.stubright span{font-size:12px;color:var(--ink-soft)}

/* ===== Filtres : des coupons tamponnés, légèrement inclinés, pas un
   sélecteur à curseur animé. ===== */
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;margin:0 0 16px}
.stamprow{display:inline-flex;gap:8px;flex-wrap:wrap}
.stamp{background:none;border:2px dashed var(--line-soft);border-radius:5px;padding:6px 12px;font:600 13.5px/1 var(--f-body);color:var(--ink-soft);transform:rotate(var(--tilt,0deg))}
.stamp:hover{color:var(--ink);border-color:var(--ink-soft)}
.stamp[aria-pressed="true"]{color:#fff;background:var(--accent);border:2px solid var(--accent);transform:rotate(0)}
.cnt{opacity:.75}

.journeerow{display:flex;gap:6px;margin:0 0 18px;padding:2px 2px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.jtag{flex:0 0 auto;padding:6px 12px;border-radius:50px;font:700 13px/1 var(--f-mono);color:var(--ink-soft);background:none;border:1px solid var(--line-soft);white-space:nowrap}
.jtag:hover{color:var(--ink);border-color:var(--ink-soft)}
.jtag[aria-pressed="true"]{color:#fff;background:var(--accent);border-color:var(--accent)}

/* En-tête de jour : un trait de carnet daté, légèrement incliné à la main. */
.dayrule{font:600 14px/1 var(--f-display);margin:26px 0 12px;color:var(--ink-soft);border-top:3px double var(--line-soft);padding-top:8px}
.dayrule span{display:inline-block;transform:rotate(-0.6deg);text-transform:capitalize}
.ledger{display:flex;flex-direction:column;gap:14px;margin-bottom:4px}

/* ===== Le match : une feuille de carnet, accent en bordure gauche, pas une
   carte SaaS arrondie. Les deux camps sont face à face (A — VS — B) et le
   score se choisit plus bas, dans un rouleau à part. ===== */
.strip{position:relative;background:var(--card);border:1px solid var(--line-soft);border-left:6px solid var(--accent);border-radius:3px;overflow:hidden}
@media (prefers-reduced-motion:no-preference){ .strip.enter{animation:stripIn .32s var(--ease) backwards} }
.striphead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line-soft);font-size:12.5px;color:var(--ink-soft)}
.comp{font:600 12.5px/1.3 var(--f-display);color:var(--ink);display:flex;align-items:center;gap:6px}
.compdot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.rnd{color:var(--ink-soft)}
.striphead time{font:500 12px/1 var(--f-mono);margin-left:auto}
.pill{display:inline-block;font:600 10.5px/1 var(--f-body);letter-spacing:.03em;color:var(--ink-soft);padding:3px 8px;border-radius:3px;background:rgba(var(--accent-rgb),.1)}
.pill.live{color:#fff;background:var(--accent2)}
@media (prefers-reduced-motion:no-preference){ .pill.live{animation:blink 1.4s step-end infinite} }

.stripbody{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.stripside{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.stripside:last-child{align-items:flex-end;text-align:right}
.stripside.lose{opacity:.55}
.sidename{font:600 17px/1.3 var(--f-display);color:var(--ink);display:flex;align-items:center;gap:6px;overflow-wrap:anywhere}
.stripside:last-child .sidename{flex-direction:row-reverse}
.flag{width:1.2em;height:.9em;flex:none;border-radius:2px;box-shadow:0 0 0 1px var(--line-soft)}
.win-badge{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--good);color:#fff;font-size:9px;flex:none}
.siderk{font:500 11.5px/1 var(--f-mono);color:var(--ink-soft)}
.sidescore{font:700 30px/1 var(--f-mono);color:var(--ink-soft);margin-top:2px}
.sidescore.win{color:var(--accent)}
.vsmark{flex:none;font:700 12px/1 var(--f-mono);color:var(--ink-soft);letter-spacing:.04em;padding:0 2px}

/* ===== Le rouleau de score : on fait défiler des tuiles façon tableau
   d'affichage à volets, on n'appuie pas sur une grille de puces. ===== */
.reelwrap{border-top:1px solid var(--line-soft);padding:12px 16px 14px}
.reellabel{font:600 11.5px/1 var(--f-body);color:var(--ink-soft);margin-bottom:8px}
.reel{display:flex;align-items:center;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.reelgroup{display:flex;gap:6px;flex:none}
.reeldiv{flex:none;font:700 11px/1 var(--f-mono);color:var(--ink-soft);padding:0 10px;border-left:1px dashed var(--line-soft);border-right:1px dashed var(--line-soft);align-self:stretch;display:flex;align-items:center}
.tile{flex:0 0 auto;scroll-snap-align:center;position:relative;width:58px;height:50px;background:var(--ink);color:var(--card);border:0;border-radius:4px;
  font:700 16px/1 var(--f-mono);display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tile::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:1px;background:rgba(128,128,128,.4)}
.tile i{width:1px;height:14px;background:currentColor;opacity:.35;display:block}
.tile[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 0 0 2px var(--accent),0 2px 0 rgba(0,0,0,.18)}
.tile:not(:disabled):hover{transform:translateY(-2px)}
.tile:disabled{opacity:.4;cursor:not-allowed}
.tile[aria-pressed="true"]:disabled{opacity:1}

/* Jauge : affichée seulement une fois un score choisi — des segments de LED
   qui s'allument, comme un afficheur de tableau de score. */
.ledbox{padding:0 16px 12px}
.ledrow{display:flex;justify-content:space-between;align-items:baseline;font:500 12.5px/1 var(--f-body);color:var(--ink-soft);margin-bottom:6px}
.ledrow b{font:700 14px/1 var(--f-mono);color:var(--accent)}
.ledtrack{height:8px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--line-soft) 0 5px,transparent 5px 7px);position:relative;overflow:hidden}
.ledfill{height:100%;width:var(--w);background:repeating-linear-gradient(90deg,var(--accent) 0 5px,transparent 5px 7px)}
@media (prefers-reduced-motion:no-preference){ .ledfill{animation:ledgrow .5s var(--ease)} }

.stripfoot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:11px 16px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--ink-soft)}
.stamp2{display:inline-block;font:700 11.5px/1 var(--f-mono);padding:3px 9px;border-radius:3px;border:2px solid currentColor;transform:rotate(-2deg)}
.stamp2.exact{color:var(--accent)}
.stamp2.win{color:var(--good)}
.stamp2.miss{color:var(--ink-soft);border-style:dashed}
.friendlist{list-style:none;margin:0;padding:0 16px 12px;font-size:13px}
.friendlist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px dashed var(--line-soft)}
.friendlist li:first-child{border-top:0}

/* ===== Classement des amis : une échelle qu'on grimpe, pas un tableau de
   bord. Chaque barreau porte un rang, un nom, et une petite pile de jetons
   pour visualiser le total sans se fier qu'au chiffre. ===== */
.ladder{position:relative;list-style:none;margin:0;padding:0 0 0 20px}
.ladder::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:3px;background:var(--line-soft);border-radius:2px}
.rung{position:relative;display:flex;align-items:center;gap:14px;padding:13px 4px 13px 10px;margin-bottom:2px}
.rung::before{content:"";position:absolute;left:-15px;top:50%;width:15px;height:3px;background:var(--line-soft)}
.rung.me::before{background:var(--accent)}
.rung.me{background:rgba(var(--accent-rgb),.07);border-radius:4px}
.rungrank{flex:none;width:30px;text-align:center;font:700 19px/1 var(--f-mono);color:var(--ink-soft)}
.rungmid{flex:1;min-width:0}
.rungname{font:600 16px/1.3 var(--f-display);overflow-wrap:anywhere;color:var(--ink)}
.rungsub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.tally{display:inline-flex;align-items:center;gap:3px;margin-top:5px;flex-wrap:wrap}
.tally i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.tally span{font:700 11px/1 var(--f-mono);color:var(--accent);margin-left:4px}
.rungpts{flex:none;font:700 22px/1 var(--f-mono);text-align:right;color:var(--accent)}
.rungpts small{font-size:12px;font-weight:500;color:var(--ink-soft);margin-left:3px;font-family:var(--f-body)}
.rules{color:var(--ink-soft);font-size:12.5px;margin:18px 2px 4px;line-height:1.6}

/* ===== Classements mondiaux/Pro A : un fichier de fiches, pas une seconde
   échelle — pour qu'on ne confonde pas les deux classements. ===== */
.filebox{list-style:none;margin:0;padding:0}
.filecard{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line-soft);cursor:pointer}
.filecard:first-child{border-top:0}
.filecard:hover .filename,.filecard:focus-visible .filename{color:var(--accent)}
.filerank{flex:none;width:28px;height:28px;border-radius:50%;background:var(--line-soft);display:flex;align-items:center;justify-content:center;font:700 12.5px/1 var(--f-mono);color:var(--ink-soft)}
.filemid{flex:1;min-width:0}
.filename{font:600 15px/1.3 var(--f-display);color:var(--ink);overflow-wrap:anywhere}
.filesub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.filepts{flex:none;font:700 15px/1 var(--f-mono);color:var(--ink-soft);text-align:right}
.filepts small{font-size:11px;font-weight:500;margin-left:2px}
.namebtn{all:unset;cursor:pointer}
.namebtn:hover,.namebtn:focus-visible{color:var(--accent)}

/* ===== Billet (connexion) et billet-joueur (fiche détail) : un coupon
   détachable avec perforation, pas un panneau SaaS deux-colonnes. ===== */
.gatewrap{flex:1;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:28px 14px}
.ticket{position:relative;width:100%;max-width:420px;background:var(--card);border-radius:6px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.ticketnotch{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:var(--ink);transform:translateY(-50%)}
.ticketnotch.l{left:-10px}
.ticketnotch.r{right:-10px}
.authhead{padding:30px 26px 18px;text-align:center}
.authhead .mark{margin:0 auto 14px}
.authhead h1{font:700 32px/1 var(--f-display);margin:0 0 10px;color:var(--ink)}
.authhead p{font-size:13.5px;color:var(--ink-soft);margin:0;line-height:1.55}
.ticket > .perf{width:auto;border-left:0;border-top:2px dashed var(--line-soft);margin:0 22px}
.ledgerform{padding:20px 26px 6px}
label{display:block;font-size:12.5px;font-weight:600;margin:16px 0 5px;color:var(--ink-soft)}
input,select,textarea{width:100%;background:transparent;border:0;border-bottom:2px dashed var(--line-soft);border-radius:0;padding:9px 2px;font-size:16px;color:var(--ink);font-family:var(--f-body)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-bottom-style:solid;border-bottom-color:var(--accent)}
textarea{resize:vertical;border:2px dashed var(--line-soft);border-radius:4px;padding:8px}
textarea:focus-visible{border-style:solid;border-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:3px;padding:13px 18px;font:700 14.5px/1 var(--f-display);letter-spacing:.02em;margin-top:18px;width:100%;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn:hover{background:var(--accent-deep)}
.btn.sec{background:transparent;color:var(--accent);border:2px solid var(--accent);box-shadow:none}
.btn.sec:hover{background:rgba(var(--accent-rgb),.08)}
.btn.small{width:auto;margin-top:0;padding:9px 14px;font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vs{font:700 15px/1 var(--f-mono);color:var(--ink-soft)}
.ferr{color:var(--bad);font-size:13px;margin:12px 26px 0;min-height:1.2em}
.fok{color:var(--good)}
.switch{text-align:center;color:var(--ink-soft);font-size:13px;padding:14px 20px 24px}

/* Fiche joueur/équipe */
.modalbackdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
@media (prefers-reduced-motion:no-preference){ .modalbackdrop{animation:fadeIn .15s var(--ease)} }
@media (min-width:640px){ .modalbackdrop{align-items:center;padding:20px} }
.playerticket{width:100%;max-width:440px;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:16px 16px 0 0}
@media (prefers-reduced-motion:no-preference){ .playerticket{animation:modalIn .22s var(--ease-spring)} }
@media (min-width:640px){ .playerticket{border-radius:10px} }
.modalclose{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);font-size:19px;line-height:1;cursor:pointer;z-index:1}
.modalclose:hover{background:var(--paper-deep)}
.modalname{font:600 22px/1.25 var(--f-display);display:flex;align-items:center;gap:8px;justify-content:center}
.modalsub{font-size:13px;color:var(--ink-soft);margin-top:4px}
.modalstats{display:flex;gap:20px;justify-content:center;padding:16px 20px 4px}
.statbox{display:flex;flex-direction:column;align-items:center;gap:1px}
.statbox b{font:700 22px/1.1 var(--f-mono);color:var(--accent)}
.statbox span{font-size:11px;color:var(--ink-soft)}
.modalbody{padding:6px 22px 22px}
.modalsec{padding:14px 0 2px}
.modalsec h3{font:600 12.5px/1 var(--f-body);letter-spacing:.03em;color:var(--ink-soft);margin:0 0 10px;border-bottom:1px solid var(--line-soft);padding-bottom:8px}
.sec-empty{color:var(--ink-soft);font-size:13.5px;text-align:center;padding:14px 0}
.cmlist{list-style:none;margin:0;padding:0}
.cmrow{padding:8px 0;border-top:1px dashed var(--line-soft)}
.cmlist li:first-child{border-top:0;padding-top:0}
.cmopp{font:600 14.5px/1.3 var(--f-display);color:var(--ink)}
.cmmeta{display:flex;align-items:center;gap:8px;margin-top:3px}
.cmdate{font-size:12px;color:var(--ink-soft);text-transform:capitalize}
.cmres{flex:0 0 auto;font-weight:700;font-size:11px;padding:2px 7px;border-radius:3px;background:var(--line-soft);color:var(--ink-soft);font-family:var(--f-mono)}
.cmres.win{color:var(--good);background:rgba(var(--good-rgb),.15)}
.cmres.loss{color:var(--bad);background:rgba(var(--bad-rgb),.15)}
.roster{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.roster li{background:var(--paper);border:1px solid var(--line-soft);border-radius:4px;padding:8px 10px;font:500 13px/1.25 var(--f-body);color:var(--ink)}

/* ===== Admin : la planchette du marqueur de la rencontre. ===== */
.clipboard{position:relative;background:var(--card);border:1px solid var(--line-soft);border-radius:4px;padding:26px 18px 18px;margin:0 0 18px}
.clipboard::before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:64px;height:16px;background:var(--ink-soft);border-radius:3px}
.clipboard h2{font:600 18px/1.2 var(--f-display);margin:0 0 4px;color:var(--ink)}
.hint{color:var(--ink-soft);font-size:13px;margin:4px 0 0}
.clipitem{padding:14px 0;border-top:1px dashed var(--line-soft)}
.clipitem:first-of-type{border-top:0}
.clipitem-title{font-weight:600;color:var(--ink);font-family:var(--f-display)}
.clipactions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px}
.scorein{width:52px;text-align:center;font:700 16px/1 var(--f-mono);padding:8px 5px;border:2px dashed var(--line-soft);border-radius:4px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:4px;font-weight:600;font-size:13.5px;z-index:60;max-width:90vw;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.28)}
@media (prefers-reduced-motion:no-preference){ .toast{animation:toastIn .22s var(--ease-spring)} }
.toast.leaving{animation:toastOut .18s ease-in forwards}
.toast.err{background:var(--bad);color:#fff}
.empty{padding:30px 4px;text-align:center;color:var(--ink-soft)}
.loading{padding:70px 0;text-align:center;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:12px}

@keyframes stripIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (min-width:640px){ @keyframes modalIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}} }
@keyframes ledgrow{from{width:0}to{width:var(--w)}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.35}100%{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,8px)}}
@keyframes tickerScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;animation:none!important;transition:none!important}
  ::view-transition-old(root),::view-transition-new(root){animation:none!important}
}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s;animation-timing-function:cubic-bezier(.2,.65,.2,1)}
</style>

// Thème de toute l'appli : basé sur le circuit choisi, et pour le WTT, sur le
// tournoi le plus pertinent du moment (celui en direct, sinon le plus proche).
function currentThemeKey() {
  if (S.tab !== 'matches') return 'ALL';
  if (S.circuit === 'PRO_A') return 'PRO_A';
  if (S.circuit !== 'WTT') return 'ALL';
  const wtt = S.matches.filter(m => m.circuit === 'WTT');
  if (!wtt.length) return 'WTT_DEFAULT';
  const now = Date.now();
  const live = wtt.filter(m => m.status === 'live');
  // Plusieurs matchs peuvent être "en direct" en même temps (plusieurs tables,
  // ou un match resté coincé en direct faute de résultat synchronisé) : on
  // prend celui dont l'heure de début est la plus proche de maintenant, qui
  // correspond le mieux au tournoi réellement en cours aujourd'hui.
  const next = wtt.filter(m => m.status === 'scheduled').sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at))[0];
  const pick = live.length
    ? live.reduce((a, b) => Math.abs(new Date(b.starts_at) - now) < Math.abs(new Date(a.starts_at) - now) ? b : a)
    : (next || wtt[0]);
  return TIER_KEY[pick.tier] || 'WTT_DEFAULT';
}

function toast(msg, isErr) {
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.setAttribute('role', 'status');
  el.textContent = msg;
  document.body.appendChild(el);

}

function friendlyError(e) {
  const msg = (e && e.message) || String(e);
  if (/Invalid login credentials/i.test(msg)) return 'Email ou mot de passe incorrect.';
  if (/Database error saving new user|invitation/i.test(msg)) return "Inscription refusée : vérifie le code d'invitation, et choisis un pseudo de 2 à 20 caractères qui n'est pas déjà pris.";
  if (/already (been )?registered/i.test(msg)) return 'Cet email a déjà un compte. Connecte-toi.';
  if (/at least \d+ characters/i.test(msg)) return 'Le mot de passe doit faire au moins 6 caractères.';
  if (/Email not confirmed/i.test(msg)) return "Ton email n'est pas encore confirmé. Vérifie ta boîte mail.";
  if (/Score impossible/i.test(msg)) return msg;
  if (/row-level security/i.test(msg)) return "Action refusée : le match a peut-être déjà commencé, ou tu n'as pas les droits.";
  if (/duplicate key/i.test(msg)) return 'Cet élément existe déjà.';
  return msg;
}

/* ---------- Prédictions statistiques ---------- */
/* Estimation simple : classement + forme récente + face-à-face.
   Ce n'est pas une certitude, juste une tendance. */
function binom(n, k) { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; }
function winProb(q, n) { let s = 0; for (let k = 0; k < n; k++) s += binom(n - 1 + k, k) * Math.pow(q, n) * Math.pow(1 - q, k); return s; }
function setProbFromMatchProb(p, n) {
  let lo = 0.001, hi = 0.999;
  for (let i = 0; i < 50; i++) { const mid = (lo + hi) / 2; if (winProb(mid, n) < p) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
function bestScore(q, n) {
  let best = null;
  for (let k = 0; k < n; k++) {
    const pa = binom(n - 1 + k, k) * Math.pow(q, n) * Math.pow(1 - q, k);
    const pb = binom(n - 1 + k, k) * Math.pow(1 - q, n) * Math.pow(q, k);
    if (!best || pa > best.p) best = { p: pa, a: n, b: k };
    if (pb > best.p) best = { p: pb, a: k, b: n };
  }
  return best;
}
function recentForm(id) {
  const games = S.matches
    .filter(m => m.status === 'finished' && (m.competitor_a_id === id || m.competitor_b_id === id))
    .sort((x, y) => new Date(y.starts_at) - new Date(x.starts_at)).slice(0, 5);
  if (games.length < 2) return null;
  const wins = games.filter(m => (m.competitor_a_id === id) === (m.score_a > m.score_b)).length;
  return wins / games.length;
}
function headToHead(a, b) {
  let wa = 0, wb = 0;
  for (const m of S.matches) {
    if (m.status !== 'finished') continue;
    if (m.competitor_a_id === a && m.competitor_b_id === b) { if (m.score_a > m.score_b) wa++; else wb++; }
    else if (m.competitor_a_id === b && m.competitor_b_id === a) { if (m.score_a > m.score_b) wb++; else wa++; }
  }
  return { wa, wb };
}
function trend(m) {
  const a = S.competitors[m.competitor_a_id], b = S.competitors[m.competitor_b_id];
  if (!a || !b || !a.ranking || !b.ranking) return null;
  let z = 0.45 * (Math.log(b.ranking) - Math.log(a.ranking));
  const fa = recentForm(a.id), fb = recentForm(b.id);
  if (fa !== null && fb !== null) z += 1.2 * (fa - fb);
  const h = headToHead(a.id, b.id);
  if (h.wa + h.wb > 0) z += 0.5 * (h.wa - h.wb) / (h.wa + h.wb);
  const pA = 1 / (1 + Math.exp(-z));
  const q = setProbFromMatchProb(pA, m.wins_needed);
  return { pA, q, score: bestScore(q, m.wins_needed) };
}
// Probabilité d'un score exact précis (a–b), à partir de q (probabilité de
// gagner une manche pour le côté A) : sert à afficher "X % de chances" sur le
// score sélectionné, plutôt qu'un pourcentage global de victoire par côté.
function scoreProb(q, n, a, b) {
  if (a === n) return binom(n - 1 + b, b) * Math.pow(q, n) * Math.pow(1 - q, b);
  if (b === n) return binom(n - 1 + a, a) * Math.pow(1 - q, n) * Math.pow(q, a);
  return 0;
}
// Bonus "outsider" (WTT uniquement) : un pronostic gagnant sur le joueur le moins bien classé
// au tirage au sort rapporte un supplément, d'autant plus grand que l'écart est important.
// Basé sur la tête de série figée à la création du match : elle ne bouge jamais après coup,
// même si le classement du joueur change ensuite (pour son tournoi suivant, par exemple).
function outsiderBonus(m, bonVainqueur) {
  if (!bonVainqueur || m.circuit !== 'WTT' || m.seed_a == null || m.seed_b == null) return 0;
  const aGagne = m.score_a > m.score_b;
  const outsiderGagne = aGagne ? m.seed_a > m.seed_b : m.seed_b > m.seed_a;
  if (!outsiderGagne) return 0;
  return Math.min(Math.floor(Math.abs(m.seed_a - m.seed_b) / 4), 5);
}
function pointsDetail(m, p) {
  if (m.status !== 'finished' || !p) return null;
  const exact = p.pred_a === m.score_a && p.pred_b === m.score_b;
  const bonVainqueur = Math.sign(p.pred_a - p.pred_b) === Math.sign(m.score_a - m.score_b);
  const base = exact ? 3 : (bonVainqueur ? 1 : 0);
  const bonus = outsiderBonus(m, bonVainqueur);
  return { total: base + bonus, base, bonus, exact };
}
function points(m, p) {
  const d = pointsDetail(m, p);
  return d ? d.total : null;
}

/* ---------- Chargement des données ---------- */
async function reloadMatches() {
  const since = new Date(Date.now() - 90 * 864e5).toISOString();
  const r = await sb.from('matches').select('*').gte('starts_at', since).order('starts_at', { ascending: true }).limit(500);
  if (r.error) throw r.error;
  S.matches = r.data || [];
}
async function reloadCompetitors() {
  const r = await sb.from('competitors').select('*').limit(2000);
  if (r.error) throw r.error;
  S.competitors = {};
  (r.data || []).forEach(c => { S.competitors[c.id] = c; });
}
async function loadAll() {
  const uid = S.session.user.id;
  const [p, preds, adm] = await Promise.all([
    sb.from('profiles').select('pseudo').eq('id', uid).maybeSingle(),
    sb.from('predictions').select('*').eq('user_id', uid).limit(3000),
    sb.rpc('is_admin')
  ]);
  await Promise.all([reloadMatches(), reloadCompetitors()]);
  S.pseudo = (p.data && p.data.pseudo) || '';
  S.myPreds = {};
  (preds.data || []).forEach(x => { S.myPreds[x.match_id] = x; });
  S.isAdmin = adm.data === true;
  loadBoard().then(render); // chargé à part : n'empêche pas la connexion s'il échoue
}
async function loadBoard() {
  const q = S.boardScope === 'ALL'
    ? sb.from('leaderboard').select('*')
    : sb.from('leaderboard_by_circuit').select('*').eq('circuit', S.boardScope);
  const r = await q.order('total_points', { ascending: false }).order('exact_scores', { ascending: false });
  if (r.error) { toast(friendlyError(r.error), true); S.board = []; return; }
  S.board = r.data || [];
}

/* ---------- Session ---------- */
async function handleSession(session) {
  if (!session) {
    S.session = null; S.pseudo = ''; S.isAdmin = false; S.matches = []; S.myPreds = {}; S.board = null;
    render(); return;
  }
  if (S.session && S.session.user.id === session.user.id) { S.session = session; return; }
  S.session = session;
  $app.innerHTML = '<div class="loading">Chargement…</div>';
  try { await loadAll(); S.bootError = ''; }
  catch (e) { S.bootError = friendlyError(e); }
  render();
}

/* ---------- Affichage ---------- */
function render() {
  if (!S.session) { applyThemeVars(document.documentElement.style, 'ALL'); $app.innerHTML = authView(); return; }
  const themeKey = currentThemeKey();
  document.documentElement.dataset.theme = themeKey;
  applyThemeVars(document.documentElement.style, themeKey);
  const themeColorMeta = document.querySelector && document.querySelector('meta[name="theme-color"]');
  if (themeColorMeta) themeColorMeta.setAttribute('content', THEME[themeKey].paper);
  const live = S.matches.find(m => m.status === 'live');
  $app.innerHTML = `
    <div class="board-app">
      ${nav()}
      ${live ? tickerHtml(live) : ''}
      <main class="pages">${S.bootError ? `<p class="ferr" role="alert">Impossible de charger les données : ${esc(S.bootError)}</p>` : ''}${tabView()}</main>
    </div>${S.openCompetitor ? competitorModal(S.openCompetitor) : ''}`;
}
function keepRender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
// Change d'écran avec un fondu enchaîné natif quand le navigateur le sait faire
// (tout le monde sauf les très vieux Firefox/Safari) ; sinon, bascule sans effet.
function navigate(fn) {
  if (document.startViewTransition) document.startViewTransition(fn);
  else fn();
}
// Bandeau "en direct" façon LED défilante : le seul mouvement non déclenché
// par un geste de toute l'appli, réservé au seul moment qui l'est vraiment.
function tickerHtml(live) {
  const txt = `EN DIRECT — ${esc(live.side_a)} ${live.score_a ?? 0}–${live.score_b ?? 0} ${esc(live.side_b)} — ${esc(live.competition)}`;
  return `<div class="ticker" role="status"><div class="tickertrack"><span>${txt}</span><span aria-hidden="true">${txt}</span></div></div>`;
}
// Masthead + onglets de classeur : toujours en haut, identiques du téléphone
// au grand écran. Pas de colonne latérale, pas de barre d'icônes en bas.
function nav() {
  const todo = S.matches.filter(m => !isLocked(m) && !S.myPreds[m.id]).length;
  const tabs = [['matches', 'Matchs'], ['board', 'Amis'], ['rankings', 'Classements']];
  if (S.isAdmin) tabs.push(['admin', 'Admin']);
  return `
  <header class="masthead">
    <div class="mastbrand">${MARK(28)}<span>${esc(APP_NAME)}</span></div>
    <div class="mastme"><span>${esc(S.pseudo)}</span><button class="linkbtn" data-act="logout">Se déconnecter</button></div>
  </header>
  <nav class="tabs" aria-label="Navigation principale">
    ${tabs.map(([k, label]) => `<button class="tab" data-act="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${esc(label)}${k === 'matches' && todo ? `<span class="tabdot" title="Pronos à faire">${todo}</span>` : ''}</button>`).join('')}
  </nav>`;
}
// Une rangée de filtres façon coupons tamponnés : l'option active est
// "compostée" (fond plein), les autres restent de simples coupons en attente.
const SEG_LABELS = { view: 'Période', circuit: 'Circuit', boardscope: 'Classement', rankview: 'Circuit' };
function segRow(items, cur, act) {
  return `<div class="stamprow" data-seg="${act}" role="group" aria-label="${SEG_LABELS[act] || ''}">
    ${items.map(([k, l], i) => `<button class="stamp" data-act="${act}" data-v="${k}" aria-pressed="${cur === k}" style="--tilt:${i % 2 ? 1 : -1}deg">${l}</button>`).join('')}</div>`;
}

function tabView() {
  if (S.tab === 'board') return boardView();
  if (S.tab === 'rankings') return rankingsView();
  if (S.tab === 'admin' && S.isAdmin) return adminView();
  return matchesView();
}

/* --- Connexion : un billet d'entrée au club, pas un formulaire SaaS en deux
   colonnes. --- */
function authView() {
  const su = S.authMode === 'signup';
  return `
  <div class="gatewrap">
    <div class="ticket">
      <div class="ticketnotch l" aria-hidden="true"></div><div class="ticketnotch r" aria-hidden="true"></div>
      <div class="authhead">${MARK(46, true)}<h1>${esc(APP_NAME)}</h1>
      <p>Les pronostics de tennis de table entre amis : WTT et Pro A. Vainqueur, score exact, et un bonus quand tu devines juste sur l'outsider.</p></div>
      <div class="perf" aria-hidden="true"></div>
      <form id="authform" class="ledgerform">
        ${su ? `<label for="pseudo">Pseudo</label><input id="pseudo" required minlength="2" maxlength="20" autocomplete="nickname">` : ''}
        <label for="email">Email</label><input id="email" type="email" required autocomplete="email">
        <label for="pw">Mot de passe</label><input id="pw" type="password" required minlength="6" autocomplete="${su ? 'new-password' : 'current-password'}">
        ${su ? `<label for="code">Code d'invitation</label><input id="code" required autocomplete="off" autocapitalize="characters">` : ''}
        <button class="btn" type="submit">${su ? 'Créer mon compte' : 'Me connecter'}</button>
        <div id="autherr" class="ferr" role="alert"></div>
      </form>
      <p class="switch">${su ? 'Déjà un compte ?' : 'Pas encore de compte ?'} <button class="linkbtn" data-act="authmode">${su ? 'Me connecter' : 'Créer un compte'}</button></p>
    </div>
  </div>`;
}
async function submitAuth(f) {
  const err = f.querySelector('#autherr'); err.className = 'ferr'; err.textContent = '';
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  const email = f.querySelector('#email').value.trim(), password = f.querySelector('#pw').value;
  try {
    if (S.authMode === 'signup') {
      const pseudo = f.querySelector('#pseudo').value.trim();
      const code = f.querySelector('#code').value.trim().toUpperCase();
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { pseudo, invite_code: code } } });
      if (error) throw error;
      if (!data.session) { err.className = 'ferr fok'; err.textContent = 'Compte créé. Confirme ton email (regarde ta boîte mail) puis connecte-toi.'; }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (e) { err.textContent = friendlyError(e); }
  btn.disabled = false;
}

/* --- Matchs : un carnet, pas un fil de cartes. --- */
function matchesView() {
  // "fresh" : la liste vient d'être ouverte ou filtrée (pas juste un prono posé
  // ailleurs sur la même liste) -> les lignes ont le droit de rejouer leur entrée.
  const fresh = S._freshMatches; S._freshMatches = false;
  const list = S.matches.filter(m => S.circuit === 'ALL' || m.circuit === S.circuit);
  const up = list.filter(m => m.status === 'scheduled' || m.status === 'live').sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const doneAll = list.filter(m => m.status === 'finished' || m.status === 'cancelled');
  const done = doneAll.slice().sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at)).slice(0, 60);
  let shown = S.view === 'upcoming' ? up : done;

  // Pro A : un onglet "journée" plutôt qu'un défilement infini. On choisit
  // automatiquement la journée la plus pertinente tant que l'utilisateur n'a
  // pas cliqué lui-même.
  let journeeRow = '';
  if (S.circuit === 'PRO_A') {
    const journeeOf = m => { const mm = /^Journée (\d+)$/.exec(m.round || ''); return mm ? +mm[1] : null; };
    const nums = [...new Set(list.map(journeeOf).filter(n => n !== null))].sort((a, b) => a - b);
    if (nums.length) {
      if (S.proJournee === null || !nums.includes(S.proJournee)) {
        const nextUp = up.map(journeeOf).find(n => n !== null);
        S.proJournee = nextUp ?? nums[nums.length - 1];
      }
      journeeRow = `<div class="journeerow" role="group" aria-label="Journée">
        ${nums.map(n => `<button class="jtag" data-act="journee" data-v="${n}" aria-pressed="${S.proJournee === n}">J${n}</button>`).join('')}
      </div>`;
      shown = shown.filter(m => journeeOf(m) === S.proJournee);
    }
  }
  let body = '';
  if (!shown.length) {
    body = `<div class="empty">${S.view === 'upcoming'
      ? (S.isAdmin ? "Aucun match à venir. Ajoute le premier dans l'onglet Admin." : (S.circuit === 'PRO_A' ? "Aucun match à venir pour cette journée." : "Aucun match à venir pour le moment. Ils apparaissent ici dès qu'ils sont ajoutés."))
      : (S.circuit === 'PRO_A' ? "Aucun match terminé pour cette journée." : "Aucun match terminé pour l'instant.")}</div>`;
  } else {
    let lastDay = '';
    let i = 0;
    for (const m of shown) {
      const d = fmtDay(m.starts_at);
      if (d !== lastDay) {
        if (lastDay) body += '</div>';
        body += `<h2 class="dayrule"><span>${esc(d)}</span></h2><div class="ledger">`;
        lastDay = d;
      }
      body += matchCard(m, fresh, i++);
    }
    body += '</div>';
  }
  const cnt = n => `<span class="cnt">${n}</span>`;
  return heroBand(up) + `<div class="filters">`
    + segRow([['upcoming', `À venir ${cnt(up.length)}`], ['done', `Terminés ${cnt(doneAll.length)}`]], S.view, 'view')
    + segRow([['ALL', 'Tous'], ['WTT', 'WTT'], ['PRO_A', 'Pro A']], S.circuit, 'circuit')
    + `</div>` + journeeRow + body;
}
// Le "billet à souche" de l'onglet Matchs : coupon détachable (encoches +
// perforation) plutôt qu'une carte de stats colorée.
function heroBand(upcoming) {
  const todo = upcoming.filter(m => !isLocked(m) && !S.myPreds[m.id]).length;
  const mine = S.board && S.board.find(r => r.user_id === S.session.user.id);
  return `<div class="stub">
    <div class="stubnotch l" aria-hidden="true"></div><div class="stubnotch r" aria-hidden="true"></div>
    <div class="stubleft">
      <div class="stubgreet">Salut ${esc(S.pseudo)}</div>
      <div class="stubsub">${todo ? `Il te reste ${todo} prono${todo > 1 ? 's' : ''} à faire avant le coup d'envoi.` : "Tous tes pronos sont à jour, bien joué."}</div>
    </div>
    <div class="perf perf-v" aria-hidden="true"></div>
    <div class="stubright">
      <b>${mine ? mine.total_points : '—'}</b>
      <span>${mine ? `pt${mine.total_points > 1 ? 's' : ''} · ${ordinalRank(S.board, mine)}` : 'pas de points'}</span>
    </div>
  </div>`;
}
function ordinalRank(board, mine) {
  let rank = 1, prev = null;
  for (let i = 0; i < board.length; i++) {
    const k = board[i].total_points + '/' + board[i].exact_scores;
    if (k !== prev) { rank = i + 1; prev = k; }
    if (board[i].user_id === mine.user_id) return rank + (rank === 1 ? 'er' : 'e');
  }
  return '';
}

// Le sélecteur de score : un rouleau qu'on fait défiler, comme un compteur
// mécanique, pas une grille de puces collées à chaque ligne.
function chips(m, side, mine, disabled) {
  const n = m.wins_needed, out = [];
  for (let k = 0; k < n; k++) {
    const a = side === 'A' ? n : k, b = side === 'A' ? k : n;
    const sel = !!mine && mine.pred_a === a && mine.pred_b === b;
    const who = side === 'A' ? m.side_a : m.side_b;
    out.push(`<button class="tile" data-act="pick" data-id="${m.id}" data-a="${a}" data-b="${b}" aria-pressed="${sel}" aria-label="${esc(who)} gagne ${a} à ${b}" ${disabled ? 'disabled' : ''}><span>${a}</span><i aria-hidden="true"></i><span>${b}</span></button>`);
  }
  return out.join('');
}

function matchCard(m, fresh, i) {
  const locked = isLocked(m), mine = S.myPreds[m.id];
  const fin = m.status === 'finished', canc = m.status === 'cancelled';
  const winA = fin && m.score_a > m.score_b, winB = fin && m.score_b > m.score_a;
  const ca = S.competitors[m.competitor_a_id], cb = S.competitors[m.competitor_b_id];
  const flag = flagHtml;
  const rk = c => (c && c.ranking) ? (c.circuit === 'WTT' ? `#${c.ranking}` : `Cl. ${c.ranking}`) : '';
  // Nom cliquable vers la fiche détail quand on a une fiche joueur/équipe liée
  // (un match ajouté à la main sans lien n'a pas de fiche : texte simple).
  const nameBtn = (c, label) => c
    ? `<button class="namebtn" data-act="competitor" data-id="${c.id}">${esc(label)}</button>`
    : esc(label);

  let pill = '';
  if (fin) pill = '<span class="pill">Terminé</span>';
  else if (canc) pill = '<span class="pill">Annulé</span>';
  else if (m.status === 'live') pill = '<span class="pill live">En direct</span>';
  else if (locked) pill = '<span class="pill">Commencé</span>';

  const showReel = !fin && !canc;
  const t = (!locked && !canc) ? trend(m) : null;
  // Jauge du pourcentage : seulement une fois qu'un prono a été fait, et pour
  // CE score précis.
  const pickProb = (mine && t) ? Math.round(scoreProb(t.q, m.wins_needed, mine.pred_a, mine.pred_b) * 100) : null;
  const gaugeHtml = pickProb !== null ? `
    <div class="ledbox">
      <div class="ledrow"><span>Chances d'avoir ${mine.pred_a}–${mine.pred_b}</span><b>${pickProb}%</b></div>
      <div class="ledtrack" role="img" aria-label="${pickProb}% de chances d'avoir le score ${mine.pred_a}–${mine.pred_b}"><div class="ledfill" style="--w:${pickProb}%"></div></div>
    </div>` : '';

  let foot;
  if (canc) foot = `<div class="stripfoot"><span>Match annulé : aucun point en jeu.</span></div>`;
  else if (!locked) foot = `<div class="stripfoot"><span>${mine ? `Prono enregistré : ${mine.pred_a}–${mine.pred_b}. Modifiable jusqu'au coup d'envoi.` : 'Fais défiler le rouleau pour choisir ton score.'}</span></div>`;
  else {
    const pt = points(m, mine);
    const det = mine ? pointsDetail(m, mine) : null;
    const stampClass = pt === 0 ? 'miss' : (det && det.exact ? 'exact' : 'win');
    foot = `<div class="stripfoot">
      <span>${mine ? `Ton prono : ${mine.pred_a}–${mine.pred_b}` : `Tu n'as pas fait de prono.`}</span>
      ${pt !== null ? `<span class="stamp2 ${stampClass}">${pt > 0 ? '+' : ''}${pt} pt${Math.abs(pt) > 1 ? 's' : ''}${det.bonus ? ` · bonus outsider +${det.bonus}` : ''}</span>` : ''}
      <button class="linkbtn" data-act="friends" data-id="${m.id}">${S.openFriends[m.id] ? 'Masquer' : 'Voir'} les pronos des amis</button></div>`;
  }

  let friends = '';
  if (S.openFriends[m.id]) {
    const rows = (S.friends[m.id] || []).map(r => ({ ...r, pt: points(m, r) }))
      .sort((x, y) => (y.pt ?? -1) - (x.pt ?? -1));
    friends = rows.length
      ? `<ul class="friendlist">${rows.map(r => `<li><span>${esc(r.profiles && r.profiles.pseudo)}${r.user_id === S.session.user.id ? ' (toi)' : ''}</span><span>${r.pred_a}–${r.pred_b}${r.pt !== null ? ` · ${r.pt} pt${r.pt > 1 ? 's' : ''}` : ''}</span></li>`).join('')}</ul>`
      : `<p class="hint" style="padding:0 16px 12px">Personne n'a fait de prono sur ce match.</p>`;
  }

  const cardTheme = themeKeyFor(m);
  const cardStyle = `${themeVarsCss(cardTheme)}${fresh ? `;animation-delay:${Math.min(i, 8) * 45}ms` : ''}`;
  const compDot = m.circuit === 'WTT' ? `<span class="compdot" aria-hidden="true"></span>` : '';
  // Deux camps face à face (A — VS — B), le score du match fini s'affiche en
  // grand mono de chaque côté ; sinon, c'est le rouleau plus bas qui s'en charge.
  const side = (c, label, scoreVal, isWinner, isLoser) => `
    <div class="stripside${isLoser ? ' lose' : ''}">
      <div class="sidename">${flag(c)}${nameBtn(c, label)}${isWinner ? '<span class="win-badge" aria-hidden="true">✓</span>' : ''}</div>
      ${rk(c) ? `<div class="siderk">${rk(c)}</div>` : ''}
      ${fin ? `<div class="sidescore${isWinner ? ' win' : ''}">${scoreVal}</div>` : ''}
    </div>`;

  const reelHtml = showReel ? `
    <div class="reelwrap">
      <div class="reellabel">${locked ? 'Pronos clos' : 'Choisis ton score'}</div>
      <div class="reel">
        <div class="reelgroup">${chips(m, 'A', mine, locked)}</div>
        <div class="reeldiv" aria-hidden="true">VS</div>
        <div class="reelgroup">${chips(m, 'B', mine, locked)}</div>
      </div>
    </div>` : '';

  return `
  <article class="strip${fresh ? ' enter' : ''}" data-card="${m.id}" style="${cardStyle}">
    <div class="striphead">
      <span class="comp">${compDot}${esc(m.competition)}</span>${m.round ? `<span class="rnd">${esc(m.round)}</span>` : ''}
      <time datetime="${esc(m.starts_at)}">${esc(fmtWhen(m.starts_at))}</time>${pill}
    </div>
    <div class="stripbody">
      ${side(ca, m.side_a, m.score_a, winA, winB)}
      <div class="vsmark" aria-hidden="true">VS</div>
      ${side(cb, m.side_b, m.score_b, winB, winA)}
    </div>
    ${reelHtml}${gaugeHtml}${foot}${friends}
  </article>`;
}

async function pick(id, a, b) {
  const m = S.matches.find(x => x.id === id);
  if (!m || isLocked(m)) { toast('Trop tard : le match a commencé.', true); keepRender(); return; }
  const { data, error } = await sb.from('predictions')
    .upsert({ user_id: S.session.user.id, match_id: id, pred_a: a, pred_b: b }, { onConflict: 'user_id,match_id' })
    .select().single();
  if (error) { toast(friendlyError(error), true); return; }
  S.myPreds[id] = data;
  toast(`Prono enregistré : ${a}–${b}`);
  keepRender();
}
async function toggleFriends(id) {
  if (S.openFriends[id]) { S.openFriends[id] = false; keepRender(); return; }
  const { data, error } = await sb.from('predictions').select('user_id,pred_a,pred_b,profiles(pseudo)').eq('match_id', id);
  if (error) { toast(friendlyError(error), true); return; }
  S.friends[id] = data || []; S.openFriends[id] = true; keepRender();
}

/* --- Classement des amis : une échelle qu'on grimpe, pas un tableau. --- */
function boardView() {
  const seg = segRow([['ALL', 'Général'], ['WTT', 'WTT'], ['PRO_A', 'Pro A']], S.boardScope, 'boardscope');
  if (S.board === null) return seg + '<div class="loading">Chargement…</div>';
  if (!S.board.length) return seg + `<div class="empty">Pas encore de points. Le classement se remplit dès que les premiers matchs sont terminés.</div>${rules()}`;
  let prev = null, rank = 0;
  const rows = S.board.map((r, i) => {
    const key = r.total_points + '/' + r.exact_scores;
    if (key !== prev) { rank = i + 1; prev = key; }
    const me = r.user_id === S.session.user.id;
    const balls = Math.max(Math.min(r.total_points, 12), 0);
    const dots = balls > 0 ? `<div class="tally">${'<i></i>'.repeat(balls)}${r.total_points > 12 ? `<span>+${r.total_points - 12}</span>` : ''}</div>` : '';
    return `<li class="rung${me ? ' me' : ''}">
      <div class="rungrank">${rank}</div>
      <div class="rungmid"><div class="rungname">${esc(r.pseudo)}${me ? ' (toi)' : ''}</div>
      <div class="rungsub">${r.exact_scores} score${r.exact_scores > 1 ? 's' : ''} exact${r.exact_scores > 1 ? 's' : ''} · ${r.good_winners} vainqueur${r.good_winners > 1 ? 's' : ''} sur ${r.matches_played}</div>
      ${dots}</div>
      <div class="rungpts">${r.total_points}<small>pts</small></div></li>`;
  }).join('');
  return seg + `<ol class="ladder">${rows}</ol>` + rules();
}
const rules = () => `<p class="rules">Barème : 1 point pour le bon vainqueur, 3 points pour le score exact. En WTT, un pronostic gagnant sur l'outsider (moins bien classé au tirage au sort) rapporte un bonus, d'autant plus grand que l'écart de tête de série est important (jusqu'à +5 points). En cas d'égalité au classement, le plus de scores exacts passe devant.</p>`;

/* --- Classements WTT (mondial) et Pro A (championnat) : un fichier de fiches,
   bien distinct de l'échelle des amis ci-dessus. --- */
function rankingsView() {
  const scope = S.rankView;
  const seg = segRow([['WTT', 'WTT'], ['PRO_A', 'Pro A']], scope, 'rankview');
  const list = Object.values(S.competitors)
    .filter(c => c.circuit === scope && c.ranking != null)
    .sort((a, b) => a.ranking - b.ranking || a.name.localeCompare(b.name));
  if (!list.length) {
    return seg + `<div class="empty">${scope === 'WTT'
      ? "Aucun classement mondial pour l'instant. Il se remplit au fil des tournois suivis."
      : "Aucun classement Pro A pour l'instant. Il se remplit dès que la saison commence."}</div>`;
  }
  const rows = list.map(c => `
    <li class="filecard" data-act="competitor" data-id="${c.id}" role="button" tabindex="0" aria-label="Voir le détail de ${esc(c.name)}">
      <div class="filerank">${c.ranking}</div>
      <div class="filemid"><div class="filename">${flagHtml(c)}${esc(c.name)}</div>
      ${scope === 'WTT' && c.country ? `<div class="filesub">${esc(c.country)}</div>` : ''}</div>
      ${c.ranking_points ? `<div class="filepts">${c.ranking_points}<small>pts</small></div>` : ''}
    </li>`).join('');
  const note = scope === 'WTT'
    ? `<p class="rules">Classement mondial simple, limité aux joueurs déjà croisés dans les tournois suivis par le site (pas la totalité du circuit).</p>`
    : `<p class="rules">Classement Pro A messieurs, mis à jour par le robot de synchronisation.</p>`;
  return seg + `<ul class="filebox">${rows}</ul>` + note;
}

/* --- Fiche détail d'un joueur ou d'une équipe : un billet détachable avec
   perforation, pas un panneau glissant générique. --- */
function competitorModal(id) {
  const c = S.competitors[id];
  if (!c) return '';
  const mine = S.matches.filter(m => m.competitor_a_id === id || m.competitor_b_id === id);
  const upcoming = mine.filter(m => m.status === 'scheduled' || m.status === 'live')
    .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const recent = mine.filter(m => m.status === 'finished' || m.status === 'cancelled')
    .sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at)).slice(0, 8);
  const oppOf = m => m.competitor_a_id === id
    ? { name: m.side_b, id: m.competitor_b_id }
    : { name: m.side_a, id: m.competitor_a_id };
  const oppHtml = m => {
    const o = oppOf(m);
    return o.id ? `<button class="namebtn" data-act="competitor" data-id="${o.id}">${esc(o.name)}</button>` : esc(o.name);
  };
  const resultTag = m => {
    if (m.status === 'cancelled') return `<span class="cmres">Annulé</span>`;
    if (m.status !== 'finished') return '';
    const won = (m.competitor_a_id === id && m.score_a > m.score_b) || (m.competitor_b_id === id && m.score_b > m.score_a);
    return `<span class="cmres ${won ? 'win' : 'loss'}">${won ? 'V' : 'D'} ${m.score_a}–${m.score_b}</span>`;
  };
  const matchRow = m => `<li class="cmrow">
    <div class="cmopp">${oppHtml(m)}</div>
    <div class="cmmeta"><span class="cmdate">${esc(fmtDay(m.starts_at))}</span>${resultTag(m)}</div>
  </li>`;
  const roster = c.circuit === 'PRO_A' ? (c.roster || []) : [];
  const nothing = !upcoming.length && !recent.length && !roster.length;

  const rosterSec = roster.length ? `
    <section class="modalsec">
      <h3>Effectif</h3>
      <ul class="roster">${roster.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
    </section>` : '';
  const upcomingSec = upcoming.length ? `
    <section class="modalsec">
      <h3>À venir</h3>
      <ul class="cmlist">${upcoming.slice(0, 5).map(matchRow).join('')}</ul>
    </section>` : '';
  const recentSec = recent.length ? `
    <section class="modalsec">
      <h3>Derniers résultats</h3>
      <ul class="cmlist">${recent.map(matchRow).join('')}</ul>
    </section>` : '';

  return `
  <div class="modalbackdrop" data-act="closecompetitor">
    <div class="ticket playerticket" role="dialog" aria-modal="true" aria-label="${esc(c.name)}" data-act="stop">
      <button class="modalclose" data-act="closecompetitor" aria-label="Fermer">&times;</button>
      <div class="authhead" style="padding-right:46px">
        <div class="modalname">${flagHtml(c)}${esc(c.name)}</div>
        <div class="modalsub">${c.circuit === 'WTT' ? 'Simple messieurs/dames, circuit WTT' : 'Équipe de Pro A'}</div>
      </div>
      <div class="perf" aria-hidden="true"></div>
      <div class="modalstats">
        <div class="statbox"><b>${c.ranking ?? '—'}</b><span>${c.circuit === 'WTT' ? 'classement mondial' : 'classement Pro A'}</span></div>
        ${c.ranking_points ? `<div class="statbox"><b>${c.ranking_points}</b><span>points</span></div>` : ''}
        ${roster.length ? `<div class="statbox"><b>${roster.length}</b><span>joueur${roster.length > 1 ? 's' : ''}</span></div>` : ''}
      </div>
      <div class="modalbody">
        ${rosterSec}${upcomingSec}${recentSec}
        ${nothing ? `<p class="sec-empty">Aucune information suivie pour le moment.</p>` : ''}
      </div>
    </div>
  </div>`;
}

/* --- Administration : la planchette du marqueur de la rencontre, pas un
   formulaire SaaS. --- */
function adminView() {
  const comps = [...new Set(S.matches.map(m => m.competition))];
  const names = Object.values(S.competitors).map(c => c.name);
  const pending = S.matches.filter(m => m.status === 'scheduled' || m.status === 'live').sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at)).slice(0, 40);
  const finished = S.matches.filter(m => m.status === 'finished').sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at)).slice(0, 10);
  const compList = Object.values(S.competitors).filter(c => c.circuit === S.adminCircuit)
    .sort((a, b) => (a.ranking ?? 1e9) - (b.ranking ?? 1e9) || a.name.localeCompare(b.name)).slice(0, 300);

  const resultRow = m => `
    <div class="clipitem">
      <div class="clipitem-title">${esc(m.side_a)} contre ${esc(m.side_b)}</div>
      <div class="hint">${esc(m.competition)}, ${esc(fmtWhen(m.starts_at))}, ${m.wins_needed} victoires pour gagner</div>
      <div class="clipactions">
        <input class="scorein" id="ra-${m.id}" type="number" min="0" max="5" inputmode="numeric" value="${m.score_a ?? ''}" aria-label="Score de ${esc(m.side_a)}">
        <span class="vs">–</span>
        <input class="scorein" id="rb-${m.id}" type="number" min="0" max="5" inputmode="numeric" value="${m.score_b ?? ''}" aria-label="Score de ${esc(m.side_b)}">
        <button class="btn small" data-act="adm-result" data-id="${m.id}">Enregistrer le résultat</button>
        ${m.status !== 'finished' ? `<button class="btn small sec" data-act="adm-cancel" data-id="${m.id}">Annuler le match</button>` : ''}
        <button class="linkbtn" data-act="adm-delete" data-id="${m.id}">Supprimer</button>
      </div>
    </div>`;

  return `
  <section class="clipboard">
    <h2>Ajouter un match</h2>
    <form id="addmatch" class="ledgerform">
      <label for="am-circuit">Circuit</label>
      <select id="am-circuit"><option value="WTT">WTT</option><option value="PRO_A">Pro A</option></select>
      <label for="am-comp">Compétition</label>
      <input id="am-comp" required list="dl-comps" placeholder="Ex : WTT Contender Lima, ou Pro A journée 3">
      <label for="am-round">Tour (facultatif)</label>
      <input id="am-round" placeholder="Ex : Quart de finale">
      <div class="row2">
        <div><label for="am-a">Joueur ou équipe A</label><input id="am-a" required list="dl-names" autocomplete="off"></div>
        <div><label for="am-b">Joueur ou équipe B</label><input id="am-b" required list="dl-names" autocomplete="off"></div>
      </div>
      <label for="am-start">Début du match</label>
      <input id="am-start" type="datetime-local" required>
      <label for="am-wins">Format</label>
      <select id="am-wins">
        <option value="3" selected>3 victoires pour gagner (au meilleur des 5)</option>
        <option value="4">4 victoires pour gagner (au meilleur des 7)</option>
        <option value="2">2 victoires pour gagner (au meilleur des 3)</option>
        <option value="5">5 victoires pour gagner (au meilleur des 9)</option>
      </select>
      <button class="btn" type="submit">Ajouter le match</button>
    </form>
    <datalist id="dl-comps">${comps.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <datalist id="dl-names">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
  </section>

  <section class="clipboard">
    <h2>Résultats à saisir</h2>
    <p class="hint">Le vainqueur a toujours le nombre de victoires du format (par exemple 3–1).</p>
    ${pending.length ? pending.map(resultRow).join('') : '<p class="hint">Aucun match en attente de résultat.</p>'}
  </section>

  <section class="clipboard">
    <h2>Corriger un résultat</h2>
    ${finished.length ? finished.map(resultRow).join('') : '<p class="hint">Aucun résultat saisi pour l\'instant.</p>'}
  </section>

  <section class="clipboard">
    <h2>Classements des joueurs et équipes</h2>
    <p class="hint">Sert à calculer les tendances statistiques. Un petit numéro = un meilleur classement.</p>
    <label for="adm-circuit">Circuit</label>
    <select id="adm-circuit"><option value="WTT" ${S.adminCircuit === 'WTT' ? 'selected' : ''}>WTT</option><option value="PRO_A" ${S.adminCircuit === 'PRO_A' ? 'selected' : ''}>Pro A</option></select>
    ${compList.length ? compList.map(c => `
      <div class="clipitem">
        <div class="clipitem-title">${esc(c.name)}</div>
        <div class="clipactions">
          <input class="scorein" style="width:90px" id="rk-${c.id}" type="number" min="1" inputmode="numeric" placeholder="Rang" value="${c.ranking ?? ''}" aria-label="Classement de ${esc(c.name)}">
          <button class="btn small sec" data-act="adm-rank" data-id="${c.id}">Enregistrer</button>
        </div>
        ${S.adminCircuit === 'PRO_A' ? `
        <label for="ro-${c.id}" class="hint" style="display:block;margin-top:10px">Joueurs de l'équipe (un par ligne)</label>
        <textarea id="ro-${c.id}" rows="3" style="width:100%;margin-top:4px" placeholder="Un nom par ligne">${esc((c.roster || []).join('\n'))}</textarea>
        <button class="btn small sec" style="margin-top:6px" data-act="adm-roster" data-id="${c.id}">Enregistrer les joueurs</button>` : ''}
      </div>`).join('') : '<p class="hint">Aucun joueur ou équipe pour ce circuit : ils sont créés automatiquement quand tu ajoutes un match.</p>'}
  </section>`;
}

async function ensureCompetitor(name, circuit) {
  name = name.trim();
  const found = Object.values(S.competitors).find(c => c.circuit === circuit && c.name.toLowerCase() === name.toLowerCase());
  if (found) return found.id;
  const { data, error } = await sb.from('competitors')
    .insert({ name, circuit, kind: circuit === 'PRO_A' ? 'team' : 'player', source: 'manual' }).select().single();
  if (error) throw error;
  S.competitors[data.id] = data;
  return data.id;
}
async function addMatch(f) {
  const v = id => f.querySelector('#' + id).value.trim();
  const circuit = v('am-circuit'), a = v('am-a'), b = v('am-b');
  if (a.toLowerCase() === b.toLowerCase()) { toast('Choisis deux adversaires différents.', true); return; }
  try {
    const [ida, idb] = [await ensureCompetitor(a, circuit), await ensureCompetitor(b, circuit)];
    const { error } = await sb.from('matches').insert({
      circuit, competition: v('am-comp'), round: v('am-round') || null,
      side_a: a, side_b: b, competitor_a_id: ida, competitor_b_id: idb,
      starts_at: new Date(f.querySelector('#am-start').value).toISOString(),
      wins_needed: parseInt(v('am-wins'), 10), source: 'manual'
    });
    if (error) throw error;
    await reloadMatches();
    toast('Match ajouté.'); keepRender();
  } catch (e) { toast(friendlyError(e), true); }
}
async function saveResult(id) {
  const m = S.matches.find(x => x.id === id);
  const a = parseInt(document.getElementById('ra-' + id).value, 10), b = parseInt(document.getElementById('rb-' + id).value, 10);
  if (Number.isNaN(a) || Number.isNaN(b)) { toast('Saisis les deux scores.', true); return; }
  if (Math.max(a, b) !== m.wins_needed || Math.min(a, b) >= m.wins_needed) { toast(`Score impossible : le vainqueur doit avoir ${m.wins_needed} victoires.`, true); return; }
  const { error } = await sb.from('matches').update({ status: 'finished', score_a: a, score_b: b }).eq('id', id);
  if (error) { toast(friendlyError(error), true); return; }
  await reloadMatches(); toast('Résultat enregistré.'); keepRender();
}
async function cancelMatch(id) {
  if (!confirm('Annuler ce match ? Les pronos ne rapporteront aucun point.')) return;
  const { error } = await sb.from('matches').update({ status: 'cancelled', score_a: null, score_b: null }).eq('id', id);
  if (error) { toast(friendlyError(error), true); return; }
  await reloadMatches(); toast('Match annulé.'); keepRender();
}
async function deleteMatch(id) {
  if (!confirm('Supprimer ce match et tous les pronos associés ? Cette action est définitive.')) return;
  const { error } = await sb.from('matches').delete().eq('id', id);
  if (error) { toast(friendlyError(error), true); return; }
  await reloadMatches(); toast('Match supprimé.'); keepRender();
}
async function saveRank(id) {
  const raw = document.getElementById('rk-' + id).value.trim();
  const ranking = raw === '' ? null : parseInt(raw, 10);
  const { error } = await sb.from('competitors').update({ ranking }).eq('id', id);
  if (error) { toast(friendlyError(error), true); return; }
  S.competitors[id].ranking = ranking; toast('Classement enregistré.');
}
async function saveRoster(id) {
  const raw = document.getElementById('ro-' + id).value;
  const roster = raw.split('\n').map(s => s.trim()).filter(Boolean);
  const { error } = await sb.from('competitors').update({ roster: roster.length ? roster : null }).eq('id', id);
  if (error) { toast(friendlyError(error), true); return; }
  S.competitors[id].roster = roster.length ? roster : null; toast('Joueurs enregistrés.'); keepRender();
}

/* ---------- Événements ---------- */
$app.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id ? Number(el.dataset.id) : null, v = el.dataset.v;
  if (act === 'authmode') { S.authMode = S.authMode === 'login' ? 'signup' : 'login'; render(); }
  else if (act === 'logout') { await sb.auth.signOut(); }
  else if (act === 'tab') {
    S.tab = el.dataset.tab;
    if (S.tab === 'matches') S._freshMatches = true;
    if (S.tab === 'board') { S.board = null; navigate(render); await loadBoard(); }
    navigate(render); window.scrollTo(0, 0);
  }
  else if (act === 'view') { S.view = v; S._freshMatches = true; navigate(render); }
  else if (act === 'circuit') { S.circuit = v; S._freshMatches = true; S.proJournee = null; navigate(render); }
  else if (act === 'journee') { S.proJournee = +v; S._freshMatches = true; navigate(render); }
  else if (act === 'boardscope') { S.boardScope = v; S.board = null; navigate(render); await loadBoard(); navigate(render); }
  else if (act === 'rankview') { S.rankView = v; navigate(render); }
  else if (act === 'competitor') { S.openCompetitor = id; keepRender(); }
  else if (act === 'closecompetitor') { S.openCompetitor = null; keepRender(); }
  else if (act === 'stop') { /* clic à l'intérieur de la fiche détail : ne pas la fermer */ }
  else if (act === 'pick') pick(id, Number(el.dataset.a), Number(el.dataset.b));
  else if (act === 'friends') toggleFriends(id);
  else if (act === 'adm-result') saveResult(id);
  else if (act === 'adm-cancel') cancelMatch(id);
  else if (act === 'adm-delete') deleteMatch(id);
  else if (act === 'adm-rank') saveRank(id);
  else if (act === 'adm-roster') saveRoster(id);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.openCompetitor) { S.openCompetitor = null; keepRender(); }
});
$app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'authform') submitAuth(e.target);
  else if (e.target.id === 'addmatch') addMatch(e.target);
});
$app.addEventListener('change', e => {
  if (e.target.id === 'adm-circuit') { S.adminCircuit = e.target.value; keepRender(); }
});

/* ---------- Démarrage ---------- */
// Sert à rendre le site installable sur mobile (icône sur l'écran d'accueil,
// ouverture en plein écran). N'empêche pas le site de marcher si ça échoue
// (navigateur trop ancien, page ouverte en local) : on l'enregistre sans bloquer.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

async function boot() {
  if (!window.supabase) {
    $app.innerHTML = '<div class="auth"><h1>Oups</h1><p class="lead">Impossible de charger le service de connexion. Vérifie ta connexion internet et recharge la page.</p></div>';
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange((event, session) => { setTimeout(() => handleSession(session), 0); });
  const { data } = await sb.auth.getSession();
  handleSession(data.session);
}
boot();
</script>
</body>
</html>
