    <span class="pts"><span data-count="${r.total_points}">${r.total_points}</span><small>pts</small></span>
    <div class="podstep"></div>
  </div>`;
  return `<div class="podium" aria-label="Podium">${col(top[1], 2)}${col(top[0], 1)}${col(top[2], 3)}</div>`;
}
const rules = () => `<p class="rules">Barème : 1 point pour le bon vainqueur, 3 points pour le score exact. En WTT, un pronostic gagnant sur l'outsider (moins bien classé au tirage au sort) rapporte un bonus, d'autant plus grand que l'écart de tête de série est important (jusqu'à +5 points). Bonus de série : plus tu enchaînes les pronos gagnants d'affilée, plus le prochain rapporte gros (jusqu'à +75 % à partir d'une grosse série) — vois l'onglet "Mon compte" pour ta série en cours. Balles : à chaque tournoi WTT tu reçois 4 balles (2 par journée de Pro A) à miser sur tes pronos, 3 au maximum sur un même match ; si le prono est gagnant, chaque balle ajoute ×1 (1 balle = ×2, 2 = ×3, 3 = ×4), sinon elles sont perdues. Le bonus de série et les balles s'additionnent. En cas d'égalité au classement, le plus de scores exacts passe devant.</p>`;

/* --- Classements WTT (mondial, messieurs/dames séparés) et Pro A
   (championnat) : à distinguer du classement des amis (points de
   pronostics) affiché dans l'onglet "Amis". --- */
function rankingsView() {
  const scope = S.rankView;
  const seg = segRow([['WTT', 'WTT'], ['PRO_A', 'Pro A']], scope, 'rankview');

  if (scope === 'PRO_A') {
    const list = Object.values(S.competitors)
      .filter(c => c.circuit === 'PRO_A' && c.ranking != null)
      .sort((a, b) => a.ranking - b.ranking || a.name.localeCompare(b.name));
    if (!list.length) return seg + `<div class="empty">Aucun classement Pro A pour l'instant. Il se remplit dès que la saison commence.</div>`;
    const rows = list.map(c => {
      const topClass = c.ranking === 1 ? ' top1' : c.ranking === 2 ? ' top2' : c.ranking === 3 ? ' top3' : '';
      return `<tr class="lbrow" data-act="competitor" data-id="${c.id}" tabindex="0" aria-label="Voir le détail de l'équipe ${esc(c.name)}">
        <td class="rankcell${topClass}">${rankInner(c.ranking)}</td>
        <td class="namecell"><div class="lbname">${esc(c.name)}</div>${c.roster && c.roster.length ? `<div class="lbsub">${c.roster.length} joueur${c.roster.length > 1 ? 's' : ''} suivi${c.roster.length > 1 ? 's' : ''}</div>` : ''}</td>
        <td class="ptscell">${c.ranking_points ? `${c.ranking_points}<small>pts</small>` : ''}</td></tr>`;
    }).join('');
    // Vue "équipes" Pro A : chaque ligne EST déjà une équipe (championnat par
    // équipes), pas un joueur individuel — clique sur son nom pour voir son
    // effectif et son calendrier (fiche détail, onglet Admin pour saisir les
    // joueurs). Ce classement et les journées filtrables de l'onglet Matchs
    // sont la "vue équipe" : pas besoin d'un onglet séparé, la donnée est
    // déjà structurée par équipe depuis le robot de synchronisation (FFTT).
    return seg + `<table class="standings"><thead><tr><th>Rang</th><th>Équipe</th><th class="num">Pts</th></tr></thead><tbody>${rows}</tbody></table>`
      + `<p class="rules">Classement Pro A messieurs par équipe, mis à jour par le robot de synchronisation. Touche une équipe pour voir son effectif et son calendrier.</p>`;
  }

  // WTT : classement mondial, messieurs et dames séparés (déduits automatiquement
  // du tableau où joue chaque joueur : simple messieurs ou simple dames).
  const genderSeg = segRow([['M', 'Messieurs'], ['F', 'Dames']], S.rankGender, 'rankgender');
  const genreLbl = S.rankGender === 'M' ? 'messieurs' : 'dames';
  const world = (S.worldRankings || []).filter(r => r.gender === S.rankGender);
  if (world.length) {
    // "SUN Yingsha" (format du classement WTT) -> "Sun Yingsha".
    const pretty = n => String(n || '').split(/\s+/).map(w => w.length > 1 && w === w.toUpperCase() ? w.charAt(0) + w.slice(1).toLowerCase() : w).join(' ');
    const rows = world.map(r => {
      const c = r.competitor_id ? S.competitors[r.competitor_id] : null;
      const name = c ? c.name : pretty(r.name);
      const ctry = r.country || (c && c.country) || '';
      const topClass = r.rank === 1 ? ' top1' : r.rank === 2 ? ' top2' : r.rank === 3 ? ' top3' : '';
      const attrs = c ? ` class="lbrow" data-act="competitor" data-id="${c.id}" tabindex="0" aria-label="Voir la fiche de ${esc(name)}"` : '';
      return `<tr${attrs}>
        <td class="rankcell${topClass}">${rankInner(r.rank)}</td>
        <td class="namecell"><div class="lbname">${flagHtml({ circuit: 'WTT', country: ctry })}${esc(name)}</div>
          <div class="lbsub">${esc(ctry)}${c ? `${ctry ? ' · ' : ''}<span class="lbfollow">voir la fiche</span>` : ''}</div></td>
        <td class="ptscell">${r.points != null ? `${r.points}<small>pts</small>` : ''}</td></tr>`;
    }).join('');
    return seg + genderSeg + `<table class="standings"><thead><tr><th>Rang</th><th>Joueur</th><th class="num">Pts</th></tr></thead><tbody>${rows}</tbody></table>`
      + `<p class="rules">Classement mondial WTT officiel (${genreLbl}), top ${world.length}, mis à jour automatiquement par le robot de synchronisation. Touche un nom marqué « voir la fiche » pour son calendrier et ses résultats.</p>`;
  }
  const pool = Object.values(S.competitors).filter(c => c.circuit === 'WTT' && c.gender === S.rankGender);
  const withWorld = pool.filter(c => c.world_ranking != null).sort((a, b) => a.world_ranking - b.world_ranking || a.name.localeCompare(b.name));
  const fallback = !withWorld.length ? pool.filter(c => c.ranking != null).sort((a, b) => a.ranking - b.ranking || a.name.localeCompare(b.name)) : [];
  const list = withWorld.length ? withWorld : fallback;
  const usingFallback = !withWorld.length && !!fallback.length;
  const genreLabel = S.rankGender === 'M' ? 'messieurs' : 'dames';
  if (!list.length) {
    return seg + genderSeg + `<div class="empty">Aucun classement ${genreLabel} pour l'instant.${S.isAdmin ? " Il se remplit automatiquement à la prochaine synchronisation WTT." : ''}</div>`;
  }
  const rows = list.map(c => {
    const rk = usingFallback ? c.ranking : c.world_ranking;
    const topClass = rk === 1 ? ' top1' : rk === 2 ? ' top2' : rk === 3 ? ' top3' : '';
    return `<tr class="lbrow" data-act="competitor" data-id="${c.id}" tabindex="0" aria-label="Voir le détail de ${esc(c.name)}">
      <td class="rankcell${topClass}">${rankInner(rk)}</td>
      <td class="namecell"><div class="lbname">${flagHtml(c)}${esc(c.name)}</div>
        ${c.country ? `<div class="lbsub">${esc(c.country)}</div>` : ''}</td>
      <td class="ptscell">${(usingFallback ? null : c.world_ranking_points) ? `${c.world_ranking_points}<small>pts</small>` : ''}</td></tr>`;
  }).join('');
  const note = usingFallback
    ? `<p class="rules">Classement mondial pas encore synchronisé pour ce tableau : tête de série des tournois suivis affichée en attendant.</p>`
    : `<p class="rules">Classement mondial WTT officiel (${genreLabel}), mis à jour automatiquement par le robot de synchronisation.</p>`;
  return seg + genderSeg + `<table class="standings"><thead><tr><th>Rang</th><th>Joueur</th><th class="num">Pts</th></tr></thead><tbody>${rows}</tbody></table>` + note;
}

/* ---------- Les 14 définitions (nom, couleurs, critère, icône) ---------- */
// Chaque entrée : { id, name, desc, colorA, colorB, icon, test(ctx) }.
// `ctx` regroupe tout ce dont les critères ont besoin, construit une seule
// fois par computeBadges() à partir des données déjà chargées pour "Mon
// compte" (voir loadAccount()) -- aucune logique serveur nouvelle, à part
// les deux requêtes de lecture déjà publiques ajoutées à loadAccount().
function circuitAccuracy(ctx, circuit) {
  if (!S.circuitBoard || !S.circuitBoard.length) return null;
  const rows = S.circuitBoard.filter(r => r.circuit === circuit && r.matches_played > 0);
  if (rows.length < 2) return null;
  const mine = rows.find(r => r.user_id === ctx.uid);
  if (!mine || mine.matches_played < 10) return null;
  const avgAcc = rows.reduce((s, r) => s + r.good_winners / r.matches_played, 0) / rows.length;
  return { myAcc: mine.good_winners / mine.matches_played, avgAcc, n: rows.length };
}
// Table user_id -> Map(match_id -> points totaux), à partir de
// S.allJudgedPreds (pronostics de tout le monde sur des matchs déjà
// jugés). Réutilise computeStreakSeries/pointsDetail : chaque personne a
// donc droit à SON propre calcul de série/bonus, comme sur le vrai
// classement, pas une approximation plus grossière.
function allUsersPointsByMatch() {
  const byUser = {};
  for (const r of (S.allJudgedPreds || [])) (byUser[r.user_id] = byUser[r.user_id] || []).push(r);
  const out = {};
  for (const uid in byUser) {
    const sorted = byUser[uid].slice().sort((a, b) => new Date(a.matches.starts_at) - new Date(b.matches.starts_at) || a.match_id - b.match_id);
    const map = new Map();
    for (const h of computeStreakSeries(sorted)) {
      const pt = pointsDetail(h.matches, h, h.streakBefore);
      map.set(h.match_id, pt ? pt.total : 0);
    }
    out[uid] = map;
  }
  return out;
}

// Calcule les 14 badges (débloqué ou pas) à partir des données déjà
// chargées. Renvoie null tant que l'historique du compte n'est pas encore
// disponible (voir myJudgedHistory()).
function computeBadges() {
  const finished = myJudgedHistory();
  if (finished === null) return null;
  const n = finished.length;
  const goodN = finished.filter(h => h.pt.total > 0).length;
  let bestStreak = 0; for (const h of finished) bestStreak = Math.max(bestStreak, h.streakAfter);
  const ctx = { finished, n, goodN, bestStreak, uid: S.session && S.session.user.id };
  return BADGE_DEFS.map(def => ({
    id: def.id, name: def.name, desc: def.desc,
    unlocked: !!def.test(ctx),
    icon: badgeIcon(def.id, def.name),
  }));
}
// Détecte les badges fraîchement débloqués depuis le dernier chargement de
// "Mon compte" (même esprit que checkStreakMilestone : jamais de fanfare
// pour des badges déjà acquis au tout premier chargement de la session,
// seulement pour un badge franchi "sous les yeux" de la personne). Le
// "déjà vu" est mémorisé en localStorage, même mécanique que
// spin_theme_mode/spin_sound_on.
function checkNewBadges() {
  try {
    const list = computeBadges();
    if (!list) return;
    let seen = [];
    try { seen = JSON.parse(localStorage.getItem('spin_badges_seen') || '[]'); } catch (e) { /* ignore */ }
    const seenSet = new Set(seen);
    let initialized = false;
    try { initialized = localStorage.getItem('spin_badges_init') === '1'; } catch (e) { /* ignore */ }
    const newlyUnlocked = initialized ? list.filter(b => b.unlocked && !seenSet.has(b.id)) : [];
    list.forEach(b => { if (b.unlocked) seenSet.add(b.id); });
    try {
      localStorage.setItem('spin_badges_seen', JSON.stringify([...seenSet]));
      localStorage.setItem('spin_badges_init', '1');
    } catch (e) { /* stockage indisponible : pas de mémoire d'une session à l'autre, tant pis */ }
    if (newlyUnlocked.length) {
      playSound('milestone'); releaseBats();
      const show = () => {
        // Une autre fenêtre est déjà ouverte : un simple message suffit.
        if (S.openBadge || S.openRecap || S.openCompetitor || TUTO) { newlyUnlocked.forEach(b => toast(`Nouveau badge débloqué : ${b.name}`)); return; }
        S.badgeQueue = newlyUnlocked.map(b => b.id);
        openNextNewBadge();
      };
      afterSplash(() => setTimeout(show, 400));
    }
  } catch (e) { /* un souci de badge ne doit jamais casser l'appli */ }
}
function openNextNewBadge() {
  const id = (S.badgeQueue || []).shift();
  if (!id) return;
  S.openBadge = id; S._newBadge = id; S._medalDrop = id;
  keepRender();
}
function closeBadge() {
  S.openBadge = null; S._newBadge = null;
  keepRender();
  if (S.badgeQueue && S.badgeQueue.length) setTimeout(openNextNewBadge, 450);
}
// Grille de badges de l'onglet "Mon compte" : en couleur et détaillés une
// fois débloqués, désaturés avec un petit cadenas tant qu'ils ne le sont
// pas -- le critère à atteindre reste lisible en infobulle (title) dans
// les deux cas, pour que tout le monde sache viser quoi.
function badgesPanel() {
  const list = computeBadges();
  if (!list) return '';
  const unlockedN = list.filter(b => b.unlocked).length;
  const cells = list.map(b => `
    <button type="button" class="badgecell ${b.unlocked ? 'unlocked' : 'locked'}" data-act="badge" data-badge="${esc(b.id)}" aria-label="${esc(b.name)}, ${b.unlocked ? 'débloqué' : 'verrouillé'} : voir le détail">
      <div class="badgeicon">${b.icon}${b.unlocked ? '' : `<span class="badgelock" aria-hidden="true">${BADGE_LOCK_SVG}</span>`}</div>
      <span class="badgename">${esc(b.name)}</span>
    </button>`).join('');
  return `<section class="panel">
    <h3>Badges</h3>
    <p class="hint" style="margin-top:2px">${unlockedN}/${list.length} badge${unlockedN > 1 ? 's' : ''} débloqué${unlockedN > 1 ? 's' : ''}. Touche un badge pour l'agrandir et voir comment le décrocher.</p>
    <div class="badgegrid">${cells}</div>
  </section>`;
}

// Un badge en grand (ouvert d'un appui dans "Mon compte") : il "saute" à
// l'écran comme un autocollant qu'on plaque, sur une explosion de points
// à ses propres couleurs, avec son nom et ce qu'il faut faire pour l'avoir.
/* =============================================================================
   La médaille en 3D (fiche d'un badge).
   Chaque badge est une vraie pièce : corps en métal tourné (or si débloqué,
   étain sinon), tranche cannelée, émail du badge devant, revers gravé
   (logo SPIN en relief, nom, condition, légende tout autour). On la fait
   tourner au doigt : elle garde son élan, ralentit, puis retombe à plat sur
   la face la plus proche. Un toucher la retourne. Un badge tout juste
   débloqué tombe d'en haut en tournant avant de se poser.
   Three.js (r160) n'est chargé qu'à la première ouverture d'une fiche, depuis
   le même CDN que Supabase. Sans WebGL, hors ligne, ou si le chargement
   échoue : l'image du badge reste à plat, comme avant.
   La toile 3D est créée une seule fois et déplacée d'un rendu à l'autre
   (l'appli reconstruit l'écran à chaque rendu) : la pièce ne saute pas
   quand l'écran se redessine derrière elle.

  catch (e) { return false; }

// Appelée après chaque rendu (voir afterRender).
function mountMedal() {
  const slot = document.querySelector('.medalslot');
  if (!slot) { if (MEDAL.engine) MEDAL.engine.sleep(); return; }
  if (MEDAL.failed || !webglOk()) { slot.classList.add('flat'); return; }
  const id = slot.dataset.badge;
  const b = (computeBadges() || []).find(x => x.id === id);
  if (!b || !BADGE_FILES[id]) { slot.classList.add('flat'); return; }
  const info = { id, name: b.name, desc: b.desc, unlocked: b.unlocked, file: BADGE_FILES[id] };
  const drop = S._medalDrop === id;
  if (drop) S._medalDrop = null;
  if (!MEDAL.loading) {
    MEDAL.loading = Promise.all([import('three'), import('three/addons/environments/RoomEnvironment.js')])
      .then(([T, R]) => (MEDAL.engine = createMedalEngine(T, R.RoomEnvironment)));
  }
  MEDAL.loading
    .then(eng => { if (slot.isConnected) eng.attach(slot, info, { drop }); })
    .catch(() => {
      MEDAL.failed = true; MEDAL.loading = null;
      document.querySelectorAll('.medalslot').forEach(s => s.classList.add('flat'));
    });
}

      g.save(); g.translate(lx + dx, ly + dy); g.scale(S0 / 524, S0 / 524); g.translate(-250, -250); g.fillStyle = f;

    else { drawLogo(3, 4, 'rgba(70,50,15,.35)'); drawLogo(0, 0, 'rgba(255,250,235,.9)'); drawLogo(0, 0, 'rgba(160,120,40,.35)'); }
    const engrave = (text, x, y) => { if (!bump) { g.fillStyle = hi; g.fillText(text, x + 2, y + 2); } g.fillStyle = ink; g.fillText(text, x, y); };

      if (l) lines.push(l); return lines;
    };
    g.font = `italic 700 ${Math.round(w * .085)}px 'Barlow Semi Condensed', 'Arial Narrow', sans-serif`;
    const nl = wrap(b.name, w * .66);
    let y = w * .53;
    nl.forEach((l, i) => engrave(l, c, y + i * w * .082));
    y += nl.length * w * .082 + w * .02;
    g.font = `500 ${Math.round(w * .041)}px 'Barlow', Arial, sans-serif`;
    wrap(b.desc, w * .64).slice(0, 3).forEach((l, i) => engrave(l, c, y + i * w * .052));
    g.font = `600 ${Math.round(w * .03)}px 'Barlow', Arial, sans-serif`;
    const legend = 'SPIN   Pronostics de tennis de table entre amis   ' + (b.unlocked ? 'Médaille débloquée' : 'Médaille à débloquer') + '   ';
    const rad = w * .455, f = TAU / g.measureText(legend).width;

  // Quelques faces gardées en mémoire, pas toutes (chacune pèse plusieurs Mo

  const cache = new Map();

    const k = b.id + (b.unlocked ? '1' : '0');
    if (cache.has(k)) { const t = cache.get(k); cache.delete(k); cache.set(k, t); return t; }
    try { await Promise.all([document.fonts.load(`italic 700 60px 'Barlow Semi Condensed'`), document.fonts.load(`500 30px 'Barlow'`), document.fonts.load(`600 30px 'Barlow'`)]); } catch (e) { /* polices de secours */ }
    const img = await loadImg('badges/' + b.file);
    const t = { front: frontTex(img, !b.unlocked), back: canvasTex(1024, 1024, (g, w) => drawBack(g, w, b, false)), bump: canvasTex(1024, 1024, (g, w) => drawBack(g, w, b, true), false) };

    while (cache.size > 3) {

      if (frontMat.map === old.front) break;
      Object.values(old).forEach(x => x.dispose()); cache.delete(oldK);

    return t;
  }
  function applyTextures(b, t) {
    const m = b.unlocked ? METALS.gold : METALS.pewter;
    frontMat.map = t.front; frontMat.clearcoat = b.unlocked ? 1 : .35; frontMat.needsUpdate = true;
    backMat.map = t.back; backMat.bumpMap = t.bump; backMat.needsUpdate = true;
    bodyMat.color.setHex(m.color); backMat.color.setHex(m.color);
    bodyMat.roughness = m.roughness; backMat.roughness = m.roughness + .09;
  }

  /* --- Le mouvement ---
     a : angle autour de l'axe vertical, v : sa vitesse. Lancée, la pièce
     garde son élan puis retombe à plat (ressort un peu sous-amorti). */

  const st = { a: 0, v: 0, tilt: 0, tv: 0, drag: null, target: null, preferFront: false, landed: false, hx: 0, hy: 0, hxT: 0, hyT: 0, drop: null, glint: null };

    try { localStorage.setItem(MEDAL_HINT_KEY, '1'); } catch (e) { /* ignore */ }

  }
  function flip() {
    if (st.drop) return;
    st.target = (Math.round(st.a / Math.PI) + 1) * Math.PI; st.preferFront = false;
    if (reduce()) { st.a = st.target; st.v = 0; st.target = null; }

    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
  });
  // Le déblocage : chute en tournant, petit rebond, côté badge, reflet.
  function playDrop() {
    if (reduce()) { st.a = 0; st.v = 0; st.drop = { t0: performance.now(), dur: 320, fade: true }; return; }
    st.drop = { t0: performance.now(), dur: 1050, sound: false };

  const STEP = 1 / 120;
  function resize() {

    const w = slot.clientWidth, h = slot.clientHeight;

    const fitH = 1.62 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));

    },
  };
}

// Rangée compacte façon "laddrow" pour un groupe tournoi/journée (réutilisée
// par le panneau "Par tournoi / saison" de "Mon compte").
function breakdownRow(label, s, col, circuit) {
  // Le bouton "Voir le récap" n'apparaît que si CE tournoi/journée est
  // entièrement terminé (voir isTournamentFinished) : pas de bilan sur
  // quelque chose encore en cours.
  const recapBtn = circuit && isTournamentFinished(circuit, label)
    ? `<button class="linkbtn recapbtn" data-act="recap" data-key="${esc(label)}" data-circuit="${circuit}">Voir le récap</button>`
    : '';
  return `<div class="laddrow" style="--ladcol:${col}">
    <div class="laddhead"><span class="laddname">${esc(label)}</span><span class="laddpts">${s.pts}<small>pts</small></span></div>
    <div class="laddsub">${s.n} prono${s.n > 1 ? 's' : ''} jugé${s.n > 1 ? 's' : ''} · ${s.exact} exact${s.exact > 1 ? 's' : ''}</div>
    ${recapBtn}
  </div>`;
}
// Un tournoi WTT / une journée Pro A est "terminé" s'il n'a plus aucun match
// encore programmé ou en direct. S'il n'apparaît plus du tout dans S.matches
// (fenêtre glissante de 90 jours, voir reloadMatches), c'est forcément qu'il
// est déjà passé depuis longtemps : terminé aussi.
function isTournamentFinished(circuit, key) {
  const ms = S.matches.filter(m => m.circuit === circuit && tournamentGroupKey(m) === key);
  if (!ms.length) return true;
  if (!ms.every(m => m.status === 'finished' || m.status === 'cancelled')) return false;
  if (circuit !== 'WTT') return true;
  // WTT : le robot ajoute le tableau tour par tour, donc "tous les matchs
  // connus sont finis" peut seulement vouloir dire "entre deux tours". On
  // attend une finale jouée, ou 3 jours sans aucun nouveau match.
  const hasFinal = ms.some(m => /(^|[,—]\s*)finale$/i.test((m.round || '').trim()));
  const last = Math.max(...ms.map(m => new Date(m.starts_at).getTime()));
  return hasFinal || Date.now() - last > 3 * 864e5;
}
// Clé de regroupement tournoi (WTT) / journée (Pro A) d'un match, identique
// à celle déjà utilisée pour "Par tournoi / saison" dans accountView.
function tournamentGroupKey(m) {
  return m.circuit === 'WTT' ? (m.competition || 'WTT') : (m.round || 'Pro A');
}
/* --- "Mon compte" : statistiques personnelles sur l'ensemble de l'historique
   de pronostics du compte (pas seulement les matchs encore affichés dans
   l'onglet Matchs), calculées avec le même barème que le classement des amis. --- */
function accountView() {
  // La série (streakBefore/streakAfter) ne dépend QUE de l'ordre chronologique
  // des matchs déjà jugés : chaque pt.total est donc calculé avec la série
  // telle qu'elle était réellement au moment de CE match, jamais recalculée
  // après coup avec la série d'aujourd'hui. Voir myJudgedHistory().
  const finished = myJudgedHistory();
  if (finished === null) return '<div class="loading">Chargement…</div>';

  if (!finished.length) {
    return `<header class="pagehead"><h1>Mon compte</h1><p>Pas encore de match terminé sur lequel tu as pronostiqué : tes statistiques apparaissent ici dès que tes premiers pronos sont jugés.</p></header>${settingsPanel()}`;
  }

  const n = finished.length;
  const total = finished.reduce((s, h) => s + h.pt.total, 0);
  const exactN = finished.filter(h => h.pt.exact).length;
  const goodN = finished.filter(h => h.pt.total > 0).length;
  const pctExact = Math.round(exactN / n * 100);
  const pctGood = Math.round(goodN / n * 100);

  const curStreak = finished[finished.length - 1].streakAfter;
  let bestStreak = 0; for (const h of finished) bestStreak = Math.max(bestStreak, h.streakAfter);
  const best = finished.reduce((b, h) => (!b || h.pt.total > b.pt.total) ? h : b, null);

  let myRank = null;
  if (S.accountBoard && S.accountBoard.length) {
    let prev = null, rk = 0;
    for (let i = 0; i < S.accountBoard.length; i++) {
      const r = S.accountBoard[i], key = r.total_points + '/' + r.exact_scores;
      if (key !== prev) { rk = i + 1; prev = key; }
      if (r.user_id === S.session.user.id) { myRank = rk; break; }
    }
  }

  // Couleurs officielles des deux circuits (mêmes valeurs que THEME), pour
  // teinter la répartition par circuit même hors contexte "Matchs" (ici le
  // thème global de la page reste neutre) — lecture seule de THEME, sans
  // jamais le modifier.
  const circuitColor = c => c === 'WTT' ? THEME.WTT_SMASH.accent : THEME.PRO_A.accent;
  const byCircuit = ['WTT', 'PRO_A'].map(c => {
    const list = finished.filter(h => h.matches.circuit === c);
    return { c, n: list.length, pts: list.reduce((s, h) => s + h.pt.total, 0), exact: list.filter(h => h.pt.exact).length };
  }).filter(x => x.n);
  const circuitLabel = c => c === 'WTT' ? 'WTT' : 'Pro A';
  const maxCircuitPts = Math.max(1, ...byCircuit.map(x => x.pts));

  const recent = finished.slice(-8).reverse();
  const matchLabel = m => `${esc(m.side_a)} – ${esc(m.side_b)}`;

  const recentRows = recent.map(h => {
    const m = h.matches, pt = h.pt;
    return `<li class="cmrow">
      <div class="cmopp">${matchLabel(m)}</div>
      <div class="cmmeta"><span class="cmdate">${esc(fmtDay(m.starts_at))} · ${esc(h.pred_a)}–${esc(h.pred_b)} (${m.score_a}–${m.score_b})</span>
        <span class="cmres ${pt.total > 0 ? (pt.exact ? 'exact' : 'win') : 'loss'}">${pt.total > 0 ? '+' : ''}${pt.total} pt${Math.abs(pt.total) > 1 ? 's' : ''}</span></div>
    </li>`;
  }).join('');

  const circuitRows = byCircuit.map(x => {
    const col = circuitColor(x.c), w = Math.max(6, Math.round(x.pts / maxCircuitPts * 100));
    return `<div class="laddrow" style="--ladcol:${col}">
      <div class="laddhead"><span class="laddname">${circuitLabel(x.c)}</span><span class="laddpts">${x.pts}<small>pts</small></span></div>
      <div class="laddbar"><i style="width:${w}%"></i></div>
      <div class="laddsub">${x.n} prono${x.n > 1 ? 's' : ''} jugé${x.n > 1 ? 's' : ''} · ${x.exact} exact${x.exact > 1 ? 's' : ''}</div>
    </div>`;
  }).join('');

  // Petit graphique en bâtons (façon carnet de bord) : un bâton par match
  // jugé, sur les 14 derniers, hauteur = points marqués sur ce match. Dessiné
  // à la main en SVG (pas de librairie) pour rester léger et dans le même
  // esprit "dessiné à l'encre" que le reste de l'appli.
  const sparkN = finished.slice(-14);
  const sparkMax = Math.max(3, ...sparkN.map(h => h.pt.total));
  const sparkW = 320, sparkH = 56, sparkPad = 3;
  const barW = (sparkW / sparkN.length) - sparkPad;
  const sparkBars = sparkN.map((h, i) => {
    const bh = Math.max(3, (h.pt.total / sparkMax) * (sparkH - 6));
    const x = i * (sparkW / sparkN.length);
    const y = sparkH - bh;
    const col = h.pt.total === 0 ? 'var(--ground-2)' : (h.pt.exact ? 'var(--red)' : 'var(--table)');
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(2, barW).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${col}"><title>${esc(fmtDay(h.matches.starts_at))} : ${h.pt.total > 0 ? '+' : ''}${h.pt.total} pt${Math.abs(h.pt.total) > 1 ? 's' : ''}</title></rect>`;
  }).join('');
  const sparkline = sparkN.length > 1 ? `
  <section class="panel">
    <h3>Tendance récente</h3>
    <p class="hint" style="margin-top:2px">Points marqués sur chacun de tes ${sparkN.length} derniers pronos jugés.</p>
    <svg class="spark" viewBox="0 0 ${sparkW} ${sparkH}" preserveAspectRatio="none" role="img" aria-label="Évolution des points sur les derniers pronos">${sparkBars}</svg>
    <div class="sparklegend"><span><i class="dot" style="background:var(--red)"></i>Score exact</span><span><i class="dot" style="background:var(--table)"></i>Bon vainqueur</span><span><i class="dot" style="background:var(--ground-2)"></i>0 point</span></div>
  </section>` : '';

  // Série en cours / meilleure série : rangée de pastilles façon "flip-tile"
  // (même esprit que les pastilles de score des pronos), une par match jugé
  // parmi les 10 derniers, verte si des points ont été marqués.
  const streakTiles = finished.slice(-10).map(h => `<i class="streaktile${h.pt.total > 0 ? ' hit' : ''}" title="${h.pt.total > 0 ? '+' + h.pt.total : '0'} pt">${h.pt.total > 0 ? '●' : '○'}</i>`).join('');
  const curPct = Math.round((streakMult(curStreak) - 1) * 100);

  // --- Par tournoi / saison : le "Par circuit" ci-dessus donne un gros
  // total WTT vs Pro A, mais pas le détail tournoi par tournoi (WTT) ni
  // journée par journée (Pro A, championnat par équipes sans saisons
  // multiples pour l'instant). Regroupement à partir des champs déjà
  // synchronisés (m.competition pour WTT, m.round = "Journée N" pour Pro A).
  const byTournament = {};
  const byJournee = {};
  for (const h of finished) {
    const m = h.matches;
    if (m.circuit === 'WTT') {
      const k = m.competition || 'WTT';
      const s = byTournament[k] || (byTournament[k] = { n: 0, pts: 0, exact: 0, last: m.starts_at });
      s.n++; s.pts += h.pt.total; if (h.pt.exact) s.exact++; if (m.starts_at > s.last) s.last = m.starts_at;
    } else if (m.circuit === 'PRO_A') {
      const k = m.round || 'Pro A';
      const s = byJournee[k] || (byJournee[k] = { n: 0, pts: 0, exact: 0 });
      s.n++; s.pts += h.pt.total; if (h.pt.exact) s.exact++;
    }
  }
  const tournamentRows = Object.entries(byTournament)
    .sort((a, b) => new Date(b[1].last) - new Date(a[1].last))
    .map(([name, s]) => breakdownRow(name, s, (THEME[themeKeyFor(S.matches.find(m => m.circuit === 'WTT' && m.competition === name))] || THEME.WTT_DEFAULT).chip, 'WTT')).join('');
  const journeeNum = k => { const mm = /^Journée (\d+)$/.exec(k); return mm ? +mm[1] : 999; };
  const journeeRows = Object.entries(byJournee)
    .sort((a, b) => journeeNum(a[0]) - journeeNum(b[0]))
    .map(([name, s]) => breakdownRow(name, s, THEME.PRO_A.accent, 'PRO_A')).join('');
  const seasonPanel = (tournamentRows || journeeRows) ? `
  <section class="panel">
    <h3>Par tournoi / saison</h3>
    <p class="hint" style="margin-top:2px">Le détail de tes points, tournoi WTT par tournoi WTT et journée par journée en Pro A.</p>
    ${tournamentRows ? `<h4 class="subh">WTT</h4><div class="laddwrap compact">${tournamentRows}</div>` : ''}
    ${journeeRows ? `<h4 class="subh">Pro A</h4><div class="laddwrap compact">${journeeRows}</div>` : ''}
  </section>` : '';

  // --- Par adversaire : contre qui tu lis bien le jeu, et contre qui tu te
  // trompes le plus. "pt.base > 0" = bon vainqueur (indépendant du bonus de
  // série ou outsider) : c'est la seule chose pertinente pour juger une
  // lecture de match. Basé sur les noms déjà présents dans l'historique
  // (side_a/side_b), sans avoir besoin d'interroger les competitor_id.
  const perPlayer = {};
  for (const h of finished) {
    const m = h.matches;
    for (const name of [m.side_a, m.side_b]) {
      if (!name) continue;
      const s = perPlayer[name] || (perPlayer[name] = { n: 0, correct: 0, circuit: m.circuit });
      s.n++; if (h.pt.base > 0) s.correct++;
    }
  }
  const MIN_SAMPLE = 3;
  const playerList = Object.entries(perPlayer)
    .map(([name, s]) => ({ name, ...s, acc: s.correct / s.n }))
    .filter(s => s.n >= MIN_SAMPLE);
  const playerRow = s => `<li class="cmrow">
    <div class="cmopp">${esc(s.name)}</div>
    <div class="cmmeta"><span class="cmdate">${s.n} prono${s.n > 1 ? 's' : ''} jugé${s.n > 1 ? 's' : ''}</span>
      <span class="cmres ${s.acc >= 0.5 ? 'win' : 'loss'}">${Math.round(s.acc * 100)}%</span></div>
  </li>`;
  const bestReads = playerList.slice().sort((a, b) => b.acc - a.acc || b.n - a.n).slice(0, 4);
  const worstReads = playerList.slice().sort((a, b) => a.acc - b.acc || b.n - a.n).slice(0, 4);
  const playerPanel = playerList.length ? `
  <section class="panel">
    <h3>Par adversaire</h3>
    <p class="hint" style="margin-top:2px">Ta justesse de pronostic (bon vainqueur, score exact ou pas) face aux joueurs/équipes que tu as croisés au moins ${MIN_SAMPLE} fois.</p>
    <h4 class="subh">Tes meilleures lectures</h4>
    <ul class="cmlist">${bestReads.map(playerRow).join('')}</ul>
    ${worstReads.length && worstReads[0].name !== bestReads[0].name ? `<h4 class="subh">Tes angles morts</h4><ul class="cmlist">${worstReads.map(playerRow).join('')}</ul>` : ''}
  </section>` : '';

  const ordinal = r => r + (r === 1 ? 'er' : 'e');
  return `
  <header class="pagehead"><h1>Mon compte</h1><p>Tes statistiques de pronostics, sur toute la durée du jeu.</p></header>
  <section class="acchero" style="${themeVarsCss('ALL')}">
    <div class="acchero-row">
      <div class="big"><span data-count="${total}">${total}</span><small>points</small></div>
      ${myRank ? `<div class="rank"><span>au classement<br>général</span><span class="medalball" style="--medal:${myRank === 1 ? 'var(--gold)' : myRank === 2 ? 'var(--silver)' : myRank === 3 ? 'var(--bronze)' : '#F3F4F1'}">${myRank}</span></div>` : ''}
    </div>
    <p>${n} prono${n > 1 ? 's' : ''} jugé${n > 1 ? 's' : ''}, dont ${exactN} score${exactN > 1 ? 's' : ''} exact${exactN > 1 ? 's' : ''}.</p>
  </section>
  <div class="acc-cols">
  <section class="panel">
    <h3>Justesse</h3>
    <ul class="statlist">
      <li><span class="k">Bons vainqueurs<small>${goodN} sur ${n} pronos jugés</small></span><span class="v">${pctGood} %</span><div class="bar"><i style="width:${pctGood}%"></i></div></li>
      <li><span class="k">Scores exacts<small>${exactN} sur ${n} pronos jugés</small></span><span class="v hot">${pctExact} %</span><div class="bar hot"><i style="width:${pctExact}%"></i></div></li>
    </ul>
  </section>
  <section class="panel">
    <h3 style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">Série en cours ${streakBadgeHtml(curStreak, true)}</h3>
    <div class="streakrow" style="margin-top:12px" aria-label="Tes 10 derniers pronos jugés">${streakTiles}</div>
    <p class="hint" style="margin-top:10px">${curStreak > 0 ? `${curStreak} prono${curStreak > 1 ? 's' : ''} gagnant${curStreak > 1 ? 's' : ''} d'affilée en ce moment${curPct > 0 ? `, le prochain prono gagnant rapporte +${curPct} %` : ''}.` : "Pas de série en cours."} Meilleure série : <b style="color:var(--ink)">${bestStreak}</b>.</p>
  </section>
  ${badgesPanel()}
  ${sparkline}
  ${byCircuit.length ? `
  <section class="panel">
    <h3>Par circuit</h3>
    <div class="laddwrap">${circuitRows}</div>
  </section>` : ''}
  ${seasonPanel}
  ${playerPanel}
  ${best && best.pt.total > 0 ? `
  <section class="panel">
    <h3>Ton meilleur coup</h3>
    <div class="bestshot">
      ${ptsBlock(best.pt.total, best.pt)}
      <div style="min-width:0">
        <div class="adm-title">${matchLabel(best.matches)}</div>
        <div class="hint">${esc(fmtDay(best.matches.starts_at))} · prono ${best.pred_a}–${best.pred_b}, score réel ${best.matches.score_a}–${best.matches.score_b}</div>
      </div>
    </div>
  </section>` : ''}
  <section class="panel">
    <h3>Forme récente</h3>
    <ul class="cmlist" style="margin-top:8px">${recentRows}</ul>
  </section>
  ${settingsPanel()}
  </div>`;
}

/* =============================================================================
   Bilan de tournoi animé ("récap") — déclenché depuis "Par tournoi / saison"
   dans "Mon compte" (bouton "Voir le récap" posé par breakdownRow, voir plus
   haut). Un seul moment de motion design soigné (bannière, rang et points qui
   comptent jusqu'à leur valeur, podium) plutôt que des micro-animations
   dispersées partout — cohérent avec le reste de l'appli (tampons, pastilles,
   chiffres en mono). Respecte prefers-reduced-motion : état final affiché
   d'un coup, sans séquence, voir mountRecapAnimation() et le CSS .recap-step.
   ========================================================================= */

// Construit le classement de CE tournoi/journée, tous les amis confondus, à
// partir de S.allJudgedPreds (pronostics de tout le monde déjà jugés, voir
// loadAccount) : chaque personne garde SA propre série (computeStreakSeries)
// calculée sur TOUT son historique chronologique (comme sur le vrai
// classement), seuls les totaux affichés sont ensuite limités à ce
// tournoi/journée. Ne touche ni ne dépend d'aucune nouvelle requête réseau.
function computeRecapData(key, circuit) {
  if (!S.allJudgedPreds || !S.accountBoard) return null;
  const uid = S.session && S.session.user.id;
  const pseudoOf = {};
  (S.accountBoard || []).forEach(r => { pseudoOf[r.user_id] = r.pseudo; });

  const byUser = {};
  for (const r of S.allJudgedPreds) {
    if (!r.matches) continue;
    (byUser[r.user_id] || (byUser[r.user_id] = [])).push(r);
  }

  const rows = [];
  for (const userId in byUser) {
    const sorted = byUser[userId].slice().sort((a, b) => new Date(a.matches.starts_at) - new Date(b.matches.starts_at) || a.match_id - b.match_id);
    const scored = computeStreakSeries(sorted).map(h => ({ ...h, pt: pointsDetail(h.matches, h, h.streakBefore) }));
    const inT = scored.filter(h => h.matches.circuit === circuit && tournamentGroupKey(h.matches) === key);
    if (!inT.length) continue;
    let bestStreakInT = 0; for (const h of inT) bestStreakInT = Math.max(bestStreakInT, h.streakAfter);
    rows.push({
      userId, pseudo: pseudoOf[userId] || '—',
      pts: inT.reduce((s, h) => s + h.pt.total, 0),
      exact: inT.filter(h => h.pt.exact).length,
      n: inT.length,
      bestStreak: bestStreakInT,
    });
  }
  rows.sort((a, b) => b.pts - a.pts || b.exact - a.exact);
  let prevKey = null, rk = 0;
  rows.forEach((r, i) => {
    const k = r.pts + '/' + r.exact;
    if (k !== prevKey) { rk = i + 1; prevKey = k; }
    r.rank = rk;
  });
  const me = rows.find(r => r.userId === uid) || null;
  const theme = circuit === 'PRO_A' ? THEME.PRO_A : THEME[TIER_KEY[(S.matches.find(m => m.circuit === 'WTT' && tournamentGroupKey(m) === key) || {}).tier]] || THEME.WTT_DEFAULT;
  return { key, circuit, rows, me, podium: rows.slice(0, 3), theme };
}

// Badges débloqués "sous les yeux" pendant CE tournoi précisément (pas avant,
// pas après) : même mécanique que checkNewBadges, rejouée sur deux
// sous-ensembles de l'historique perso (juste avant / jusqu'à la fin du
// tournoi) pour isoler ce qui a basculé pendant cette fenêtre-là. Ne modifie
// ni ne rappelle computeBadges/checkNewBadges (pas d'effet de bord, pas de
// double notification).
function recapNewBadges(key, circuit) {
  const finished = myJudgedHistory();
  if (!finished || !finished.length) return [];
  const inT = finished.filter(h => h.matches.circuit === circuit && tournamentGroupKey(h.matches) === key);
  if (!inT.length) return [];
  const firstTs = inT[0].matches.starts_at, lastTs = inT[inT.length - 1].matches.starts_at;
  const badgesOf = list => {
    const n = list.length, goodN = list.filter(h => h.pt.total > 0).length;
    let bestStreak = 0; for (const h of list) bestStreak = Math.max(bestStreak, h.streakAfter);
    const ctx = { finished: list, n, goodN, bestStreak, uid: S.session && S.session.user.id };
    return new Set(BADGE_DEFS.filter(d => d.test(ctx)).map(d => d.id));
  };
  const before = badgesOf(finished.filter(h => h.matches.starts_at < firstTs));
  const after = badgesOf(finished.filter(h => h.matches.starts_at <= lastTs));
  return BADGE_DEFS.filter(d => after.has(d.id) && !before.has(d.id));
}

/* ---------- Prise en main (tuto) ----------
   Six étapes sur les vrais écrans : un projecteur éclaire l'élément dont on
   parle, une carte explique. À l'étape "Touche un score", on le fait pour de
   vrai (c'est un vrai prono, modifiable). Lancé une fois automatiquement à
   la première connexion sur cet appareil, puis à la demande depuis
   Mon compte > Réglages. "Passer" ou Échap ferme tout. */
const TUTO_KEY = 'spin_tuto_done';
const TUTO_STEPS = [
  { art: 'welcome', title: 'Bienvenue sur SPIN', next: 'Commencer',
    text: "Le jeu de pronostics de ping-pong entre amis, sur le circuit WTT et la Pro A. Une minute pour voir comment marquer des points." },
  { target: 'hero', title: 'Le match du moment',
    text: "En haut, le match en direct, ou le prochain à pronostiquer avec son compte à rebours. « Pronostiquer » t'emmène directement dessus." },
  { target: 'table', title: 'Touche un score', interactive: true,
    text: "Chaque match a sa table, un joueur de chaque côté du filet. Touche le score que tu prévois : <b>1 point</b> pour le bon vainqueur, <b>3 points</b> pour le score exact." },
  { target: 'balles', title: 'Tes balles',
    text: "4 balles par tournoi WTT, 2 par journée de Pro A. Misées sur un prono (3 au plus), elles le font valoir <b>×2, ×3 ou ×4</b> s'il est gagnant. S'il est perdu, les balles aussi." },
  { art: 'streak', title: 'Les bonus',
    text: "Enchaîne les pronos gagnants : dès 3 d'affilée, chaque nouveau prono gagnant rapporte plus, jusqu'à <b>+75 %</b>. En WTT, gagner avec l'outsider rapporte aussi jusqu'à <b>+5 points</b>." },
  { target: 'nav', title: "Le reste de l'appli", next: "C'est parti",
    text: "<b>Amis</b> : le classement entre vous. <b>Classements</b> : le mondial WTT et la Pro A. <b>Mon compte</b> : tes stats, tes badges et le récap animé de chaque tournoi. Ce tuto s'y trouve aussi, dans Réglages." },
];
let TUTO = null; // { i, el, picked }
function tutoTarget(name) {
  if (name === 'hero') return document.querySelector('.hero');
  if (name === 'table') { const b = document.querySelector('.mrow .scorebtn:not([disabled])'); return b ? b.closest('.table3d') : null; }
  if (name === 'balles') return document.querySelector('.ballesbudget');
  if (name === 'nav') return document.querySelector('.nav');
  return null;
}
function tutoArt(kind) {
  if (kind === 'welcome') return `<div class="tuto-art" aria-hidden="true"><div class="court"><div class="court-table"><div class="court-net"></div></div><div class="rally"><span class="shadow"></span><span class="ball"></span></div></div></div>`;
  if (kind === 'streak') return `<div class="tuto-art streak" aria-hidden="true"><div class="tuto-balls">${[0, 1, 2, 3, 4].map(i => `<i style="--d:${150 + i * 120}ms"></i>`).join('')}</div><b>+28 %</b></div>`;
  return '';
}
function maybeStartTuto() {
  if (TUTO || S._tutoChecked || !S.session || S.bootError) return;
  S._tutoChecked = true;
  let done = false;
  try { done = localStorage.getItem(TUTO_KEY) === '1'; } catch (e) { /* stockage bloqué : on propose le tuto */ }
  if (!done) afterSplash(() => setTimeout(() => { if (!TUTO && S.session && !S.openRecap && !S.openCompetitor && !S.openBadge) startTuto(); }, 900));
}
function startTuto() {
  if (TUTO) return;
  if (S.tab !== 'matches' || S.view !== 'upcoming' || S.circuit !== 'ALL') {
    S.tab = 'matches'; S.view = 'upcoming'; S.circuit = 'ALL'; S.proJournee = null; S._freshMatches = true; S._tabAt = Date.now();
    render();
  }
  window.scrollTo(0, 0);
  const el = document.createElement('div');
  el.className = 'tuto';
  el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-labelledby', 'tuto-title');
  el.innerHTML = '<div class="tuto-spot none"></div><div class="tuto-card"></div>';
  document.body.appendChild(el);
  TUTO = { i: 0, el, picked: false };
  el.addEventListener('click', onTutoClick);

  window.addEventListener('resize', onTutoMove);

function endTuto() {

function tutoGo(delta) {

function showTutoStep() {

    <div class="tuto-dots" role="img" aria-label="Étape ${TUTO.i + 1} sur ${TUTO_STEPS.length}">${TUTO_STEPS.map((_, k) => `<i class="${k === TUTO.i ? 'on' : k < TUTO.i ? 'past' : ''}"></i>`).join('')}</div>
    <h2 id="tuto-title">${step.title}</h2>

    ${live ? `<p class="tuto-hint"><i aria-hidden="true"></i><span>À toi : touche un score sur cette table. C'est un vrai prono, modifiable jusqu'au début du match.</span></p>` : ''}
    <div class="tuto-foot">

      <button type="button" class="btn small tuto-next">${step.next || (live ? 'Plus tard' : 'Suivant')}</button>

let tutoRaf = 0;
function onTutoMove() { if (tutoRaf) return; tutoRaf = requestAnimationFrame(() => { tutoRaf = 0; positionTuto(); }); }
function positionTuto() {
  if (!TUTO) return;
  const step = TUTO_STEPS[TUTO.i], spot = TUTO.el.querySelector('.tuto-spot'), card = TUTO.el.querySelector('.tuto-card');
  const W = window.innerWidth, H = window.innerHeight, pad = 8, gap = 14;
  const target = step.target ? tutoTarget(step.target) : null;

  if (r) {
    spot.classList.remove('none');

  } else {
    spot.classList.add('none');
    Object.assign(spot.style, { left: W / 2 + 'px', top: H / 2 + 'px', width: '0px', height: '0px' });
  }

    const below = H - (r.y + r.h) - gap, above = r.y - gap, right = W - (r.x + r.w) - gap;
    if (r.h > H * 0.6 && right >= cw + 8) { left = r.x + r.w + gap; top = Math.min(Math.max(12, r.y + r.h / 2 - ch / 2), H - ch - 12); }
    else {
      left = Math.min(Math.max(12, r.x + r.w / 2 - cw / 2), W - cw - 12);
      if (below >= ch + 4) top = r.y + r.h + gap;
      else if (above >= ch + 4) top = r.y - gap - ch;
      else top = Math.max(12, H - ch - 12);
    }
  }
  card.style.width = cw + 'px'; card.style.left = left + 'px'; card.style.top = top + 'px';
}
function onTutoClick(e) {
  if (!TUTO) return;
  if (e.target.closest('.tuto-next')) { tutoGo(1); return; }
  if (e.target.closest('.tuto-skip')) { endTuto(); return; }
  if (e.target.closest('.tuto-card')) return;
  // Étape interactive : un tap sur la table éclairée passe à travers.
  const step = TUTO_STEPS[TUTO.i];
  if (!step.interactive) return;
  TUTO.el.style.pointerEvents = 'none';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  TUTO.el.style.pointerEvents = '';
  const btn = under && under.closest('.scorebtn');
  const tgt = tutoTarget(step.target);
  if (btn && tgt && tgt.contains(btn) && !btn.disabled) btn.click();
}
function tutoOnPick() {
  if (!TUTO || TUTO.picked || !TUTO_STEPS[TUTO.i].interactive) return;
  TUTO.picked = true;
  const hint = TUTO.el.querySelector('.tuto-hint span'), next = TUTO.el.querySelector('.tuto-next');
  if (hint) { hint.textContent = 'Bien joué, ton prono est posé.'; hint.parentElement.classList.add('ok'); }
  if (next) next.textContent = 'Suivant';
  const at = TUTO.i;
  setTimeout(() => { if (TUTO && TUTO.i === at) tutoGo(1); }, 1500);
}
document.addEventListener('keydown', e => {
  if (!TUTO) return;
  if (e.key === 'Escape') { e.stopPropagation(); endTuto(); }
  else if (e.key === 'ArrowRight') tutoGo(1);
  else if (e.key === 'ArrowLeft') tutoGo(-1);
}, true);

/* ---------- Bilan de tournoi : le film ----------
   À l'ouverture : la table de la compétition, une balle qui arrive du fond
   de la salle et rebondit vers toi, de plus en plus près, jusqu'à percuter
   l'écran, qui devient blanc (le blanc de la balle). Puis les chiffres
   arrivent un par un. Environ 8 secondes ; "Passer" (ou un tap) va
   directement à la fin ; rien de tout ça si la personne a demandé moins
   d'animations (le bilan s'affiche directement, complet). */
let RECAP_RUN = null; // { timers, anims } de la séquence en cours

function stopRecapRun() {
  if (!RECAP_RUN) return;
  RECAP_RUN.timers.forEach(clearTimeout);
  RECAP_RUN.anims.forEach(a => { try { a.cancel(); } catch (e) { /* déjà fini */ } });
  RECAP_RUN = null;
}
// Va directement à la fin (bouton "Passer", tap sur la scène, ou échec).
function finishRecap() {
  stopRecapRun();
  const root = document.querySelector('.recapx');
  if (!root) return;
  root.classList.remove('intro', 'play');
  root.classList.add('done');
  root.querySelectorAll('[data-to]').forEach(el => { el.textContent = el.dataset.to; });
}
function countTo(el, dur) {
  const target = Number(el.dataset.to) || 0, start = performance.now();
  if (!target) { el.textContent = '0'; return; }
  const tick = now => {
    if (!el.isConnected) return;
    const p = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = String(Math.round(target * e));
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
// La séquence. Les positions de la balle sont calculées sur la table telle
// qu'elle est réellement affichée (perspective comprise), puis jouées en une
// seule animation (Web Animations API), image par image : chaque rebond est
// une vraie parabole, la balle grossit en approchant, s'écrase un peu à
// chaque contact, et son ombre glisse sur la table.
function mountRecapAnimation() {
  const root = document.querySelector('.recapx');
  if (!root || !root.classList.contains('intro')) return;
  try {
    stopRecapRun();
    const run = RECAP_RUN = { timers: [], anims: [] };
    const at = (ms, fn) => run.timers.push(setTimeout(fn, ms));
    const intro = root.querySelector('.rx-intro'), ball = root.querySelector('.rx-ball'), shadow = root.querySelector('.rx-shadow');
    const white = root.querySelector('.rx-white'), table = root.querySelector('.rx-table'), net = root.querySelector('.rx-net');
    if (!ball.animate) { finishRecap(); return; }
    // Une vraie scène 3D : on place nous-mêmes la table (perspective, angle,
    // taille) et on projette chaque position de la balle avec les mêmes
    // nombres que le navigateur. La balle reste donc collée à la table.
    const W = intro.clientWidth, H = intro.clientHeight;
    const court = root.querySelector('.rx-court');
    const P = 1000, ox = W / 2, oy = H * 0.04, deg = 55, th = deg * Math.PI / 180;
    const tw = Math.min(W * 0.78, H * 0.46), tl = Math.min(tw * 1.8, 0.8 * P / Math.sin(th)), T = H * 0.24, left = (W - tw) / 2;
    court.style.perspective = P + 'px'; court.style.perspectiveOrigin = `${ox}px ${oy}px`;
    Object.assign(table.style, { left: left + 'px', width: tw + 'px', top: T + 'px', height: tl + 'px', transform: `rotateX(${deg}deg)` });
    const netH = tw * 0.1;
    Object.assign(net.style, { top: `calc(50% - ${netH}px)`, height: netH + 'px' });
    const proj = (X, Y, Z) => { const k = P / (P - Z); return { x: ox + (X - ox) * k, y: oy + (Y - oy) * k, k }; };
    const world = (u, v, h) => { const dd = v * tl; return { X: left + u * tw, Y: T + dd * Math.cos(th) - h * Math.sin(th), Z: dd * Math.sin(th) + h * Math.cos(th) }; };
    const at3 = (u, v, h) => { const w = world(u, v, h || 0); return proj(w.X, w.Y, w.Z); };
    const yOf = v => at3(0.5, v, 0).y;
    const solveV = (target, lo, hi) => { for (let n = 0; n < 30; n++) { const m = (lo + hi) / 2; if (yOf(m) < target) lo = m; else hi = m; } return Math.min(0.97, (lo + hi) / 2); };
    const netY = yOf(0.5), floorY = H * 0.97;
    // Rebonds : un sur la moitié du fond, puis deux côté proche, de plus en plus près.
    const C = [
      { u: 0.62, v: 0.22 },
      { u: 0.4, v: solveV(netY + (floorY - netY) * 0.38, 0.5, 1) },
      { u: 0.56, v: solveV(netY + (floorY - netY) * 0.78, 0.5, 1) },
    ];
    const S0 = { u: 0.7, v: -0.3, h: tw * 0.6 };
    const bw = tw * 0.09; // diamètre de la balle (un peu plus grosse que nature, pour l'œil)
    const d = [620, 760, 560, 900], D = d.reduce((a, b) => a + b, 0), START = 450;
    const contacts = [d[0], d[0] + d[1], d[0] + d[1] + d[2]];
    const lerp = (a, b, t) => a + (b - a) * t;
    const frames = [], sframes = [];
    for (let t = 0; t <= D; t += 16) {
      let pos, ground, h = 0, fade = 1;
      if (t <= contacts[0]) {
        const q = t / d[0];
        const u = lerp(S0.u, C[0].u, q), v = lerp(S0.v, C[0].v, q); h = S0.h * (1 - q * q);
        pos = at3(u, v, h); ground = at3(u, Math.max(0, v), 0); fade = v < 0 ? 0 : 1;
      } else if (t <= contacts[2]) {
        const seg = t <= contacts[1] ? 0 : 1, t0 = seg ? contacts[1] : contacts[0], q = (t - t0) / d[seg + 1];
        const A = C[seg], B = C[seg + 1], Hm = tw * (seg ? 0.22 : 0.42);
        const u = lerp(A.u, B.u, q), v = lerp(A.v, B.v, q); h = Hm * 4 * q * (1 - q);
        pos = at3(u, v, h); ground = at3(u, v, 0);
      } else {
        // Le dernier rebond : la balle remonte et fonce sur l'écran ; son
        // diamètre à l'écran grandit de façon exponentielle jusqu'à le couvrir.
        const q = (t - contacts[2]) / d[3], c3 = at3(C[2].u, C[2].v, 0);
        const s0 = bw * c3.k, target = Math.hypot(W, H) * 1.35;
        const diam = s0 * Math.pow(target / s0, Math.pow(q, 1.25));
        const ease = 1 - Math.pow(1 - q, 2);
        pos = { x: lerp(c3.x, W / 2, ease), y: lerp(c3.y, H * 0.48, ease) - H * 0.12 * Math.sin(Math.PI * q) * (1 - q), k: diam / bw };
        ground = c3; h = tw * q; fade = Math.max(0, 1 - q * 3);
      }
      const s = bw * pos.k / 40;
      let sx = s, sy = s;
      const near = Math.min(...contacts.map(c => Math.abs(t - c)));
      if (near < 48) { const k = 1 - near / 48; sx = s * (1 + 0.24 * k); sy = s * (1 - 0.24 * k); }
      const off = t / D;
      frames.push({ transform: `translate(${pos.x.toFixed(1)}px,${pos.y.toFixed(1)}px) scale(${sx.toFixed(3)},${sy.toFixed(3)})`, offset: off });
      const hn = Math.min(1, h / (tw * 0.45));
      const ss = bw * ground.k / 40;
      sframes.push({ transform: `translate(${ground.x.toFixed(1)}px,${(ground.y + 2 * ss).toFixed(1)}px) scale(${(ss * (1 - 0.45 * hn)).toFixed(3)})`,
        opacity: (0.6 * (1 - 0.7 * hn) * fade).toFixed(3), offset: off });
    }
    frames[frames.length - 1].offset = 1; sframes[sframes.length - 1].offset = 1;
    run.anims.push(ball.animate(frames, { duration: D, delay: START, fill: 'both', easing: 'linear' }));
    run.anims.push(shadow.animate(sframes, { duration: D, delay: START, fill: 'both', easing: 'linear' }));
    contacts.forEach(c => at(START + c, () => playSound('bounce')));
    const hit = START + D;
    at(hit - 90, () => playSound('pop'));
    run.anims.push(white.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 140, delay: hit - 70, fill: 'both', easing: 'ease-out' }));
    // L'écran est blanc : on enlève la scène, les chiffres arrivent.
    at(hit + 60, () => {
      if (!root.isConnected) return;
      root.classList.remove('intro'); root.classList.add('play');
      white.style.display = 'none'; // même blanc que le fond du bilan : la transition est invisible
      root.querySelectorAll('[data-to]').forEach(el => {
        el.textContent = '0';
        at(Number(el.dataset.at) || 0, () => countTo(el, 850));
      });
      [380, 950, 1600, 2800].forEach(ms => at(ms, () => playSound('tick')));
      at(5200, () => { root.classList.remove('play'); root.classList.add('done'); RECAP_RUN = null; });
    });
  } catch (e) { finishRecap(); /* une animation ratée ne doit jamais empêcher d'ouvrir le bilan */ }
}

/* --- Fiche détail d'un joueur ou d'une équipe (clic sur son nom, où qu'il
   apparaisse : rangée de match, classement...). --- */
function competitorModal(id) {
  const c = S.competitors[id];
  if (!c) return '';
  const mine = S.matches.filter(m => m.competitor_a_id === id || m.competitor_b_id === id);
  const upcoming = mine.filter(m => m.status === 'scheduled' || m.status === 'live')
    .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const recent = mine.filter(m => m.status === 'finished' || m.status === 'cancelled')
    .sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at)).slice(0, 8);
  const oppOf = m => m.competitor_a_id === id
    ? { name: m.side_b, id: m.competitor_b_id }
    : { name: m.side_a, id: m.competitor_a_id };
  const oppHtml = m => {
    const o = oppOf(m);
    return o.id ? `<button class="namebtn" data-act="competitor" data-id="${o.id}">${esc(o.name)}</button>` : esc(o.name);
  };
  const resultTag = m => {
    if (m.status === 'cancelled') return `<span class="cmres">${HALLOWEEN ? ico('ghost.f') : ''}Annulé</span>`;
    if (m.status !== 'finished') return '';
    const won = (m.competitor_a_id === id && m.score_a > m.score_b) || (m.competitor_b_id === id && m.score_b > m.score_a);
    return `<span class="cmres ${won ? 'win' : 'loss'}">${won ? 'V' : 'D'} ${m.score_a}–${m.score_b}</span>`;
  };
  const matchRow2 = m => `<li class="cmrow">
    <div class="cmopp">${oppHtml(m)}</div>
    <div class="cmmeta"><span class="cmdate">${esc(fmtDay(m.starts_at))}</span>${resultTag(m)}</div>

  const roster = c.circuit === 'PRO_A' ? (c.roster || []) : [];
  const nothing = !upcoming.length && !recent.length && !roster.length;

  const rosterSec = roster.length ? `
    <section class="modalsec sec-roster">
      <h3><span class="secdot" aria-hidden="true"></span>Effectif</h3>
      <ul class="roster">${roster.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
    </section>` : '';
  const upcomingSec = upcoming.length ? `
    <section class="modalsec sec-upcoming">
      <h3><span class="secdot" aria-hidden="true"></span>À venir</h3>
      <ul class="cmlist">${upcoming.slice(0, 5).map(matchRow2).join('')}</ul>
    </section>` : '';
  const recentSec = recent.length ? `
    <section class="modalsec sec-recent">
      <h3><span class="secdot" aria-hidden="true"></span>Derniers résultats</h3>
      <ul class="cmlist">${recent.map(matchRow2).join('')}</ul>
    </section>` : '';

  return `
  <div class="modalbackdrop" data-act="closecompetitor">
    <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(c.name)}" data-act="stop" style="${themeVarsCss(c.circuit === 'PRO_A' ? 'PRO_A' : 'WTT_DEFAULT')}">
      <button class="modalclose" data-act="closecompetitor" aria-label="Fermer">${ico('x')}</button>
      <div class="modalhead">
        <div class="modalname">${flagHtml(c)}${esc(c.name)}</div>
        <div class="modalsub">${c.circuit === 'WTT' ? `Simple ${c.gender === 'F' ? 'dames' : c.gender === 'M' ? 'messieurs' : 'messieurs/dames'}, circuit WTT` : 'Équipe de Pro A'}</div>
        <div class="modalstats">
          ${c.circuit === 'WTT'
            ? (c.world_ranking != null
              ? `<div class="statbox"><b>#${c.world_ranking}</b><span>classement mondial</span></div>`
              : `<div class="statbox"><b>${c.ranking ?? '—'}</b><span>tête de série (tournoi)</span></div>`)
            : `<div class="statbox"><b>${c.ranking ?? '—'}</b><span>classement Pro A</span></div>`}
          ${c.circuit === 'WTT' && c.world_ranking != null && c.world_ranking_points ? `<div class="statbox"><b>${c.world_ranking_points}</b><span>points</span></div>` : ''}
          ${c.circuit === 'PRO_A' && c.ranking_points ? `<div class="statbox"><b>${c.ranking_points}</b><span>points</span></div>` : ''}
          ${roster.length ? `<div class="statbox"><b>${roster.length}</b><span>joueur${roster.length > 1 ? 's' : ''}</span></div>` : ''}
        </div>
      </div>
      <div class="modalbody">
        ${rosterSec}${upcomingSec}${recentSec}
        ${nothing ? `<p class="sec-empty">Aucune information suivie pour le moment.</p>` : ''}

  </div>`;
}

async function ensureCompetitor(name, circuit) {
  name = name.trim();
  const found = Object.values(S.competitors).find(c => c.circuit === circuit && c.name.toLowerCase() === name.toLowerCase());
  if (found) return found.id;
  const { data, error } = await sb.from('competitors')
    .insert({ name, circuit, kind: circuit === 'PRO_A' ? 'team' : 'player', source: 'manual' }).select().single();
  if (error) throw error;
  S.competitors[data.id] = data;
  return data.id;
}
async function addMatch(f) {
  const v = id => f.querySelector('#' + id).value.trim();
  const circuit = v('am-circuit'), a = v('am-a'), b = v('am-b');
  if (a.toLowerCase() === b.toLowerCase()) { toast('Choisis deux adversaires différents.', true); return; }
  try {
    const [ida, idb] = [await ensureCompetitor(a, circuit), await ensureCompetitor(b, circuit)];
    const { error } = await sb.from('matches').insert({
      circuit, competition: v('am-comp'), round: v('am-round') || null,
      side_a: a, side_b: b, competitor_a_id: ida, competitor_b_id: idb,
      starts_at: new Date(f.querySelector('#am-start').value).toISOString(),
      wins_needed: parseInt(v('am-wins'), 10), source: 'manual'
    });
    if (error) throw error;
    await reloadMatches();
    toast('Match ajouté.'); keepRender();
  } catch (e) { toast(friendlyError(e), true); }
}
async function saveResult(id) {
  const m = S.matches.find(x => x.id === id);
  const a = parseInt(document.getElementById('ra-' + id).value, 10), b = parseInt(document.getElementById('rb-' + id).value, 10);
  if (Number.isNaN(a) || Number.isNaN(b)) { toast('Saisis les deux scores.', true); return; }
  if (Math.max(a, b) !== m.wins_needed || Math.min(a, b) >= m.wins_needed) { toast(`Score impossible : le vainqueur doit avoir ${m.wins_needed} victoires.`, true); return; }
  const { error } = await sb.from('matches').update({ status: 'finished', score_a: a, score_b: b }).eq('id', id);
  if (error) { toast(friendlyError(error), true); return; }
  await reloadMatches(); toast('Résultat enregistré.'); keepRender();
}
async function cancelMatch(id) {
  if (!confirm('Annuler ce match ? Les pronos ne rapporteront aucun point.')) return;
  const { error } = await sb.from('matches').update({ status: 'cancelled', score_a: null, score_b: null }).eq('id', id);
  if (error) { toast(friendlyError(error), true); return; }
  await reloadMatches(); toast('Match annulé.'); keepRender();
}
async function deleteMatch(id) {
  if (!confirm('Supprimer ce match et tous les pronos associés ? Cette action est définitive.')) return;
  const { error } = await sb.from('matches').delete().eq('id', id);
  if (error) { toast(friendlyError(error), true); return; }
  await reloadMatches(); toast('Match supprimé.'); keepRender();
}
async function saveRank(id) {
  const raw = document.getElementById('rk-' + id).value.trim();
  const ranking = raw === '' ? null : parseInt(raw, 10);
  const { error } = await sb.from('competitors').update({ ranking }).eq('id', id);
  if (error) { toast(friendlyError(error), true); return; }
  S.competitors[id].ranking = ranking; toast('Classement enregistré.');
}
async function saveRoster(id) {
  const raw = document.getElementById('ro-' + id).value;
  const roster = raw.split('\n').map(s => s.trim()).filter(Boolean);
  const { error } = await sb.from('competitors').update({ roster: roster.length ? roster : null }).eq('id', id);
  if (error) { toast(friendlyError(error), true); return; }
  S.competitors[id].roster = roster.length ? roster : null; toast('Joueurs enregistrés.'); keepRender();
}
// Classement mondial WTT : mis à jour automatiquement par le robot de
// synchronisation (synchro.mjs) à chaque passage ; cette fonction ne sert
// qu'à une correction manuelle ponctuelle (ex. nom non reconnu par le robot).
async function saveWorldRank(id) {
  const rawR = document.getElementById('wr-' + id).value.trim();
  const rawP = document.getElementById('wp-' + id).value.trim();
  const world_ranking = rawR === '' ? null : parseInt(rawR, 10);
  const world_ranking_points = rawP === '' ? null : parseInt(rawP, 10);
  const { error } = await sb.from('competitors').update({ world_ranking, world_ranking_points }).eq('id', id);
  if (error) { toast(friendlyError(error), true); return; }
  S.competitors[id].world_ranking = world_ranking; S.competitors[id].world_ranking_points = world_ranking_points;
  toast('Classement mondial enregistré.');
}

/* ---------- Export en image (partage, sans dépendance externe) ----------
   Dessin manuel sur <canvas> plutôt qu'une capture DOM-vers-canvas (pas de
   librairie, pas de souci de polices/CSS externes à sérialiser) : un rendu
   simple et net, pas une réplique pixel pour pixel de la carte HTML, avec
   juste l'essentiel à partager dans une conversation de groupe. */
function downloadCanvas(canvas, filename) {
  canvas.toBlob(blob => {
    if (!blob) { toast("Impossible de générer l'image.", true); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }, 'image/png');
}
/* ---------- Images à partager : même identité que l'appli ----------
   Fond de salle, bandeau-table à la couleur de la compétition (bord blanc),
   gros chiffres en Barlow Semi Condensed, tuile de points. Dessiné en 2x
   pour rester net sur téléphone. */
const EXPORT_DISPLAY = "'Barlow Semi Condensed', 'Arial Narrow', Arial, sans-serif";
const EXPORT_BODY = "'Barlow', Arial, sans-serif";
const EX = HALLOWEEN
  ? { ground: '#11171E', ground2: '#0A0F15', surface: '#1A222B', surface2: '#232D38', ink: '#EEE6D8', ink2: '#B9B0A1', line: '#2C3642', red: '#F2832B', muted: '#7E786E', me: 'rgba(255,255,255,.06)', onMedal: '#1E1912' }
  : { ground: '#E3E8ED', ground2: '#D5DCE3', surface: '#F6F7F4', surface2: '#ECEFF0', ink: '#141B24', ink2: '#4A5563', line: '#DCE2E8', red: '#C41E2E', muted: '#8A94A1', me: 'rgba(29,79,140,.10)', onMedal: '#141B24' };
// Couleur de table lisible comme texte sur le fond de l'image (à Halloween,
// le fond est sombre : on éclaircit la couleur de la compétition).
const exText = c => {
  if (!HALLOWEEN || !/^#[0-9a-f]{6}$/i.test(c)) return c;
  const n = parseInt(c.slice(1), 16), mix = v => Math.round(v + (255 - v) * 0.5);
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(v => mix(v).toString(16).padStart(2, '0')).join('');
};
const MEDALS = { 1: '#D9A92E', 2: '#AEB8C4', 3: '#C3814F' };
async function exportFontsReady() {
  try {
    if (!document.fonts || !document.fonts.load) return;
    await Promise.all([
      document.fonts.load(`700 40px 'Barlow Semi Condensed'`),
      document.fonts.load(`600 40px 'Barlow Semi Condensed'`),
      document.fonts.load(`500 16px 'Barlow'`),
      document.fonts.load(`600 16px 'Barlow'`),
    ]);
  } catch (e) { /* polices indisponibles : on dessine avec les polices de secours */ }
}
function makeExportCanvas(w, h) {
  const k = 2, canvas = document.createElement('canvas');
  canvas.width = w * k; canvas.height = h * k;
  const ctx = canvas.getContext('2d');
  ctx.scale(k, k);
  return { canvas, ctx };
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
// Réduit la taille de police jusqu'à ce que le texte tienne dans maxW.
function fitFont(ctx, text, weight, size, family, maxW, minSize) {
  let s = size;
  ctx.font = `${weight} ${s}px ${family}`;
  while (s > (minSize || size * 0.55) && ctx.measureText(text).width > maxW) {
    s -= 1; ctx.font = `${weight} ${s}px ${family}`;
  }
  return s;
}
function clamp01(v) { return Math.max(0, Math.min(1, v)); }
// Fond commun : salle claire + bandeau-table de la compétition avec son bord blanc.
function paintExportPoster(ctx, w, h, t, title, sub, opts) {
  opts = opts || {};
  const m = 20, bandH = opts.bandH || 120;
  ctx.fillStyle = EX.ground; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = t.table; roundRect(ctx, m, m, w - 2 * m, bandH, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.94)'; ctx.lineWidth = 3;
  roundRect(ctx, m + 7, m + 7, w - 2 * m - 14, bandH - 14, 3); ctx.stroke();
  const tx = m + 28;
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
  const size = fitFont(ctx, String(title), 700, 44, EXPORT_DISPLAY, w - 2 * tx - (opts.titleRoom || 0), 24);
  ctx.font = `700 ${size}px ${EXPORT_DISPLAY}`;
  ctx.fillText(String(title), tx, m + (sub ? 64 : 76));
  if (sub) {
    ctx.fillStyle = 'rgba(255,255,255,.84)'; ctx.font = `500 17px ${EXPORT_BODY}`;
    ctx.fillText(String(sub), tx, m + 94);
  }
  return m + bandH;
}
// Pied : la marque, et ce que c'est.
function paintExportFooter(ctx, w, h) {
  ctx.textAlign = 'left';
  ctx.fillStyle = EX.ink; ctx.font = `700 30px ${EXPORT_DISPLAY}`; ctx.fillText('SPIN', 28, h - 26);
  const bw = ctx.measureText('SPIN').width;
  ctx.fillStyle = EX.ink2; ctx.font = `500 14px ${EXPORT_BODY}`;
  ctx.fillText("Pronostics de tennis de table entre amis, pas un jeu d'argent", 28 + bw + 14, h - 32);
}
// Tuile de points : le chiffre en grand et ce qu'il veut dire.
function paintPtsTile(ctx, x, y, w, h, value, label, color) {
  ctx.fillStyle = EX.surface; roundRect(ctx, x, y, w, h, 6); ctx.fill();
  ctx.textAlign = 'center'; ctx.fillStyle = color;
  ctx.font = `700 ${Math.round(h * 0.46)}px ${EXPORT_DISPLAY}`; ctx.fillText(value, x + w / 2, y + h * 0.58);
  ctx.fillStyle = EX.ink2; ctx.font = `600 15px ${EXPORT_BODY}`; ctx.fillText(label, x + w / 2, y + h - 18);
  ctx.textAlign = 'left';
}
function paintStatTicket(ctx, x, y, w, h, t, value, label, accent) {
  ctx.fillStyle = EX.surface; roundRect(ctx, x, y, w, h, 6); ctx.fill();
  ctx.textAlign = 'left';
  ctx.fillStyle = accent ? EX.red : EX.ink; ctx.font = `700 50px ${EXPORT_DISPLAY}`; ctx.fillText(value, x + 20, y + 58);
  ctx.fillStyle = EX.ink2; ctx.font = `500 15px ${EXPORT_BODY}`; ctx.fillText(label, x + 20, y + h - 18);
}

async function exportMatchImage(id) {
  const m = S.matches.find(x => x.id === id);
  if (!m) { toast('Match introuvable.', true); return; }
  await exportFontsReady();
  const mine = S.myPreds[m.id];
  const streakInfo = myStreakInfo();
  const myStreakBefore = streakInfo.before.get(m.id) || 0;
  const fin = m.status === 'finished';
  const det = (fin && mine) ? pointsDetail(m, mine, myStreakBefore) : null;
  const t = THEME[themeKeyFor(m)] || THEME.ALL;

  const w = 820, h = 470;
  const { canvas, ctx } = makeExportCanvas(w, h);
  const top = paintExportPoster(ctx, w, h, t, m.competition || 'Match', m.round || '');

  // Carte du match.
  const cx = 20, cy = top + 14, cw = w - 40, ch = 238;
  ctx.fillStyle = EX.surface; roundRect(ctx, cx, cy, cw, ch, 6); ctx.fill();
  ctx.fillStyle = EX.ink2; ctx.font = `500 16px ${EXPORT_BODY}`; ctx.textAlign = 'left';
  const when = esc0(fmtWhen(m.starts_at));
  ctx.fillText(when.charAt(0).toUpperCase() + when.slice(1), cx + 24, cy + 36);

  const winA = fin && m.score_a > m.score_b, winB = fin && m.score_b > m.score_a;
  const nameMax = cw - 24 - 300;
  const rowY = [cy + 96, cy + 156];
  [[m.side_a, winB], [m.side_b, winA]].forEach(([name, lost], i) => {
    const s = fitFont(ctx, esc0(name), 700, 46, EXPORT_DISPLAY, nameMax, 26);
    ctx.font = `700 ${s}px ${EXPORT_DISPLAY}`;
    ctx.fillStyle = lost ? EX.muted : EX.ink;
    ctx.fillText(esc0(name), cx + 24, rowY[i]);
  });
  ctx.textAlign = 'right'; ctx.font = `700 60px ${EXPORT_DISPLAY}`;
  const sx = cx + cw - 196;
  if (fin) {
    ctx.fillStyle = winA ? EX.ink : EX.muted; ctx.fillText(String(m.score_a), sx, rowY[0] + 4);
    ctx.fillStyle = winB ? EX.ink : EX.muted; ctx.fillText(String(m.score_b), sx, rowY[1] + 4);
  } else if (mine) {
    ctx.fillStyle = exText(t.table);
    ctx.fillText(String(mine.pred_a), sx, rowY[0] + 4);
    ctx.fillText(String(mine.pred_b), sx, rowY[1] + 4);
  }
  ctx.textAlign = 'left';
  ctx.fillStyle = EX.ink; ctx.font = `600 18px ${EXPORT_BODY}`;
  if (mine) ctx.fillText(fin ? `Mon prono : ${mine.pred_a}–${mine.pred_b}` : `Mon prono : ${mine.pred_a}–${mine.pred_b}, match à venir`, cx + 24, cy + 204);
  if (det) {
    const bits = [];
    if (det.streakBonus) bits.push(`série +${det.streakBonus}`);
    if (det.ballesBonus) bits.push(`balles (${det.balles}) +${det.ballesBonus}`);
    if (det.bonus) bits.push(`outsider +${det.bonus}`);
    if (bits.length) { ctx.fillStyle = EX.ink2; ctx.font = `500 15px ${EXPORT_BODY}`; ctx.fillText(`dont ${bits.join(', ')}`, cx + 24, cy + 226); }
    const col = det.total > 0 ? (det.exact ? EX.red : exText(t.table)) : EX.ink2;
    const label = det.total === 0 ? 'raté' : (det.exact ? 'score exact' : 'bon vainqueur');
    ctx.fillStyle = t.table; roundRect(ctx, cx + cw - 172, cy + 52, 150, 136, 6); ctx.fill();
    paintPtsTile(ctx, cx + cw - 164, cy + 60, 134, 120, `${det.total > 0 ? '+' : ''}${det.total}`, label, col);
  }
  paintExportFooter(ctx, w, h);
  downloadCanvas(canvas, `spin-match-${m.id}.png`);
}

async function exportBoardImage() {
  const rows = (S.board || []).slice(0, 10);
  if (!rows.length) { toast('Rien à exporter encore.', true); return; }
  await exportFontsReady();
  const t = THEME.ALL;
  const w = 780, hRow = 66, h = 160 + rows.length * hRow + 96;
  const { canvas, ctx } = makeExportCanvas(w, h);
  const scopeLabel = S.boardScope === 'ALL' ? 'Classement général' : (S.boardScope === 'WTT' ? 'Classement WTT' : 'Classement Pro A');
  const today = new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  const top = paintExportPoster(ctx, w, h, t, scopeLabel, `Au ${today}`);
  const uid = S.session && S.session.user.id;

  const lx = 20, lw = w - 40;
  let y = top + 14;
  ctx.fillStyle = EX.surface; roundRect(ctx, lx, y, lw, rows.length * hRow, 6); ctx.fill();
  let prev = null, rank = 0;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i], key = r.total_points + '/' + r.exact_scores;
    if (key !== prev) { rank = i + 1; prev = key; }
    if (r.user_id === uid) { ctx.fillStyle = EX.me; ctx.fillRect(lx, y, lw, hRow); }
    if (i > 0) { ctx.fillStyle = EX.line; ctx.fillRect(lx + 16, y, lw - 32, 1); }
    const cy = y + hRow / 2;
    ctx.textAlign = 'center';
    if (rank <= 3) { ctx.fillStyle = MEDALS[rank]; ctx.beginPath(); ctx.arc(lx + 44, cy, 19, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = EX.onMedal; }
    else ctx.fillStyle = EX.ink2;
    ctx.font = `700 24px ${EXPORT_DISPLAY}`; ctx.fillText(String(rank), lx + 44, cy + 8);
    ctx.textAlign = 'left'; ctx.fillStyle = EX.ink;
    const ns = fitFont(ctx, esc0(r.pseudo), 700, 28, EXPORT_DISPLAY, lw - 300, 18);
    ctx.font = `700 ${ns}px ${EXPORT_DISPLAY}`; ctx.fillText(esc0(r.pseudo), lx + 82, cy + 2);
    ctx.fillStyle = EX.ink2; ctx.font = `500 14px ${EXPORT_BODY}`;
    ctx.fillText(`${r.exact_scores} score${r.exact_scores > 1 ? 's' : ''} exact${r.exact_scores > 1 ? 's' : ''} · ${r.good_winners} bon${r.good_winners > 1 ? 's' : ''} vainqueur${r.good_winners > 1 ? 's' : ''}`, lx + 82, cy + 22);
    ctx.textAlign = 'right';
    ctx.fillStyle = EX.ink2; ctx.font = `500 14px ${EXPORT_BODY}`; ctx.fillText('pts', lx + lw - 20, cy + 9);
    ctx.fillStyle = EX.ink; ctx.font = `700 34px ${EXPORT_DISPLAY}`; ctx.fillText(String(r.total_points), lx + lw - 48, cy + 12);
    ctx.textAlign = 'left';
    y += hRow;
  }
  paintExportFooter(ctx, w, h);
  downloadCanvas(canvas, 'spin-classement.png');
}
