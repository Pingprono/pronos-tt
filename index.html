<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121418">
<title>SPIN</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SPIN">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css">
<style>
/* =============================================================================
   SPIN — refonte n°2.
   Principe : s'inspirer de la vraie famille des apps de score en direct
   (SofaScore / Flashscore pour les listes de matchs denses groupées par
   compétition et le traitement du "live" ; appli ESPN / barre d'onglets à
   icônes pour la navigation mobile ; grille de pick'em type DraftKings pour
   le choix du score) plutôt que d'habiller la maquette d'avant avec d'autres
   couleurs. Pensé "copains" : dense et jouable, pas un produit de diffusion
   pro, pas de pub, pas de cotes d'argent réel.
   ========================================================================== */
:root{
  --paper:#121418;
  --paper-deep:#0A0B0D;
  --card:#1B1E24;
  --card-top:#242832;
  --ink:#F3F1EC;
  --ink-soft:#9A9CA6;
  --accent:#D9472B;
  --accent-rgb:217,71,43;
  --accent-deep:#A8341F;
  --accent2:#3E6FB0;
  --accent2-rgb:62,111,176;
  --paper-glow:rgba(255,255,255,.04);
  --line-soft:rgba(255,255,255,.1);
  --good:#4FAE6B;
  --good-rgb:79,174,107;
  --bad:#E24B3C;
  --bad-rgb:226,75,60;
  --live:#E2392B;
  --live-rgb:226,57,43;
  --radius:10px;
  --radius-lg:16px;
  --ease:cubic-bezier(.2,.65,.2,1);
  --ease-spring:cubic-bezier(.3,1.4,.4,1);
  --f-display:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Work Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--ink);font:400 15.5px/1.48 var(--f-body);
  background-color:var(--paper);font-variant-numeric:tabular-nums;
  transition:background-color .3s var(--ease);
  /* Grain de papier façon trame halftone : la base de l'identité visuelle,
     posée sur TOUTE l'appli (pas une texture par écran). Un simple dégradé
     radial répété, assez discret pour ne jamais gêner la lecture. */
  background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.4px);
  background-size:9px 9px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* Le logo peint en aplat avec la couleur d'accent du moment. C'est le VRAI
   logo (PNG détouré, voir LOGO) utilisé comme masque CSS : il se recolore
   donc automatiquement avec --accent, y compris en mode Halloween — jamais
   remplacé par un autre dessin. */
.mark{flex:none;display:inline-block;background-color:var(--accent);
  -webkit-mask-image:var(--logo);mask-image:var(--logo);
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;
  transition:background-color .3s var(--ease)}
.mark.light{background-color:#F8EFE2}
/* Habillage Halloween du VRAI logo (pas de substitution) : une lueur de
   citrouille/bougie posée en filtre sur le masque, qui vacille de façon
   irrégulière façon flamme de bougie plutôt qu'un pulse régulier. */
.spooky .mark{filter:drop-shadow(0 0 5px rgba(224,122,46,.65)) drop-shadow(0 0 11px rgba(140,95,201,.32))}
@media (prefers-reduced-motion:no-preference){
  .spooky .mark{animation:markflicker 3.6s ease-in-out infinite}
}
@keyframes markflicker{
  0%,100%{filter:drop-shadow(0 0 5px rgba(224,122,46,.65)) drop-shadow(0 0 11px rgba(140,95,201,.3))}
  18%{filter:drop-shadow(0 0 7px rgba(224,122,46,.85)) drop-shadow(0 0 13px rgba(140,95,201,.4))}
  41%{filter:drop-shadow(0 0 4px rgba(224,122,46,.5)) drop-shadow(0 0 8px rgba(140,95,201,.24))}
  63%{filter:drop-shadow(0 0 6.5px rgba(224,122,46,.78)) drop-shadow(0 0 10px rgba(140,95,201,.34))}
  82%{filter:drop-shadow(0 0 4.5px rgba(224,122,46,.56)) drop-shadow(0 0 9px rgba(140,95,201,.28))}
}

/* -----------------------------------------------------------------------
   Ossature : rail d'icônes fixe sur mobile (type appli de scores native),
   rail élargi avec libellés sur grand écran. Le contenu défile derrière
   une barre supérieure collante (ticker live + identité), comme les apps
   de scores qui gardent toujours un direct visible en haut de l'écran.
   ----------------------------------------------------------------------- */
.shell{max-width:1180px;margin:0 auto;min-height:100vh;position:relative}
.content{padding:0 14px 96px;min-width:0}
@media (min-width:860px){
  .shell{display:grid;grid-template-columns:76px minmax(0,1fr)}
  .content{padding:0 36px 48px;border-left:1px solid var(--line-soft)}
}
@media (min-width:1180px){
  .shell{grid-template-columns:230px minmax(0,1fr)}
}

@media (prefers-reduced-motion:no-preference){
  button,.scorebtn,.btn,input,select,.pillbtn,.linkbtn,.lbrow,.trow{transition:background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease),transform .15s var(--ease)}
}
.scorebtn:not(:disabled):active,.pillbtn:active{transform:scale(.94)}

/* --- Rail de navigation : icônes d'abord, texte en complément. --- */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line-soft);
  padding:4px 4px calc(4px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:20}
.navbrand,.navfoot{display:none}
.navitem{flex:1;max-width:90px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px 6px;color:var(--ink-soft);position:relative}
.navitem svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.navitem span{font:600 10.5px/1 var(--f-body);letter-spacing:.01em}
.navitem[aria-current="page"]{color:var(--accent)}
.navitem[aria-current="page"] svg{stroke-width:2.1}
.navdot{position:absolute;top:2px;right:16px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--live);
  color:#fff;font:700 10px/15px var(--f-body);text-align:center}
@media (min-width:860px){
  .nav{position:sticky;top:0;left:auto;right:auto;bottom:auto;height:100vh;flex-direction:column;justify-content:flex-start;
    align-items:stretch;width:76px;padding:20px 8px;border-top:0;border-right:1px solid var(--line-soft);background:var(--card);gap:4px}
  .navbrand{display:flex;justify-content:center;margin:0 0 22px}
  .navitem{flex:none;max-width:none;padding:11px 4px;border-radius:12px}
  .navitem[aria-current="page"]{background:rgba(var(--accent-rgb),.14)}
  .navdot{top:4px;right:14px}
  .navfoot{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line-soft)}
  .navfoot .linkbtn{font-size:10px;padding:2px}
  .navfoot .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;
    justify-content:center;font:700 13px/1 var(--f-display)}
}
@media (min-width:1180px){
  .nav{width:230px;align-items:stretch;padding:24px 14px}
  .navbrand{justify-content:flex-start;gap:10px;font:700 19px/1 var(--f-display);padding:0 8px}
  .navitem{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 12px}
  .navitem span{font-size:14.5px}
  .navdot{position:static;margin-left:auto}
  .navfoot{flex-direction:row;justify-content:space-between;padding:14px 10px 0}
}

/* --- Barre supérieure collante : identité + ticker de matchs en direct.
   Toujours visible en haut de l'onglet Matchs, comme le bandeau de scores
   que gardent SofaScore/ESPN même quand on scrolle la liste. --- */
.topbar{position:sticky;top:0;z-index:10;background:var(--paper);padding-top:env(safe-area-inset-top)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;background:linear-gradient(var(--paper),transparent);pointer-events:none}
.topbar-row{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px}
.brand{font:700 20px/1 var(--f-display);display:flex;align-items:center;gap:8px;color:var(--ink)}
.me{display:flex;align-items:center;gap:9px;color:var(--ink-soft);font-size:12.5px}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--accent);font-size:inherit;font-weight:600}
.linkbtn:hover{color:var(--accent-deep)}
.linkbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;display:block}
.themetoggle{display:inline-flex;align-items:center;padding:4px}
@media (min-width:860px){ .topbar-row{display:none} }

.ticker{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 2px 10px;margin:0}
.ticker::-webkit-scrollbar{display:none}
.tickeritem{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid rgba(var(--live-rgb),.35);
  border-radius:999px;padding:6px 13px 6px 10px;font:600 12.5px/1 var(--f-body);white-space:nowrap}
.tickerdot{width:7px;height:7px;border-radius:50%;background:var(--live);flex:none}
@media (prefers-reduced-motion:no-preference){ .tickerdot{animation:blink 1.3s step-end infinite} }
.tickerscore{font:700 13.5px/1 var(--f-mono);color:var(--ink)}
.tickervs{color:var(--ink-soft);font-weight:500}

/* --- Bandeau de stats personnelles : deux tuiles sobres, pas un bloc de
   couleur plein écran. L'info passe par le chiffre, pas par le fond. --- */
.statrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:2px 0 18px}
.stattile{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius-lg);padding:13px 15px}
.stattile b{display:block;font:700 26px/1 var(--f-display);color:var(--ink)}
.stattile b.accent{color:var(--accent)}
.stattile span{font-size:11.5px;color:var(--ink-soft)}

/* --- Filtres : pastilles pleines plutôt que des onglets soulignés. --- */
.pillrow{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.pillbtn{background:var(--card);border:1px solid var(--line-soft);border-radius:999px;padding:7px 14px;
  font:600 13px/1 var(--f-body);color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
.pillbtn:hover{color:var(--ink);border-color:var(--ink-soft)}
.pillbtn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.pillbtn .cnt{font-size:11.5px;opacity:.75}

.journeerow{display:flex;gap:6px;margin:0 0 16px;padding:1px 1px 7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.journeerow::-webkit-scrollbar{height:4px}
.jchip{flex:0 0 auto;padding:6px 13px;border-radius:999px;font:600 13px/1 var(--f-body);color:var(--ink-soft);background:var(--card);border:1px solid var(--line-soft);white-space:nowrap}
.jchip[aria-pressed="true"]{color:#fff;background:var(--accent);border-color:var(--accent)}

/* -----------------------------------------------------------------------
   Liste de matchs : groupée par compétition (barre de couleur comme un
   bandeau de championnat Flashscore), puis par jour. Chaque match est une
   RANGÉE dense, pas une carte encadrée — on peut en voir beaucoup d'un
   coup d'œil, comme une vraie app de scores plutôt qu'un flux de cartes.
   ----------------------------------------------------------------------- */
.complabel{display:flex;align-items:center;gap:9px;margin:22px 0 2px;padding:9px 12px;border-radius:9px 9px 0 0;
  background-color:rgba(var(--accent-rgb),.14);color:var(--ink);
  background-image:radial-gradient(rgba(var(--accent-rgb),.55) 1.1px, transparent 1.7px);background-size:8px 8px}
.complabel:first-of-type{margin-top:4px}
.compbar{width:4px;align-self:stretch;border-radius:2px;background:var(--accent);flex:none}
.complabel b{font:600 13.5px/1.2 var(--f-display)}
.complabel small{display:block;color:var(--ink-soft);font-size:11px;margin-top:1px}
.day{font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--ink-soft);
  padding:9px 12px 7px;background:var(--card-top)}
.complist{background:var(--card-top);border-radius:0 0 12px 12px;overflow:hidden;margin-bottom:4px;border:1px solid var(--line-soft);border-top:0}

.mrow{border-top:1px solid var(--line-soft);position:relative}
.mrow:first-of-type{border-top:0}
.mrow.islive{box-shadow:inset 3px 0 0 var(--live)}
.mrowhead{display:flex;align-items:stretch;gap:0;width:100%;background:none;border:0;padding:0;text-align:left;color:inherit}
.mtime{flex:0 0 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:11px 4px;
  font:600 12px/1.15 var(--f-body);color:var(--ink-soft)}
.mtime .liv{color:var(--live);font-weight:700;font-size:11px;letter-spacing:.03em;display:flex;align-items:center;gap:4px}
.mtime .livedotsm{width:5px;height:5px;border-radius:50%;background:var(--live)}
@media (prefers-reduced-motion:no-preference){ .mtime .livedotsm{animation:blink 1.3s step-end infinite} }
.msides{flex:1;min-width:0;padding:9px 6px;display:flex;flex-direction:column;gap:5px}
.mside{display:flex;align-items:center;gap:7px;min-width:0}
.mside.lose{opacity:.52}
.mname{flex:1;min-width:0;font:600 14.5px/1.25 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px;color:var(--ink)}
.flag{width:1.1em;height:.85em;flex:none;border-radius:2px;box-shadow:0 0 0 1px var(--line-soft)}
.mrk{font:500 10.5px/1 var(--f-body);color:var(--ink-soft);flex:none}
.mrk .seed{color:var(--accent);font-weight:700}
.msc{flex:0 0 26px;text-align:right;font:700 16px/1 var(--f-mono);color:var(--ink-soft)}
.msc.win{color:var(--ink)}
.mpredpill{flex:0 0 auto;font:700 11.5px/1 var(--f-mono);color:var(--ink-soft);background:var(--card);border:1px solid var(--line-soft);
  border-radius:6px;padding:4px 8px;min-width:30px;text-align:center}
.mright{flex:0 0 72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 10px 6px 2px}
.statuspill{font:700 9.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);
  background:var(--paper-deep);border-radius:5px;padding:3px 6px}
.statuspill.live{color:#fff;background:var(--live)}
@media (prefers-reduced-motion:no-preference){ .statuspill.live{animation:blink 1.4s step-end infinite} }
.chevron{color:var(--ink-soft);opacity:.6}
.chevron svg{width:14px;height:14px;transition:transform .2s var(--ease)}
.mrow.open .chevron svg{transform:rotate(180deg)}

/* --- Panneau de pronostic : s'ouvre sous la rangée quand on la touche.
   Sélecteur de score façon grille de pick'em (type DraftKings) : une
   rangée de pastilles par camp, celle choisie se remplit en couleur. --- */
.predpanel{padding:4px 12px 14px;background:var(--card);border-top:1px dashed var(--line-soft)}
.predpanel.locked{padding-top:10px}
.pickgrid{display:flex;flex-direction:column;gap:7px;margin:8px 0 2px}
.pickside{display:flex;align-items:center;gap:10px}
.pickside .pslabel{flex:0 0 108px;font:600 12.5px/1.2 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.scores{display:flex;gap:5px;flex:1}
.scorebtn{flex:1;max-width:46px;height:38px;background:var(--paper-deep);border:1px solid var(--line-soft);border-radius:8px;
  font:700 14.5px/1 var(--f-mono);color:var(--ink)}
.scorebtn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.scorebtn:not(:disabled):hover{border-color:var(--accent)}
.scorebtn:disabled{opacity:.4;cursor:not-allowed}
.scorebtn[aria-pressed="true"]:disabled{opacity:1}
.predstatus{font-size:12.5px;color:var(--ink-soft);margin:10px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.predstatus b{color:var(--ink);font-weight:700}

.oddsgauge{display:flex;align-items:center;gap:9px;margin-top:9px}
.oddsgauge .bar{flex:1;height:5px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.oddsgauge .bar i{display:block;height:100%;width:var(--w);background:var(--accent)}
@media (prefers-reduced-motion:no-preference){ .oddsgauge .bar i{animation:barfill .5s var(--ease)} }
.oddsgauge b{font:700 13px/1 var(--f-display);color:var(--accent);flex:none}

/* Pavé "tampon encreur" : met en avant les points gagnés sur un match
   terminé, chiffre en gros caractères mono, légèrement de travers comme un
   coup de tampon sur une feuille de match. */
.stamp{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:54px;height:54px;border-radius:10px;border:2px solid currentColor;transform:rotate(-4deg);
  background-image:radial-gradient(color-mix(in srgb, currentColor 55%, transparent) 1px, transparent 1.6px);background-size:6px 6px}
.stamp b{font:700 21px/1 var(--f-mono)}
.stamp span{font:600 9px/1 var(--f-body);text-transform:uppercase;letter-spacing:.05em;opacity:.85;margin-top:1px}
.stamp.p3{color:var(--accent);background-color:rgba(var(--accent-rgb),.12)}
.stamp.p1{color:var(--good);background-color:rgba(var(--good-rgb),.16)}
.stamp.p0{color:var(--ink-soft);background-color:var(--line-soft);border-style:dashed;transform:rotate(0)}
.stamp.big{width:66px;height:66px;flex:none}
.stamp.big b{font-size:25px}

/* --- "Mon compte" : jauges, ladder par circuit et graphique en bâtons
   (mêmes codes visuels que le reste de l'appli : pavés .stattile, tampon
   .stamp, pastilles rondes façon score — pas un nouveau système). --- */
.gaugetile{position:relative;padding-bottom:16px}
.minibar{margin-top:8px;height:5px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.minibar i{display:block;height:100%;background:var(--good)}
.minibar.accent i{background:var(--accent)}
.streakrow{display:flex;flex-wrap:wrap;gap:6px}
.streaktile{width:26px;height:26px;border-radius:7px;border:1.5px dashed var(--line-soft);display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--line-soft);font-style:normal}
.streaktile.hit{border-style:solid;border-color:var(--good);background:rgba(var(--good-rgb),.16);color:var(--good)}

/* --- Bonus de série : pastille flamme (verte -> orange -> violette ->
   bleue selon le palier), utilisée dans "Mon compte" et sur les cartes de
   match. Couleurs fixes, volontairement indépendantes du THEME du moment
   (c'est une mécanique de jeu globale, pas une couleur de tournoi). --- */
.streakbadge{display:inline-flex;align-items:center;gap:5px;font:700 12.5px/1 var(--f-mono);
  padding:4px 9px 4px 7px;border-radius:999px;background:var(--card);border:1px solid var(--line-soft);color:var(--ink)}
.streakbadge.t1{border-color:#3DBB6B;color:#3DBB6B}
.streakbadge.t2{border-color:#E6862B;color:#E6862B}
.streakbadge.t3{border-color:#9A5CE0;color:#9A5CE0}
.streakbadge.t4{border-color:#3E9AE8;color:#3E9AE8}
.streakbadge small{font:600 10px/1 var(--f-body);opacity:.85;margin-left:1px}
.flameicon{flex:none;display:block}
@media (prefers-reduced-motion:no-preference){ .flameflick{animation:flameflick 1.7s ease-in-out infinite} }

/* --- Balles (mise stratégique par tournoi) : un petit stepper compact sous
   le panneau de pronostic, dans le même esprit que .oddsgauge -- pas un
   second widget encadré, juste une ligne de plus. --- */
.ballesrow{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.balleslabel{display:inline-flex;align-items:center;gap:5px;font:600 12px/1 var(--f-body);color:var(--ink-soft)}
.ballesstepper{display:inline-flex;align-items:center;gap:7px;background:var(--paper-deep);border:1px solid var(--line-soft);
  border-radius:999px;padding:3px 10px}
.ballesstepper b{font:700 13.5px/1 var(--f-mono);color:var(--ink);min-width:11px;text-align:center}
.ballesbtn{flex:none;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;border:0;
  font:700 14px/1 var(--f-mono);display:flex;align-items:center;justify-content:center;padding:0}

/* -----------------------------------------------------------------------
   Bilan de tournoi ("récap") : seul écran à porter la touche Retro VHS
   évoquée pour l'identité visuelle — en plus de la trame halftone déjà
   posée partout (bandeau, podium), effet "re-diffusion" d'un moment déjà
   joué : scanlines, aberration chromatique sur le titre, mentions REC /
   REPLAY façon caméscope. Jamais ailleurs dans l'appli : utilisé une seule
   fois, sur un seul écran, il reste un moment plutôt qu'une fatigue visuelle.
   ----------------------------------------------------------------------- */
.recapmodal{overflow:hidden}
.recapbanner{position:relative;overflow:hidden;padding:22px 20px 20px;border-radius:16px 16px 0 0;color:#fff;
  background-color:var(--accent);
  background-image:radial-gradient(rgba(255,255,255,.16) 1.1px, transparent 1.7px);background-size:9px 9px}
.recapbanner::before{content:"● REC";position:absolute;top:12px;left:20px;font:700 10px/1 var(--f-mono);
  letter-spacing:.08em;color:rgba(255,255,255,.75)}
@media (prefers-reduced-motion:no-preference){ .recapbanner::before{animation:blink 1.6s step-end infinite} }
.recapbanner::after{content:"REPLAY";position:absolute;bottom:10px;right:20px;font:700 10px/1 var(--f-mono);
  letter-spacing:.1em;color:rgba(255,255,255,.55)}
.recapkicker{font:700 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;opacity:.8;margin:14px 0 6px}
.recapname{font:700 24px/1.15 var(--f-display);margin:0;
  text-shadow:1.5px 0 rgba(255,60,80,.55),-1.5px 0 rgba(60,200,255,.5)}
.recapsub{font-size:13px;opacity:.85;margin-top:5px}
.recapbody{position:relative}
.recapbody::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(to bottom, rgba(255,255,255,.03) 0 1px, transparent 1px 3px)}
.recap-step{animation:recapIn .5s var(--ease-spring) both}
@keyframes recapIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.recap-podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-top:4px}
.podiumcol{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;max-width:108px;min-width:0}
.podiumname{font:600 12.5px/1.2 var(--f-display);color:var(--ink);text-align:center;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;max-width:100%}

  padding-top:8px;background-color:var(--pcol);
  background-image:radial-gradient(rgba(0,0,0,.18) 1px, transparent 1.6px);background-size:7px 7px}
.podiumbar span{font:700 15px/1 var(--f-display);color:rgba(0,0,0,.55)}

@keyframes rowIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  *{scroll-behavior:auto!important;animation:none!important;transition:none!important}

}

/* =============================================================================
   Mode Halloween — habillage décoratif, posé sur la classe .spooky (html).
   Palette : pumpkin #E07A2E (accent principal), pumpkin-deep #9C4A14,
   witch-violet #8C5FC9 (accent secondaire), grave-plum #1B1322 (fond "nuit",
   jamais du noir pur), bone-ink #F1E4C8 (encre pâle sur le fond sombre),
   ecto #8FB24A (vert maladif, utilisé en toutes petites touches seulement :
   lueur d'œil, fil de toile — jamais en fond).
   Principe : ce bloc ne touche à AUCUNE couleur fonctionnelle par tournoi
   (THEME.WTT_*/PRO_A, qui restent les vraies couleurs d'affiche quel que
   soit le mode) ni au système de paliers de flamme (FLAME_COLORS) : il ajoute
   une texture "carnet de bord hanté, tenu à la bougie par des copains"
   au-dessus de ces couleurs — toile dans un coin de pastille de score,
   tampon de résultat façon cachet de cire ailé, classement façon lattes de
   bois d'un vieux banc de club. Rien de gore, pensé pour une bande de potes.
   ========================================================================== */
.spooky body{position:relative}
.spooky body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 85% -6%, rgba(241,228,200,.10), transparent 60%),
    radial-gradient(ellipse 70% 50% at 8% 108%, rgba(224,122,46,.14), transparent 62%),
    radial-gradient(ellipse 90% 60% at 50% 0%, rgba(140,95,201,.10), transparent 65%);
}
/* Pastille de score (flip-tile) : fil de toile discret au coin, comme si
   une araignée avait élu domicile dans la grille de pronostic. */
.spooky .scorebtn{position:relative;overflow:hidden}
.spooky .scorebtn::before{
  content:"";position:absolute;top:-1px;left:-1px;width:13px;height:13px;pointer-events:none;
  opacity:.42;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g fill='none' stroke='%23B9A68A' stroke-width='1.1'><path d='M0 0 L24 24M0 8 L10 10M0 16 L13 15M8 0 L10 10M16 0 L15 13'/><path d='M0 0 Q7 7 2 13M0 0 Q9 6 10 16M0 0 Q4 10 16 10' /></g></svg>");
  background-repeat:no-repeat;background-size:13px 13px;
}
.spooky .scorebtn[aria-pressed="true"]::before{opacity:.22;filter:brightness(2)}
/* Tampon encreur (.stamp) : cachet ailé façon chauve-souris plutôt qu'un
   simple carré tamponné — coins très arrondis + petite silhouette d'aile
   en filigrane, sans changer sa taille ni ses couleurs fonctionnelles
   (--accent/--good restent les vraies couleurs de point gagné). */
.spooky .stamp{position:relative;border-radius:50% 10px 50% 10px;transform:rotate(-7deg)}
.spooky .stamp.p0{border-radius:10px;transform:rotate(0)}
.spooky .stamp::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;border-radius:inherit;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M32 30c-6-10-20-12-26-6 7 1 13 5 16 11-6 1-12 5-13 11 8-1 16-5 23-10 7 5 15 9 23 10-1-6-7-10-13-11 3-6 9-10 16-11-6-6-20-4-26 6Z' fill='currentColor'/></svg>");
  background-repeat:no-repeat;background-size:60% 60%;background-position:center;
}
/* Classement "échelle" : lattes façon vieux banc de club plutôt que de
   simples lignes — bordure en relief (groove), sans toucher aux couleurs. */
.spooky .standings tbody tr{border-top-style:groove;border-top-width:2px}
.spooky .standings{box-shadow:0 1px 0 rgba(0,0,0,.3) inset, 0 -1px 0 rgba(255,255,255,.04) inset}
/* Pastille "pronos à faire" : lueur de citrouille/bougie qui vacille au lieu
   du rouge "live" neutre — purement décoratif, la logique ne change pas. */
.spooky .navdot{background:#E07A2E;box-shadow:0 0 7px rgba(224,122,46,.75)}
@media (prefers-reduced-motion:no-preference){ .spooky .navdot{animation:candleflicker 2.4s ease-in-out infinite} }
@keyframes candleflicker{0%,100%{opacity:1;box-shadow:0 0 7px rgba(224,122,46,.75)}45%{opacity:.82;box-shadow:0 0 4px rgba(224,122,46,.5)}70%{opacity:1;box-shadow:0 0 10px rgba(224,122,46,.9)}}

/* --- Ambiance "phantomatique" : fantômes qui dérivent très discrètement
   derrière le contenu, et une brume basse qui ondule lentement. Caché hors
   mode Halloween ; purement décoratif (pointer-events:none, z-index bas,
   sous .shell), et figé (pas d'animation continue) si la personne a demandé
   moins de mouvement. --- */
#spookyfx{display:none}
.spooky #spookyfx{display:block;position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.shell{position:relative;z-index:2}
.ghost{position:absolute;width:86px;height:104px;opacity:.09;
  background-repeat:no-repeat;background-size:contain;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 120'><path d='M50 4C26 4 10 24 10 52v50c4-8 10-8 14 0 4-8 10-8 14 0 4-8 10-8 14 0 4-8 10-8 14 0 4-8 10-8 14 0V52C90 24 74 4 50 4Z' fill='%23F1E4C8'/><circle cx='38' cy='50' r='5' fill='%231B1322'/><circle cx='62' cy='50' r='5' fill='%231B1322'/></svg>")}
.ghost.g1{top:8%;left:-14%}
.ghost.g2{top:46%;left:-18%;width:64px;height:78px;opacity:.07}
.ghost.g3{top:74%;left:-10%;width:104px;height:126px;opacity:.06}
@media (prefers-reduced-motion:no-preference){
  .ghost.g1{animation:ghostdrift1 48s linear infinite}
  .ghost.g2{animation:ghostdrift2 63s linear infinite}
  .ghost.g3{animation:ghostdrift3 71s linear infinite}
}
@keyframes ghostdrift1{
  0%{transform:translate(0,0)}25%{transform:translate(40vw,-10px)}50%{transform:translate(85vw,6px)}75%{transform:translate(105vw,-4px)}100%{transform:translate(130vw,0)}

// exactement comme avant"). Seule la clé "ALL" (fond neutre hors contexte
// de match) suit la préférence sombre/clair de la personne.
function resolveThemeKey(key) {
  if (key !== 'ALL') return key;
  if (S.themeMode === 'dark') return 'ALL_DARK';
  if (S.themeMode === 'halloween') return 'ALL_HALLOWEEN';
  return key;
}

};
// Thème d'un match précis (pour colorer sa carte selon SON tournoi).
function themeKeyFor(m) {
  if (!m) return 'ALL';
  if (m.circuit === 'PRO_A') return 'PRO_A';
  if (m.circuit === 'WTT') return TIER_KEY[m.tier] || 'WTT_DEFAULT';
  return 'ALL';
}

function currentThemeKey() {

  if (S.circuit === 'PRO_A') return 'PRO_A';
  if (S.circuit !== 'WTT') return 'ALL';
  const wtt = S.matches.filter(m => m.circuit === 'WTT');
  if (!wtt.length) return 'WTT_DEFAULT';
  const now = Date.now();
  const live = wtt.filter(m => m.status === 'live');
  // Plusieurs matchs peuvent être "en direct" en même temps (plusieurs tables,
  // ou un match resté coincé en direct faute de résultat synchronisé) : on
  // prend celui dont l'heure de début est la plus proche de maintenant, qui
  // correspond le mieux au tournoi réellement en cours aujourd'hui.
  const next = wtt.filter(m => m.status === 'scheduled').sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at))[0];
  const pick = live.length
    ? live.reduce((a, b) => Math.abs(new Date(b.starts_at) - now) < Math.abs(new Date(a.starts_at) - now) ? b : a)

// s'ajouter par-dessus sans jamais être multiplié -- exactement comme avant

// déjà chargés : aucune requête réseau supplémentaire.
function ballesSpentInScope(m, excludeMatchId) {
  const scope = ballesScopeKey(m);
  let spent = 0;
  for (const midStr in S.myPreds) {
    const mid = +midStr;
    if (excludeMatchId != null && mid === excludeMatchId) continue;
    const p = S.myPreds[mid];
    if (!p || !p.balles_staked) continue;
    const mm = S.matches.find(x => x.id === mid);
    if (!mm || mm.circuit !== m.circuit || ballesScopeKey(mm) !== scope) continue;
    spent += p.balles_staked;
  }
  return spent;
}
// Balles encore disponibles pour ce tournoi/journée, en excluant la mise déjà
// posée sur `m` elle-même (donc : "combien puis-je au total mettre sur ce
// match" = ballesRemaining(m, m.id), mise actuelle de ce match comprise).
function ballesRemaining(m, excludeMatchId) {
  return Math.max(0, BALLES_STOCK - ballesSpentInScope(m, excludeMatchId));
}
// Petite icône "balle" en SVG inline (même esprit que flameSvg/MARK : pas
// d'image, juste un trait fin qui prend la couleur courante).
function ballIcon(size) {
  size = size || 13;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M8.2 6.6q2.4 5.4 0 10.8" stroke-width="1.3" opacity=".6"/></svg>`;
}
// Budget de balles d'un groupe de matchs (ex : l'en-tête d'un tournoi dans
// matchesView) : n'affiche un total que si tous les matchs du groupe
// partagent bien la même scope tournoi/journée (sinon le nombre serait
// trompeur -- ça n'arrive qu'en filtre "Tous" si plusieurs journées Pro A
// sont affichées ensemble, jamais dans les onglets WTT/Pro A filtrés).
function groupBallesBudgetHtml(matches) {
  if (!matches.length) return '';
  const scopes = new Set(matches.map(ballesScopeKey));
  if (scopes.size !== 1) return '';
  const rem = ballesRemaining(matches[0], null);
  return `<span class="ballesbudget" title="Balles encore disponibles pour ce tournoi">${ballIcon(12)}${rem}/${BALLES_STOCK}</span>`;
}
// Mini-stepper de mise, affiché sous le panneau de pronostic d'un match pas
// encore jugé : visible seulement une fois un prono posé (on mise SUR un
// pronostic existant, pas dans le vide), boutons désactivés une fois le match
// verrouillé (même convention que les pastilles de score, voir chips()).
function ballesStepperHtml(m) {
  const mine = S.myPreds[m.id];
  if (!mine) return '';
  const locked = isLocked(m);
  const staked = mine.balles_staked || 0;
  const cap = Math.min(BALLES_MAX_PER_MATCH, ballesRemaining(m, m.id));
  const pct = Math.round((ballesMult(staked) - 1) * 100);
  return `<div class="ballesrow">
    <span class="balleslabel">${ballIcon(13)}Balles misées</span>
    <div class="ballesstepper">
      <button type="button" class="ballesbtn" data-act="balles" data-id="${m.id}" data-v="${Math.max(0, staked - 1)}" aria-label="Retirer une balle" ${locked || staked <= 0 ? 'disabled' : ''}>−</button>
      <b>${staked}</b>
      <button type="button" class="ballesbtn" data-act="balles" data-id="${m.id}" data-v="${staked + 1}" aria-label="Ajouter une balle" ${locked || staked >= cap ? 'disabled' : ''}>+</button>
    </div>
    <small class="ballespct">${staked > 0 ? `×${ballesMult(staked)} si gagnant (+${pct}%)` : `jusqu'à ${cap} ici`}</small>
  </div>`;
}
// À partir d'un historique déjà trié chronologiquement (du plus ancien au
// plus récent), calcule pour chaque entrée la série EN COURS avant et
// après ce match. "bonVainqueur" = la victoire était la bonne (score exact
// ou pas), seul critère qui fait avancer la série (voir énoncé : "un
// pronostic victorieux = qui a rapporté au moins un point"). m peut être
// soit l'objet match directement, soit h.matches (forme renvoyée par
// loadAccount()).
function computeStreakSeries(sortedFinished) {
  let streak = 0;
  return sortedFinished.map(h => {
    const m = h.matches || h;
    const bonVainqueur = Math.sign(h.pred_a - h.pred_b) === Math.sign(m.score_a - m.score_b);
    const streakBefore = streak;
    streak = bonVainqueur ? streak + 1 : 0;
    return { ...h, streakBefore, streakAfter: streak, bonVainqueur };
  });
}
// Série actuelle de la personne connectée + table match_id -> série AVANT
// ce match, à partir de S.myHistory (chargé par loadAccount(), aussi
// déclenché en tâche de fond dès la connexion — voir loadAll()). Renvoie
// des valeurs neutres tant que l'historique n'est pas encore chargé : la
// vue SQL reste de toute façon la seule source de vérité pour les points
// réellement enregistrés.
function myStreakInfo() {
  if (!S.myHistory) return { before: new Map(), now: 0 };
  const sorted = S.myHistory.filter(h => h.matches && h.matches.status === 'finished')
    .sort((a, b) => new Date(a.matches.starts_at) - new Date(b.matches.starts_at));
  const withStreak = computeStreakSeries(sorted);
  const before = new Map(withStreak.map(h => [h.match_id, h.streakBefore]));
  const now = withStreak.length ? withStreak[withStreak.length - 1].streakAfter : 0;
  return { before, now };
}
function pointsDetail(m, p, streakBefore) {
  if (m.status !== 'finished' || !p) return null;
  const exact = p.pred_a === m.score_a && p.pred_b === m.score_b;
  const bonVainqueur = Math.sign(p.pred_a - p.pred_b) === Math.sign(m.score_a - m.score_b);
  const base = exact ? 3 : (bonVainqueur ? 1 : 0);
  const mult = bonVainqueur ? streakMult(streakBefore) : 1;
  const withStreak = Math.round(base * mult);
  const streakBonus = withStreak - base;
  // Multiplicateur balles : se compose avec le bonus de série en multipliant
  // les DEUX facteurs sur le barème de base avant un seul arrondi final (pas
  // en enchaînant deux arrondis successifs) -- voir le commentaire au-dessus
  // de BALLES_STOCK. staked = 0/undefined (tout pronostic jugé avant cet
  // ajout) -> ballesMult = 1 -> withBalles === withStreak : comportement
  // strictement inchangé, donc rétro-compatible.
  const staked = p.balles_staked || 0;
  const ballesMultiplier = bonVainqueur ? ballesMult(staked) : 1;
  const withBalles = Math.round(base * mult * ballesMultiplier);
  const ballesBonus = withBalles - withStreak;
  const bonus = outsiderBonus(m, bonVainqueur);
  return { total: withBalles + bonus, base, bonus, streakBonus, ballesBonus, balles: staked, exact, streakBefore: streakBefore || 0 };
}
function points(m, p, streakBefore) {
  const d = pointsDetail(m, p, streakBefore);
  return d ? d.total : null;
}
// Historique de MES pronostics déjà jugés, trié chronologiquement, avec pour
// chacun la série en cours avant/après (streakBefore/streakAfter) et le
// détail des points (pt). Base commune à accountView() ET aux badges
// (computeBadges), pour ne jamais faire dériver les deux calculs. Renvoie
// null tant que S.myHistory n'est pas encore chargé (voir loadAccount()).
function myJudgedHistory() {
  if (S.myHistory === null) return null;
  const sortedChrono = S.myHistory
    .filter(h => h.matches && h.matches.status === 'finished')
    .sort((a, b) => new Date(a.matches.starts_at) - new Date(b.matches.starts_at));
  return computeStreakSeries(sortedChrono).map(h => ({ ...h, pt: pointsDetail(h.matches, h, h.streakBefore) }));
}

/* ---------- Chargement des données ---------- */
async function reloadMatches() {
  const since = new Date(Date.now() - 90 * 864e5).toISOString();
  const r = await sb.from('matches').select('*').gte('starts_at', since).order('starts_at', { ascending: true }).limit(500);
  if (r.error) throw r.error;
  S.matches = r.data || [];
}
async function reloadCompetitors() {
  const r = await sb.from('competitors').select('*').limit(2000);
  if (r.error) throw r.error;
  S.competitors = {};
  (r.data || []).forEach(c => { S.competitors[c.id] = c; });
}
async function loadAll() {
  const uid = S.session.user.id;
  const [p, preds, adm] = await Promise.all([
    sb.from('profiles').select('pseudo').eq('id', uid).maybeSingle(),
    sb.from('predictions').select('*').eq('user_id', uid).limit(3000),
    sb.rpc('is_admin')
  ]);
  await Promise.all([reloadMatches(), reloadCompetitors()]);
  S.pseudo = (p.data && p.data.pseudo) || '';
  S.myPreds = {};
  (preds.data || []).forEach(x => { S.myPreds[x.match_id] = x; });
  S.isAdmin = adm.data === true;
  loadBoard().then(render); // chargé à part : n'empêche pas la connexion s'il échoue
  loadAccount().then(render); // idem : pour la pastille de série sur les cartes de match, sans bloquer la connexion
}
async function loadBoard() {
  const q = S.boardScope === 'ALL'
    ? sb.from('leaderboard').select('*')
    : sb.from('leaderboard_by_circuit').select('*').eq('circuit', S.boardScope);
  const r = await q.order('total_points', { ascending: false }).order('exact_scores', { ascending: false });
  if (r.error) { toast(friendlyError(r.error), true); S.board = []; return; }
  S.board = r.data || [];
}
// Historique complet des pronostics du compte (pas limité aux 90 derniers
// jours comme S.matches), avec le match associé : sert à calculer les
// statistiques personnelles de l'onglet "Mon compte" sur toute la durée du
// jeu, pas seulement sur les matchs encore affichés ailleurs dans l'appli.
async function loadAccount() {
  try {
    const uid = S.session.user.id;
    // circuitBoard (tous circuits, tout le monde) et allJudgedPreds (les
    // pronostics de TOUT LE MONDE sur les matchs déjà terminés) ne servent
    // qu'aux badges (comparaison "Expert WTT/Pro A" et duel "Le Rival") :
    // pas besoin de requête supplémentaire côté sécurité, la policy RLS
    // "voir pronostics" autorise déjà la lecture des pronostics d'autrui une
    // fois le match terminé, et leaderboard_by_circuit est déjà une vue
    // publique existante (utilisée par l'onglet Classements).
    const [h, b, cb, ap] = await Promise.all([
      sb.from('predictions')
        .select('pred_a,pred_b,match_id,created_at,balles_staked,matches(circuit,status,score_a,score_b,seed_a,seed_b,starts_at,competition,round,side_a,side_b,wins_needed)')
        .eq('user_id', uid).limit(5000),
      sb.from('leaderboard').select('*').order('total_points', { ascending: false }).order('exact_scores', { ascending: false }),
      sb.from('leaderboard_by_circuit').select('*'),
      // competition/round/tier ajoutés à ce select existant (et uniquement
      // à celui-ci) pour pouvoir regrouper ces pronostics de tout le monde
      // par tournoi WTT / journée Pro A dans le bilan animé — sans requête
      // supplémentaire, juste trois colonnes de plus sur une jointure déjà
      // là pour les badges.
      sb.from('predictions')
        .select('user_id,match_id,pred_a,pred_b,balles_staked,matches(circuit,status,score_a,score_b,seed_a,seed_b,starts_at,competition,round,tier)')
        .limit(20000),
    ]);
    if (h.error) throw h.error;
    if (b.error) throw b.error;
    S.myHistory = h.data || [];
    S.accountBoard = b.data || [];
    S.circuitBoard = cb.error ? [] : (cb.data || []);
    // Seuls les pronostics (de tout le monde) déjà jugés arrivent ici de
    // toute façon via la policy RLS ; le filtre n'est qu'une double sécurité.
    S.allJudgedPreds = (ap.error ? [] : (ap.data || [])).filter(r => r.matches && r.matches.status === 'finished');
    checkStreakMilestone();
    // "Trône de courte durée" (voir computeBadges) : le classement général
    // est calculé en direct, jamais stocké dans le temps — on se contente
    // donc de retenir, en local sur cet appareil, qu'on a déjà vu son propre
    // nom en tête au moins une fois. Un souvenir, pas une preuve officielle.
    try {
      if (S.accountBoard.length && S.accountBoard[0].user_id === uid) {
        localStorage.setItem('spin_was_first', '1');
      }
    } catch (e) { /* stockage indisponible : tant pis pour ce petit souvenir */ }
    checkNewBadges();
  } catch (e) {
    toast(friendlyError(e), true);
    S.myHistory = S.myHistory || [];
    S.accountBoard = S.accountBoard || [];
    S.circuitBoard = S.circuitBoard || [];
    S.allJudgedPreds = S.allJudgedPreds || [];
  }
}

/* ---------- Session ---------- */
async function handleSession(session) {
  if (!session) {
    S.session = null; S.pseudo = ''; S.isAdmin = false; S.matches = []; S.myPreds = {}; S.board = null;
    render(); return;
  }
  if (S.session && S.session.user.id === session.user.id) { S.session = session; return; }
  S.session = session;
  $app.innerHTML = '<div class="loading">Chargement…</div>';
  try { await loadAll(); S.bootError = ''; }
  catch (e) { S.bootError = friendlyError(e); }
  render();
}

/* ---------- Affichage ---------- */
function render() {
  // Habillage décoratif Halloween (classe .spooky) : indépendant de la clé
  // de thème résolue, pour que les touches décoratives (toile sur les
  // pastilles de score, cachet ailé, lattes du classement...) s'appliquent
  // partout, y compris sur une carte de match au thème WTT_*/PRO_A dont les
  // couleurs, elles, ne doivent jamais bouger.
  document.documentElement.classList.toggle('spooky', S.themeMode === 'halloween');
  if (!S.session) { applyThemeVars(document.documentElement.style, resolveThemeKey('ALL')); $app.innerHTML = authView(); return; }
  const themeKey = resolveThemeKey(currentThemeKey());
  document.documentElement.dataset.theme = themeKey;
  applyThemeVars(document.documentElement.style, themeKey);
  const themeColorMeta = document.querySelector && document.querySelector('meta[name="theme-color"]');
  if (themeColorMeta) themeColorMeta.setAttribute('content', THEME[themeKey].paper);
  const todo = S.matches.filter(m => !isLocked(m) && !S.myPreds[m.id]).length;
  const tabs = [['matches', 'Matchs'], ['board', 'Amis'], ['rankings', 'Classements'], ['account', 'Mon compte']];
  if (S.isAdmin) tabs.push(['admin', 'Admin']);
  const initial = (S.pseudo || '?').slice(0, 1).toUpperCase();
  $app.innerHTML = `
    <div class="shell">
      <nav class="nav" aria-label="Navigation principale">
        <div class="navbrand">${MARK(28)}</div>
        ${tabs.map(([k, label]) => `<button class="navitem" data-act="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${ICONS[k]}<span>${label}</span>${k === 'matches' && todo ? `<span class="navdot" title="Pronos à faire">${todo}</span>` : ''}</button>`).join('')}
        <div class="navfoot">${themeToggleBtn()}${soundToggleBtn()}<span class="avatar">${esc(initial)}</span><button class="linkbtn" data-act="logout" aria-label="Se déconnecter" title="Se déconnecter">${ICONS.logout}</button></div>
      </nav>
      <div class="content">
        <div class="topbar">
          <header class="topbar-row">
            <div class="brand">${MARK(24)}${esc(APP_NAME)}</div>
            <div class="me">${themeToggleBtn()}${soundToggleBtn()}<span>${esc(S.pseudo)}</span><button class="linkbtn" data-act="logout">Se déconnecter</button></div>
          </header>
          ${liveTicker()}
        </div>
        <main>${S.bootError ? `<p class="ferr" role="alert">Impossible de charger les données : ${esc(S.bootError)}</p>` : ''}${tabView()}</main>
      </div>
    </div>${S.openCompetitor ? competitorModal(S.openCompetitor) : ''}${S.openRecap ? recapModal(S.openRecap.key, S.openRecap.circuit) : ''}`;
  if (S.openRecap && !S.recapAnimPlayed) { S.recapAnimPlayed = true; mountRecapAnimation(); }
}
// Bouton clair/sombre/Halloween : préférence globale de la personne,
// indépendante du THEME par tournoi (voir resolveThemeKey). Un seul bouton
// qui fait défiler les 3 modes (clair → sombre → Halloween → clair), pour
// rester cohérent avec l'ancien bouton clair/sombre plutôt que d'ajouter un
// nouveau composant. Icônes inline avec taille fixée en attributs (pas de
// règle CSS .me svg existante à réutiliser).
function themeToggleBtn() {
  const mode = S.themeMode;
  const ICON = {
    light: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.5A9 9 0 1 1 11.5 3a7 7 0 0 0 9.5 9.5Z"/></svg>',
    dark: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>',
    // Petite citrouille sculptée, cohérente avec la marque Halloween (voir
    // MARK_HALLOWEEN) mais réduite à l'essentiel pour un bouton de 18px.
    halloween: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2.4"/><circle cx="12" cy="13" r="8"/><path d="M9 11l2 2-2 2M15 11l-2 2 2 2M9 17q3 2 6 0"/></svg>',
  };
  const LABEL = { light: 'Mode clair actif', dark: 'Mode sombre actif', halloween: 'Mode Halloween actif' };
  const NEXT = { light: 'sombre', dark: 'Halloween', halloween: 'clair' };
  return `<button class="linkbtn themetoggle" data-act="thememode" aria-label="${LABEL[mode]}, passer en mode ${NEXT[mode]}" title="Changer de thème (clair / sombre / Halloween)">${ICON[mode]}</button>`;
}
// Bouton son activé/coupé : même style/emplacement que le bouton de thème
// (bouton icône .linkbtn), préférence persistée en localStorage sur le même
// modèle que spin_theme_mode. Par défaut activé.
function soundToggleBtn() {
  const on = S.soundOn;
  const ICON_ON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M17.3 8.7a5 5 0 0 1 0 6.6M20 6a8.2 8.2 0 0 1 0 12"/></svg>';
  const ICON_OFF = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16.2 9.2l5 5.6M21.2 9.2l-5 5.6"/></svg>';

}
function keepRender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
// Change d'écran avec un fondu enchaîné natif quand le navigateur le sait faire
// (tout le monde sauf les très vieux Firefox/Safari) ; sinon, bascule sans effet.
function navigate(fn) {
  if (document.startViewTransition) document.startViewTransition(fn);
  else fn();
}
// Rangée de pastilles de filtre (style app de scores, pas des onglets soulignés).
const SEG_LABELS = { view: 'Période', circuit: 'Circuit', boardscope: 'Classement', rankview: 'Circuit' };
function segRow(items, cur, act) {
  return `<div class="pillrow" data-seg="${act}" role="group" aria-label="${SEG_LABELS[act] || ''}">
    ${items.map(([k, l]) => `<button class="pillbtn" data-act="${act}" data-v="${k}" aria-pressed="${cur === k}">${l}</button>`).join('')}</div>`;
}

function tabView() {
  if (S.tab === 'board') return boardView();
  if (S.tab === 'rankings') return rankingsView();
  if (S.tab === 'account') return accountView();
  if (S.tab === 'admin' && S.isAdmin) return adminView();
  return matchesView();
}

// Ticker horizontal des matchs en direct, collé en haut de l'écran : s'inspire
// du bandeau de scores toujours visible des apps type SofaScore/ESPN. Ne
// s'affiche que sur l'onglet Matchs et seulement s'il y a du direct.
function liveTicker() {
  if (S.tab !== 'matches' || !S.session) return '';
  const live = S.matches.filter(m => m.status === 'live');
  if (!live.length) return '';
  return `<div class="ticker" role="list" aria-label="Matchs en direct">
    ${live.map(m => `<span class="tickeritem" role="listitem"><span class="tickerdot" aria-hidden="true"></span>
      <span>${esc(m.side_a)}</span><span class="tickerscore">${m.score_a ?? 0}–${m.score_b ?? 0}</span><span>${esc(m.side_b)}</span></span>`).join('')}
  </div>`;
}

/* --- Connexion --- */
function authView() {
  const su = S.authMode === 'signup';
  return `
  <div class="authshell">
    <div class="authbrand"><div class="authbrand-in">
      <h1>${MARK(40, true)}${esc(APP_NAME)}</h1>
      <p>Les pronostics de tennis de table entre amis : WTT et Pro A. Vainqueur, score exact, et un bonus quand tu devines juste sur l'outsider.</p>
    </div></div>
    <div class="authform-col">
      <div class="auth">
        <form id="authform" class="panel">
          ${su ? `<label for="pseudo">Pseudo</label><input id="pseudo" required minlength="2" maxlength="20" autocomplete="nickname">` : ''}
          <label for="email">Email</label><input id="email" type="email" required autocomplete="email">
          <label for="pw">Mot de passe</label><input id="pw" type="password" required minlength="6" autocomplete="${su ? 'new-password' : 'current-password'}">
          ${su ? `<label for="code">Code d'invitation</label><input id="code" required autocomplete="off" autocapitalize="characters">` : ''}
          <button class="btn" type="submit">${su ? 'Créer mon compte' : 'Me connecter'}</button>

      </div>
    </div>
  </div>`;
}
async function submitAuth(f) {
  const err = f.querySelector('#autherr'); err.className = 'ferr'; err.textContent = '';
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  const email = f.querySelector('#email').value.trim(), password = f.querySelector('#pw').value;
  try {
    if (S.authMode === 'signup') {
      const pseudo = f.querySelector('#pseudo').value.trim();
      const code = f.querySelector('#code').value.trim().toUpperCase();
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { pseudo, invite_code: code } } });
      if (error) throw error;
      if (!data.session) { err.className = 'ferr fok'; err.textContent = 'Compte créé. Confirme ton email (regarde ta boîte mail) puis connecte-toi.'; }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (e) { err.textContent = friendlyError(e); }
  btn.disabled = false;
}

/* --- Matchs ---
   Au lieu d'un gros bandeau de bienvenue en haut de l'écran (ancienne
   maquette), l'accueil mène directement à l'essentiel : deux tuiles de
   stats compactes, puis la liste groupée par compétition — comme on
   ouvrirait une vraie app de scores plutôt qu'un tableau de bord perso. */
function matchesView() {
  // "fresh" : la liste vient d'être ouverte ou filtrée (pas juste un prono posé
  // ailleurs sur la même liste) -> les rangées ont le droit de rejouer leur entrée.
  const fresh = S._freshMatches; S._freshMatches = false;
  const list = S.matches.filter(m => S.circuit === 'ALL' || m.circuit === S.circuit);
  const up = list.filter(m => m.status === 'scheduled' || m.status === 'live').sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const doneAll = list.filter(m => m.status === 'finished' || m.status === 'cancelled');
  const done = doneAll.slice().sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at)).slice(0, 60);
  let shown = S.view === 'upcoming' ? up : done;

  // Pro A : un onglet "journée" plutôt qu'un défilement infini. On choisit
  // automatiquement la journée la plus pertinente (la prochaine à venir,
  // sinon la dernière) tant que l'utilisateur n'a pas cliqué lui-même.
  let journeeRow = '';
  if (S.circuit === 'PRO_A') {
    const journeeOf = m => { const mm = /^Journée (\d+)$/.exec(m.round || ''); return mm ? +mm[1] : null; };
    const nums = [...new Set(list.map(journeeOf).filter(n => n !== null))].sort((a, b) => a - b);
    if (nums.length) {
      if (S.proJournee === null || !nums.includes(S.proJournee)) {
        const nextUp = up.map(journeeOf).find(n => n !== null);
        S.proJournee = nextUp ?? nums[nums.length - 1];
      }
      journeeRow = `<div class="journeerow" role="group" aria-label="Journée">
        ${nums.map(n => `<button class="jchip" data-act="journee" data-v="${n}" aria-pressed="${S.proJournee === n}">Journée ${n}</button>`).join('')}
      </div>`;
      shown = shown.filter(m => journeeOf(m) === S.proJournee);
    }
  }

  const streakInfo = myStreakInfo();
  let body = '';
  if (!shown.length) {
    body = `<div class="empty">${S.view === 'upcoming'
      ? (S.isAdmin ? "Aucun match à venir. Ajoute le premier dans l'onglet Admin." : (S.circuit === 'PRO_A' ? "Aucun match à venir pour cette journée." : "Aucun match à venir pour le moment. Ils apparaissent ici dès qu'ils sont ajoutés."))
      : (S.circuit === 'PRO_A' ? "Aucun match terminé pour cette journée." : "Aucun match terminé pour l'instant.")}</div>`;
  } else {
    // Groupé par compétition (comme un bandeau de championnat Flashscore),
    // puis par jour à l'intérieur de chaque compétition.
    const groups = [];
    for (const m of shown) {
      let g = groups[groups.length - 1];
      if (!g || g.competition !== m.competition) { g = { competition: m.competition, matches: [] }; groups.push(g); }
      g.matches.push(m);
    }
    let i = 0;
    body = groups.map(g => {
      const n = g.matches.length;
      let lastDay = '', rows = '';
      for (const m of g.matches) {
        const d = fmtDay(m.starts_at);
        if (d !== lastDay) { rows += `<div class="day">${esc(d)}</div>`; lastDay = d; }
        rows += matchRow(m, fresh, i++, streakInfo);
      }
      return `<div class="complabel" style="${themeVarsCss(themeKeyFor(g.matches[0]))}"><span class="compbar" aria-hidden="true"></span>
        <div><b>${esc(g.competition)}</b><small>${n} match${n > 1 ? 's' : ''}</small></div>${groupBallesBudgetHtml(g.matches)}</div>
        <div class="complist">${rows}</div>`;
    }).join('');
  }
  const cnt = n => `<span class="cnt">${n}</span>`;
  return statRow(up) + `<div class="pillrow">`
    + segRow([['upcoming', `À venir ${cnt(up.length)}`], ['done', `Terminés ${cnt(doneAll.length)}`]], S.view, 'view').replace('<div class="pillrow"', '<div class="pillrow" style="margin:0"')
    + `</div>`
    + segRow([['ALL', 'Tous'], ['WTT', 'WTT'], ['PRO_A', 'Pro A']], S.circuit, 'circuit')
    + journeeRow + body;
}
// Tuiles de stats personnelles : ce qu'il reste à prédire, et ta position au
// classement. Deux chiffres au lieu d'un bandeau de bienvenue.
function statRow(upcoming) {
  const todo = upcoming.filter(m => !isLocked(m) && !S.myPreds[m.id]).length;
  const mine = S.board && S.board.find(r => r.user_id === S.session.user.id);
  return `<div class="statrow">
    <div class="stattile"><b class="${todo ? 'accent' : ''}">${todo}</b><span>${todo ? `prono${todo > 1 ? 's' : ''} à faire` : 'à jour, bien joué'}</span></div>
    <div class="stattile"><b>${mine ? mine.total_points : '—'}</b><span>${mine ? `point${mine.total_points > 1 ? 's' : ''} · ${ordinalRank(S.board, mine)}` : 'pas encore de points'}</span></div>
  </div>`;
}
function ordinalRank(board, mine) {
  let rank = 1, prev = null;
  for (let i = 0; i < board.length; i++) {
    const k = board[i].total_points + '/' + board[i].exact_scores;
    if (k !== prev) { rank = i + 1; prev = k; }
    if (board[i].user_id === mine.user_id) return rank + (rank === 1 ? 'er' : 'e');
  }
  return '';
}

// Génère les pastilles de score pour un camp (inchangé dans sa logique :
// toujours n scores possibles, le choisi marqué aria-pressed, data-act="pick"
// pour le câblage des clics) — seul le style de pastille change.
function chips(m, side, mine, disabled) {
  const n = m.wins_needed, out = [];
  for (let k = 0; k < n; k++) {
    const a = side === 'A' ? n : k, b = side === 'A' ? k : n;
    const sel = !!mine && mine.pred_a === a && mine.pred_b === b;
    const who = side === 'A' ? m.side_a : m.side_b;
    out.push(`<button class="scorebtn" data-act="pick" data-id="${m.id}" data-a="${a}" data-b="${b}" aria-pressed="${sel}" aria-label="${esc(who)} gagne ${a} à ${b}" ${disabled ? 'disabled' : ''}>${a}–${b}</button>`);
  }
  return `<div class="scores">${out.join('')}</div>`;
}

// Une rangée dense par match (style SofaScore/Flashscore) : heure/statut à
// gauche, deux noms empilés au centre avec le score ou le prono à droite.
// Le panneau de prédiction (grille de pick'em) est toujours affiché sous la
// rangée pour un match à venir — pas replié, pour que le geste de prono
// reste visible et accessible d'un seul geste, comme demandé pour une appli
// entre copains plutôt qu'un produit pro surchargé d'options.
function matchRow(m, fresh, i, streakInfo) {
  streakInfo = streakInfo || { before: new Map(), now: 0 };
  const locked = isLocked(m), mine = S.myPreds[m.id];
  const fin = m.status === 'finished', canc = m.status === 'cancelled', live = m.status === 'live';
  const winA = fin && m.score_a > m.score_b, winB = fin && m.score_b > m.score_a;
  const ca = S.competitors[m.competitor_a_id], cb = S.competitors[m.competitor_b_id];
  const flag = flagHtml;
  const rk = c => {
    if (!c || !c.ranking) return '';
    return c.circuit === 'WTT' ? `<strong>#${c.ranking}</strong>` : c.ranking;
  };
  const nameBtn = (c, label) => c
    ? `<button class="namebtn" data-act="competitor" data-id="${c.id}">${esc(label)}</button>`
    : esc(label);

  let statusPill = '';
  if (fin) statusPill = '<span class="statuspill">Fini</span>';
  else if (canc) statusPill = '<span class="statuspill">Annulé</span>';
  else if (live) statusPill = '<span class="statuspill live">Live</span>';

  const sideHtml = (c, label, side, isWinner, isLoser) => {
    const scoreOrPred = fin
      ? `<span class="msc${isWinner ? ' win' : ''}">${side === 'A' ? m.score_a : m.score_b}</span>`
      : '';
    return `<div class="mside${isLoser ? ' lose' : ''}">
      <span class="mname">${flag(c)}${nameBtn(c, label)}<span class="mrk">${rk(c)}</span></span>
      ${scoreOrPred}
    </div>`;
  };

  const rowStyle = `${themeVarsCss(themeKeyFor(m))}${fresh ? `;animation-delay:${Math.min(i, 10) * 35}ms` : ''}`;
  const timeCol = live
    ? `<span class="liv"><span class="livedotsm" aria-hidden="true"></span>LIVE</span>`
    : esc(new Date(m.starts_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }));

  let panel = '';
  if (!fin && !canc) {
    const showChips = true;
    const t = !locked ? trend(m) : null;
    const pickProb = (mine && t) ? Math.round(scoreProb(t.q, m.wins_needed, mine.pred_a, mine.pred_b) * 100) : null;
    const gauge = pickProb !== null ? `
      <div class="oddsgauge" role="img" aria-label="${pickProb} % de chances d'avoir le score ${mine.pred_a}–${mine.pred_b}">
        <div class="bar"><i style="--w:${pickProb}%;width:${pickProb}%"></i></div><b>${pickProb}%</b>
      </div>` : '';
    const status = locked
      ? `<span>${mine ? `Ton prono : <b>${mine.pred_a}–${mine.pred_b}</b>` : "Trop tard, pas de prono."}</span>`
      : `<span>${mine ? `Prono : <b>${mine.pred_a}–${mine.pred_b}</b>, modifiable jusqu'au début du match.` : 'Touche un score pour pronostiquer.'}</span>`;
    // Pastille de série : seulement si elle offre vraiment un bonus (série
    // >= 3), pour ne pas surcharger chaque carte avec un chiffre à zéro.
    const streakTeaser = (!locked && streakInfo.now >= 3)
      ? `<span>${streakBadgeHtml(streakInfo.now, true)} si gagnant</span>` : '';
    panel = `<div class="predpanel${locked ? ' locked' : ''}">
      <div class="pickgrid">
        <div class="pickside"><span class="pslabel">${flag(ca)}${esc(m.side_a)}</span>${chips(m, 'A', mine, locked)}</div>
        <div class="pickside"><span class="pslabel">${flag(cb)}${esc(m.side_b)}</span>${chips(m, 'B', mine, locked)}</div>
      </div>
      <div class="predstatus">${status}${streakTeaser}</div>
      ${gauge}
      ${ballesStepperHtml(m)}
    </div>`;
  } else {
    let foot, stamp = '';
    if (canc) foot = `<span>Match annulé : aucun point en jeu.</span>`;
    else {
      // Série AVANT ce match précis (pas la série actuelle) : c'est elle qui
      // a déterminé le bonus réellement appliqué sur ce prono, au moment où
      // il a été jugé — jamais recalculée rétroactivement avec la série
      // d'aujourd'hui. Vient de S.myHistory (voir myStreakInfo) ; 0 par
      // défaut tant qu'il n'est pas encore chargé (la vue SQL reste la seule
      // source de vérité pour les points réellement enregistrés).
      const myStreakBefore = streakInfo.before.get(m.id) || 0;
      const pt = points(m, mine, myStreakBefore);
      const det = mine ? pointsDetail(m, mine, myStreakBefore) : null;
      // Le nombre de points gagnés est l'info la plus attendue sur un match
      // fini : affiché en grand, dans un pavé façon tampon encreur, plutôt
      // que noyé dans la ligne de texte.
      if (pt !== null) {
        stamp = `<div class="stamp ${pt === 0 ? 'p0' : (det.exact ? 'p3' : 'p1')}" aria-label="${pt} point${Math.abs(pt) > 1 ? 's' : ''} gagné${Math.abs(pt) > 1 ? 's' : ''} sur ce match"><b>${pt > 0 ? '+' : ''}${pt}</b><span>pt${Math.abs(pt) > 1 ? 's' : ''}</span></div>`;
      }
      const bonusBits = [];
      if (det && det.streakBonus) bonusBits.push(`bonus série +${det.streakBonus}`);
      if (det && det.ballesBonus) bonusBits.push(`bonus balles (${det.balles}) +${det.ballesBonus}`);
      if (det && det.bonus) bonusBits.push(`bonus outsider +${det.bonus}`);
      foot = `<span>${mine ? `Ton prono : ${mine.pred_a}–${mine.pred_b}` : `Tu n'as pas fait de prono.`}</span>
        ${bonusBits.length ? `<span class="hint" style="margin:2px 0 0">(dont ${bonusBits.join(', ')})</span>` : ''}
        <span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="friendstoggle" data-act="friends" data-id="${m.id}">${S.openFriends[m.id] ? 'Masquer' : 'Voir'} les pronos des amis</button>
          ${mine ? `<button class="friendstoggle" data-act="exportmatch" data-id="${m.id}">Partager en image</button>` : ''}
        </span>`;
    }
    let friends = '';
    if (S.openFriends[m.id]) {
      const rows = (S.friends[m.id] || []).map(r => ({ ...r, pt: points(m, r) }))
        .sort((x, y) => (y.pt ?? -1) - (x.pt ?? -1));
      friends = rows.length
        ? `<ul class="friends">${rows.map(r => `<li><span>${esc(r.profiles && r.profiles.pseudo)}${r.user_id === S.session.user.id ? ' (toi)' : ''}</span><span>${r.pred_a}–${r.pred_b}${r.pt !== null ? ` : ${r.pt} pt${r.pt > 1 ? 's' : ''}` : ''}</span></li>`).join('')}</ul>`
        : `<p class="hint" style="margin-top:8px">Personne n'a fait de prono sur ce match.</p>`;
    }
    panel = `<div class="predpanel locked"><div class="predstatus" style="display:flex;align-items:center;gap:12px">${stamp}<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">${foot}</div></div>${friends}</div>`;
  }

  return `
  <div class="mrow${live ? ' islive' : ''}${fresh ? ' enter' : ''}" style="${rowStyle}">
    <div class="mrowhead">
      <div class="mtime">${timeCol}${!live ? statusPill : ''}</div>
      <div class="msides">
        ${sideHtml(ca, m.side_a, 'A', winA, winB)}
        ${sideHtml(cb, m.side_b, 'B', winB, winA)}
      </div>
      <div class="mright">${live ? statusPill : ''}${m.round ? `<span class="hint" style="font-size:10px;margin:0;text-align:right">${esc(m.round)}</span>` : ''}</div>
    </div>
    ${panel}
  </div>`;
}

async function pick(id, a, b) {
  const m = S.matches.find(x => x.id === id);
  if (!m || isLocked(m)) { toast('Trop tard : le match a commencé.', true); keepRender(); return; }
  playSound('tick'); // retour tactile immédiat au tap, sans attendre la réponse réseau (toast() jouera le "confirm"/"error" une fois enregistré)
  const { data, error } = await sb.from('predictions')
    .upsert({ user_id: S.session.user.id, match_id: id, pred_a: a, pred_b: b }, { onConflict: 'user_id,match_id' })
    .select().single();
  if (error) { toast(friendlyError(error), true); return; }
  S.myPreds[id] = data;
  toast(`Prono enregistré : ${a}–${b}`);
  keepRender();
}
// Change la mise de balles sur un pronostic déjà posé (voir ballesStepperHtml
// / BALLES_STOCK). newVal est la valeur ABSOLUE visée (pas un delta) ; elle
// est re-plafonnée ici (jamais confiance aveugle dans les data-v du bouton
// cliqué) par le plafond par match ET le budget restant du tournoi -- la
// vérité finale reste de toute façon le déclencheur SQL (check_prediction,
// voir ajout-balles.sql), qui referait le même calcul côté base de données.
async function setBalles(id, newVal) {
  const m = S.matches.find(x => x.id === id);
  const mine = S.myPreds[id];
  if (!m || isLocked(m)) { toast('Trop tard : le match a commencé.', true); keepRender(); return; }
  if (!mine) { toast('Fais d’abord un prono sur ce match.', true); keepRender(); return; }
  const cap = Math.min(BALLES_MAX_PER_MATCH, ballesRemaining(m, id));
  const v = Math.max(0, Math.min(newVal, cap));
  if (v === (mine.balles_staked || 0)) { keepRender(); return; }
  const { data, error } = await sb.from('predictions').update({ balles_staked: v }).eq('id', mine.id).select().single();
  if (error) { toast(friendlyError(error), true); return; }
  S.myPreds[id] = data;
  playSound('tick');
  toast(v > 0 ? `${v} balle${v > 1 ? 's' : ''} misée${v > 1 ? 's' : ''} sur ce match.` : 'Mise de balles retirée.');
  keepRender();
}
async function toggleFriends(id) {
  if (S.openFriends[id]) { S.openFriends[id] = false; keepRender(); return; }
  const { data, error } = await sb.from('predictions').select('user_id,pred_a,pred_b,balles_staked,profiles(pseudo)').eq('match_id', id);
  if (error) { toast(friendlyError(error), true); return; }
  S.friends[id] = data || []; S.openFriends[id] = true; keepRender();
}

/* --- Classement des amis : vraie table de standings, podium en évidence. --- */
function boardView() {
  const seg = segRow([['ALL', 'Général'], ['WTT', 'WTT'], ['PRO_A', 'Pro A']], S.boardScope, 'boardscope');
  const exportBtn = `<button class="btn small sec" style="margin:-6px 0 14px" data-act="exportboard">Exporter ce classement en image</button>`;
  if (S.board === null) return seg + '<div class="loading">Chargement…</div>';
  if (!S.board.length) return seg + `<div class="empty">Pas encore de points. Le classement se remplit dès que les premiers matchs sont terminés.</div>${rules()}`;
  let prev = null, rank = 0;
  const rows = S.board.map((r, i) => {
    const key = r.total_points + '/' + r.exact_scores;
    if (key !== prev) { rank = i + 1; prev = key; }
    const me = r.user_id === S.session.user.id;
    const topClass = rank === 1 ? ' top1' : rank === 2 ? ' top2' : rank === 3 ? ' top3' : '';
    return `<tr class="${me ? 'me' : ''}">
      <td class="rankcell${topClass}">${rank}</td>
      <td class="namecell"><div class="lbname">${esc(r.pseudo)}${me ? ' (toi)' : ''}</div>
        <div class="lbsub">${r.exact_scores} score${r.exact_scores > 1 ? 's' : ''} exact${r.exact_scores > 1 ? 's' : ''} · ${r.good_winners} bon${r.good_winners > 1 ? 's' : ''} vainqueur${r.good_winners > 1 ? 's' : ''} / ${r.matches_played}</div></td>
      <td class="ptscell">${r.total_points}<small>pts</small></td></tr>`;
  }).join('');
  return seg + exportBtn + `<table class="standings"><thead><tr><th>Rang</th><th>Joueur</th><th class="num">Pts</th></tr></thead><tbody>${rows}</tbody></table>` + rules();
}
const rules = () => `<p class="rules">Barème : 1 point pour le bon vainqueur, 3 points pour le score exact. En WTT, un pronostic gagnant sur l'outsider (moins bien classé au tirage au sort) rapporte un bonus, d'autant plus grand que l'écart de tête de série est important (jusqu'à +5 points). Bonus de série : plus tu enchaînes les pronos gagnants d'affilée, plus le prochain rapporte gros (jusqu'à +75 % à partir d'une grosse série) — vois l'onglet "Mon compte" pour ta série en cours. En cas d'égalité au classement, le plus de scores exacts passe devant.</p>`;

/* --- Classements WTT (mondial, messieurs/dames séparés) et Pro A
   (championnat) : à distinguer du classement des amis (points de
   pronostics) affiché dans l'onglet "Amis". --- */
function rankingsView() {
  const scope = S.rankView;
  const seg = segRow([['WTT', 'WTT'], ['PRO_A', 'Pro A']], scope, 'rankview');

  if (scope === 'PRO_A') {
    const list = Object.values(S.competitors)
      .filter(c => c.circuit === 'PRO_A' && c.ranking != null)
      .sort((a, b) => a.ranking - b.ranking || a.name.localeCompare(b.name));
    if (!list.length) return seg + `<div class="empty">Aucun classement Pro A pour l'instant. Il se remplit dès que la saison commence.</div>`;
    const rows = list.map(c => {
      const topClass = c.ranking === 1 ? ' top1' : c.ranking === 2 ? ' top2' : c.ranking === 3 ? ' top3' : '';
      return `<tr class="lbrow" data-act="competitor" data-id="${c.id}" tabindex="0" aria-label="Voir le détail de l'équipe ${esc(c.name)}">
        <td class="rankcell${topClass}">${c.ranking}</td>
        <td class="namecell"><div class="lbname">${esc(c.name)}</div>${c.roster && c.roster.length ? `<div class="lbsub">${c.roster.length} joueur${c.roster.length > 1 ? 's' : ''} suivi${c.roster.length > 1 ? 's' : ''}</div>` : ''}</td>
        <td class="ptscell">${c.ranking_points ? `${c.ranking_points}<small>pts</small>` : ''}</td></tr>`;
    }).join('');
    // Vue "équipes" Pro A : chaque ligne EST déjà une équipe (championnat par
    // équipes), pas un joueur individuel — clique sur son nom pour voir son
    // effectif et son calendrier (fiche détail, onglet Admin pour saisir les
    // joueurs). Ce classement et les journées filtrables de l'onglet Matchs
    // sont la "vue équipe" : pas besoin d'un onglet séparé, la donnée est
    // déjà structurée par équipe depuis le robot de synchronisation (FFTT).
    return seg + `<table class="standings"><thead><tr><th>Rang</th><th>Équipe</th><th class="num">Pts</th></tr></thead><tbody>${rows}</tbody></table>`
      + `<p class="rules">Classement Pro A messieurs par équipe, mis à jour par le robot de synchronisation. Touche une équipe pour voir son effectif et son calendrier.</p>`;
  }

  // WTT : classement mondial, messieurs et dames séparés (déduits automatiquement
  // du tableau où joue chaque joueur : simple messieurs ou simple dames).
  const genderSeg = segRow([['M', 'Messieurs'], ['F', 'Dames']], S.rankGender, 'rankgender');
  const pool = Object.values(S.competitors).filter(c => c.circuit === 'WTT' && c.gender === S.rankGender);
  const withWorld = pool.filter(c => c.world_ranking != null).sort((a, b) => a.world_ranking - b.world_ranking || a.name.localeCompare(b.name));
  const fallback = !withWorld.length ? pool.filter(c => c.ranking != null).sort((a, b) => a.ranking - b.ranking || a.name.localeCompare(b.name)) : [];
  const list = withWorld.length ? withWorld : fallback;
  const usingFallback = !withWorld.length && !!fallback.length;
  const genreLabel = S.rankGender === 'M' ? 'messieurs' : 'dames';
  if (!list.length) {
    return seg + genderSeg + `<div class="empty">Aucun classement ${genreLabel} pour l'instant.${S.isAdmin ? " Il se remplit automatiquement à la prochaine synchronisation WTT." : ''}</div>`;
  }
  const rows = list.map(c => {
    const rk = usingFallback ? c.ranking : c.world_ranking;
    const topClass = rk === 1 ? ' top1' : rk === 2 ? ' top2' : rk === 3 ? ' top3' : '';
    return `<tr class="lbrow" data-act="competitor" data-id="${c.id}" tabindex="0" aria-label="Voir le détail de ${esc(c.name)}">
      <td class="rankcell${topClass}">${rk}</td>
      <td class="namecell"><div class="lbname">${flagHtml(c)}${esc(c.name)}</div>
        ${c.country ? `<div class="lbsub">${esc(c.country)}</div>` : ''}</td>
      <td class="ptscell">${(usingFallback ? null : c.world_ranking_points) ? `${c.world_ranking_points}<small>pts</small>` : ''}</td></tr>`;
  }).join('');
  const note = usingFallback
    ? `<p class="rules">Classement mondial pas encore synchronisé pour ce tableau : tête de série des tournois suivis affichée en attendant.</p>`
    : `<p class="rules">Classement mondial WTT officiel (${genreLabel}), mis à jour automatiquement par le robot de synchronisation.</p>`;
  return seg + genderSeg + `<table class="standings"><thead><tr><th>Rang</th><th>Joueur</th><th class="num">Pts</th></tr></thead><tbody>${rows}</tbody></table>` + note;
}

/* ---------- Les 14 définitions (nom, couleurs, critère, icône) ---------- */
// Chaque entrée : { id, name, desc, colorA, colorB, icon, test(ctx) }.
// `ctx` regroupe tout ce dont les critères ont besoin, construit une seule
// fois par computeBadges() à partir des données déjà chargées pour "Mon
// compte" (voir loadAccount()) -- aucune logique serveur nouvelle, à part
// les deux requêtes de lecture déjà publiques ajoutées à loadAccount().
function circuitAccuracy(ctx, circuit) {
  if (!S.circuitBoard || !S.circuitBoard.length) return null;
  const rows = S.circuitBoard.filter(r => r.circuit === circuit && r.matches_played > 0);
  if (rows.length < 2) return null;
  const mine = rows.find(r => r.user_id === ctx.uid);
  if (!mine || mine.matches_played < 10) return null;
  const avgAcc = rows.reduce((s, r) => s + r.good_winners / r.matches_played, 0) / rows.length;
  return { myAcc: mine.good_winners / mine.matches_played, avgAcc, n: rows.length };
}
// Table user_id -> Map(match_id -> points totaux), à partir de
// S.allJudgedPreds (pronostics de tout le monde sur des matchs déjà
// jugés). Réutilise computeStreakSeries/pointsDetail : chaque personne a
// donc droit à SON propre calcul de série/bonus, comme sur le vrai
// classement, pas une approximation plus grossière.
function allUsersPointsByMatch() {
  const byUser = {};
  for (const r of (S.allJudgedPreds || [])) (byUser[r.user_id] = byUser[r.user_id] || []).push(r);
  const out = {};
  for (const uid in byUser) {
    const sorted = byUser[uid].slice().sort((a, b) => new Date(a.matches.starts_at) - new Date(b.matches.starts_at));
    const map = new Map();
    for (const h of computeStreakSeries(sorted)) {
      const pt = pointsDetail(h.matches, h, h.streakBefore);
      map.set(h.match_id, pt ? pt.total : 0);
    }
    out[uid] = map;
  }
  return out;
}
