          <div class="adm-actions" style="margin-top:6px">
            <input class="scorein" style="width:90px" id="wr-${c.id}" type="number" min="1" inputmode="numeric" placeholder="Rang mondial" value="${c.world_ranking ?? ''}" aria-label="Classement mondial de ${esc(c.name)}">
            <input class="scorein" style="width:90px" id="wp-${c.id}" type="number" min="0" inputmode="numeric" placeholder="Points" value="${c.world_ranking_points ?? ''}" aria-label="Points mondiaux de ${esc(c.name)}">
            <button class="btn small sec" data-act="adm-worldrank" data-id="${c.id}">Enregistrer</button>
          </div>
        </details>` : ''}
        ${S.adminCircuit === 'PRO_A' ? `
        <label for="ro-${c.id}" class="hint" style="display:block;margin-top:10px">Joueurs de l'équipe (un par ligne)</label>
        <textarea id="ro-${c.id}" rows="3" style="width:100%;margin-top:4px" placeholder="Un nom par ligne">${esc((c.roster || []).join('\n'))}</textarea>
        <button class="btn small sec" style="margin-top:6px" data-act="adm-roster" data-id="${c.id}">Enregistrer les joueurs</button>` : ''}
      </div>`).join('') : '<p class="hint">Aucun joueur ou équipe pour ce circuit : ils sont créés automatiquement quand tu ajoutes un match.</p>'}
  </section>`;
}

async function ensureCompetitor(name, circuit) {
  name = name.trim();
  const found = Object.values(S.competitors).find(c => c.circuit === circuit && c.name.toLowerCase() === name.toLowerCase());
  if (found) return found.id;
  const { data, error } = await sb.from('competitors')
    .insert({ name, circuit, kind: circuit === 'PRO_A' ? 'team' : 'player', source: 'manual' }).select().single();
  if (error) throw error;
  S.competitors[data.id] = data;
  return data.id;
}
async function addMatch(f) {
  const v = id => f.querySelector('#' + id).value.trim();
  const circuit = v('am-circuit'), a = v('am-a'), b = v('am-b');
  if (a.toLowerCase() === b.toLowerCase()) { toast('Choisis deux adversaires différents.', true); return; }
  try {
    const [ida, idb] = [await ensureCompetitor(a, circuit), await ensureCompetitor(b, circuit)];
    const { error } = await sb.from('matches').insert({
      circuit, competition: v('am-comp'), round: v('am-round') || null,
      side_a: a, side_b: b, competitor_a_id: ida, competitor_b_id: idb,
      starts_at: new Date(f.querySelector('#am-start').value).toISOString(),
      wins_needed: parseInt(v('am-wins'), 10), source: 'manual'
    });
    if (error) throw error;
    await reloadMatches();
    toast('Match ajouté.'); keepRender();
  } catch (e) { toast(friendlyError(e), true); }
}
async function saveResult(id) {
  const m = S.matches.find(x => x.id === id);
  const a = parseInt(document.getElementById('ra-' + id).value, 10), b = parseInt(document.getElementById('rb-' + id).value, 10);
  if (Number.isNaN(a) || Number.isNaN(b)) { toast('Saisis les deux scores.', true); return; }
  if (Math.max(a, b) !== m.wins_needed || Math.min(a, b) >= m.wins_needed) { toast(`Score impossible : le vainqueur doit avoir ${m.wins_needed} victoires.`, true); return; }
  const { error } = await sb.from('matches').update({ status: 'finished', score_a: a, score_b: b }).eq('id', id);
  if (error) { toast(friendlyError(error), true); return; }
  await reloadMatches(); toast('Résultat enregistré.'); keepRender();
}
async function cancelMatch(id) {
  if (!confirm('Annuler ce match ? Les pronos ne rapporteront aucun point.')) return;
  const { error } = await sb.from('matches').update({ status: 'cancelled', score_a: null, score_b: null }).eq('id', id);
  if (error) { toast(friendlyError(error), true); return; }
  await reloadMatches(); toast('Match annulé.'); keepRender();
}
async function deleteMatch(id) {
  if (!confirm('Supprimer ce match et tous les pronos associés ? Cette action est définitive.')) return;
  const { error } = await sb.from('matches').delete().eq('id', id);
  if (error) { toast(friendlyError(error), true); return; }
  await reloadMatches(); toast('Match supprimé.'); keepRender();
}
async function saveRank(id) {
  const raw = document.getElementById('rk-' + id).value.trim();
  const ranking = raw === '' ? null : parseInt(raw, 10);
  const { error } = await sb.from('competitors').update({ ranking }).eq('id', id);
  if (error) { toast(friendlyError(error), true); return; }
  S.competitors[id].ranking = ranking; toast('Classement enregistré.');
}
async function saveRoster(id) {
  const raw = document.getElementById('ro-' + id).value;
  const roster = raw.split('\n').map(s => s.trim()).filter(Boolean);
  const { error } = await sb.from('competitors').update({ roster: roster.length ? roster : null }).eq('id', id);
  if (error) { toast(friendlyError(error), true); return; }
  S.competitors[id].roster = roster.length ? roster : null; toast('Joueurs enregistrés.'); keepRender();
}
// Classement mondial WTT : mis à jour automatiquement par le robot de
// synchronisation (synchro.mjs) à chaque passage ; cette fonction ne sert
// qu'à une correction manuelle ponctuelle (ex. nom non reconnu par le robot).
async function saveWorldRank(id) {
  const rawR = document.getElementById('wr-' + id).value.trim();
  const rawP = document.getElementById('wp-' + id).value.trim();
  const world_ranking = rawR === '' ? null : parseInt(rawR, 10);

/* ---------- Export en image (partage, sans dépendance externe) ----------
   Dessin manuel sur <canvas> plutôt qu'une capture DOM-vers-canvas (pas de
   librairie, pas de souci de polices/CSS externes à sérialiser) : un rendu
   simple et net, pas une réplique pixel pour pixel de la carte HTML, avec
   juste l'essentiel à partager dans une conversation de groupe. */
function downloadCanvas(canvas, filename) {
  canvas.toBlob(blob => {
    if (!blob) { toast("Impossible de générer l'image.", true); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }, 'image/png');
}
/* ---------- Images à partager : la même affiche halftone que l'appli ----------
   Papier du thème + grain, bandeau à la couleur du tournoi avec sa trame de
   points, gros caractères d'affiche, tampon rond pour les points. Dessiné en
   2x pour rester net sur téléphone. Les couleurs viennent de THEME, jamais
   codées en dur ici (sauf médailles et vert "bon vainqueur"). */
const EXPORT_DISPLAY = "'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif";
const EXPORT_BODY = "'Archivo', Arial, sans-serif";
const EXPORT_GOOD = '#3E9E5C';
const MEDALS = { 1: '#F0C544', 2: '#CBD3DC', 3: '#D79A6B' };
async function exportFontsReady() {
  try {
    if (!document.fonts || !document.fonts.load) return;
    await Promise.all([
      document.fonts.load(`900 40px 'Big Shoulders Display'`),
      document.fonts.load(`800 40px 'Big Shoulders Display'`),
      document.fonts.load(`700 40px 'Big Shoulders Display'`),
      document.fonts.load(`600 16px 'Archivo'`),
      document.fonts.load(`800 16px 'Archivo'`),
    ]);
  } catch (e) { /* polices indisponibles : on dessine avec les polices de secours */ }
}
function makeExportCanvas(w, h) {
  const k = 2, canvas = document.createElement('canvas');
  canvas.width = w * k; canvas.height = h * k;
  const ctx = canvas.getContext('2d');
  ctx.scale(k, k);
  return { canvas, ctx };
}
// Trame de points à 45° (même géométrie que les trames CSS) : le rayon de
// chaque point suit tone(x, y), entre 0 (rien) et 1 (points qui se touchent).
function paintHalftone(ctx, x, y, w, h, color, pitch, tone) {
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = color;
  const rMax = pitch * 0.37;
  for (let row = 0, py = y; py <= y + h + pitch; row++, py += pitch / 2) {
    for (let px = x + (row % 2 ? pitch / 2 : 0); px <= x + w + pitch; px += pitch) {
      const t = Math.min(1, tone(px, py));
      if (t <= 0.05) continue;
      ctx.beginPath(); ctx.arc(px, py, rMax * Math.sqrt(t), 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}
// Grain de papier : taches d'encre éparses, pseudo-aléatoires mais stables.
function paintGrain(ctx, w, h, color) {
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  ctx.save(); ctx.fillStyle = color; ctx.globalAlpha = 0.1;
  for (let i = 0; i < (w * h) / 80; i++) ctx.fillRect(rnd() * w, rnd() * h, 1.1, 1.1);
  ctx.restore();
}
// Réduit la taille de police jusqu'à ce que le texte tienne dans maxW.
function fitFont(ctx, text, weight, size, family, maxW, minSize) {
  let s = size;
  ctx.font = `${weight} ${s}px ${family}`;
  while (s > (minSize || size * 0.55) && ctx.measureText(text).width > maxW) {
    s -= 1; ctx.font = `${weight} ${s}px ${family}`;
  }
  return s;
}
function clamp01(v) { return Math.max(0, Math.min(1, v)); }
// Filet de points (séparateurs façon journal).
function paintDotRule(ctx, x1, x2, y, color) {
  ctx.save(); ctx.fillStyle = color;
  for (let x = x1; x <= x2; x += 7) { ctx.beginPath(); ctx.arc(x, y, 1.3, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}
// Fond commun : papier + grain + cadre, puis bandeau d'en-tête imprimé.
function paintExportPoster(ctx, w, h, t, title, sub, opts) {
  opts = opts || {};
  const bandH = opts.bandH || 118;
  ctx.fillStyle = t.paper; ctx.fillRect(0, 0, w, h);
  paintGrain(ctx, w, h, t.ink);
  ctx.fillStyle = t.accent; ctx.fillRect(0, 0, w, bandH);
  if (opts.burst) {
    const cx = w * 0.78, cy = bandH * 0.5, R = w * 0.52;
    paintHalftone(ctx, 0, 0, w, bandH, t.accent2, 12, (px, py) => 1.25 - Math.hypot(px - cx, py - cy) / R);
  } else {
    paintHalftone(ctx, 0, 0, w, bandH, t.accent2, 11, px => (px - w * 0.32) / (w * 0.6));
  }
  if (opts.vhs) {
    ctx.save(); ctx.fillStyle = 'rgba(0,0,0,.16)';
    for (let y = 0; y < bandH; y += 3) ctx.fillRect(0, y, w, 1);
    ctx.fillStyle = '#E2392B'; ctx.beginPath(); ctx.arc(40, 24, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = t.onAccent || '#fff'; ctx.font = `800 14px ${EXPORT_DISPLAY}`; ctx.textAlign = 'left';
    ctx.fillText('REC', 52, 29);
    ctx.textAlign = 'right'; ctx.globalAlpha = 0.85; ctx.fillText('▶ LECTURE', w - 30, bandH - 14);
    ctx.restore();
  }
  ctx.fillStyle = t.ink; ctx.fillRect(0, bandH, w, 3);
  const titleY = opts.vhs ? 78 : 64;
  const titleText = String(title).toUpperCase();
  const size = fitFont(ctx, titleText, 900, opts.vhs ? 46 : 42, EXPORT_DISPLAY, w - 72 - (opts.titleRoom || 0), 24);
  if (opts.vhs) {
    ctx.save(); ctx.globalAlpha = 0.75;
    ctx.fillStyle = 'rgb(255,40,80)'; ctx.fillText(titleText, 38, titleY);
    ctx.fillStyle = 'rgb(40,220,255)'; ctx.fillText(titleText, 34, titleY);
    ctx.restore();
  }
  ctx.font = `900 ${size}px ${EXPORT_DISPLAY}`; ctx.textAlign = 'left';
  ctx.fillStyle = t.onAccent || '#fff'; ctx.fillText(titleText, 36, titleY);
  if (sub) {
    ctx.save(); ctx.globalAlpha = 0.88; ctx.font = `600 16px ${EXPORT_BODY}`;
    ctx.fillText(String(sub), 36, titleY + (opts.vhs ? 28 : 30)); ctx.restore();
  }
  // Cadre d'encre.
  ctx.strokeStyle = t.ink; ctx.lineWidth = 6; ctx.strokeRect(0, 0, w, h);
  return bandH + 3;
}
// Pied de l'affiche : la marque imprimée en deux passes décalées.
function paintExportFooter(ctx, w, h, t) {
  paintDotRule(ctx, 36, w - 36, h - 62, t.inkSoft);
  ctx.textAlign = 'left';
  ctx.font = `900 34px ${EXPORT_DISPLAY}`;
  ctx.fillStyle = t.accent2; ctx.fillText('SPIN', 38.5, h - 20.5);
  ctx.fillStyle = t.ink; ctx.fillText('SPIN', 36, h - 23);
  const bw = ctx.measureText('SPIN').width;
  ctx.fillStyle = t.inkSoft; ctx.font = `600 13px ${EXPORT_BODY}`;
  ctx.fillText("Pronostics de tennis de table entre amis, pas un jeu d'argent", 36 + bw + 16, h - 28);
}
// Tampon encreur rond, double filet, légère trame à l'intérieur.
function paintStamp(ctx, cx, cy, r, color, big, small, rot) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot || -0.14);
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r - 8, 0, Math.PI * 2); ctx.clip();
  ctx.globalAlpha = 0.3; paintHalftone(ctx, -r, -r, 2 * r, 2 * r, color, 7, () => 0.45);
  ctx.restore();
  ctx.strokeStyle = color; ctx.lineWidth = 4.5; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(0, 0, r - 8, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = color; ctx.textAlign = 'center';
  ctx.font = `900 ${Math.round(r * 0.78)}px ${EXPORT_DISPLAY}`; ctx.fillText(big, 0, r * 0.2);
  ctx.font = `800 ${Math.round(r * 0.2)}px ${EXPORT_BODY}`; ctx.fillText(small, 0, r * 0.56);
  ctx.restore();
}
// Ticket de stat (rang, points...) : cadre encré, encoches, gros chiffre.
function paintStatTicket(ctx, x, y, w, h, t, value, label, accent) {
  ctx.save();
  ctx.fillStyle = t.card; ctx.fillRect(x, y, w, h);
  paintHalftone(ctx, x, y, w, h, t.accent, 8, (px, py) => 0.75 * (1 - Math.hypot(px - (x + w), py - (y + h)) / (w * 0.55)));
  ctx.strokeStyle = t.ink; ctx.lineWidth = 2.5; ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = t.paper;
  for (const nx of [x, x + w]) { ctx.beginPath(); ctx.arc(nx, y + h / 2, 8, 0, Math.PI * 2); ctx.fill(); }
  ctx.textAlign = 'left';
  ctx.font = `800 54px ${EXPORT_DISPLAY}`;
  if (accent) { ctx.fillStyle = t.accent2; ctx.fillText(value, x + 22.5, y + 62.5); }
  ctx.fillStyle = accent ? (t.accentInk || t.accent) : t.ink; ctx.fillText(value, x + 20, y + 60);
  ctx.fillStyle = t.inkSoft; ctx.font = `600 14px ${EXPORT_BODY}`; ctx.fillText(label, x + 20, y + h - 16);
  ctx.restore();
}

async function exportMatchImage(id) {
  const m = S.matches.find(x => x.id === id);
  if (!m) { toast('Match introuvable.', true); return; }
  await exportFontsReady();
  const mine = S.myPreds[m.id];
  const streakInfo = myStreakInfo();
  const myStreakBefore = streakInfo.before.get(m.id) || 0;
  const fin = m.status === 'finished';
  const det = (fin && mine) ? pointsDetail(m, mine, myStreakBefore) : null;
  const t = THEME[themeKeyFor(m)] || THEME.ALL;

  const w = 820, h = 470;
  const { canvas, ctx } = makeExportCanvas(w, h);
  const top = paintExportPoster(ctx, w, h, t, m.competition || 'Match', m.round || '');

  ctx.fillStyle = t.inkSoft; ctx.font = `600 15px ${EXPORT_BODY}`; ctx.textAlign = 'left';
  const when = esc0(fmtWhen(m.starts_at));
  ctx.fillText(when.charAt(0).toUpperCase() + when.slice(1), 36, top + 36);

  const winA = fin && m.score_a > m.score_b, winB = fin && m.score_b > m.score_a;
  const nameMax = w - 36 - 320;
  const rowY = [top + 104, top + 170];
  [[m.side_a, winB], [m.side_b, winA]].forEach(([name, lost], i) => {
    const s = fitFont(ctx, esc0(name), 800, 54, EXPORT_DISPLAY, nameMax, 30);
    ctx.font = `800 ${s}px ${EXPORT_DISPLAY}`;
    ctx.fillStyle = lost ? t.inkSoft : t.ink;
    ctx.fillText(esc0(name), 36, rowY[i]);
  });
  ctx.textAlign = 'right'; ctx.font = `900 72px ${EXPORT_DISPLAY}`;
  if (fin) {
    ctx.fillStyle = winA ? t.ink : t.inkSoft; ctx.fillText(String(m.score_a), w - 210, rowY[0] + 4);
    ctx.fillStyle = winB ? t.ink : t.inkSoft; ctx.fillText(String(m.score_b), w - 210, rowY[1] + 4);
  } else if (mine) {
    ctx.fillStyle = t.accentInk || t.accent;
    ctx.fillText(String(mine.pred_a), w - 210, rowY[0] + 4);
    ctx.fillText(String(mine.pred_b), w - 210, rowY[1] + 4);
  }
  ctx.textAlign = 'left';

  let yy = top + 226;
  ctx.fillStyle = t.ink; ctx.font = `800 20px ${EXPORT_DISPLAY}`;
  if (mine) ctx.fillText(fin ? `Mon prono : ${mine.pred_a}–${mine.pred_b}` : `Mon prono : ${mine.pred_a}–${mine.pred_b}, match à venir`, 36, yy);
  ctx.fillStyle = t.inkSoft; ctx.font = `500 14px ${EXPORT_BODY}`;
  if (det) {
    const bits = [];
    if (det.streakBonus) bits.push(`bonus série +${det.streakBonus}`);
    if (det.ballesBonus) bits.push(`bonus balles (${det.balles}) +${det.ballesBonus}`);
    if (det.bonus) bits.push(`bonus outsider +${det.bonus}`);
    if (bits.length) ctx.fillText(`dont ${bits.join(', ')}`, 36, yy + 24);
    const col = det.total > 0 ? (det.exact ? (t.accentInk || t.accent) : EXPORT_GOOD) : t.inkSoft;
    paintStamp(ctx, w - 100, top + 140, 66, col, `${det.total > 0 ? '+' : ''}${det.total}`, Math.abs(det.total) > 1 ? 'PTS' : 'PT');
  }
  paintExportFooter(ctx, w, h, t);
  downloadCanvas(canvas, `spin-match-${m.id}.png`);
}

async function exportBoardImage() {
  const rows = (S.board || []).slice(0, 10);
  if (!rows.length) { toast('Rien à exporter encore.', true); return; }
  await exportFontsReady();
  const t = THEME[resolveThemeKey('ALL')] || THEME.ALL;
  const w = 780, hRow = 66, h = 150 + rows.length * hRow + 96;
  const { canvas, ctx } = makeExportCanvas(w, h);
  const scopeLabel = S.boardScope === 'ALL' ? 'Classement général' : (S.boardScope === 'WTT' ? 'Classement WTT' : 'Classement Pro A');
  const today = new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  const top = paintExportPoster(ctx, w, h, t, scopeLabel, `Au ${today}`);

  let prev = null, rank = 0, y = top + 26;
  for (let i = 0; i < rows.length; i++) {

    if (key !== prev) { rank = i + 1; prev = key; }
    if (r.user_id === uid) {
      ctx.save(); ctx.globalAlpha = 0.12; ctx.fillStyle = t.accent; ctx.fillRect(6, y, w - 12, hRow); ctx.restore();
      ctx.fillStyle = t.accent; ctx.fillRect(6, y, 6, hRow);
    }
    const cy = y + hRow / 2;
    ctx.textAlign = 'center';
    if (rank <= 3) {
      ctx.fillStyle = MEDALS[rank]; ctx.beginPath(); ctx.arc(64, cy, 21, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = t.ink; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#2B1A0E';
    } else ctx.fillStyle = t.inkSoft;
    ctx.font = `800 30px ${EXPORT_DISPLAY}`; ctx.fillText(String(rank), 64, cy + 11);
    ctx.textAlign = 'left';
    ctx.fillStyle = t.ink;
    const ns = fitFont(ctx, esc0(r.pseudo), 800, 30, EXPORT_DISPLAY, w - 320, 20);
    ctx.font = `800 ${ns}px ${EXPORT_DISPLAY}`; ctx.fillText(esc0(r.pseudo), 108, cy + 2);
    ctx.fillStyle = t.inkSoft; ctx.font = `500 13px ${EXPORT_BODY}`;
    ctx.fillText(`${r.exact_scores} score${r.exact_scores > 1 ? 's' : ''} exact${r.exact_scores > 1 ? 's' : ''} · ${r.good_winners} bon${r.good_winners > 1 ? 's' : ''} vainqueur${r.good_winners > 1 ? 's' : ''}`, 108, cy + 22);
    ctx.textAlign = 'right';
    ctx.fillStyle = t.inkSoft; ctx.font = `600 14px ${EXPORT_BODY}`; ctx.fillText('pts', w - 36, cy + 10);
    ctx.fillStyle = t.accentInk || t.accent; ctx.font = `800 38px ${EXPORT_DISPLAY}`; ctx.fillText(String(r.total_points), w - 66, cy + 12);
    ctx.textAlign = 'left';
    if (i < rows.length - 1) paintDotRule(ctx, 36, w - 36, y + hRow, t.inkSoft);
    y += hRow;
  }
  paintExportFooter(ctx, w, h, t);
  downloadCanvas(canvas, 'spin-classement.png');
}

// Bilan de tournoi en image : l'affiche du récap, avec sa touche VHS.

  const w = 820, h = 760;
  const { canvas, ctx } = makeExportCanvas(w, h);
  const circuitLabel = circuit === 'WTT' ? 'Circuit WTT' : 'Pro A';
  const top = paintExportPoster(ctx, w, h, t, key, `Bilan de tournoi · ${circuitLabel} · ${me.n} prono${me.n > 1 ? 's' : ''} jugé${me.n > 1 ? 's' : ''}`, { bandH: 150, burst: true, vhs: true });

  const gx = 36, gap = 18, tw = (w - 2 * gx - gap) / 2, th = 104;
  paintStatTicket(ctx, gx, top + 26, tw, th, t, `#${me.rank}`, 'mon rang', true);
  paintStatTicket(ctx, gx + tw + gap, top + 26, tw, th, t, String(me.pts), me.pts === 1 ? 'point' : 'points');
  paintStatTicket(ctx, gx, top + 26 + th + gap, tw, th, t, String(me.bestStreak), 'meilleure série');
  paintStatTicket(ctx, gx + tw + gap, top + 26 + th + gap, tw, th, t, String(me.exact), `score${me.exact > 1 ? 's' : ''} exact${me.exact > 1 ? 's' : ''}`);

  // Podium : trois marches imprimées, trame qui monte depuis le sol.
  const baseY = h - 96, colW = 200, H = { 1: 128, 2: 98, 3: 76 };
  const order = [[podium[1], 2], [podium[0], 1], [podium[2], 3]];
  const x0 = (w - colW * 3 - 24) / 2;
  ctx.fillStyle = t.ink; ctx.font = `800 22px ${EXPORT_DISPLAY}`; ctx.textAlign = 'left';
  ctx.fillText('Podium du tournoi', gx, top + 26 + 2 * th + gap + 50);
  order.forEach(([row, place], i) => {
    if (!row) return;
    const x = x0 + i * (colW + 12), bh = H[place], y = baseY - bh;
    ctx.fillStyle = MEDALS[place]; ctx.fillRect(x, y, colW, bh);
    paintHalftone(ctx, x, y, colW, bh, 'rgba(0,0,0,.22)', 9, (px, py) => (py - y) / bh);
    ctx.strokeStyle = t.ink; ctx.lineWidth = 2.5; ctx.strokeRect(x, y, colW, bh + 2);
    ctx.fillStyle = '#2B1A0E'; ctx.textAlign = 'center'; ctx.font = `900 34px ${EXPORT_DISPLAY}`;
    ctx.fillText(String(place), x + colW / 2, y + 40);
    ctx.fillStyle = t.ink;
    const ns = fitFont(ctx, esc0(row.pseudo), 800, 24, EXPORT_DISPLAY, colW - 10, 16);
    ctx.font = `800 ${ns}px ${EXPORT_DISPLAY}`; ctx.fillText(esc0(row.pseudo), x + colW / 2, y - 34);
    ctx.fillStyle = t.accentInk || t.accent; ctx.font = `800 22px ${EXPORT_DISPLAY}`;
    ctx.fillText(`${row.pts} pts`, x + colW / 2, y - 10);
  });
  ctx.fillStyle = t.ink; ctx.fillRect(gx, baseY, w - 2 * gx, 3);
  ctx.textAlign = 'left';
  paintExportFooter(ctx, w, h, t);
  const slug = String(key).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  downloadCanvas(canvas, `spin-recap-${slug || 'tournoi'}.png`);
}
// Petit nettoyage pour le texte dessiné sur <canvas> : contrairement au
// HTML, canvas n'a pas besoin d'échappement d'entités, juste d'une chaîne
// propre (évite "undefined"/"null" affichés tels quels).
function esc0(s) { return String(s ?? ''); }

/* ---------- Événements ---------- */
$app.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id ? Number(el.dataset.id) : null, v = el.dataset.v;
  if (act === 'authmode') { S.authMode = S.authMode === 'login' ? 'signup' : 'login'; render(); }
  else if (act === 'logout') { await sb.auth.signOut(); }
  else if (act === 'thememode') {
    S.themeMode = S.themeMode === 'light' ? 'dark' : (S.themeMode === 'dark' ? 'halloween' : 'light');
    try { localStorage.setItem('spin_theme_mode', S.themeMode); } catch (e) { /* ignore */ }
    navigate(render);
  }
  else if (act === 'soundtoggle') {
    S.soundOn = !S.soundOn;
    try { localStorage.setItem('spin_sound_on', S.soundOn ? '1' : '0'); } catch (e) { /* ignore */ }
    if (S.soundOn) playSound('tick'); // petit retour immédiat pour confirmer que le son est bien réactivé
    navigate(render);
  }
  else if (act === 'exportmatch') exportMatchImage(id);
  else if (act === 'exportboard') exportBoardImage();
  else if (act === 'exportrecap') exportRecapImage(el.dataset.key, el.dataset.circuit);
  else if (act === 'recap') { markRecapSeen(el.dataset.circuit, el.dataset.key); S.openRecap = { key: el.dataset.key, circuit: el.dataset.circuit }; S.recapAnimPlayed = false; navigate(render); }
  else if (act === 'recapdismiss') { markRecapSeen(el.dataset.circuit, el.dataset.key); keepRender(); }
  else if (act === 'closerecap') { S.openRecap = null; keepRender(); }
  else if (act === 'tab') {
    if (el.dataset.tab !== S.tab) playSound('tick'); // tap discret, seulement quand on change vraiment d'onglet
    S.tab = el.dataset.tab;
    if (S.tab === 'matches') S._freshMatches = true;
    if (S.tab === 'board') { S.board = null; navigate(render); await loadBoard(); }
    if (S.tab === 'account') { S.myHistory = null; navigate(render); await loadAccount(); }
    navigate(render); window.scrollTo(0, 0);
  }
  else if (act === 'view') { S.view = v; S._freshMatches = true; navigate(render); }
  else if (act === 'circuit') { S.circuit = v; S._freshMatches = true; S.proJournee = null; navigate(render); }
  else if (act === 'journee') { S.proJournee = +v; S._freshMatches = true; navigate(render); }
  else if (act === 'boardscope') { S.boardScope = v; S.board = null; navigate(render); await loadBoard(); navigate(render); }
  else if (act === 'rankview') { S.rankView = v; navigate(render); }
  else if (act === 'rankgender') { S.rankGender = v; navigate(render); }
  else if (act === 'competitor') { S.openCompetitor = id; keepRender(); }
  else if (act === 'closecompetitor') { S.openCompetitor = null; keepRender(); }
  else if (act === 'badge') { S.openBadge = el.dataset.badge; playSound('tick'); keepRender(); }
  else if (act === 'closebadge') { S.openBadge = null; keepRender(); }
  else if (act === 'stop') { /* clic à l'intérieur de la fiche détail : ne pas la fermer */ }
  else if (act === 'pick') pick(id, Number(el.dataset.a), Number(el.dataset.b));
  else if (act === 'balles') setBalles(id, Number(v));
  else if (act === 'friends') toggleFriends(id);
  else if (act === 'adm-result') saveResult(id);
  else if (act === 'adm-cancel') cancelMatch(id);
  else if (act === 'adm-delete') deleteMatch(id);
  else if (act === 'adm-rank') saveRank(id);
  else if (act === 'adm-worldrank') saveWorldRank(id);
  else if (act === 'adm-roster') saveRoster(id);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.openCompetitor) { S.openCompetitor = null; keepRender(); }
  if (e.key === 'Escape' && S.openBadge) { S.openBadge = null; keepRender(); }
  if (e.key === 'Escape' && S.openRecap) { S.openRecap = null; keepRender(); }
});
$app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'authform') submitAuth(e.target);
  else if (e.target.id === 'addmatch') addMatch(e.target);
});
$app.addEventListener('change', e => {
  if (e.target.id === 'adm-circuit') { S.adminCircuit = e.target.value; keepRender(); }
});

/* ---------- Démarrage ---------- */
// Sert à rendre le site installable sur mobile (icône sur l'écran d'accueil,
// ouverture en plein écran). N'empêche pas le site de marcher si ça échoue
// (navigateur trop ancien, page ouverte en local) : on l'enregistre sans bloquer.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

async function boot() {
  if (!window.supabase) {
    $app.innerHTML = '<div class="auth"><h1>Oups</h1><p class="lead">Impossible de charger le service de connexion. Vérifie ta connexion internet et recharge la page.</p></div>';
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange((event, session) => { setTimeout(() => handleSession(session), 0); });
  const { data } = await sb.auth.getSession();
  handleSession(data.session);
}
boot();
</script>
