// d'affilée (bon vainqueur, score exact ou pas), plus le prochain
// pronostic gagnant rapporte de points. "streakBefore" = nombre de pronos
// gagnants d'affilée JUSTE AVANT ce match (jamais ce match lui-même) :
// appelant doit le calculer à partir de l'historique chronologique de la
// personne (voir computeStreakSeries / myStreakInfo plus bas). Formule et
// paliers IDENTIQUES à ceux de la vue SQL "prediction_points"
// (ajout-bonus-serie.sql) : c'est elle qui fait foi pour le classement,
// cette fonction n'est qu'un miroir pour l'affichage côté client.
//   0–2  pronos gagnants d'affilée -> x1.00 (pas de bonus)
//   3–4                            -> x1.15 (palier "vert")
//   5–6                            -> x1.28 (palier "orange")
//   7–9                            -> x1.45 (palier "violet")
//   10+                            -> x1.60, +0.02 par palier supplémentaire,
//                                      plafonné à x1.75 (palier "bleu")
function streakMult(streak) {
  const s = Math.max(0, streak || 0);
  if (s <= 2) return 1;
  if (s <= 4) return 1.15;
  if (s <= 6) return 1.28;
  if (s <= 9) return 1.45;
  return Math.min(1.60 + 0.02 * (s - 10), 1.75);
}
// Palier visuel (couleur de flamme) pour une longueur de série donnée.
// Ordre volontaire et explicite, demandé par le projet : vert -> orange ->
// violet -> bleu, le bleu étant le palier le plus haut (le plus "chaud"),
// même si la couleur lit habituellement "froid".
function flameTier(streak) {
  const s = Math.max(0, streak || 0);
  if (s >= 10) return 4;
  if (s >= 7) return 3;
  if (s >= 5) return 2;
  if (s >= 3) return 1;
  return 0;
}
const FLAME_COLORS = ['var(--ink-soft)', '#3DBB6B', '#E6862B', '#9A5CE0', '#3E9AE8'];
const FLAME_LABELS = ['', 'vert', 'orange', 'violet', 'bleu'];
// Petite flamme en SVG inline (pas d'image). Palier 0 : pas de flamme,
// juste une étincelle neutre discrète pour ne pas alourdir l'affichage
// quand il n'y a pas encore de bonus en jeu.
// En mode Halloween, la même mécanique de paliers (FLAME_COLORS, inchangée)
// est dessinée comme une petite citrouille sculptée plutôt qu'une flamme —
// voir pumpkinSvg ci-dessous. La couleur/le sens (vert -> orange -> violet
// -> bleu = palier le plus "chaud") ne change pas, seule la forme change.
function flameSvg(streak, size) {
  size = size || 16;
  const tier = flameTier(streak), color = FLAME_COLORS[tier];
  if (S.themeMode === 'halloween') return pumpkinSvg(tier, color, size);
  if (tier === 0) {
    return `<svg class="flameicon t0" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v6M12 15v6M4.5 12h5M14.5 12h5"/></svg>`;
  }
  return `<svg class="flameicon t${tier} flameflick" width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}" aria-hidden="true" style="filter:drop-shadow(0 0 4px ${color})">
    <path d="M12 2c1 3-3 4.6-3 8a3 3 0 0 0 6 0c0-1-.5-1.9-1-2.6 2.1 1.1 3.6 3.4 3.6 6A5.6 5.6 0 1 1 6.4 13.4C6.4 8.9 9.5 5.1 12 2Z"/>
  </svg>`;
}
// Variante Halloween de flameSvg : une petite citrouille sculptée, lisible
// à 15-18px. Palier 0 : juste un contour (pas encore de bougie allumée).
// À partir du palier 1, le visage sculpté s'éclaire dans la couleur du
// palier (même tableau FLAME_COLORS que la flamme) avec une lueur qui
// s'intensifie aux paliers supérieurs, et un sourire qui se fait un peu
// plus dentelé au palier 2 et au-delà — un clin d'œil, pas une surcharge.
function pumpkinSvg(tier, color, size) {
  size = size || 16;
  if (tier === 0) {
    return `<svg class="flameicon t0" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2.6v2"/>
      <ellipse cx="12" cy="14" rx="8" ry="7"/>
      <path d="M9 12.3l1.6 1.6-1.6 1.6M15 12.3l-1.6 1.6 1.6 1.6"/>
    </svg>`;
  }
  const glow = (2.5 + tier * 1.4).toFixed(1);
  const mouth = tier >= 2
    ? `<path d="M8 17.1q.9-1.3 1.8 0t1.8 0 1.8 0 1.8 0" stroke="#1B1322" stroke-width="1.4" stroke-linecap="round" fill="none"/>`
    : `<path d="M8.4 17.2q3.6 2 7.2 0" stroke="#1B1322" stroke-width="1.4" stroke-linecap="round" fill="none"/>`;
  return `<svg class="flameicon t${tier} flameflick" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" style="filter:drop-shadow(0 0 ${glow}px ${color})">
    <path d="M11.4 2.2c.5.9-.2 1.5.3 2.1" stroke="#4A7A33" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <ellipse cx="12" cy="13.6" rx="8.3" ry="7.3" fill="${color}"/>
    <path d="M12 6.6v14M8.4 7.7c1 3.5 1 9.8 0 12.5M15.6 7.7c-1 3.5-1 9.8 0 12.5" stroke="rgba(0,0,0,.25)" stroke-width="1" fill="none"/>
    <path d="M8.3 12l1.8 1.8-1.8 1.8M15.7 12l-1.8 1.8 1.8 1.8" stroke="#1B1322" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    ${mouth}
  </svg>`;
}
// Pastille "série" : flamme colorée + chiffre, et éventuellement le
// pourcentage de bonus qu'elle offrirait sur le prochain pronostic gagnant.
function streakBadgeHtml(streak, showPct) {
  const tier = flameTier(streak), pct = Math.round((streakMult(streak) - 1) * 100);
  return `<span class="streakbadge t${tier}" title="Série de ${streak} pronostic${streak > 1 ? 's' : ''} gagnant${streak > 1 ? 's' : ''} d'affilée${tier ? ` (palier ${esc(FLAME_LABELS[tier])})` : ''}">${flameSvg(streak, 15)}<b>${streak}</b>${showPct && pct > 0 ? `<small>+${pct}%</small>` : ''}</span>`;
}

// --- Balles (mise stratégique par tournoi) : au début de chaque tournoi WTT
// (une valeur de m.competition) ou de chaque journée Pro A (une valeur de
// m.round -- même regroupement que byTournament/byJournee dans accountView()),
// chacun reçoit un petit stock de balles à miser sur ses pronostics de CE
// tournoi : 4 pour un tournoi WTT, 2 pour une journée de Pro A (qui compte
// deux fois moins de matchs). 3 balles au maximum sur un même match.
// Les balles ne se récupèrent JAMAIS en cours de tournoi, qu'on gagne ou
// qu'on perde le match sur lequel elles sont misées : la mise est déduite dès
// qu'elle est posée. Seul son MONTANT peut encore être changé (augmenté ou
// diminué) tant que le match n'a pas commencé -- voir setBalles().
//
// Effet : si le prono est gagnant (bon vainqueur ou score exact), chaque
// balle ajoute +1 au multiplicateur (1 balle = x2, 2 = x3, 3 = x4).
// Rééquilibrage : le bonus de série et les balles s'ADDITIONNENT au lieu de
// se multiplier entre eux -> multiplicateur = série + balles, sur le barème
// de base (1 ou 3 points), un seul arrondi final ; le bonus outsider
// continue de s'ajouter par-dessus sans jamais être multiplié.
// Avant ce rééquilibrage (10 balles, max 5, série x balles), une simulation
// de saison montrait que les balles faisaient ~65 % des points et qu'un seul
// match pouvait rapporter ~37 points ; avec ces règles : ~34 % et ~19 max.
// Formule et chiffres IDENTIQUES à ceux de la vue SQL "prediction_points"
// (reequilibrage-balles.sql) : c'est elle qui fait foi pour le classement,
// cette fonction n'est qu'un miroir d'affichage.
// Exemple : score exact (3 pts), série de 5 pronos gagnants avant ce match
// (x1.28), 2 balles misées (+2) -> round(3 * (1.28 + 2)) = round(9.84)
// = 10 points (+ bonus outsider éventuel).
const BALLES_STOCK_BY_CIRCUIT = { WTT: 4, PRO_A: 2 }; // stock au début de chaque tournoi WTT / journée Pro A
const BALLES_MAX_PER_MATCH = 3;   // plafond par match
const BALLES_BONUS_PER = 1;       // +1 au multiplicateur par balle misée, si gagnant
const BALLES_MULT_CEILING = 4;    // plafond du multiplicateur de balles (3 balles : 1+1*3)
function ballesStock(m) {
  return BALLES_STOCK_BY_CIRCUIT[m && m.circuit] || 4;
}

// Clé de regroupement "tournoi" d'un match pour le budget de balles : un
// tournoi WTT (m.competition) ou une journée Pro A (m.round) -- jamais mélangé
// entre deux tournois WTT ni entre deux journées Pro A différentes.
function ballesScopeKey(m) {
  return m.circuit === 'WTT' ? (m.competition || 'WTT') : (m.round || m.competition || 'Pro A');
}
// Multiplicateur de points pour N balles misées (0 balle = x1, exactement le
// comportement d'avant cet ajout : rétro-compatible avec tout pronostic jugé
// sans donnée de mise).
function ballesMult(staked) {
  const n = Math.max(0, Math.min(staked || 0, BALLES_MAX_PER_MATCH));
  return Math.min(1 + BALLES_BONUS_PER * n, BALLES_MULT_CEILING);
}
// Balles déjà dépensées par la personne connectée sur le même tournoi/journée
// que `m` (toutes les entrées de S.myPreds dont le match correspondant
// partage la même scope), hors le match `excludeMatchId` le cas échéant --
// pour pouvoir calculer "combien puis-je encore mettre sur CE match-ci" sans
// compter sa propre mise actuelle en double. Basé sur S.myPreds/S.matches
// déjà chargés : aucune requête réseau supplémentaire.
function ballesSpentInScope(m, excludeMatchId) {
  const scope = ballesScopeKey(m);
  let spent = 0;
  for (const midStr in S.myPreds) {
    const mid = +midStr;
    if (excludeMatchId != null && mid === excludeMatchId) continue;
    const p = S.myPreds[mid];
    if (!p || !p.balles_staked) continue;
    const mm = S.matches.find(x => x.id === mid);
    if (!mm || mm.circuit !== m.circuit || ballesScopeKey(mm) !== scope) continue;
    spent += p.balles_staked;
  }
  return spent;
}
// Balles encore disponibles pour ce tournoi/journée, en excluant la mise déjà
// posée sur `m` elle-même (donc : "combien puis-je au total mettre sur ce
// match" = ballesRemaining(m, m.id), mise actuelle de ce match comprise).
function ballesRemaining(m, excludeMatchId) {
  return Math.max(0, ballesStock(m) - ballesSpentInScope(m, excludeMatchId));
}
// Petite icône "balle" en SVG inline (même esprit que flameSvg/MARK : pas
// d'image, juste un trait fin qui prend la couleur courante).
function ballIcon(size) {
  size = size || 13;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M8.2 6.6q2.4 5.4 0 10.8" stroke-width="1.3" opacity=".6"/></svg>`;
}
// Budget de balles d'un groupe de matchs (ex : l'en-tête d'un tournoi dans
// matchesView) : n'affiche un total que si tous les matchs du groupe
// partagent bien la même scope tournoi/journée (sinon le nombre serait
// trompeur -- ça n'arrive qu'en filtre "Tous" si plusieurs journées Pro A
// sont affichées ensemble, jamais dans les onglets WTT/Pro A filtrés).
function groupBallesBudgetHtml(matches) {
  if (!matches.length) return '';
  const scopes = new Set(matches.map(ballesScopeKey));
  if (scopes.size !== 1) return '';
  const rem = ballesRemaining(matches[0], null);
  return `<span class="ballesbudget" title="Balles encore disponibles pour ce tournoi">${ballIcon(12)}${rem}/${ballesStock(matches[0])}</span>`;
}
// Mini-stepper de mise, affiché sous le panneau de pronostic d'un match pas
// encore jugé : visible seulement une fois un prono posé (on mise SUR un
// pronostic existant, pas dans le vide), boutons désactivés une fois le match
// verrouillé (même convention que les pastilles de score, voir chips()).
function ballesStepperHtml(m) {
  const mine = S.myPreds[m.id];
  if (!mine) return '';
  const locked = isLocked(m);
  const staked = mine.balles_staked || 0;
  const cap = Math.min(BALLES_MAX_PER_MATCH, ballesRemaining(m, m.id));
  const pct = Math.round((ballesMult(staked) - 1) * 100);
  return `<div class="ballesrow">
    <span class="balleslabel">${ballIcon(13)}Balles misées</span>
    <div class="ballesstepper">
      <button type="button" class="ballesbtn" data-act="balles" data-id="${m.id}" data-v="${Math.max(0, staked - 1)}" aria-label="Retirer une balle" ${locked || staked <= 0 ? 'disabled' : ''}>−</button>
      <b>${staked}</b>
      <button type="button" class="ballesbtn" data-act="balles" data-id="${m.id}" data-v="${staked + 1}" aria-label="Ajouter une balle" ${locked || staked >= cap ? 'disabled' : ''}>+</button>
    </div>
    <small class="ballespct">${staked > 0 ? `×${ballesMult(staked)} si gagnant (+${pct}%)` : `jusqu'à ${cap} ici`}</small>
  </div>`;
}
// À partir d'un historique déjà trié chronologiquement (du plus ancien au
// plus récent), calcule pour chaque entrée la série EN COURS avant et
// après ce match. "bonVainqueur" = la victoire était la bonne (score exact
// ou pas), seul critère qui fait avancer la série (voir énoncé : "un
// pronostic victorieux = qui a rapporté au moins un point"). m peut être
// soit l'objet match directement, soit h.matches (forme renvoyée par
// loadAccount()).
function computeStreakSeries(sortedFinished) {
  let streak = 0;
  return sortedFinished.map(h => {
    const m = h.matches || h;
    const bonVainqueur = Math.sign(h.pred_a - h.pred_b) === Math.sign(m.score_a - m.score_b);
    const streakBefore = streak;
    streak = bonVainqueur ? streak + 1 : 0;
    return { ...h, streakBefore, streakAfter: streak, bonVainqueur };
  });
}
// Série actuelle de la personne connectée + table match_id -> série AVANT
// ce match, à partir de S.myHistory (chargé par loadAccount(), aussi
// déclenché en tâche de fond dès la connexion — voir loadAll()). Renvoie
// des valeurs neutres tant que l'historique n'est pas encore chargé : la
// vue SQL reste de toute façon la seule source de vérité pour les points
// réellement enregistrés.
function myStreakInfo() {
  if (!S.myHistory) return { before: new Map(), now: 0 };
  const sorted = S.myHistory.filter(h => h.matches && h.matches.status === 'finished')
    .sort((a, b) => new Date(a.matches.starts_at) - new Date(b.matches.starts_at) || a.match_id - b.match_id);
  const withStreak = computeStreakSeries(sorted);
  const before = new Map(withStreak.map(h => [h.match_id, h.streakBefore]));
  const now = withStreak.length ? withStreak[withStreak.length - 1].streakAfter : 0;
  return { before, now };
}
function pointsDetail(m, p, streakBefore) {
  if (m.status !== 'finished' || !p) return null;
  const exact = p.pred_a === m.score_a && p.pred_b === m.score_b;
  const bonVainqueur = Math.sign(p.pred_a - p.pred_b) === Math.sign(m.score_a - m.score_b);
  const base = exact ? 3 : (bonVainqueur ? 1 : 0);
  const mult = bonVainqueur ? streakMult(streakBefore) : 1;
  const withStreak = Math.round(base * mult);
  const streakBonus = withStreak - base;
  // Balles : s'ADDITIONNENT au bonus de série (voir le commentaire au-dessus
  // de BALLES_STOCK_BY_CIRCUIT) ; plafonnées à BALLES_MAX_PER_MATCH, y
  // compris pour d'anciennes mises posées avant le rééquilibrage. Un seul
  // arrondi final ; 0 balle -> withBalles === withStreak (rien ne change
  // pour les pronostics sans mise).
  const staked = p.balles_staked || 0;
  const counted = bonVainqueur ? Math.max(0, Math.min(staked, BALLES_MAX_PER_MATCH)) : 0;
  const withBalles = Math.round(base * (mult + BALLES_BONUS_PER * counted));
  const ballesBonus = withBalles - withStreak;
  const bonus = outsiderBonus(m, bonVainqueur);
  return { total: withBalles + bonus, base, bonus, streakBonus, ballesBonus, balles: staked, exact, streakBefore: streakBefore || 0 };
}
// Série de n'importe quel joueur JUSTE AVANT un match jugé, à partir de
// S.allJudgedPreds (pronostics de tout le monde déjà jugés, chargés par
// loadAccount) : même calcul que le récap et que la vue SQL. Sert à afficher
// sous un match les mêmes points que ceux comptés au classement. Mis en
// cache tant que S.allJudgedPreds ne change pas ; 0 tant qu'il n'est pas
// encore chargé.
let _streakCache = { src: null, map: null };
function streakBeforeFor(userId, matchId) {
  const src = S.allJudgedPreds;
  if (!src) return 0;
  if (_streakCache.src !== src) {
    const byUser = {};
    for (const r of src) { if (r.matches) (byUser[r.user_id] || (byUser[r.user_id] = [])).push(r); }
    const map = new Map();
    for (const uid in byUser) {
      const sorted = byUser[uid].slice().sort((a, b) => new Date(a.matches.starts_at) - new Date(b.matches.starts_at) || a.match_id - b.match_id);
      for (const h of computeStreakSeries(sorted)) map.set(uid + ':' + h.match_id, h.streakBefore);
    }
    _streakCache = { src, map };
  }
  return _streakCache.map.get(userId + ':' + matchId) || 0;
}
function points(m, p, streakBefore) {
  const d = pointsDetail(m, p, streakBefore);
  return d ? d.total : null;
}
// Historique de MES pronostics déjà jugés, trié chronologiquement, avec pour
// chacun la série en cours avant/après (streakBefore/streakAfter) et le
// détail des points (pt). Base commune à accountView() ET aux badges
// (computeBadges), pour ne jamais faire dériver les deux calculs. Renvoie
// null tant que S.myHistory n'est pas encore chargé (voir loadAccount()).
function myJudgedHistory() {
  if (S.myHistory === null) return null;
  const sortedChrono = S.myHistory
    .filter(h => h.matches && h.matches.status === 'finished')
    .sort((a, b) => new Date(a.matches.starts_at) - new Date(b.matches.starts_at) || a.match_id - b.match_id);
  return computeStreakSeries(sortedChrono).map(h => ({ ...h, pt: pointsDetail(h.matches, h, h.streakBefore) }));
}

/* ---------- Chargement des données ---------- */
async function reloadMatches() {
  const since = new Date(Date.now() - 90 * 864e5).toISOString();
  const r = await sb.from('matches').select('*').gte('starts_at', since).order('starts_at', { ascending: true }).limit(500);
  if (r.error) throw r.error;
  S.matches = r.data || [];
}
// Supabase ne renvoie jamais plus de 1000 lignes par requête (réglage "Max
// rows"), quel que soit le .limit() demandé : au-delà, des joueurs, des
// pronos ou des matchs manquaient sans prévenir (classements incomplets,
// séries fausses...). On lit donc page par page, dans un ordre stable.
async function fetchAllRows(build) {
  const all = [];
  for (let from = 0; ; from += 1000) {
    const r = await build().range(from, from + 999);
    if (r.error) return { data: null, error: r.error };
    all.push(...(r.data || []));
    if (!r.data || r.data.length < 1000) return { data: all, error: null };
  }
}
async function reloadCompetitors() {
  const r = await fetchAllRows(() => sb.from('competitors').select('*').order('id'));
  if (r.error) throw r.error;
  S.competitors = {};
  (r.data || []).forEach(c => { S.competitors[c.id] = c; });
}
async function loadAll() {
  const uid = S.session.user.id;
  const [p, preds, adm] = await Promise.all([
    sb.from('profiles').select('pseudo').eq('id', uid).maybeSingle(),
    fetchAllRows(() => sb.from('predictions').select('*').eq('user_id', uid).order('id')),
    sb.rpc('is_admin')
  ]);
  await Promise.all([reloadMatches(), reloadCompetitors()]);
  S.pseudo = (p.data && p.data.pseudo) || '';
  S.myPreds = {};
  (preds.data || []).forEach(x => { S.myPreds[x.match_id] = x; });
  S.isAdmin = adm.data === true;
  loadBoard().then(render); // chargé à part : n'empêche pas la connexion s'il échoue
  loadWorldRankings().then(() => { if (S.tab === 'rankings') render(); });
  loadAccount().then(render); // idem : pour la pastille de série sur les cartes de match, sans bloquer la connexion
}
// Vrai classement mondial WTT (top 100 de chaque tableau), enregistré par le
// robot de synchronisation dans world_rankings (voir
// classement-mondial-complet.sql). Table absente ou vide -> [] : l'onglet
// garde alors l'ancien affichage, basé sur les seuls joueurs suivis.
async function loadWorldRankings() {
  try {
    const r = await sb.from('world_rankings').select('gender,pos,rank,name,country,points,competitor_id').order('gender').order('pos');
    S.worldRankings = r.error ? [] : (r.data || []);
  } catch (e) { S.worldRankings = []; }
}
async function loadBoard() {
  const q = S.boardScope === 'ALL'
    ? sb.from('leaderboard').select('*')
    : sb.from('leaderboard_by_circuit').select('*').eq('circuit', S.boardScope);
  const r = await q.order('total_points', { ascending: false }).order('exact_scores', { ascending: false });
  if (r.error) { toast(friendlyError(r.error), true); S.board = []; return; }
  S.board = r.data || [];
}
// Historique complet des pronostics du compte (pas limité aux 90 derniers
// jours comme S.matches), avec le match associé : sert à calculer les
// statistiques personnelles de l'onglet "Mon compte" sur toute la durée du
// jeu, pas seulement sur les matchs encore affichés ailleurs dans l'appli.
async function loadAccount() {
  try {
    const uid = S.session.user.id;
    // circuitBoard (tous circuits, tout le monde) et allJudgedPreds (les
    // pronostics de TOUT LE MONDE sur les matchs déjà terminés) ne servent
    // qu'aux badges (comparaison "Expert WTT/Pro A" et duel "Le Rival") :
    // pas besoin de requête supplémentaire côté sécurité, la policy RLS
    // "voir pronostics" autorise déjà la lecture des pronostics d'autrui une
    // fois le match terminé, et leaderboard_by_circuit est déjà une vue
    // publique existante (utilisée par l'onglet Classements).
    const [h, b, cb, ap] = await Promise.all([
      fetchAllRows(() => sb.from('predictions')
        .select('pred_a,pred_b,match_id,created_at,balles_staked,matches(circuit,status,score_a,score_b,seed_a,seed_b,starts_at,competition,round,side_a,side_b,wins_needed)')
        .eq('user_id', uid).order('id')),
      sb.from('leaderboard').select('*').order('total_points', { ascending: false }).order('exact_scores', { ascending: false }),
      sb.from('leaderboard_by_circuit').select('*'),
      // competition/round/tier ajoutés à ce select existant (et uniquement
      // à celui-ci) pour pouvoir regrouper ces pronostics de tout le monde
      // par tournoi WTT / journée Pro A dans le bilan animé — sans requête
      // supplémentaire, juste trois colonnes de plus sur une jointure déjà
      // là pour les badges.
      fetchAllRows(() => sb.from('predictions')
        .select('user_id,match_id,pred_a,pred_b,balles_staked,matches(circuit,status,score_a,score_b,seed_a,seed_b,starts_at,competition,round,tier)')
        .order('id')),
    ]);
    if (h.error) throw h.error;
    if (b.error) throw b.error;
    S.myHistory = h.data || [];
    S.accountBoard = b.data || [];
    S.circuitBoard = cb.error ? [] : (cb.data || []);
    // Seuls les pronostics (de tout le monde) déjà jugés arrivent ici de
    // toute façon via la policy RLS ; le filtre n'est qu'une double sécurité.
    S.allJudgedPreds = (ap.error ? [] : (ap.data || [])).filter(r => r.matches && r.matches.status === 'finished');
    checkStreakMilestone();
    // "Trône de courte durée" (voir computeBadges) : le classement général
    // est calculé en direct, jamais stocké dans le temps — on se contente
    // donc de retenir, en local sur cet appareil, qu'on a déjà vu son propre
    // nom en tête au moins une fois. Un souvenir, pas une preuve officielle.
    try {
      if (S.accountBoard.length && S.accountBoard[0].user_id === uid) {
        localStorage.setItem('spin_was_first', '1');
      }
    } catch (e) { /* stockage indisponible : tant pis pour ce petit souvenir */ }
    checkNewBadges();
  } catch (e) {
    toast(friendlyError(e), true);
    S.myHistory = S.myHistory || [];
    S.accountBoard = S.accountBoard || [];
    S.circuitBoard = S.circuitBoard || [];
    S.allJudgedPreds = S.allJudgedPreds || [];
  }
}

/* ---------- Session ---------- */
async function handleSession(session) {
  if (!session) {
    S.session = null; S.pseudo = ''; S.isAdmin = false; S.matches = []; S.myPreds = {}; S.board = null;
    render(); return;
  }
  if (S.session && S.session.user.id === session.user.id) { S.session = session; return; }
  S.session = session;
  $app.innerHTML = '<div class="loading">Chargement…</div>';
  try { await loadAll(); S.bootError = ''; }
  catch (e) { S.bootError = friendlyError(e); }
  render();
}

/* --- Matchs ---
   Au lieu d'un gros bandeau de bienvenue en haut de l'écran (ancienne
   maquette), l'accueil mène directement à l'essentiel : deux tuiles de
   stats compactes, puis la liste groupée par compétition — comme on
   ouvrirait une vraie app de scores plutôt qu'un tableau de bord perso. */
function matchesView() {
  // "fresh" : la liste vient d'être ouverte ou filtrée (pas juste un prono posé
  // ailleurs sur la même liste) -> les rangées ont le droit de rejouer leur entrée.
  const fresh = S._freshMatches; S._freshMatches = false;
  const list = S.matches.filter(m => S.circuit === 'ALL' || m.circuit === S.circuit);
  const up = list.filter(m => (m.status === 'scheduled' || m.status === 'live') && !isAwaitingResult(m)).sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const doneAll = list.filter(m => m.status === 'finished' || m.status === 'cancelled' || isAwaitingResult(m));
  const done = doneAll.slice().sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at)).slice(0, 60);
  let shown = S.view === 'upcoming' ? up : done;

  // Pro A : un onglet "journée" plutôt qu'un défilement infini. On choisit
  // automatiquement la journée la plus pertinente (la prochaine à venir,
  // sinon la dernière) tant que l'utilisateur n'a pas cliqué lui-même.
  let journeeRow = '';
  if (S.circuit === 'PRO_A') {
    const journeeOf = m => { const mm = /^Journée (\d+)$/.exec(m.round || ''); return mm ? +mm[1] : null; };
    const nums = [...new Set(list.map(journeeOf).filter(n => n !== null))].sort((a, b) => a - b);
    if (nums.length) {
      if (S.proJournee === null || !nums.includes(S.proJournee)) {
        const nextUp = up.map(journeeOf).find(n => n !== null);
        S.proJournee = nextUp ?? nums[nums.length - 1];
      }
      journeeRow = `<div class="journeerow" role="group" aria-label="Journée">
        ${nums.map(n => `<button class="jchip" data-act="journee" data-v="${n}" aria-pressed="${S.proJournee === n}">Journée ${n}</button>`).join('')}
      </div>`;
      shown = shown.filter(m => journeeOf(m) === S.proJournee);
    }
  }

  const streakInfo = myStreakInfo();
  let body = '';
  if (!shown.length) {
    body = `<div class="empty">${S.view === 'upcoming'
      ? (S.isAdmin ? "Aucun match à venir. Ajoute le premier dans l'onglet Admin." : (S.circuit === 'PRO_A' ? "Aucun match à venir pour cette journée." : "Aucun match à venir pour le moment. Ils apparaissent ici dès qu'ils sont ajoutés."))
      : (S.circuit === 'PRO_A' ? "Aucun match terminé pour cette journée." : "Aucun match terminé pour l'instant.")}</div>`;
  } else {
    // Groupé par compétition (comme un bandeau de championnat Flashscore),
    // puis par jour à l'intérieur de chaque compétition.
    const groups = [];
    for (const m of shown) {
      let g = groups[groups.length - 1];
      if (!g || g.competition !== m.competition) { g = { competition: m.competition, matches: [] }; groups.push(g); }
      g.matches.push(m);
    }
    let i = 0;
    body = groups.map(g => {
      const n = g.matches.length;
      let lastDay = '', rows = '';
      for (const m of g.matches) {
        const d = fmtDay(m.starts_at);
        if (d !== lastDay) { rows += `<div class="day">${esc(d)}</div>`; lastDay = d; }
        rows += matchRow(m, fresh, i++, streakInfo);
      }
      return `<section class="compgroup" style="${themeVarsCss(themeKeyFor(g.matches[0]))}"><div class="complabel"><span class="compbar" aria-hidden="true"></span>
        <div><b>${esc(g.competition)}</b><small>${n} match${n > 1 ? 's' : ''}</small></div>${groupBallesBudgetHtml(g.matches)}</div>
        <div class="complist">${rows}</div></section>`;
    }).join('');
  }
  const cnt = n => `<span class="cnt">${n}</span>`;
  return statRow(up) + recapNotice() + `<div class="pillrow">`
    + segRow([['upcoming', `À venir ${cnt(up.length)}`], ['done', `Terminés ${cnt(doneAll.length)}`]], S.view, 'view').replace('<div class="pillrow"', '<div class="pillrow" style="margin:0"')
    + `</div>`
    + segRow([['ALL', 'Tous'], ['WTT', 'WTT'], ['PRO_A', 'Pro A']], S.circuit, 'circuit')
    + journeeRow + body;
}
// --- "Le récap est prêt" : dès qu'un tournoi WTT / une journée Pro A sur
// lequel tu as pronostiqué est entièrement joué, un bandeau le signale en
// haut de l'onglet Matchs (le récap restait sinon caché dans "Mon compte").
// Un seul à la fois (le plus récent), seulement s'il date de moins de 14
// jours, et plus jamais une fois ouvert ou fermé : souvenir local à cet
// appareil (comme spin_was_first), sans rien stocker côté serveur.
const RECAP_SEEN_KEY = 'spin_recap_seen';
function recapSeenList() {
  try { const v = JSON.parse(localStorage.getItem(RECAP_SEEN_KEY) || '[]'); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}
function markRecapSeen(circuit, key) {
  try {
    const id = circuit + '|' + key;
    const list = recapSeenList().filter(x => x !== id);
    list.push(id);
    localStorage.setItem(RECAP_SEEN_KEY, JSON.stringify(list.slice(-60)));
  } catch (e) { /* stockage indisponible : le bandeau reviendra, sans gravité */ }
}
function pendingRecap() {
  const finished = myJudgedHistory();
  if (!finished || !finished.length || !S.allJudgedPreds || !S.accountBoard) return null;
  const seen = new Set(recapSeenList());
  const groups = new Map();
  for (const h of finished) {
    const m = h.matches, key = tournamentGroupKey(m), id = m.circuit + '|' + key;
    const g = groups.get(id) || { id, circuit: m.circuit, key, last: m.starts_at };
    if (m.starts_at > g.last) g.last = m.starts_at;
    groups.set(id, g);
  }
  const since = Date.now() - 14 * 864e5;
  return [...groups.values()]
    .filter(g => !seen.has(g.id) && new Date(g.last).getTime() >= since && isTournamentFinished(g.circuit, g.key))
    .sort((a, b) => new Date(b.last) - new Date(a.last))[0] || null;
}
function recapNotice() {
  const g = pendingRecap();
  if (!g) return '';
  const data = computeRecapData(g.key, g.circuit);
  if (!data || !data.me) return '';
  const themeKey = Object.keys(THEME).find(k => THEME[k] === data.theme) || 'ALL';
  return `<section class="recapnotice" style="${themeVarsCss(themeKey)}" aria-label="Récap disponible">
    <button class="recapnotice-close" data-act="recapdismiss" data-key="${esc(g.key)}" data-circuit="${esc(g.circuit)}" aria-label="Masquer ce bandeau">&times;</button>
    <span class="recapnotice-rec" aria-hidden="true"><i></i>REC</span>
    <p class="recapnotice-kicker">Le récap est prêt</p>
    <h2 class="recapnotice-title">${esc(g.key)}</h2>
    <p class="recapnotice-sub">Ton rang, tes points et le podium entre amis t'attendent.</p>
    <button class="btn small" data-act="recap" data-key="${esc(g.key)}" data-circuit="${esc(g.circuit)}">Voir le récap</button>
  </section>`;
}
// Tuiles de stats personnelles : ce qu'il reste à prédire, et ta position au
// classement. Deux chiffres au lieu d'un bandeau de bienvenue.
function statRow(upcoming) {
  const todo = upcoming.filter(m => !isLocked(m) && !S.myPreds[m.id]).length;
  const mine = S.board && S.board.find(r => r.user_id === S.session.user.id);
  return `<div class="statrow">
    <div class="stattile"><b class="${todo ? 'accent' : ''}">${todo}</b><span>${todo ? `prono${todo > 1 ? 's' : ''} à faire` : 'à jour, bien joué'}</span></div>
    <div class="stattile"><b>${mine ? mine.total_points : '—'}</b><span>${mine ? `point${mine.total_points > 1 ? 's' : ''} · ${ordinalRank(S.board, mine)}` : 'pas encore de points'}</span></div>
  </div>`;
}
function ordinalRank(board, mine) {
  let rank = 1, prev = null;
  for (let i = 0; i < board.length; i++) {
    const k = board[i].total_points + '/' + board[i].exact_scores;
    if (k !== prev) { rank = i + 1; prev = k; }
    if (board[i].user_id === mine.user_id) return rank + (rank === 1 ? 'er' : 'e');
  }
  return '';
}

// Génère les pastilles de score pour un camp (inchangé dans sa logique :
// toujours n scores possibles, le choisi marqué aria-pressed, data-act="pick"
// pour le câblage des clics) — seul le style de pastille change.
function chips(m, side, mine, disabled) {
  const n = m.wins_needed, out = [];
  for (let k = 0; k < n; k++) {
    const a = side === 'A' ? n : k, b = side === 'A' ? k : n;
    const sel = !!mine && mine.pred_a === a && mine.pred_b === b;
    const who = side === 'A' ? m.side_a : m.side_b;
    out.push(`<button class="scorebtn" data-act="pick" data-id="${m.id}" data-a="${a}" data-b="${b}" aria-pressed="${sel}" aria-label="${esc(who)} gagne ${a} à ${b}" ${disabled ? 'disabled' : ''}>${a}–${b}</button>`);
  }
  return `<div class="scores">${out.join('')}</div>`;
}

// Une rangée dense par match (style SofaScore/Flashscore) : heure/statut à
// gauche, deux noms empilés au centre avec le score ou le prono à droite.
// Le panneau de prédiction (grille de pick'em) est toujours affiché sous la
// rangée pour un match à venir — pas replié, pour que le geste de prono
// reste visible et accessible d'un seul geste, comme demandé pour une appli
// entre copains plutôt qu'un produit pro surchargé d'options.
function matchRow(m, fresh, i, streakInfo) {
  streakInfo = streakInfo || { before: new Map(), now: 0 };
  const locked = isLocked(m), mine = S.myPreds[m.id];
  const awaiting = isAwaitingResult(m);
  const fin = m.status === 'finished', canc = m.status === 'cancelled', live = m.status === 'live' && !awaiting;
  const winA = fin && m.score_a > m.score_b, winB = fin && m.score_b > m.score_a;
  const ca = S.competitors[m.competitor_a_id], cb = S.competitors[m.competitor_b_id];
  const flag = flagHtml;
  const rk = c => {
    if (!c || !c.ranking) return '';
    return c.circuit === 'WTT' ? `<strong>#${c.ranking}</strong>` : c.ranking;
  };
  const nameBtn = (c, label) => c
    ? `<button class="namebtn" data-act="competitor" data-id="${c.id}">${esc(label)}</button>`
    : esc(label);

  let statusPill = '';
  if (fin) statusPill = '<span class="statuspill">Fini</span>';
  else if (canc) statusPill = '<span class="statuspill">Annulé</span>';
  else if (awaiting) statusPill = '<span class="statuspill wait">En attente</span>';
  else if (live) statusPill = '<span class="statuspill live">Live</span>';

  const sideHtml = (c, label, side, isWinner, isLoser) => {
    const scoreOrPred = fin
      ? `<span class="msc${isWinner ? ' win' : ''}">${side === 'A' ? m.score_a : m.score_b}</span>`
      : '';
    return `<div class="mside${isLoser ? ' lose' : ''}">
      <span class="mname">${flag(c)}${nameBtn(c, label)}<span class="mrk">${rk(c)}</span></span>
      ${scoreOrPred}
    </div>`;
  };

  const rowStyle = `${themeVarsCss(themeKeyFor(m))}${fresh ? `;animation-delay:${Math.min(i, 10) * 35}ms` : ''}`;
  const timeCol = live
    ? `<span class="liv"><span class="livedotsm" aria-hidden="true"></span>LIVE</span>`
    : esc(new Date(m.starts_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }));

  let panel = '';
  if (!fin && !canc) {
    const showChips = true;
    const t = !locked ? trend(m) : null;
    const pickProb = (mine && t) ? Math.round(scoreProb(t.q, m.wins_needed, mine.pred_a, mine.pred_b) * 100) : null;
    const gauge = pickProb !== null ? `
      <div class="oddsgauge" role="img" aria-label="${pickProb} % de chances d'avoir le score ${mine.pred_a}–${mine.pred_b}">
        <div class="bar"><i style="--w:${pickProb}%;width:${pickProb}%"></i></div><b>${pickProb}%</b>
      </div>` : '';
    const status = awaiting
      ? `<span>${mine ? `Ton prono : <b>${mine.pred_a}–${mine.pred_b}</b>. ` : ''}Résultat pas encore reçu : les points arrivent dès qu'il est connu.</span>`
      : locked
      ? `<span>${mine ? `Ton prono : <b>${mine.pred_a}–${mine.pred_b}</b>` : "Trop tard, pas de prono."}</span>`
      : `<span>${mine ? `Prono : <b>${mine.pred_a}–${mine.pred_b}</b>, modifiable jusqu'au début du match.` : 'Touche un score pour pronostiquer.'}</span>`;
    // Pastille de série : seulement si elle offre vraiment un bonus (série
    // >= 3), pour ne pas surcharger chaque carte avec un chiffre à zéro.
    const streakTeaser = (!locked && streakInfo.now >= 3)
      ? `<span>${streakBadgeHtml(streakInfo.now, true)} si gagnant</span>` : '';
    panel = `<div class="predpanel${locked ? ' locked' : ''}">
      <div class="pickgrid">
        <div class="pickside"><span class="pslabel">${flag(ca)}${esc(m.side_a)}</span>${chips(m, 'A', mine, locked)}</div>
        <div class="pickside"><span class="pslabel">${flag(cb)}${esc(m.side_b)}</span>${chips(m, 'B', mine, locked)}</div>
      </div>
      <div class="predstatus">${status}${streakTeaser}</div>
      ${gauge}
      ${ballesStepperHtml(m)}
    </div>`;
  } else {
    let foot, stamp = '';
    if (canc) foot = `<span>Match annulé : aucun point en jeu.</span>`;
    else {
      // Série AVANT ce match précis (pas la série actuelle) : c'est elle qui
      // a déterminé le bonus réellement appliqué sur ce prono, au moment où
      // il a été jugé — jamais recalculée rétroactivement avec la série
      // d'aujourd'hui. Vient de S.myHistory (voir myStreakInfo) ; 0 par
      // défaut tant qu'il n'est pas encore chargé (la vue SQL reste la seule
      // source de vérité pour les points réellement enregistrés).
      const myStreakBefore = streakInfo.before.get(m.id) || 0;
      const pt = points(m, mine, myStreakBefore);
      const det = mine ? pointsDetail(m, mine, myStreakBefore) : null;
      // Le nombre de points gagnés est l'info la plus attendue sur un match
      // fini : affiché en grand, dans un pavé façon tampon encreur, plutôt
      // que noyé dans la ligne de texte.
      if (pt !== null) {
        stamp = `<div class="stamp ${pt === 0 ? 'p0' : (det.exact ? 'p3' : 'p1')}" aria-label="${pt} point${Math.abs(pt) > 1 ? 's' : ''} gagné${Math.abs(pt) > 1 ? 's' : ''} sur ce match"><b>${pt > 0 ? '+' : ''}${pt}</b><span>pt${Math.abs(pt) > 1 ? 's' : ''}</span></div>`;
      }
      const bonusBits = [];
      if (det && det.streakBonus) bonusBits.push(`bonus série +${det.streakBonus}`);
      if (det && det.ballesBonus) bonusBits.push(`bonus balles (${det.balles}) +${det.ballesBonus}`);
      if (det && det.bonus) bonusBits.push(`bonus outsider +${det.bonus}`);
      foot = `<span>${mine ? `Ton prono : ${mine.pred_a}–${mine.pred_b}` : `Tu n'as pas fait de prono.`}</span>
        ${bonusBits.length ? `<span class="hint" style="margin:2px 0 0">(dont ${bonusBits.join(', ')})</span>` : ''}
        <span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="friendstoggle" data-act="friends" data-id="${m.id}">${S.openFriends[m.id] ? 'Masquer' : 'Voir'} les pronos des amis</button>
          ${mine ? `<button class="friendstoggle" data-act="exportmatch" data-id="${m.id}">Partager en image</button>` : ''}
        </span>`;
    }
    let friends = '';
    if (S.openFriends[m.id]) {
      const rows = (S.friends[m.id] || []).map(r => ({ ...r, pt: points(m, r, r.user_id === S.session.user.id ? (streakInfo.before.get(m.id) || 0) : streakBeforeFor(r.user_id, m.id)) }))
        .sort((x, y) => (y.pt ?? -1) - (x.pt ?? -1));
      friends = rows.length
        ? `<ul class="friends">${rows.map(r => `<li><span>${esc(r.profiles && r.profiles.pseudo)}${r.user_id === S.session.user.id ? ' (toi)' : ''}</span><span>${r.pred_a}–${r.pred_b}${r.pt !== null ? ` : ${r.pt} pt${r.pt > 1 ? 's' : ''}` : ''}</span></li>`).join('')}</ul>`
        : `<p class="hint" style="margin-top:8px">Personne n'a fait de prono sur ce match.</p>`;
    }
    panel = `<div class="predpanel locked"><div class="predstatus" style="display:flex;align-items:center;gap:12px">${stamp}<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">${foot}</div></div>${friends}</div>`;
  }

  return `
  <div class="mrow${live ? ' islive' : ''}${fresh ? ' enter' : ''}" style="${rowStyle}">
    <div class="mrowhead">
      <div class="mtime">${timeCol}${!live ? statusPill : ''}</div>
      <div class="msides">
        ${sideHtml(ca, m.side_a, 'A', winA, winB)}
        ${sideHtml(cb, m.side_b, 'B', winB, winA)}
      </div>
      <div class="mright">${m.round ? roundLabel(m.round) : ''}</div>
    </div>
    ${panel}
  </div>`;
}

// Étiquette du tour, à droite de la rangée : le tour lui-même en gros
// ("Quart de finale", "Journée 6"), le tableau en petit dessous.
function roundLabel(round) {
  const parts = String(round).split(/\s*(?:,|—)\s*/).filter(Boolean);
  const main = parts.length > 1 ? parts.slice(1).join(', ') : (parts[0] || '');
  const sub = parts.length > 1 ? parts[0] : '';
  const cap = main.charAt(0).toUpperCase() + main.slice(1);
  return `<span class="mround"><b>${esc(cap)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</span>`;
}

async function pick(id, a, b) {
  const m = S.matches.find(x => x.id === id);
  if (!m || isLocked(m)) { toast('Trop tard : le match a commencé.', true); keepRender(); return; }
  playSound('tick'); // retour tactile immédiat au tap, sans attendre la réponse réseau (toast() jouera le "confirm"/"error" une fois enregistré)
  const { data, error } = await sb.from('predictions')
    .upsert({ user_id: S.session.user.id, match_id: id, pred_a: a, pred_b: b }, { onConflict: 'user_id,match_id' })
    .select().single();
  if (error) { toast(friendlyError(error), true); return; }
  S.myPreds[id] = data;
  toast(`Prono enregistré : ${a}–${b}`);
  keepRender();
}
// Change la mise de balles sur un pronostic déjà posé (voir ballesStepperHtml
// / ballesStock). newVal est la valeur ABSOLUE visée (pas un delta) ; elle
// est re-plafonnée ici (jamais confiance aveugle dans les data-v du bouton
// cliqué) par le plafond par match ET le budget restant du tournoi -- la
// vérité finale reste de toute façon le déclencheur SQL (check_prediction,
// voir ajout-balles.sql), qui referait le même calcul côté base de données.
async function setBalles(id, newVal) {
  const m = S.matches.find(x => x.id === id);
  const mine = S.myPreds[id];
  if (!m || isLocked(m)) { toast('Trop tard : le match a commencé.', true); keepRender(); return; }
  if (!mine) { toast('Fais d’abord un prono sur ce match.', true); keepRender(); return; }
  const cap = Math.min(BALLES_MAX_PER_MATCH, ballesRemaining(m, id));
  const v = Math.max(0, Math.min(newVal, cap));
  if (v === (mine.balles_staked || 0)) { keepRender(); return; }
  const { data, error } = await sb.from('predictions').update({ balles_staked: v }).eq('id', mine.id).select().single();
  if (error) { toast(friendlyError(error), true); return; }
  S.myPreds[id] = data;
  playSound('tick');
  toast(v > 0 ? `${v} balle${v > 1 ? 's' : ''} misée${v > 1 ? 's' : ''} sur ce match.` : 'Mise de balles retirée.');
  keepRender();
}
async function toggleFriends(id) {
  if (S.openFriends[id]) { S.openFriends[id] = false; keepRender(); return; }
  const { data, error } = await sb.from('predictions').select('user_id,pred_a,pred_b,balles_staked,profiles(pseudo)').eq('match_id', id);
  if (error) { toast(friendlyError(error), true); return; }
  S.friends[id] = data || []; S.openFriends[id] = true; keepRender();
}

/* --- Classement des amis : vraie table de standings, podium en évidence. --- */
function boardView() {
  const seg = segRow([['ALL', 'Général'], ['WTT', 'WTT'], ['PRO_A', 'Pro A']], S.boardScope, 'boardscope');
  const exportBtn = `<button class="btn small sec" style="margin:-6px 0 14px" data-act="exportboard">Exporter ce classement en image</button>`;
  if (S.board === null) return seg + '<div class="loading">Chargement…</div>';
  if (!S.board.length) return seg + `<div class="empty">Pas encore de points. Le classement se remplit dès que les premiers matchs sont terminés.</div>${rules()}`;
  let prev = null, rank = 0;
  const rows = S.board.map((r, i) => {
    const key = r.total_points + '/' + r.exact_scores;
    if (key !== prev) { rank = i + 1; prev = key; }
    const me = r.user_id === S.session.user.id;
    const topClass = rank === 1 ? ' top1' : rank === 2 ? ' top2' : rank === 3 ? ' top3' : '';
    return `<tr class="${me ? 'me' : ''}">
      <td class="rankcell${topClass}">${rank}</td>
      <td class="namecell"><div class="lbname">${esc(r.pseudo)}${me ? ' (toi)' : ''}</div>
        <div class="lbsub">${r.exact_scores} score${r.exact_scores > 1 ? 's' : ''} exact${r.exact_scores > 1 ? 's' : ''} · ${r.good_winners} bon${r.good_winners > 1 ? 's' : ''} vainqueur${r.good_winners > 1 ? 's' : ''} / ${r.matches_played}</div></td>
      <td class="ptscell">${r.total_points}<small>pts</small></td></tr>`;
  }).join('');
  return seg + exportBtn + `<table class="standings"><thead><tr><th>Rang</th><th>Joueur</th><th class="num">Pts</th></tr></thead><tbody>${rows}</tbody></table>` + rules();
}
const rules = () => `<p class="rules">Barème : 1 point pour le bon vainqueur, 3 points pour le score exact. En WTT, un pronostic gagnant sur l'outsider (moins bien classé au tirage au sort) rapporte un bonus, d'autant plus grand que l'écart de tête de série est important (jusqu'à +5 points). Bonus de série : plus tu enchaînes les pronos gagnants d'affilée, plus le prochain rapporte gros (jusqu'à +75 % à partir d'une grosse série) — vois l'onglet "Mon compte" pour ta série en cours. Balles : à chaque tournoi WTT tu reçois 4 balles (2 par journée de Pro A) à miser sur tes pronos, 3 au maximum sur un même match ; si le prono est gagnant, chaque balle ajoute ×1 (1 balle = ×2, 2 = ×3, 3 = ×4), sinon elles sont perdues. Le bonus de série et les balles s'additionnent. En cas d'égalité au classement, le plus de scores exacts passe devant.</p>`;

/* --- Classements WTT (mondial, messieurs/dames séparés) et Pro A
   (championnat) : à distinguer du classement des amis (points de
   pronostics) affiché dans l'onglet "Amis". --- */
function rankingsView() {
  const scope = S.rankView;
  const seg = segRow([['WTT', 'WTT'], ['PRO_A', 'Pro A']], scope, 'rankview');

  if (scope === 'PRO_A') {
    const list = Object.values(S.competitors)
      .filter(c => c.circuit === 'PRO_A' && c.ranking != null)
      .sort((a, b) => a.ranking - b.ranking || a.name.localeCompare(b.name));
    if (!list.length) return seg + `<div class="empty">Aucun classement Pro A pour l'instant. Il se remplit dès que la saison commence.</div>`;
    const rows = list.map(c => {
      const topClass = c.ranking === 1 ? ' top1' : c.ranking === 2 ? ' top2' : c.ranking === 3 ? ' top3' : '';
      return `<tr class="lbrow" data-act="competitor" data-id="${c.id}" tabindex="0" aria-label="Voir le détail de l'équipe ${esc(c.name)}">
        <td class="rankcell${topClass}">${c.ranking}</td>
        <td class="namecell"><div class="lbname">${esc(c.name)}</div>${c.roster && c.roster.length ? `<div class="lbsub">${c.roster.length} joueur${c.roster.length > 1 ? 's' : ''} suivi${c.roster.length > 1 ? 's' : ''}</div>` : ''}</td>
        <td class="ptscell">${c.ranking_points ? `${c.ranking_points}<small>pts</small>` : ''}</td></tr>`;
    }).join('');
    // Vue "équipes" Pro A : chaque ligne EST déjà une équipe (championnat par
    // équipes), pas un joueur individuel — clique sur son nom pour voir son
    // effectif et son calendrier (fiche détail, onglet Admin pour saisir les
    // joueurs). Ce classement et les journées filtrables de l'onglet Matchs
    // sont la "vue équipe" : pas besoin d'un onglet séparé, la donnée est
    // déjà structurée par équipe depuis le robot de synchronisation (FFTT).
    return seg + `<table class="standings"><thead><tr><th>Rang</th><th>Équipe</th><th class="num">Pts</th></tr></thead><tbody>${rows}</tbody></table>`
      + `<p class="rules">Classement Pro A messieurs par équipe, mis à jour par le robot de synchronisation. Touche une équipe pour voir son effectif et son calendrier.</p>`;
  }

  // WTT : classement mondial, messieurs et dames séparés (déduits automatiquement
  // du tableau où joue chaque joueur : simple messieurs ou simple dames).
  const genderSeg = segRow([['M', 'Messieurs'], ['F', 'Dames']], S.rankGender, 'rankgender');
  const genreLbl = S.rankGender === 'M' ? 'messieurs' : 'dames';
  const world = (S.worldRankings || []).filter(r => r.gender === S.rankGender);
  if (world.length) {
    // "SUN Yingsha" (format du classement WTT) -> "Sun Yingsha".
    const pretty = n => String(n || '').split(/\s+/).map(w => w.length > 1 && w === w.toUpperCase() ? w.charAt(0) + w.slice(1).toLowerCase() : w).join(' ');
    const rows = world.map(r => {
      const c = r.competitor_id ? S.competitors[r.competitor_id] : null;
      const name = c ? c.name : pretty(r.name);
      const ctry = r.country || (c && c.country) || '';
      const topClass = r.rank === 1 ? ' top1' : r.rank === 2 ? ' top2' : r.rank === 3 ? ' top3' : '';
      const attrs = c ? ` class="lbrow" data-act="competitor" data-id="${c.id}" tabindex="0" aria-label="Voir la fiche de ${esc(name)}"` : '';
      return `<tr${attrs}>
        <td class="rankcell${topClass}">${r.rank}</td>
        <td class="namecell"><div class="lbname">${flagHtml({ circuit: 'WTT', country: ctry })}${esc(name)}</div>
          <div class="lbsub">${esc(ctry)}${c ? `${ctry ? ' · ' : ''}<span class="lbfollow">voir la fiche</span>` : ''}</div></td>
        <td class="ptscell">${r.points != null ? `${r.points}<small>pts</small>` : ''}</td></tr>`;
    }).join('');
    return seg + genderSeg + `<table class="standings"><thead><tr><th>Rang</th><th>Joueur</th><th class="num">Pts</th></tr></thead><tbody>${rows}</tbody></table>`
      + `<p class="rules">Classement mondial WTT officiel (${genreLbl}), top ${world.length}, mis à jour automatiquement par le robot de synchronisation. Touche un nom marqué « voir la fiche » pour son calendrier et ses résultats.</p>`;
  }
  const pool = Object.values(S.competitors).filter(c => c.circuit === 'WTT' && c.gender === S.rankGender);
  const withWorld = pool.filter(c => c.world_ranking != null).sort((a, b) => a.world_ranking - b.world_ranking || a.name.localeCompare(b.name));
  const fallback = !withWorld.length ? pool.filter(c => c.ranking != null).sort((a, b) => a.ranking - b.ranking || a.name.localeCompare(b.name)) : [];
  const list = withWorld.length ? withWorld : fallback;
  const usingFallback = !withWorld.length && !!fallback.length;
  const genreLabel = S.rankGender === 'M' ? 'messieurs' : 'dames';
  if (!list.length) {
    return seg + genderSeg + `<div class="empty">Aucun classement ${genreLabel} pour l'instant.${S.isAdmin ? " Il se remplit automatiquement à la prochaine synchronisation WTT." : ''}</div>`;
  }
  const rows = list.map(c => {
    const rk = usingFallback ? c.ranking : c.world_ranking;
    const topClass = rk === 1 ? ' top1' : rk === 2 ? ' top2' : rk === 3 ? ' top3' : '';
    return `<tr class="lbrow" data-act="competitor" data-id="${c.id}" tabindex="0" aria-label="Voir le détail de ${esc(c.name)}">
      <td class="rankcell${topClass}">${rk}</td>
      <td class="namecell"><div class="lbname">${flagHtml(c)}${esc(c.name)}</div>
        ${c.country ? `<div class="lbsub">${esc(c.country)}</div>` : ''}</td>
      <td class="ptscell">${(usingFallback ? null : c.world_ranking_points) ? `${c.world_ranking_points}<small>pts</small>` : ''}</td></tr>`;
  }).join('');
  const note = usingFallback
    ? `<p class="rules">Classement mondial pas encore synchronisé pour ce tableau : tête de série des tournois suivis affichée en attendant.</p>`
    : `<p class="rules">Classement mondial WTT officiel (${genreLabel}), mis à jour automatiquement par le robot de synchronisation.</p>`;
  return seg + genderSeg + `<table class="standings"><thead><tr><th>Rang</th><th>Joueur</th><th class="num">Pts</th></tr></thead><tbody>${rows}</tbody></table>` + note;
}

const BADGE_LOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

/* ---------- Les 14 définitions (nom, couleurs, critère, icône) ---------- */
// Chaque entrée : { id, name, desc, colorA, colorB, icon, test(ctx) }.
// `ctx` regroupe tout ce dont les critères ont besoin, construit une seule
// fois par computeBadges() à partir des données déjà chargées pour "Mon
// compte" (voir loadAccount()) -- aucune logique serveur nouvelle, à part
// les deux requêtes de lecture déjà publiques ajoutées à loadAccount().
function circuitAccuracy(ctx, circuit) {
  if (!S.circuitBoard || !S.circuitBoard.length) return null;
  const rows = S.circuitBoard.filter(r => r.circuit === circuit && r.matches_played > 0);
  if (rows.length < 2) return null;
  const mine = rows.find(r => r.user_id === ctx.uid);
  if (!mine || mine.matches_played < 10) return null;
  const avgAcc = rows.reduce((s, r) => s + r.good_winners / r.matches_played, 0) / rows.length;
  return { myAcc: mine.good_winners / mine.matches_played, avgAcc, n: rows.length };
}
// Table user_id -> Map(match_id -> points totaux), à partir de
// S.allJudgedPreds (pronostics de tout le monde sur des matchs déjà
// jugés). Réutilise computeStreakSeries/pointsDetail : chaque personne a
// donc droit à SON propre calcul de série/bonus, comme sur le vrai
// classement, pas une approximation plus grossière.
function allUsersPointsByMatch() {
  const byUser = {};
  for (const r of (S.allJudgedPreds || [])) (byUser[r.user_id] = byUser[r.user_id] || []).push(r);
  const out = {};
  for (const uid in byUser) {
    const sorted = byUser[uid].slice().sort((a, b) => new Date(a.matches.starts_at) - new Date(b.matches.starts_at) || a.match_id - b.match_id);
    const map = new Map();
    for (const h of computeStreakSeries(sorted)) {
      const pt = pointsDetail(h.matches, h, h.streakBefore);
      map.set(h.match_id, pt ? pt.total : 0);
    }
    out[uid] = map;
  }
  return out;
}

// Calcule les 14 badges (débloqué ou pas) à partir des données déjà
// chargées. Renvoie null tant que l'historique du compte n'est pas encore
// disponible (voir myJudgedHistory()).
function computeBadges() {
  const finished = myJudgedHistory();
  if (finished === null) return null;
  const n = finished.length;
  const goodN = finished.filter(h => h.pt.total > 0).length;
  let bestStreak = 0; for (const h of finished) bestStreak = Math.max(bestStreak, h.streakAfter);
  const ctx = { finished, n, goodN, bestStreak, uid: S.session && S.session.user.id };
  return BADGE_DEFS.map(def => ({
    id: def.id, name: def.name, desc: def.desc,
    unlocked: !!def.test(ctx),
    icon: badgeIcon(def.id, def.name),
  }));
}
// Détecte les badges fraîchement débloqués depuis le dernier chargement de
// "Mon compte" (même esprit que checkStreakMilestone : jamais de fanfare
// pour des badges déjà acquis au tout premier chargement de la session,
// seulement pour un badge franchi "sous les yeux" de la personne). Le
// "déjà vu" est mémorisé en localStorage, même mécanique que
// spin_theme_mode/spin_sound_on.
function checkNewBadges() {
  try {
    const list = computeBadges();
    if (!list) return;
    let seen = [];
    try { seen = JSON.parse(localStorage.getItem('spin_badges_seen') || '[]'); } catch (e) { /* ignore */ }
    const seenSet = new Set(seen);
    let initialized = false;
    try { initialized = localStorage.getItem('spin_badges_init') === '1'; } catch (e) { /* ignore */ }
    const newlyUnlocked = initialized ? list.filter(b => b.unlocked && !seenSet.has(b.id)) : [];
    list.forEach(b => { if (b.unlocked) seenSet.add(b.id); });
    try {
      localStorage.setItem('spin_badges_seen', JSON.stringify([...seenSet]));
      localStorage.setItem('spin_badges_init', '1');
    } catch (e) { /* stockage indisponible : pas de mémoire d'une session à l'autre, tant pis */ }
    if (newlyUnlocked.length) {
      playSound('milestone');
      newlyUnlocked.forEach(b => toast(`Nouveau badge débloqué : ${b.name} \u{1F3AF}`));
    }
  } catch (e) { /* un souci de badge ne doit jamais casser l'appli */ }
}

// Rangée compacte façon "laddrow" pour un groupe tournoi/journée (réutilisée
// par le panneau "Par tournoi / saison" de "Mon compte").
function breakdownRow(label, s, col, circuit) {
  // Le bouton "Voir le récap" n'apparaît que si CE tournoi/journée est
  // entièrement terminé (voir isTournamentFinished) : pas de bilan sur
  // quelque chose encore en cours.
  const recapBtn = circuit && isTournamentFinished(circuit, label)
    ? `<button class="linkbtn recapbtn" data-act="recap" data-key="${esc(label)}" data-circuit="${circuit}">Voir le récap ✨</button>`
    : '';
  return `<div class="laddrow" style="--ladcol:${col}">
    <div class="laddhead"><span class="laddname">${esc(label)}</span><span class="laddpts">${s.pts}<small>pts</small></span></div>
    <div class="laddsub">${s.n} prono${s.n > 1 ? 's' : ''} jugé${s.n > 1 ? 's' : ''} · ${s.exact} exact${s.exact > 1 ? 's' : ''}</div>
    ${recapBtn}
  </div>`;
}
// Un tournoi WTT / une journée Pro A est "terminé" s'il n'a plus aucun match
// encore programmé ou en direct. S'il n'apparaît plus du tout dans S.matches
// (fenêtre glissante de 90 jours, voir reloadMatches), c'est forcément qu'il
// est déjà passé depuis longtemps : terminé aussi.
function isTournamentFinished(circuit, key) {
  const ms = S.matches.filter(m => m.circuit === circuit && tournamentGroupKey(m) === key);
  if (!ms.length) return true;
  if (!ms.every(m => m.status === 'finished' || m.status === 'cancelled')) return false;
  if (circuit !== 'WTT') return true;
  // WTT : le robot ajoute le tableau tour par tour, donc "tous les matchs
  // connus sont finis" peut seulement vouloir dire "entre deux tours". On
  // attend une finale jouée, ou 3 jours sans aucun nouveau match.
  const hasFinal = ms.some(m => /(^|[,—]\s*)finale$/i.test((m.round || '').trim()));
  const last = Math.max(...ms.map(m => new Date(m.starts_at).getTime()));
  return hasFinal || Date.now() - last > 3 * 864e5;
}
// Clé de regroupement tournoi (WTT) / journée (Pro A) d'un match, identique
// à celle déjà utilisée pour "Par tournoi / saison" dans accountView.
function tournamentGroupKey(m) {
  return m.circuit === 'WTT' ? (m.competition || 'WTT') : (m.round || 'Pro A');
}
/* --- "Mon compte" : statistiques personnelles sur l'ensemble de l'historique
   de pronostics du compte (pas seulement les matchs encore affichés dans
   l'onglet Matchs), calculées avec le même barème que le classement des amis. --- */
function accountView() {
  // La série (streakBefore/streakAfter) ne dépend QUE de l'ordre chronologique
  // des matchs déjà jugés : chaque pt.total est donc calculé avec la série
  // telle qu'elle était réellement au moment de CE match, jamais recalculée
  // après coup avec la série d'aujourd'hui. Voir myJudgedHistory().
  const finished = myJudgedHistory();
  if (finished === null) return '<div class="loading">Chargement…</div>';

  if (!finished.length) {
    return `<div class="panel"><h2>Mon compte</h2><p class="hint">Pas encore de match terminé sur lequel tu as pronostiqué : reviens ici une fois que tes premiers pronos auront été jugés.</p></div>`;
  }

  const n = finished.length;
  const total = finished.reduce((s, h) => s + h.pt.total, 0);
  const exactN = finished.filter(h => h.pt.exact).length;
  const goodN = finished.filter(h => h.pt.total > 0).length;
  const pctExact = Math.round(exactN / n * 100);
  const pctGood = Math.round(goodN / n * 100);

  const curStreak = finished[finished.length - 1].streakAfter;
  let bestStreak = 0; for (const h of finished) bestStreak = Math.max(bestStreak, h.streakAfter);
  const best = finished.reduce((b, h) => (!b || h.pt.total > b.pt.total) ? h : b, null);

  let myRank = null;
  if (S.accountBoard && S.accountBoard.length) {
    let prev = null, rk = 0;
    for (let i = 0; i < S.accountBoard.length; i++) {
      const r = S.accountBoard[i], key = r.total_points + '/' + r.exact_scores;
      if (key !== prev) { rk = i + 1; prev = key; }
      if (r.user_id === S.session.user.id) { myRank = rk; break; }
    }
  }

  // Couleurs officielles des deux circuits (mêmes valeurs que THEME), pour
  // teinter la répartition par circuit même hors contexte "Matchs" (ici le
  // thème global de la page reste neutre) — lecture seule de THEME, sans
  // jamais le modifier.
  const circuitColor = c => c === 'WTT' ? THEME.WTT_SMASH.accent : THEME.PRO_A.accent;
  const byCircuit = ['WTT', 'PRO_A'].map(c => {
    const list = finished.filter(h => h.matches.circuit === c);
    return { c, n: list.length, pts: list.reduce((s, h) => s + h.pt.total, 0), exact: list.filter(h => h.pt.exact).length };
  }).filter(x => x.n);
  const circuitLabel = c => c === 'WTT' ? 'WTT' : 'Pro A';
  const maxCircuitPts = Math.max(1, ...byCircuit.map(x => x.pts));

  const recent = finished.slice(-8).reverse();
  const matchLabel = m => `${esc(m.side_a)} – ${esc(m.side_b)}`;

  const recentRows = recent.map(h => {
    const m = h.matches, pt = h.pt;
    return `<li class="cmrow">
      <div class="cmopp">${matchLabel(m)}</div>
      <div class="cmmeta"><span class="cmdate">${esc(fmtDay(m.starts_at))} · ${esc(h.pred_a)}–${esc(h.pred_b)} (${m.score_a}–${m.score_b})</span>
        <span class="cmres ${pt.total > 0 ? 'win' : 'loss'}">${pt.total > 0 ? '+' : ''}${pt.total} pt${Math.abs(pt.total) > 1 ? 's' : ''}</span></div>
    </li>`;
  }).join('');

  const circuitRows = byCircuit.map(x => {
    const col = circuitColor(x.c), w = Math.max(6, Math.round(x.pts / maxCircuitPts * 100));
    return `<div class="laddrow" style="--ladcol:${col}">
      <div class="laddhead"><span class="laddname">${circuitLabel(x.c)}</span><span class="laddpts">${x.pts}<small>pts</small></span></div>
      <div class="laddbar"><i style="width:${w}%"></i></div>
      <div class="laddsub">${x.n} prono${x.n > 1 ? 's' : ''} jugé${x.n > 1 ? 's' : ''} · ${x.exact} exact${x.exact > 1 ? 's' : ''}</div>
    </div>`;
  }).join('');

  // Petit graphique en bâtons (façon carnet de bord) : un bâton par match
  // jugé, sur les 14 derniers, hauteur = points marqués sur ce match. Dessiné
  // à la main en SVG (pas de librairie) pour rester léger et dans le même
  // esprit "dessiné à l'encre" que le reste de l'appli.
  const sparkN = finished.slice(-14);
  const sparkMax = Math.max(3, ...sparkN.map(h => h.pt.total));
  const sparkW = 320, sparkH = 56, sparkPad = 3;
  const barW = (sparkW / sparkN.length) - sparkPad;
  const sparkBars = sparkN.map((h, i) => {
    const bh = Math.max(3, (h.pt.total / sparkMax) * (sparkH - 6));
    const x = i * (sparkW / sparkN.length);
    const y = sparkH - bh;
    const col = h.pt.total === 0 ? 'var(--line-soft)' : (h.pt.exact ? 'var(--accent)' : 'var(--good)');
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(2, barW).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${col}"><title>${esc(fmtDay(h.matches.starts_at))} : ${h.pt.total > 0 ? '+' : ''}${h.pt.total} pt${Math.abs(h.pt.total) > 1 ? 's' : ''}</title></rect>`;
  }).join('');
  const sparkline = sparkN.length > 1 ? `
  <div class="panel">
    <h3>Tendance récente</h3>
    <p class="hint" style="margin-top:2px">Points marqués sur chacun de tes ${sparkN.length} derniers pronos jugés.</p>
    <svg class="spark" viewBox="0 0 ${sparkW} ${sparkH}" preserveAspectRatio="none" role="img" aria-label="Évolution des points sur les derniers pronos">${sparkBars}</svg>
    <div class="sparklegend"><span><i class="dot" style="background:var(--accent)"></i>Score exact</span><span><i class="dot" style="background:var(--good)"></i>Bon vainqueur</span><span><i class="dot" style="background:var(--line-soft)"></i>0 point</span></div>
  </div>` : '';

  // Série en cours / meilleure série : rangée de pastilles façon "flip-tile"
  // (même esprit que les pastilles de score des pronos), une par match jugé
  // parmi les 10 derniers, verte si des points ont été marqués.
  const streakTiles = finished.slice(-10).map(h => `<i class="streaktile${h.pt.total > 0 ? ' hit' : ''}" title="${h.pt.total > 0 ? '+' + h.pt.total : '0'} pt">${h.pt.total > 0 ? '●' : '○'}</i>`).join('');
  const curPct = Math.round((streakMult(curStreak) - 1) * 100);

  // --- Par tournoi / saison : le "Par circuit" ci-dessus donne un gros
  // total WTT vs Pro A, mais pas le détail tournoi par tournoi (WTT) ni
  // journée par journée (Pro A, championnat par équipes sans saisons
  // multiples pour l'instant). Regroupement à partir des champs déjà
  // synchronisés (m.competition pour WTT, m.round = "Journée N" pour Pro A).
  const byTournament = {};
  const byJournee = {};
  for (const h of finished) {
    const m = h.matches;
    if (m.circuit === 'WTT') {
      const k = m.competition || 'WTT';
      const s = byTournament[k] || (byTournament[k] = { n: 0, pts: 0, exact: 0, last: m.starts_at });
      s.n++; s.pts += h.pt.total; if (h.pt.exact) s.exact++; if (m.starts_at > s.last) s.last = m.starts_at;
    } else if (m.circuit === 'PRO_A') {
      const k = m.round || 'Pro A';
      const s = byJournee[k] || (byJournee[k] = { n: 0, pts: 0, exact: 0 });
      s.n++; s.pts += h.pt.total; if (h.pt.exact) s.exact++;
    }
  }
  const tournamentRows = Object.entries(byTournament)
    .sort((a, b) => new Date(b[1].last) - new Date(a[1].last))
    .map(([name, s]) => breakdownRow(name, s, THEME.WTT_SMASH.accent, 'WTT')).join('');
  const journeeNum = k => { const mm = /^Journée (\d+)$/.exec(k); return mm ? +mm[1] : 999; };
  const journeeRows = Object.entries(byJournee)
    .sort((a, b) => journeeNum(a[0]) - journeeNum(b[0]))
    .map(([name, s]) => breakdownRow(name, s, THEME.PRO_A.accent, 'PRO_A')).join('');
  const seasonPanel = (tournamentRows || journeeRows) ? `
  <div class="panel">
    <h3>Par tournoi / saison</h3>
    <p class="hint" style="margin-top:2px">Le détail de tes points, tournoi WTT par tournoi WTT et journée par journée en Pro A.</p>
    ${tournamentRows ? `<h4 class="subh">WTT</h4><div class="laddwrap compact">${tournamentRows}</div>` : ''}
    ${journeeRows ? `<h4 class="subh">Pro A</h4><div class="laddwrap compact">${journeeRows}</div>` : ''}
  </div>` : '';

  // --- Par adversaire : contre qui tu lis bien le jeu, et contre qui tu te
  // trompes le plus. "pt.base > 0" = bon vainqueur (indépendant du bonus de
  // série ou outsider) : c'est la seule chose pertinente pour juger une
  // lecture de match. Basé sur les noms déjà présents dans l'historique
  // (side_a/side_b), sans avoir besoin d'interroger les competitor_id.
  const perPlayer = {};
  for (const h of finished) {
    const m = h.matches;
    for (const name of [m.side_a, m.side_b]) {
      if (!name) continue;
      const s = perPlayer[name] || (perPlayer[name] = { n: 0, correct: 0, circuit: m.circuit });
      s.n++; if (h.pt.base > 0) s.correct++;
    }
  }
  const MIN_SAMPLE = 3;
  const playerList = Object.entries(perPlayer)
    .map(([name, s]) => ({ name, ...s, acc: s.correct / s.n }))
    .filter(s => s.n >= MIN_SAMPLE);
  const playerRow = s => `<li class="cmrow">
    <div class="cmopp">${esc(s.name)}</div>
    <div class="cmmeta"><span class="cmdate">${s.n} prono${s.n > 1 ? 's' : ''} jugé${s.n > 1 ? 's' : ''}</span>
      <span class="cmres ${s.acc >= 0.5 ? 'win' : 'loss'}">${Math.round(s.acc * 100)}%</span></div>
  </li>`;
  const bestReads = playerList.slice().sort((a, b) => b.acc - a.acc || b.n - a.n).slice(0, 4);

/* =============================================================================
   Bilan de tournoi animé ("récap") — déclenché depuis "Par tournoi / saison"
   dans "Mon compte" (bouton "Voir le récap" posé par breakdownRow, voir plus
   haut). Un seul moment de motion design soigné (bannière, rang et points qui
   comptent jusqu'à leur valeur, podium) plutôt que des micro-animations
   dispersées partout — cohérent avec le reste de l'appli (tampons, pastilles,
   chiffres en mono). Respecte prefers-reduced-motion : état final affiché
   d'un coup, sans séquence, voir mountRecapAnimation() et le CSS .recap-step.
   ========================================================================= */

// Construit le classement de CE tournoi/journée, tous les amis confondus, à
// partir de S.allJudgedPreds (pronostics de tout le monde déjà jugés, voir
// loadAccount) : chaque personne garde SA propre série (computeStreakSeries)
// calculée sur TOUT son historique chronologique (comme sur le vrai
// classement), seuls les totaux affichés sont ensuite limités à ce
// tournoi/journée. Ne touche ni ne dépend d'aucune nouvelle requête réseau.
function computeRecapData(key, circuit) {
  if (!S.allJudgedPreds || !S.accountBoard) return null;
  const uid = S.session && S.session.user.id;
  const pseudoOf = {};
  (S.accountBoard || []).forEach(r => { pseudoOf[r.user_id] = r.pseudo; });

  const byUser = {};
  for (const r of S.allJudgedPreds) {
    if (!r.matches) continue;
    (byUser[r.user_id] || (byUser[r.user_id] = [])).push(r);
  }

  const rows = [];
  for (const userId in byUser) {
    const sorted = byUser[userId].slice().sort((a, b) => new Date(a.matches.starts_at) - new Date(b.matches.starts_at) || a.match_id - b.match_id);
    const scored = computeStreakSeries(sorted).map(h => ({ ...h, pt: pointsDetail(h.matches, h, h.streakBefore) }));
    const inT = scored.filter(h => h.matches.circuit === circuit && tournamentGroupKey(h.matches) === key);
    if (!inT.length) continue;
    let bestStreakInT = 0; for (const h of inT) bestStreakInT = Math.max(bestStreakInT, h.streakAfter);
    rows.push({
      userId, pseudo: pseudoOf[userId] || '—',
      pts: inT.reduce((s, h) => s + h.pt.total, 0),
      exact: inT.filter(h => h.pt.exact).length,
      n: inT.length,
      bestStreak: bestStreakInT,
    });
  }
  rows.sort((a, b) => b.pts - a.pts || b.exact - a.exact);
  let prevKey = null, rk = 0;
  rows.forEach((r, i) => {
    const k = r.pts + '/' + r.exact;
    if (k !== prevKey) { rk = i + 1; prevKey = k; }
    r.rank = rk;
  });
  const me = rows.find(r => r.userId === uid) || null;
  const theme = circuit === 'PRO_A' ? THEME.PRO_A : THEME[TIER_KEY[(S.matches.find(m => m.circuit === 'WTT' && tournamentGroupKey(m) === key) || {}).tier]] || THEME.WTT_DEFAULT;
  return { key, circuit, rows, me, podium: rows.slice(0, 3), theme };
}

// Badges débloqués "sous les yeux" pendant CE tournoi précisément (pas avant,
// pas après) : même mécanique que checkNewBadges, rejouée sur deux
// sous-ensembles de l'historique perso (juste avant / jusqu'à la fin du
// tournoi) pour isoler ce qui a basculé pendant cette fenêtre-là. Ne modifie
// ni ne rappelle computeBadges/checkNewBadges (pas d'effet de bord, pas de
// double notification).
function recapNewBadges(key, circuit) {
  const finished = myJudgedHistory();
  if (!finished || !finished.length) return [];
  const inT = finished.filter(h => h.matches.circuit === circuit && tournamentGroupKey(h.matches) === key);
  if (!inT.length) return [];
  const firstTs = inT[0].matches.starts_at, lastTs = inT[inT.length - 1].matches.starts_at;
  const badgesOf = list => {
    const n = list.length, goodN = list.filter(h => h.pt.total > 0).length;
    let bestStreak = 0; for (const h of list) bestStreak = Math.max(bestStreak, h.streakAfter);
    const ctx = { finished: list, n, goodN, bestStreak, uid: S.session && S.session.user.id };
    return new Set(BADGE_DEFS.filter(d => d.test(ctx)).map(d => d.id));
  };
  const before = badgesOf(finished.filter(h => h.matches.starts_at < firstTs));
  const after = badgesOf(finished.filter(h => h.matches.starts_at <= lastTs));
  return BADGE_DEFS.filter(d => after.has(d.id) && !before.has(d.id));
}

function podiumColumn(row, place) {
  if (!row) return '';
  const H = { 1: 96, 2: 74, 3: 58 }, COL = { 1: '#F0C544', 2: '#CBD3DC', 3: '#D79A6B' };
  return `<div class="podiumcol place${place}">
    <div class="podiumname">${esc(row.pseudo)}</div>
    <div class="podiumpts">${row.pts}<small>pts</small></div>
    <div class="podiumbar" style="height:${H[place]}px;--pcol:${COL[place]}"><span>${place}</span></div>

}

// Fait "compter" les chiffres du bilan jusqu'à leur valeur réelle, avec un
// décalage croissant par ligne (le vrai motion design de cette fonctionnalité
// est ici, pas éparpillé ailleurs dans l'appli). Respecte scrupuleusement
// prefers-reduced-motion : affiche directement la valeur finale, sans aucune
// séquence ni délai, pour qui a demandé moins de mouvement.
function mountRecapAnimation() {
  try {
    const modal = document.querySelector('.recapmodal');
    if (!modal) return;
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    modal.querySelectorAll('.recap-count[data-target]').forEach(el => {
      const target = Number(el.dataset.target) || 0;
      const prefix = el.dataset.prefix || '';
      const delay = reduced ? 0 : (Number(el.dataset.delay) || 0);
      if (reduced) { el.textContent = prefix + target; return; }
      el.textContent = prefix + '0';
      setTimeout(() => {
        const dur = 850, start = performance.now();
        const tick = now => {
          const p = Math.min(1, (now - start) / dur);
          const eased = 1 - Math.pow(1 - p, 3);
          el.textContent = prefix + Math.round(target * eased);
          if (p < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }, delay);
    });
  } catch (e) { /* une animation ratée ne doit jamais empêcher d'ouvrir le bilan */ }
}

/* --- Fiche détail d'un joueur ou d'une équipe (clic sur son nom, où qu'il
   apparaisse : rangée de match, classement...). --- */
function competitorModal(id) {
  const c = S.competitors[id];
  if (!c) return '';
  const mine = S.matches.filter(m => m.competitor_a_id === id || m.competitor_b_id === id);
  const upcoming = mine.filter(m => m.status === 'scheduled' || m.status === 'live')
    .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const recent = mine.filter(m => m.status === 'finished' || m.status === 'cancelled')
    .sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at)).slice(0, 8);
  const oppOf = m => m.competitor_a_id === id
    ? { name: m.side_b, id: m.competitor_b_id }
    : { name: m.side_a, id: m.competitor_a_id };
  const oppHtml = m => {
    const o = oppOf(m);
    return o.id ? `<button class="namebtn" data-act="competitor" data-id="${o.id}">${esc(o.name)}</button>` : esc(o.name);
  };
  const resultTag = m => {
    if (m.status === 'cancelled') return `<span class="cmres">Annulé</span>`;
    if (m.status !== 'finished') return '';
    const won = (m.competitor_a_id === id && m.score_a > m.score_b) || (m.competitor_b_id === id && m.score_b > m.score_a);
    return `<span class="cmres ${won ? 'win' : 'loss'}">${won ? 'V' : 'D'} ${m.score_a}–${m.score_b}</span>`;
  };
  const matchRow2 = m => `<li class="cmrow">
    <div class="cmopp">${oppHtml(m)}</div>
    <div class="cmmeta"><span class="cmdate">${esc(fmtDay(m.starts_at))}</span>${resultTag(m)}</div>
  </li>`;
  const roster = c.circuit === 'PRO_A' ? (c.roster || []) : [];
  const nothing = !upcoming.length && !recent.length && !roster.length;

  const rosterSec = roster.length ? `
    <section class="modalsec sec-roster">
      <h3><span class="secdot" aria-hidden="true"></span>Effectif</h3>
      <ul class="roster">${roster.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
    </section>` : '';
  const upcomingSec = upcoming.length ? `
    <section class="modalsec sec-upcoming">
      <h3><span class="secdot" aria-hidden="true"></span>À venir</h3>
      <ul class="cmlist">${upcoming.slice(0, 5).map(matchRow2).join('')}</ul>
    </section>` : '';
  const recentSec = recent.length ? `
    <section class="modalsec sec-recent">
      <h3><span class="secdot" aria-hidden="true"></span>Derniers résultats</h3>
      <ul class="cmlist">${recent.map(matchRow2).join('')}</ul>
    </section>` : '';

  return `
  <div class="modalbackdrop" data-act="closecompetitor">
    <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(c.name)}" data-act="stop">
      <button class="modalclose" data-act="closecompetitor" aria-label="Fermer">&times;</button>
      <div class="modalhead">
        <div class="modalname">${flagHtml(c)}${esc(c.name)}</div>
        <div class="modalsub">${c.circuit === 'WTT' ? `Simple ${c.gender === 'F' ? 'dames' : c.gender === 'M' ? 'messieurs' : 'messieurs/dames'}, circuit WTT` : 'Équipe de Pro A'}</div>
        <div class="modalstats">
          ${c.circuit === 'WTT'
            ? (c.world_ranking != null
              ? `<div class="statbox"><b>#${c.world_ranking}</b><span>classement mondial</span></div>`
              : `<div class="statbox"><b>${c.ranking ?? '—'}</b><span>tête de série (tournoi)</span></div>`)
            : `<div class="statbox"><b>${c.ranking ?? '—'}</b><span>classement Pro A</span></div>`}
          ${c.circuit === 'WTT' && c.world_ranking != null && c.world_ranking_points ? `<div class="statbox"><b>${c.world_ranking_points}</b><span>points</span></div>` : ''}
          ${c.circuit === 'PRO_A' && c.ranking_points ? `<div class="statbox"><b>${c.ranking_points}</b><span>points</span></div>` : ''}
          ${roster.length ? `<div class="statbox"><b>${roster.length}</b><span>joueur${roster.length > 1 ? 's' : ''}</span></div>` : ''}
        </div>
      </div>
      <div class="modalbody">
        ${rosterSec}${upcomingSec}${recentSec}
        ${nothing ? `<p class="sec-empty">Aucune information suivie pour le moment.</p>` : ''}
      </div>
    </div>
  </div>`;
}
