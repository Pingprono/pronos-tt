.1 292.7 454.7 294.3 449 295.7C444.2 296.9 440.5 298.1 436 299.5C431.2 301.1 423.7 304.2 421 305.1C420 305.4 419.4 305.7 419 305.6C418.8 305.5 418.5 305.3 418.5 305C418.8 303.6 431.3 297.7 437 294.8C441.7 292.4 445.5 290.6 450 288.7C454.8 286.6 459.6 284.8 465 283C471.2 280.9 478.4 278.7 485 277C491.3 275.3 497.7 274.1 503.6 273C509 272.1 513.7 271.4 519 270.8C524.8 270.2 530.6 269.8 537 269.6C544.2 269.4 552.3 269.4 560 269.8C567.7 270.2 576.2 271 583.1 272C588.9 272.8 593.1 273.5 599 274.8C606.6 276.5 617.6 279.4 625 281.8C630.7 283.6 638.5 285.9 640 287.5C640.5 288 640.6 288.4 640.4 289C639.8 290.6 633.9 293.6 631.3 296C629.1 298 627.3 299.9 625.7 302C624.2 303.9 623 305.8 621.6 308C620.1 310.6 618.5 316.1 617 316.8Z"/><circle class="sp-dot" cx="667.7" cy="335.1" r="39.9"/><circle class="sp-hit" cx="667.7" cy="335.1" r="39.9"/></g></svg><span class="sp-bshadow"></span><span class="sp-ball"></span><span class="sp-face"></span></div>
    <div class="sp-word"><span>S</span><span>P</span><span>I</span><span>N</span></div>
    <p class="sp-tag">Pronostics de tennis de table</p>
  </div>
</div>
<script>
/* ---------- Écran d'ouverture : la mise en scène ----------
   Ce petit script tourne tout de suite, avant même que le reste de la page
   soit chargé, pour que l'animation démarre dès le premier affichage.
   L'appli lui dit quand elle est prête (SPLASH.ready(), appelé à chaque
   rendu) ; l'écran ne part qu'une fois l'animation jouée ET l'appli prête.
   Si les données traînent, le logo tourne sur lui-même en attendant ; au
   bout de 7 s on ouvre quoi qu'il arrive. Un toucher fait passer l'intro. */
(function () {
  const sp = document.getElementById('splash');
  if (!sp) return;
  const root = document.documentElement;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const motion = !reduce && typeof sp.animate === 'function';
  const meta = document.querySelector('meta[name="theme-color"]');
  const meta0 = meta ? meta.content : '';
  if (meta) meta.content = '#1F5495';
  // Pas de défilement de la page cachée dessous pendant l'ouverture.
  const stop = e => e.preventDefault();
  sp.addEventListener('wheel', stop, { passive: false });
  sp.addEventListener('touchmove', stop, { passive: false });

  const $ = s => sp.querySelector(s);
  const halves = [$('.sp-half.l'), $('.sp-half.r')];
  const edges = [$('.sp-half.l .sp-edge path'), $('.sp-half.r .sp-edge path')];
  const wrap = $('.sp-markwrap'), mark = $('.sp-mark');
  const ball = $('.sp-ball'), shadow = $('.sp-bshadow');
  const dot = $('.sp-dot'), hit = $('.sp-hit');
  const pad = $('.sp-pad'), ghost = $('.sp-ghost'), orbit = $('.sp-orbit');
  const sweeps = [...sp.querySelectorAll('.sp-sw')];
  const letters = [...sp.querySelectorAll('.sp-word span')];
  const tag = $('.sp-tag');
  // Halloween (classe posée dans <head> selon la date) : balle citrouille dont
  // le visage s'allume au moment du coup, et trois chauves-souris qui
  // s'échappent de derrière le logo.
  const halloween = root.classList.contains('halloween');
  const face = $('.sp-face'), bats = [...sp.querySelectorAll('.sp-bat')];
  if (halloween && tag) tag.textContent = 'Édition Halloween';

  let introDone = false, ready = false, leaving = false, gone = false, waitAnim = null;
  const intro = [];
  const doneCbs = [];
  const INTRO_END = motion ? 2300 : 450;

  // Le bord de la table : une ligne blanche à quelques pixels du bord de
  // l'écran (en tenant compte des encoches), coupée en deux moitiés qui
  // partent du milieu du haut et finissent au milieu du bas.
  function insets() {
    const p = document.createElement('div');
    p.style.cssText = 'position:fixed;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
    document.body.appendChild(p);
    const cs = getComputedStyle(p);
    const r = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
    p.remove();
    return r;
  }
  function drawEdges() {
    const W = innerWidth, H = innerHeight, s = insets();
    const i = W < 700 ? 14 : 22, rad = W < 700 ? 24 : 10;
    const hw = W / 2 + 1, top = i + s.t, bot = H - i - s.b;
    const L = i + s.l, R = hw - i - s.r;
    // (chaque moitié déborde de 3 px sur l'autre : pas de jour au milieu)
    const m = W / 2 + 3;
    edges[0].setAttribute('d', `M${m} ${top}H${L + rad}A${rad} ${rad} 0 0 0 ${L} ${top + rad}V${bot - rad}A${rad} ${rad} 0 0 0 ${L + rad} ${bot}H${m}`);
    edges[1].setAttribute('d', `M-2 ${top}H${R - rad}A${rad} ${rad} 0 0 1 ${R} ${top + rad}V${bot - rad}A${rad} ${rad} 0 0 1 ${R - rad} ${bot}H-2`);
  }
  drawEdges();
  addEventListener('resize', () => { if (!gone) drawEdges(); });

  // fill "both" : l'état de départ est tenu pendant l'attente (delay). Les
  // sorties (fondus de fin) passent fill: 'forwards' pour ne pas écraser,
  // pendant leur attente, l'animation précédente du même élément.
  function anim(el, kf, opt) {
    const a = el.animate(kf, Object.assign({ fill: 'both' }, opt));
    intro.push(a);
    return a;
  }

  function play() {
    // 1. La ligne du bord se trace (0 → 0,7 s).
    edges.forEach(e => anim(e, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }],
      { duration: 700, delay: 60, easing: 'cubic-bezier(.33,0,.15,1)' }));

    // 2. La balle arrive du coin haut-droit, rebondit deux fois et se pose
    //    pile à sa place dans le logo. Vue de dessus : plus elle est haute,
    //    plus elle est grosse et plus son ombre s'écarte d'elle.
    const br = ball.getBoundingClientRect();
    const cx = br.left + br.width / 2, cy = br.top + br.height / 2, D = br.width;
    const W = innerWidth, H = innerHeight;
    const dir = [0.62, -0.78];
    const toEdge = Math.min((W - cx) / dir[0], cy / -dir[1]);
    const Ln = toEdge + D * 3.2;
    const S0 = [cx + dir[0] * Ln, cy + dir[1] * Ln];
    const ctl = [cx + dir[0] * Ln * 0.5 - dir[1] * Ln * 0.16, cy + dir[1] * Ln * 0.5 + dir[0] * Ln * 0.16];
    const t1 = 0.47, t2 = 0.77, t3 = 0.95;
    const hAt = t => t < t1 ? 1 - (t / t1) ** 2
      : t < t2 ? 4 * 0.3 * ((t - t1) / (t2 - t1)) * (1 - (t - t1) / (t2 - t1))
      : t < t3 ? 4 * 0.08 * ((t - t2) / (t3 - t2)) * (1 - (t - t2) / (t3 - t2)) : 0;
    const uAt = t => t < t1 ? 0.66 * t / t1 : t < t2 ? 0.66 + 0.27 * (t - t1) / (t2 - t1) : t < t3 ? 0.93 + 0.07 * (t - t2) / (t3 - t2) : 1;
    const at = u => [0, 1].map(k => (1 - u) * (1 - u) * S0[k] + 2 * u * (1 - u) * ctl[k] + u * u * [cx, cy][k]);
    const ts = new Set([0, t1, t2, t3, 1]);
    for (let k = 1; k < 48; k++) ts.add(k / 48);
    const bk = [], sk = [];
    [...ts].sort((a, b) => a - b).forEach(t => {
      const h = hAt(t), p = at(uAt(t));
      const x = p[0] - cx, y = p[1] - cy;
      bk.push({ offset: t, opacity: 1, transform: `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${(1 + 1.5 * h).toFixed(3)})` });
      sk.push({ offset: t, opacity: +(0.95 - 0.4 * h).toFixed(3), transform: `translate(${(x + h * D * 0.8).toFixed(1)}px,${(y + h * D * 1.2).toFixed(1)}px) scale(${(1.08 + 0.8 * h).toFixed(3)})` });
    });
    anim(ball, bk, { duration: 900, delay: 120 });
    anim(shadow, sk, { duration: 900, delay: 120 });
    // Posée : la balle en volume devient la balle plate du logo.
    anim(dot, [{ opacity: 0 }, { opacity: 1 }], { duration: 140, delay: 1000 });
    anim(ball, [{ opacity: 1 }, { opacity: 0 }], { duration: 160, delay: 1060, fill: 'forwards' });
    anim(shadow, [{ opacity: 0.95 }, { opacity: 0 }], { duration: 160, delay: 1020, fill: 'forwards' });

    // 3. La raquette monte depuis le bas, pivote autour du manche et frappe
    //    (contact à 1,26 s), avec un léger rebond en fin de geste.
    const swing = [
      { offset: 0, opacity: 0, transform: 'rotate(-82deg) scale(.94)', easing: 'cubic-bezier(.5,0,.9,.55)' },
      { offset: 0.14, opacity: 1 },
      { offset: 0.68, transform: 'rotate(0deg) scale(1)', easing: 'cubic-bezier(.2,.7,.35,1)' },
      { offset: 0.84, transform: 'rotate(4.5deg) scale(1)', easing: 'cubic-bezier(.45,0,.55,1)' },
      { offset: 1, opacity: 1, transform: 'rotate(0deg) scale(1)' }
    ];
    anim(pad, swing, { duration: 560, delay: 880 });
    anim(ghost, [
      { offset: 0, opacity: 0, transform: 'rotate(-82deg) scale(.94)', easing: 'cubic-bezier(.5,0,.9,.55)' },
      { offset: 0.3, opacity: 0.26 },
      { offset: 0.68, opacity: 0, transform: 'rotate(0deg) scale(1)' },
      { offset: 1, opacity: 0, transform: 'rotate(0deg) scale(1)' }
    ], { duration: 560, delay: 930 });

    // 4. Contact : la balle encaisse le coup...
    anim(dot, [{ transform: 'scale(1)' }, { transform: 'scale(1.2)', offset: 0.3 }, { transform: 'scale(1)' }],
      { duration: 300, delay: 1260, easing: 'cubic-bezier(.3,0,.3,1)' });
    anim(hit, [{ opacity: 0.75, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(2.1)' }],
      { duration: 420, delay: 1260, easing: 'cubic-bezier(.23,1,.32,1)', fill: 'forwards' });
    // ... et son effet dessine les arcs du logo, en partant d'elle.
    // (chaque arc porte son départ et sa durée : data-t="départ durée")
    sweeps.forEach(s => {
      const [delay, duration] = s.dataset.t.split(' ').map(Number);
      anim(s, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration, delay, easing: 'cubic-bezier(.3,.6,.35,1)' });
    });

    if (halloween) {
      anim(face, [{ opacity: 0 }, { opacity: 1, offset: 0.2 }, { opacity: 0.5, offset: 0.34 }, { opacity: 1, offset: 0.5 },
        { opacity: 0.78, offset: 0.74 }, { opacity: 1 }], { duration: 900, delay: 1240 });
      const dests = [[-0.6, -0.6], [0.64, -0.56], [0.72, -0.1]];
      bats.forEach((b, k) => {
        const dx = dests[k][0] * W, dy = dests[k][1] * H, kf = [];
        for (let i = 0; i <= 12; i++) {
          const t = i / 12, wob = Math.sin(t * Math.PI * 3 + k) * 22 * (1 - t);
          kf.push({ opacity: Math.min(1, t / 0.08), transform: `translate(${(dx * (0.55 * t + 0.45 * t * t)).toFixed(1)}px,${(dy * t + wob).toFixed(1)}px) scale(${(0.3 + 1.15 * t).toFixed(2)})` });
        }
        anim(b, kf, { duration: 1050 + k * 140, delay: 1600 + k * 110, easing: 'cubic-bezier(.4,0,.75,1)' });
      });
    }

    // 5. Le nom, lettre par lettre, puis la ligne du dessous.
    letters.forEach((l, k) => anim(l, [
      { transform: 'translateY(108%) skewX(-10deg)', opacity: 0 },
      { opacity: 1, offset: 0.35 },
      { transform: 'translateY(0) skewX(0)', opacity: 1 }
    ], { duration: 560, delay: 1520 + k * 70, easing: 'cubic-bezier(.23,1,.32,1)' }));
    anim(tag, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }],
      { duration: 420, delay: 1880, easing: 'cubic-bezier(.23,1,.32,1)' });
  }

  function finishIntro() {
    if (introDone) return;
    introDone = true;
    intro.forEach(a => { try { a.finish(); } catch (e) { /* déjà fini */ } });
    maybeLeave();
  }

  // En attendant les données : le logo tourne sur lui-même, comme une balle
  // liftée. Dès que l'appli est prête, il termine son tour puis on ouvre.
  function startWait() {
    if (waitAnim || !motion) return;
    waitAnim = orbit.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }],
      { duration: 1150, iterations: Infinity, easing: 'cubic-bezier(.6,0,.35,1)' });
  }

  function maybeLeave() {
    if (leaving || !introDone) return;
    if (!ready) { startWait(); return; }
    if (waitAnim) {
      if (waitAnim.ending) return;
      waitAnim.ending = true; // on part à la fin du tour en cours
      const it = waitAnim.effect.getComputedTiming().currentIteration || 0;
      waitAnim.effect.updateTiming({ iterations: it + 1 });
      waitAnim.finished.then(() => { waitAnim = null; leave(); }, () => { waitAnim = null; leave(); });
      return;
    }
    leave();
  }

  function findTarget() {
    for (const m of document.querySelectorAll('#app .mark')) {
      const r = m.getBoundingClientRect();
      if (r.width > 4 && r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth) return m;
    }
    return null;
  }

  function cleanup() {
    if (gone) return;
    gone = true;
    sp.remove();
    root.classList.remove('splash-flying');
    if (meta) meta.content = meta0;
    window.SPLASH.active = false;
    doneCbs.splice(0).forEach(cb => { try { cb(); } catch (e) { console.error(e); } });
  }

  function leave() {
    if (leaving || gone) return;
    leaving = true;
    sp.style.pointerEvents = 'none';
    try { if (window.SPLASH.onReveal) window.SPLASH.onReveal(); } catch (e) { console.error(e); }
    if (!motion) {
      if (typeof sp.animate === 'function') sp.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 280, fill: 'forwards' }).finished.then(cleanup, cleanup);
      else cleanup();
      return;
    }
    const target = findTarget();
    if (halloween && face) face.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, fill: 'forwards' });
    const ease = 'cubic-bezier(.65,0,.25,1)';
    const fades = [$('.sp-word'), tag].map(el =>
      el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(8px)' }], { duration: 220, fill: 'forwards', easing: 'ease-in' }));
    let fly;
    if (target) {
      root.classList.add('splash-flying');
      const wr = wrap.getBoundingClientRect(), tr = target.getBoundingClientRect();
      const k = tr.width / wr.width;
      const dx = tr.left + tr.width / 2 - (wr.left + wr.width / 2), dy = tr.top + tr.height / 2 - (wr.top + wr.height / 2);
      fly = wrap.animate([{ transform: 'translate(0,0) scale(1)' }, { transform: `translate(${dx}px,${dy}px) scale(${k})` }],
        { duration: 760, easing: 'cubic-bezier(.6,0,.2,1)', fill: 'forwards' });
      const col = getComputedStyle(target).backgroundColor || '#fff';
      mark.animate([{ color: '#fff' }, { color: '#fff', offset: 0.4 }, { color: col, offset: 0.85 }, { color: col }], { duration: 760, fill: 'forwards' });
    } else {
      fly = wrap.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.7)' }], { duration: 420, easing: 'ease-in', fill: 'forwards' });
    }
    // Les deux moitiés s'écartent ; leur ombre sur l'appli n'apparaît
    // qu'une fois qu'elles ont commencé à bouger (pas de pli au milieu avant).
    const doors = halves.map((h, k) => {
      const sh = `${k ? -26 : 26}px 0 46px -14px rgba(6,16,32,`;
      return h.animate([
        { transform: 'translateX(0)', boxShadow: sh + '0)' },
        { boxShadow: sh + '.55)', offset: 0.3 },
        { transform: `translateX(${k ? '' : '-'}101%)`, boxShadow: sh + '.55)' }
      ], { duration: 780, delay: 60, easing: ease, fill: 'forwards' });
    });
    Promise.all([fly.finished, ...doors.map(d => d.finished), ...fades.map(f => f.finished)]).then(cleanup, cleanup);
  }

  window.SPLASH = {
    active: true,
    onReveal: null,
    // (différé : on ne relance jamais un rendu depuis l'intérieur d'un rendu)
    ready() { if (ready) return; ready = true; setTimeout(maybeLeave, 0); },
    whenDone(cb) { if (gone) cb(); else doneCbs.push(cb); }
  };

  if (motion) play();
  else if (halloween && face) face.style.opacity = '1';
  setTimeout(finishIntro, INTRO_END);
  // Toucher ou appuyer sur une touche : on passe l'intro.

function themeKeyFor(m) {

// Thème de toute l'appli : basé sur le circuit choisi, et pour le WTT, sur le
// tournoi le plus pertinent du moment (celui en direct, sinon le plus proche).
function currentThemeKey() {
  if (S.tab !== 'matches') return 'ALL';
  if (S.circuit === 'PRO_A') return 'PRO_A';
  if (S.circuit !== 'WTT') return 'ALL';
  const wtt = S.matches.filter(m => m.circuit === 'WTT');
  if (!wtt.length) return 'WTT_DEFAULT';
  const now = Date.now();
  const live = wtt.filter(m => m.status === 'live');
  // Plusieurs matchs peuvent être "en direct" en même temps (plusieurs tables,
  // ou un match resté coincé en direct faute de résultat synchronisé) : on
  // prend celui dont l'heure de début est la plus proche de maintenant, qui
  // correspond le mieux au tournoi réellement en cours aujourd'hui.
  const next = wtt.filter(m => m.status === 'scheduled').sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at))[0];
  const pick = live.length
    ? live.reduce((a, b) => Math.abs(new Date(b.starts_at) - now) < Math.abs(new Date(a.starts_at) - now) ? b : a)

const fmtWhen = iso => new Date(iso).toLocaleString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

/* ---------- Petits sons (Web Audio, synthétisés — pas de fichiers audio) ---------- */
// Design sonore minimal : quelques bips courts (80-250ms) générés à la
// volée avec des oscillateurs, pour un fichier unique sans ressource externe
// à héberger/licencier. Le contexte audio n'est créé qu'au premier appel de
// playSound(), jamais avant : les navigateurs bloquent toute lecture audio
// avant un geste réel de la personne (clic, appui...), et on respecte cette
// règle plutôt que d'essayer de la contourner. Tout est "best effort" :
// Web Audio peut être indisponible ou lever une erreur dans certains
// contextes restrictifs (vieux navigateur, certaines webviews...) — jamais
// cela ne doit faire planter le reste de l'appli (render, toast, pick...),
// d'où les try/catch à chaque étage.
let _actx = null;
function getAudioCtx() {
  if (_actx) return _actx;

    if (!Ctx) return null;
    _actx = new Ctx();

// Une tonalité brève : fréquence fixe ou glissée (freq -> freqEnd), durée,
// forme d'onde, volume de pointe modeste. Enveloppe attaque rapide /
// relâchement exponentiel doux pour éviter tout "clic" de coupure brutale.
function tone(ctx, { freq, freqEnd, dur = 0.12, type = 'sine', gain = 0.08, delay = 0 }) {
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const amp = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (freqEnd != null) osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), t0 + dur);
  amp.gain.setValueAtTime(0, t0);
  amp.gain.linearRampToValueAtTime(gain, t0 + Math.min(0.015, dur / 4));
  amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(amp).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}
// Bibliothèque de sons courts, un par moment clé (voir playSound()). Les
// variantes "Halloween" (grincement/whoosh grave au lieu d'une petite
// fanfare) ne sont utilisées que quand S.themeMode === 'halloween' — même
// système playSound()/SOUNDS, juste des paramètres de synthèse différents,
// plutôt qu'un second système de sons à maintenir.
const SOUNDS = {
  // Pronostic confirmé / toast de succès : petit blip à deux tons, net et bref.
  confirm(ctx) {
    tone(ctx, { freq: 660, dur: 0.07, type: 'sine', gain: 0.07 });
    tone(ctx, { freq: 880, dur: 0.09, type: 'sine', gain: 0.07, delay: 0.06 });
  },
  // Toast d'erreur : tonalité courte et descendante, nettement distincte du succès.
  error(ctx) {
    tone(ctx, { freq: 340, freqEnd: 180, dur: 0.18, type: 'square', gain: 0.05 });
  },
  // Tap sur un score de la "fiche de match" / changement d'onglet : tick
  // discret, presque un murmure, pour rester agréable même répété vite.
  tick(ctx) {
    tone(ctx, { freq: 520, dur: 0.035, type: 'sine', gain: 0.035 });
  },
  // Rebond d'une balle sur la table : un "toc" sec, très court.
  bounce(ctx) {
    tone(ctx, { freq: 1900, freqEnd: 1100, dur: 0.035, type: 'triangle', gain: 0.07 });
    tone(ctx, { freq: 300, dur: 0.025, type: 'sine', gain: 0.05 });
  },
  // Une médaille qui se pose : un tintement de métal, deux harmoniques aiguës.
  clink(ctx) {
    tone(ctx, { freq: 2350, dur: 0.22, type: 'sine', gain: 0.035 });
    tone(ctx, { freq: 3520, dur: 0.16, type: 'sine', gain: 0.02, delay: 0.005 });
    tone(ctx, { freq: 2350, dur: 0.12, type: 'sine', gain: 0.02, delay: 0.09 });
  },
  // La balle percute l'écran : un "pop" qui monte.

    tone(ctx, { freq: 700, freqEnd: 1600, dur: 0.12, type: 'sine', gain: 0.06 });
  },
  // Nouveau palier de série franchi (vert -> orange -> violet -> bleu) :
  // petite fanfare montante à 3 notes, un peu plus marquée (c'est rare).
  milestone(ctx) {
    if (S.themeMode === 'halloween') { SOUNDS.milestoneSpooky(ctx); return; }
    [523.25, 659.25, 783.99].forEach((f, i) => tone(ctx, { freq: f, dur: 0.14, type: 'triangle', gain: 0.09, delay: i * 0.08 }));

  // l'aigu, façon grincement de porte/esprit qui passe — plus en phase avec
  // l'ambiance fantomatique que la fanfare habituelle.
  milestoneSpooky(ctx) {
    tone(ctx, { freq: 110, freqEnd: 330, dur: 0.4, type: 'sawtooth', gain: 0.05 });

  },

// Point d'entrée unique, à appeler partout dans l'appli : no-op silencieux

// une erreur — ne lève jamais d'exception vers l'appelant.
function playSound(name) {
  try {
    if (!S.soundOn) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume().catch(() => {});
    const fn = SOUNDS[name];

    if (S._lastStreakTier != null && tier > S._lastStreakTier) { playSound('milestone'); releaseBats(); }

function toast(msg, isErr) {

  el.className = 'toast' + (isErr ? ' err' : '');

    el.classList.add('leaving');
    setTimeout(() => el.remove(), 200);

function friendlyError(e) {
  const msg = (e && e.message) || String(e);
  if (/Invalid login credentials/i.test(msg)) return 'Email ou mot de passe incorrect.';
  if (/Database error saving new user|invitation/i.test(msg)) return "Inscription refusée : vérifie le code d'invitation, et choisis un pseudo de 2 à 20 caractères qui n'est pas déjà pris.";
  if (/already (been )?registered/i.test(msg)) return 'Cet email a déjà un compte. Connecte-toi.';
  if (/at least \d+ characters/i.test(msg)) return 'Le mot de passe doit faire au moins 6 caractères.';
  if (/Email not confirmed/i.test(msg)) return "Ton email n'est pas encore confirmé. Vérifie ta boîte mail.";
  if (/Score impossible/i.test(msg)) return msg;
  if (/row-level security/i.test(msg)) return "Action refusée : le match a peut-être déjà commencé, ou tu n'as pas les droits.";
  if (/duplicate key/i.test(msg)) return 'Cet élément existe déjà.';

/* ---------- Prédictions statistiques ---------- */
/* Estimation simple : classement + forme récente + face-à-face.
   Ce n'est pas une certitude, juste une tendance. */
function binom(n, k) { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; }
function winProb(q, n) { let s = 0; for (let k = 0; k < n; k++) s += binom(n - 1 + k, k) * Math.pow(q, n) * Math.pow(1 - q, k); return s; }
function setProbFromMatchProb(p, n) {
  let lo = 0.001, hi = 0.999;
  for (let i = 0; i < 50; i++) { const mid = (lo + hi) / 2; if (winProb(mid, n) < p) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
function bestScore(q, n) {
  let best = null;
  for (let k = 0; k < n; k++) {
    const pa = binom(n - 1 + k, k) * Math.pow(q, n) * Math.pow(1 - q, k);
    const pb = binom(n - 1 + k, k) * Math.pow(1 - q, n) * Math.pow(q, k);
    if (!best || pa > best.p) best = { p: pa, a: n, b: k };
    if (pb > best.p) best = { p: pb, a: k, b: n };
  }
  return best;
}
function recentForm(id) {
  const games = S.matches
    .filter(m => m.status === 'finished' && (m.competitor_a_id === id || m.competitor_b_id === id))
    .sort((x, y) => new Date(y.starts_at) - new Date(x.starts_at)).slice(0, 5);
  if (games.length < 2) return null;
  const wins = games.filter(m => (m.competitor_a_id === id) === (m.score_a > m.score_b)).length;
  return wins / games.length;
}
function headToHead(a, b) {
  let wa = 0, wb = 0;
  for (const m of S.matches) {
    if (m.status !== 'finished') continue;
    if (m.competitor_a_id === a && m.competitor_b_id === b) { if (m.score_a > m.score_b) wa++; else wb++; }
    else if (m.competitor_a_id === b && m.competitor_b_id === a) { if (m.score_a > m.score_b) wb++; else wa++; }
  }
  return { wa, wb };
}
function trend(m) {
  const a = S.competitors[m.competitor_a_id], b = S.competitors[m.competitor_b_id];
  if (!a || !b || !a.ranking || !b.ranking) return null;
  let z = 0.45 * (Math.log(b.ranking) - Math.log(a.ranking));
  const fa = recentForm(a.id), fb = recentForm(b.id);
  if (fa !== null && fb !== null) z += 1.2 * (fa - fb);
  const h = headToHead(a.id, b.id);
  if (h.wa + h.wb > 0) z += 0.5 * (h.wa - h.wb) / (h.wa + h.wb);
  const pA = 1 / (1 + Math.exp(-z));
  const q = setProbFromMatchProb(pA, m.wins_needed);

}

// score sélectionné, plutôt qu'un pourcentage global de victoire par côté.
function scoreProb(q, n, a, b) {
  if (a === n) return binom(n - 1 + b, b) * Math.pow(q, n) * Math.pow(1 - q, b);
  if (b === n) return binom(n - 1 + a, a) * Math.pow(1 - q, n) * Math.pow(q, a);
  return 0;
}
// Bonus "outsider" (WTT uniquement) : un pronostic gagnant sur le joueur le moins bien classé
// au tirage au sort rapporte un supplément, d'autant plus grand que l'écart est important.
// Basé sur la tête de série figée à la création du match : elle ne bouge jamais après coup,
// même si le classement du joueur change ensuite (pour son tournoi suivant, par exemple).
function outsiderBonus(m, bonVainqueur) {
  if (!bonVainqueur || m.circuit !== 'WTT' || m.seed_a == null || m.seed_b == null) return 0;
  const aGagne = m.score_a > m.score_b;
  const outsiderGagne = aGagne ? m.seed_a > m.seed_b : m.seed_b > m.seed_a;
  if (!outsiderGagne) return 0;
  return Math.min(Math.floor(Math.abs(m.seed_a - m.seed_b) / 4), 5);

// --- Bonus de série (streak) : plus on enchaîne de pronostics gagnants
// d'affilée (bon vainqueur, score exact ou pas), plus le prochain
// pronostic gagnant rapporte de points. "streakBefore" = nombre de pronos
// gagnants d'affilée JUSTE AVANT ce match (jamais ce match lui-même) :
// appelant doit le calculer à partir de l'historique chronologique de la
// personne (voir computeStreakSeries / myStreakInfo plus bas). Formule et
// paliers IDENTIQUES à ceux de la vue SQL "prediction_points"
// (ajout-bonus-serie.sql) : c'est elle qui fait foi pour le classement,
// cette fonction n'est qu'un miroir pour l'affichage côté client.
//   0–2  pronos gagnants d'affilée -> x1.00 (pas de bonus)
//   3–4                            -> x1.15 (palier "vert")
//   5–6                            -> x1.28 (palier "orange")
//   7–9                            -> x1.45 (palier "violet")

//                                      plafonné à x1.75 (palier "bleu")
function streakMult(streak) {
  const s = Math.max(0, streak || 0);
  if (s <= 2) return 1;
  if (s <= 4) return 1.15;
  if (s <= 6) return 1.28;
  if (s <= 9) return 1.45;
  return Math.min(1.60 + 0.02 * (s - 10), 1.75);
}
// Palier visuel (couleur de flamme) pour une longueur de série donnée.

// même si la couleur lit habituellement "froid".
function flameTier(streak) {

const FLAME_LABELS = ['', 'vert', 'orange', 'violet', 'bleu'];

// Variante Halloween de flameSvg : une petite citrouille sculptée, lisible

// Pastille "série" : flamme colorée + chiffre, et éventuellement le

// --- Balles (mise stratégique par tournoi) : au début de chaque tournoi WTT
// (une valeur de m.competition) ou de chaque journée Pro A (une valeur de
// m.round -- même regroupement que byTournament/byJournee dans accountView()),
// chacun reçoit un petit stock de balles à miser sur ses pronostics de CE
// tournoi : 4 pour un tournoi WTT, 2 pour une journée de Pro A (qui compte
// deux fois moins de matchs). 3 balles au maximum sur un même match.
// Les balles ne se récupèrent JAMAIS en cours de tournoi, qu'on gagne ou
// qu'on perde le match sur lequel elles sont misées : la mise est déduite dès
// qu'elle est posée. Seul son MONTANT peut encore être changé (augmenté ou
// diminué) tant que le match n'a pas commencé -- voir setBalles().
//
// Effet : si le prono est gagnant (bon vainqueur ou score exact), chaque
// balle ajoute +1 au multiplicateur (1 balle = x2, 2 = x3, 3 = x4).
// Rééquilibrage : le bonus de série et les balles s'ADDITIONNENT au lieu de
// se multiplier entre eux -> multiplicateur = série + balles, sur le barème
// de base (1 ou 3 points), un seul arrondi final ; le bonus outsider
// continue de s'ajouter par-dessus sans jamais être multiplié.
// Avant ce rééquilibrage (10 balles, max 5, série x balles), une simulation
// de saison montrait que les balles faisaient ~65 % des points et qu'un seul
// match pouvait rapporter ~37 points ; avec ces règles : ~34 % et ~19 max.
// Formule et chiffres IDENTIQUES à ceux de la vue SQL "prediction_points"
// (reequilibrage-balles.sql) : c'est elle qui fait foi pour le classement,
// cette fonction n'est qu'un miroir d'affichage.
// Exemple : score exact (3 pts), série de 5 pronos gagnants avant ce match
// (x1.28), 2 balles misées (+2) -> round(3 * (1.28 + 2)) = round(9.84)
// = 10 points (+ bonus outsider éventuel).
const BALLES_STOCK_BY_CIRCUIT = { WTT: 4, PRO_A: 2 }; // stock au début de chaque tournoi WTT / journée Pro A
const BALLES_MAX_PER_MATCH = 3;   // plafond par match
const BALLES_BONUS_PER = 1;       // +1 au multiplicateur par balle misée, si gagnant
const BALLES_MULT_CEILING = 4;    // plafond du multiplicateur de balles (3 balles : 1+1*3)
function ballesStock(m) {
  return BALLES_STOCK_BY_CIRCUIT[m && m.circuit] || 4;
}

// Clé de regroupement "tournoi" d'un match pour le budget de balles : un
// tournoi WTT (m.competition) ou une journée Pro A (m.round) -- jamais mélangé
// entre deux tournois WTT ni entre deux journées Pro A différentes.
function ballesScopeKey(m) {
  return m.circuit === 'WTT' ? (m.competition || 'WTT') : (m.round || m.competition || 'Pro A');
}
// Multiplicateur de points pour N balles misées (0 balle = x1, exactement le
// comportement d'avant cet ajout : rétro-compatible avec tout pronostic jugé
// sans donnée de mise).
function ballesMult(staked) {
  const n = Math.max(0, Math.min(staked || 0, BALLES_MAX_PER_MATCH));
  return Math.min(1 + BALLES_BONUS_PER * n, BALLES_MULT_CEILING);
}
// Balles déjà dépensées par la personne connectée sur le même tournoi/journée
// que `m` (toutes les entrées de S.myPreds dont le match correspondant
// partage la même scope), hors le match `excludeMatchId` le cas échéant --
// pour pouvoir calculer "combien puis-je encore mettre sur CE match-ci" sans
// compter sa propre mise actuelle en double. Basé sur S.myPreds/S.matches
// déjà chargés : aucune requête réseau supplémentaire.
function ballesSpentInScope(m, excludeMatchId) {
  const scope = ballesScopeKey(m);
  let spent = 0;
  for (const midStr in S.myPreds) {
    const mid = +midStr;
    if (excludeMatchId != null && mid === excludeMatchId) continue;
    const p = S.myPreds[mid];
    if (!p || !p.balles_staked) continue;
    const mm = S.matches.find(x => x.id === mid);
    if (!mm || mm.circuit !== m.circuit || ballesScopeKey(mm) !== scope) continue;
    spent += p.balles_staked;
  }
  return spent;
}
// Balles encore disponibles pour ce tournoi/journée, en excluant la mise déjà
// posée sur `m` elle-même (donc : "combien puis-je au total mettre sur ce
// match" = ballesRemaining(m, m.id), mise actuelle de ce match comprise).
function ballesRemaining(m, excludeMatchId) {
  return Math.max(0, ballesStock(m) - ballesSpentInScope(m, excludeMatchId));
}
// Petite icône "balle" en SVG inline (même esprit que flameSvg/MARK : pas
// d'image, juste un trait fin qui prend la couleur courante).
function ballIcon(size) {
  size = size || 13;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M8.2 6.6q2.4 5.4 0 10.8" stroke-width="1.3" opacity=".6"/></svg>`;
}
// Budget de balles d'un groupe de matchs (ex : l'en-tête d'un tournoi dans
// matchesView) : n'affiche un total que si tous les matchs du groupe
// partagent bien la même scope tournoi/journée (sinon le nombre serait
// trompeur -- ça n'arrive qu'en filtre "Tous" si plusieurs journées Pro A
// sont affichées ensemble, jamais dans les onglets WTT/Pro A filtrés).
function groupBallesBudgetHtml(matches) {
  if (!matches.length) return '';
  const scopes = new Set(matches.map(ballesScopeKey));
  if (scopes.size !== 1) return '';
  const rem = ballesRemaining(matches[0], null);
  return `<span class="ballesbudget" title="Balles encore disponibles pour ce tournoi">${ballIcon(14)}<span><b>${rem}</b>/${ballesStock(matches[0])} balles</span></span>`;
}
// Mini-stepper de mise, affiché sous le panneau de pronostic d'un match pas
// encore jugé : visible seulement une fois un prono posé (on mise SUR un
// pronostic existant, pas dans le vide), boutons désactivés une fois le match
// verrouillé (même convention que les pastilles de score, voir chips()).
function ballesStepperHtml(m) {
  const mine = S.myPreds[m.id];
  if (!mine) return '';
  const locked = isLocked(m);
  const staked = mine.balles_staked || 0;
  const cap = Math.min(BALLES_MAX_PER_MATCH, ballesRemaining(m, m.id));
  const pct = Math.round((ballesMult(staked) - 1) * 100);
  return `<div class="ballesrow">
    <span class="balleslabel">${ballIcon(13)}Balles misées</span>
    <div class="ballesstepper">
      <button type="button" class="ballesbtn" data-act="balles" data-id="${m.id}" data-v="${Math.max(0, staked - 1)}" aria-label="Retirer une balle" ${locked || staked <= 0 ? 'disabled' : ''}>−</button>
      <span class="ballesdots" aria-hidden="true">${Array.from({ length: BALLES_MAX_PER_MATCH }, (_, i) => `<i class="${i < staked ? 'on' : ''}"></i>`).join('')}</span><b class="sr-only">${staked}</b>
      <button type="button" class="ballesbtn" data-act="balles" data-id="${m.id}" data-v="${staked + 1}" aria-label="Ajouter une balle" ${locked || staked >= cap ? 'disabled' : ''}>+</button>
    </div>
    <small class="ballespct">${staked > 0 ? `×${ballesMult(staked)} si gagnant (+${pct}%)` : `jusqu'à ${cap} ici`}</small>
  </div>`;
}
// À partir d'un historique déjà trié chronologiquement (du plus ancien au
// plus récent), calcule pour chaque entrée la série EN COURS avant et
// après ce match. "bonVainqueur" = la victoire était la bonne (score exact
// ou pas), seul critère qui fait avancer la série (voir énoncé : "un
// pronostic victorieux = qui a rapporté au moins un point"). m peut être
// soit l'objet match directement, soit h.matches (forme renvoyée par
// loadAccount()).
function computeStreakSeries(sortedFinished) {
  let streak = 0;
  return sortedFinished.map(h => {
    const m = h.matches || h;
    const bonVainqueur = Math.sign(h.pred_a - h.pred_b) === Math.sign(m.score_a - m.score_b);
    const streakBefore = streak;
    streak = bonVainqueur ? streak + 1 : 0;
    return { ...h, streakBefore, streakAfter: streak, bonVainqueur };
  });
}
// Série actuelle de la personne connectée + table match_id -> série AVANT
// ce match, à partir de S.myHistory (chargé par loadAccount(), aussi
// déclenché en tâche de fond dès la connexion — voir loadAll()). Renvoie
// des valeurs neutres tant que l'historique n'est pas encore chargé : la
// vue SQL reste de toute façon la seule source de vérité pour les points
// réellement enregistrés.
function myStreakInfo() {
  if (!S.myHistory) return { before: new Map(), now: 0 };
  const sorted = S.myHistory.filter(h => h.matches && h.matches.status === 'finished')
    .sort((a, b) => new Date(a.matches.starts_at) - new Date(b.matches.starts_at) || a.match_id - b.match_id);
  const withStreak = computeStreakSeries(sorted);
  const before = new Map(withStreak.map(h => [h.match_id, h.streakBefore]));
  const now = withStreak.length ? withStreak[withStreak.length - 1].streakAfter : 0;
  return { before, now };
}
function pointsDetail(m, p, streakBefore) {
  if (m.status !== 'finished' || !p) return null;
  const exact = p.pred_a === m.score_a && p.pred_b === m.score_b;
  const bonVainqueur = Math.sign(p.pred_a - p.pred_b) === Math.sign(m.score_a - m.score_b);
  const base = exact ? 3 : (bonVainqueur ? 1 : 0);
  const mult = bonVainqueur ? streakMult(streakBefore) : 1;
  const withStreak = Math.round(base * mult);
  const streakBonus = withStreak - base;
  // Balles : s'ADDITIONNENT au bonus de série (voir le commentaire au-dessus
  // de BALLES_STOCK_BY_CIRCUIT) ; plafonnées à BALLES_MAX_PER_MATCH, y
  // compris pour d'anciennes mises posées avant le rééquilibrage. Un seul
  // arrondi final ; 0 balle -> withBalles === withStreak (rien ne change
  // pour les pronostics sans mise).
  const staked = p.balles_staked || 0;
  const counted = bonVainqueur ? Math.max(0, Math.min(staked, BALLES_MAX_PER_MATCH)) : 0;
  const withBalles = Math.round(base * (mult + BALLES_BONUS_PER * counted));
  const ballesBonus = withBalles - withStreak;
  const bonus = outsiderBonus(m, bonVainqueur);
  return { total: withBalles + bonus, base, bonus, streakBonus, ballesBonus, balles: staked, exact, streakBefore: streakBefore || 0 };
}
// Série de n'importe quel joueur JUSTE AVANT un match jugé, à partir de
// S.allJudgedPreds (pronostics de tout le monde déjà jugés, chargés par
// loadAccount) : même calcul que le récap et que la vue SQL. Sert à afficher
// sous un match les mêmes points que ceux comptés au classement. Mis en
// cache tant que S.allJudgedPreds ne change pas ; 0 tant qu'il n'est pas
// encore chargé.
let _streakCache = { src: null, map: null };
function streakBeforeFor(userId, matchId) {
  const src = S.allJudgedPreds;
  if (!src) return 0;
  if (_streakCache.src !== src) {
    const byUser = {};
    for (const r of src) { if (r.matches) (byUser[r.user_id] || (byUser[r.user_id] = [])).push(r); }
    const map = new Map();
    for (const uid in byUser) {
      const sorted = byUser[uid].slice().sort((a, b) => new Date(a.matches.starts_at) - new Date(b.matches.starts_at) || a.match_id - b.match_id);
      for (const h of computeStreakSeries(sorted)) map.set(uid + ':' + h.match_id, h.streakBefore);
    }
    _streakCache = { src, map };
  }
  return _streakCache.map.get(userId + ':' + matchId) || 0;
}
function points(m, p, streakBefore) {
  const d = pointsDetail(m, p, streakBefore);
  return d ? d.total : null;
}
// Historique de MES pronostics déjà jugés, trié chronologiquement, avec pour
// chacun la série en cours avant/après (streakBefore/streakAfter) et le
// détail des points (pt). Base commune à accountView() ET aux badges
// (computeBadges), pour ne jamais faire dériver les deux calculs. Renvoie
// null tant que S.myHistory n'est pas encore chargé (voir loadAccount()).
function myJudgedHistory() {
  if (S.myHistory === null) return null;
  const sortedChrono = S.myHistory
    .filter(h => h.matches && h.matches.status === 'finished')
    .sort((a, b) => new Date(a.matches.starts_at) - new Date(b.matches.starts_at) || a.match_id - b.match_id);
  return computeStreakSeries(sortedChrono).map(h => ({ ...h, pt: pointsDetail(h.matches, h, h.streakBefore) }));
}

/* ---------- Chargement des données ---------- */
async function reloadMatches() {
  const since = new Date(Date.now() - 90 * 864e5).toISOString();
  const r = await sb.from('matches').select('*').gte('starts_at', since).order('starts_at', { ascending: true }).limit(500);
  if (r.error) throw r.error;
  S.matches = r.data || [];
}
// Supabase ne renvoie jamais plus de 1000 lignes par requête (réglage "Max
// rows"), quel que soit le .limit() demandé : au-delà, des joueurs, des
// pronos ou des matchs manquaient sans prévenir (classements incomplets,
// séries fausses...). On lit donc page par page, dans un ordre stable.
async function fetchAllRows(build) {
  const all = [];
  for (let from = 0; ; from += 1000) {
    const r = await build().range(from, from + 999);
    if (r.error) return { data: null, error: r.error };
    all.push(...(r.data || []));
    if (!r.data || r.data.length < 1000) return { data: all, error: null };
  }
}
async function reloadCompetitors() {
  const r = await fetchAllRows(() => sb.from('competitors').select('*').order('id'));
  if (r.error) throw r.error;
  S.competitors = {};
  (r.data || []).forEach(c => { S.competitors[c.id] = c; });
}
async function loadAll() {
  const uid = S.session.user.id;
  const [p, preds, adm] = await Promise.all([
    sb.from('profiles').select('pseudo').eq('id', uid).maybeSingle(),
    fetchAllRows(() => sb.from('predictions').select('*').eq('user_id', uid).order('id')),
    sb.rpc('is_admin')
  ]);
  await Promise.all([reloadMatches(), reloadCompetitors()]);
  S.pseudo = (p.data && p.data.pseudo) || '';
  S.myPreds = {};
  (preds.data || []).forEach(x => { S.myPreds[x.match_id] = x; });
  S.isAdmin = adm.data === true;
  loadBoard().then(render); // chargé à part : n'empêche pas la connexion s'il échoue
  loadWorldRankings().then(() => { if (S.tab === 'rankings') render(); });
  loadAccount().then(render); // idem : pour la pastille de série sur les cartes de match, sans bloquer la connexion
}
// Vrai classement mondial WTT (top 100 de chaque tableau), enregistré par le
// robot de synchronisation dans world_rankings (voir
// classement-mondial-complet.sql). Table absente ou vide -> [] : l'onglet
// garde alors l'ancien affichage, basé sur les seuls joueurs suivis.
async function loadWorldRankings() {
  try {
    const r = await sb.from('world_rankings').select('gender,pos,rank,name,country,points,competitor_id').order('gender').order('pos');
    S.worldRankings = r.error ? [] : (r.data || []);
  } catch (e) { S.worldRankings = []; }
}
async function loadBoard() {
  const q = S.boardScope === 'ALL'
    ? sb.from('leaderboard').select('*')
    : sb.from('leaderboard_by_circuit').select('*').eq('circuit', S.boardScope);
  const r = await q.order('total_points', { ascending: false }).order('exact_scores', { ascending: false });
  if (r.error) { toast(friendlyError(r.error), true); S.board = []; return; }
  S.board = r.data || [];
}
// Historique complet des pronostics du compte (pas limité aux 90 derniers
// jours comme S.matches), avec le match associé : sert à calculer les
// statistiques personnelles de l'onglet "Mon compte" sur toute la durée du
// jeu, pas seulement sur les matchs encore affichés ailleurs dans l'appli.
async function loadAccount() {
  try {
    const uid = S.session.user.id;
    // circuitBoard (tous circuits, tout le monde) et allJudgedPreds (les
    // pronostics de TOUT LE MONDE sur les matchs déjà terminés) ne servent
    // qu'aux badges (comparaison "Expert WTT/Pro A" et duel "Le Rival") :
    // pas besoin de requête supplémentaire côté sécurité, la policy RLS
    // "voir pronostics" autorise déjà la lecture des pronostics d'autrui une
    // fois le match terminé, et leaderboard_by_circuit est déjà une vue
    // publique existante (utilisée par l'onglet Classements).
    const [h, b, cb, ap] = await Promise.all([
      fetchAllRows(() => sb.from('predictions')
        .select('pred_a,pred_b,match_id,created_at,balles_staked,matches(circuit,status,score_a,score_b,seed_a,seed_b,starts_at,competition,round,side_a,side_b,wins_needed)')
        .eq('user_id', uid).order('id')),
      sb.from('leaderboard').select('*').order('total_points', { ascending: false }).order('exact_scores', { ascending: false }),
      sb.from('leaderboard_by_circuit').select('*'),
      // competition/round/tier ajoutés à ce select existant (et uniquement
      // à celui-ci) pour pouvoir regrouper ces pronostics de tout le monde
      // par tournoi WTT / journée Pro A dans le bilan animé — sans requête
      // supplémentaire, juste trois colonnes de plus sur une jointure déjà
      // là pour les badges.
      fetchAllRows(() => sb.from('predictions')
        .select('user_id,match_id,pred_a,pred_b,balles_staked,matches(circuit,status,score_a,score_b,seed_a,seed_b,starts_at,competition,round,tier)')
        .order('id')),
    ]);
    if (h.error) throw h.error;
    if (b.error) throw b.error;
    S.myHistory = h.data || [];
    S.accountBoard = b.data || [];
    S.circuitBoard = cb.error ? [] : (cb.data || []);
    // Seuls les pronostics (de tout le monde) déjà jugés arrivent ici de
    // toute façon via la policy RLS ; le filtre n'est qu'une double sécurité.
    S.allJudgedPreds = (ap.error ? [] : (ap.data || [])).filter(r => r.matches && r.matches.status === 'finished');
    checkStreakMilestone();
    // "Trône de courte durée" (voir computeBadges) : le classement général
    // est calculé en direct, jamais stocké dans le temps — on se contente
    // donc de retenir, en local sur cet appareil, qu'on a déjà vu son propre
    // nom en tête au moins une fois. Un souvenir, pas une preuve officielle.
    try {
      if (S.accountBoard.length && S.accountBoard[0].user_id === uid) {
        localStorage.setItem('spin_was_first', '1');
      }
    } catch (e) { /* stockage indisponible : tant pis pour ce petit souvenir */ }
    checkNewBadges();
  } catch (e) {
    toast(friendlyError(e), true);
    S.myHistory = S.myHistory || [];
    S.accountBoard = S.accountBoard || [];
    S.circuitBoard = S.circuitBoard || [];
    S.allJudgedPreds = S.allJudgedPreds || [];
  }
}

/* ---------- Session ---------- */
async function handleSession(session) {
  if (!session) {
    S.session = null; S.pseudo = ''; S.isAdmin = false; S.matches = []; S.myPreds = {}; S.board = null;
    render(); return;
  }
  if (S.session && S.session.user.id === session.user.id) { S.session = session; return; }
  S.session = session;
  $app.innerHTML = '<div class="loading">Chargement…</div>';
  try { await loadAll(); S.bootError = ''; }
  catch (e) { S.bootError = friendlyError(e); }
  S._tabAt = Date.now();
  render();
}

/* ---------- Affichage ---------- */
/* ---------- Halloween : araignée, toile, chauves-souris ---------- */
// L'araignée pend au bout de son fil (en-tête sur mobile, rail sur PC,
// écran de connexion). Touchée, elle remonte, puis redescend 6 s plus tard.
function spiderHtml(where) {
  if (!HALLOWEEN) return '';
  const up = Date.now() < (S._spiderUntil || 0) ? ' up' : '';
  return `<span class="spider ${where}${up}" data-act="spider" aria-hidden="true"><i class="thread"></i><svg viewBox="0 0 400 350"><use href="#gi-spider" width="400" height="350"/></svg></span>`;
}
const cobwebHtml = () => HALLOWEEN ? '<svg class="cobweb" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><use href="#gi-web" width="512" height="512"/></svg>' : '';
function spiderUp() {
  S._spiderUntil = Date.now() + 6000;
  document.querySelectorAll('.spider').forEach(s => s.classList.add('up'));
  clearTimeout(spiderUp.t);
  spiderUp.t = setTimeout(() => document.querySelectorAll('.spider').forEach(s => s.classList.remove('up')), 6000);
}
// Les grands moments (nouveau palier de série, nouveau badge) : une volée de
// chauves-souris traverse l'écran. Rien en mouvement réduit ni hors saison.
function releaseBats(n = 6) {
  if (!HALLOWEEN || matchMedia('(prefers-reduced-motion: reduce)').matches || !document.body.animate) return;
  const box = document.createElement('div');
  box.className = 'bats'; box.setAttribute('aria-hidden', 'true');
  const W = innerWidth, H = innerHeight;
  for (let i = 0; i < n; i++) {
    const b = document.createElement('i');
    b.innerHTML = '<svg viewBox="0 0 480 356"><use href="#gi-bat" width="480" height="356"/></svg>';
    box.appendChild(b);
    const sx = W * (0.3 + Math.random() * 0.4), sy = H + 40;
    const ex = (i % 2 ? W + 90 : -90) + (Math.random() - 0.5) * W * 0.3, ey = -60 - Math.random() * H * 0.2;
    const mx = sx + (ex - sx) * 0.3 + (Math.random() - 0.5) * W * 0.4, my = H * (0.35 + Math.random() * 0.3);
    const s = 0.65 + Math.random() * 0.6, kf = [];
    for (let k = 0; k <= 14; k++) {
      const t = k / 14, u = 1 - t;
      const x = u * u * sx + 2 * u * t * mx + t * t * ex, y = u * u * sy + 2 * u * t * my + t * t * ey + Math.sin(t * 9 + i) * 10;
      kf.push({ transform: `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${(s * (0.75 + 0.5 * t)).toFixed(2)})` });
    }
    b.animate(kf, { duration: 1500 + Math.random() * 600, delay: i * 120, easing: 'cubic-bezier(.3,0,.6,1)', fill: 'both' });
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3200);
}

function render() {
  if (window.SPLASH) SPLASH.ready();
  // Habillage décoratif Halloween (classe .spooky) : indépendant de la clé
  // de thème résolue, pour que les touches décoratives (toile sur les
  // pastilles de score, cachet ailé, lattes du classement...) s'appliquent
  // partout, y compris sur une carte de match au thème WTT_*/PRO_A dont les
  // couleurs, elles, ne doivent jamais bouger.
  if (!S.session) { $app.innerHTML = authView(); afterRender(); return; }
  const todo = S.matches.filter(m => !isLocked(m) && !S.myPreds[m.id]).length;
  const tabs = [['matches', 'Matchs'], ['board', 'Amis'], ['rankings', 'Classements'], ['account', 'Mon compte']];
  if (S.isAdmin) tabs.push(['admin', 'Admin']);
  const initial = (S.pseudo || '?').slice(0, 1).toUpperCase();
  $app.innerHTML = `
    <div class="shell">
      <nav class="nav" aria-label="Navigation principale">
        <div class="navbrand">${MARK(30)}</div>${cobwebHtml()}${spiderHtml('rail')}
        ${tabs.map(([k, label]) => `<button class="navitem" data-act="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${navIcon(k)}<span>${label}</span>${k === 'matches' && todo ? `<span class="navdot" title="Pronos à faire">${todo}</span>` : ''}</button>`).join('')}
        <span class="navball" aria-hidden="true"></span>

      </nav>

        <aside class="side" aria-label="En un coup d'œil">${sideView()}</aside>

    </div>${S.openCompetitor ? competitorModal(S.openCompetitor) : ''}${S.openRecap ? recapModal(S.openRecap.key, S.openRecap.circuit) : ''}${S.openBadge ? badgeModal(S.openBadge) : ''}`;
  document.documentElement.classList.toggle('noscroll', !!S.openRecap);

/* ---------- Mouvement (après chaque rendu) ----------
   Le DOM est reconstruit à chaque rendu : on rejoue donc ici, une fois
   l'écran en place, les quelques mouvements qui montrent un changement
   d'état (curseur des filtres qui glisse, balle du dock qui saute d'onglet,
   chiffres qui montent à l'ouverture d'un écran). Rien ne bloque un geste. */
const SEG_PREV = {};
let NAV_LAST = null;
function reducedMotion() { try { return !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; } }
function afterRender() {
  try {
    document.querySelectorAll('.pillrow.seg[data-i]').forEach(el => {
      const i = el.dataset.i;
      requestAnimationFrame(() => requestAnimationFrame(() => el.style.setProperty('--i', i)));
    });
    placeNavBall();
    if (!reducedMotion() && document.querySelector('main.fresh')) document.querySelectorAll('main [data-count]').forEach(countUp);
  } catch (e) { /* un mouvement raté ne doit jamais casser l'écran */ }
  try { mountMedal(); } catch (e) { /* la médaille reste à plat */ }
}
function countUp(el) {
  const target = Number(el.dataset.count) || 0;
  if (target <= 0) return;
  const start = performance.now(), dur = 900;
  el.textContent = '0';
  const tick = now => {
    const p = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = String(Math.round(target * e));
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
// La balle du dock : sous l'onglet actif ; quand on change d'onglet, elle
// fait un petit lob jusqu'au nouveau.
function placeNavBall() {
  const nav = document.querySelector('.nav');
  if (!nav) return;
  const ball = nav.querySelector('.navball'), act = nav.querySelector('.navitem[aria-current="page"]');
  if (!ball || !act) return;
  const nr = nav.getBoundingClientRect(), ar = act.getBoundingClientRect();
  const vertical = nr.height > nr.width;
  const x = vertical ? 3 : Math.round(ar.left - nr.left + ar.width / 2 - 4);
  const y = vertical ? Math.round(ar.top - nr.top + ar.height / 2 - 4) : Math.round(ar.bottom - nr.top + 1);
  ball.style.transform = `translate(${x}px,${y}px)`;
  ball.classList.add('on');
  const last = NAV_LAST;
  NAV_LAST = { tab: S.tab, x, y, vertical };
  if (!last || last.tab === S.tab || last.vertical !== vertical || reducedMotion() || !ball.animate) return;
  const midX = vertical ? 16 : (last.x + x) / 2, midY = vertical ? (last.y + y) / 2 : Math.min(last.y, y) - 30;
  ball.animate([
    { transform: `translate(${last.x}px,${last.y}px)`, easing: 'cubic-bezier(.2,.65,.35,1)' },
    { transform: `translate(${midX}px,${midY}px)`, offset: 0.5, easing: 'cubic-bezier(.6,0,.85,.45)' },
    { transform: `translate(${x}px,${y}px) scale(1.3,.7)`, offset: 0.88 },
    { transform: `translate(${x}px,${y}px)` },
  ], { duration: 480 });
}
// Décor : une table de compétition vue en perspective (fond des affiches).
const heroScene = () => '<div class="hero-scene" aria-hidden="true"><div class="hero-table"></div></div>';
// Compte à rebours en chiffres de marqueur.
function clockInner(startsAt) {
  const t = new Date(startsAt), diff = t - Date.now();
  if (diff <= 0) return `<span class="hero-when">C'est parti</span><small>le match a commencé</small>`;
  if (diff < 24 * 3600e3) {
    const hh = String(Math.floor(diff / 3600e3)).padStart(2, '0'), mm = String(Math.floor(diff % 3600e3 / 60e3)).padStart(2, '0');
    return `<div class="digits" role="img" aria-label="Début dans ${+hh} h ${+mm} min"><span class="flipd">${hh[0]}</span><span class="flipd">${hh[1]}</span><span class="sep">:</span><span class="flipd">${mm[0]}</span><span class="flipd">${mm[1]}</span></div><small>avant le début</small>`;
  }
  const day = t.toLocaleDateString('fr-FR', { weekday: 'long' });
  return `<span class="hero-when">${esc(day.charAt(0).toUpperCase() + day.slice(1))}</span><small>${esc(t.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }))}</small>`;
}
function updateClocks() {
  document.querySelectorAll('.hero-clock[data-start]').forEach(el => {
    const before = [...el.querySelectorAll('.flipd')].map(d => d.textContent);
    const html = clockInner(el.dataset.start);
    if (el.innerHTML === html) return;
    el.innerHTML = html;
    [...el.querySelectorAll('.flipd')].forEach((d, i) => { if (before[i] !== undefined && before[i] !== d.textContent) d.classList.add('go'); });
  });
}
setInterval(updateClocks, 15000);
// La balle qui tombe sur le score qu'on vient de choisir.
// Posée par-dessus la page (pas dans la tuile) pour survivre au rendu qui suit.
function dropBall(id, a, b) {
  if (reducedMotion()) return;
  const btn = document.querySelector(`.scorebtn[data-id="${id}"][data-a="${a}"][data-b="${b}"]`);
  if (!btn) return;
  const rc = btn.getBoundingClientRect();
  const s = document.createElement('span');
  s.className = 'balldrop'; s.setAttribute('aria-hidden', 'true'); s.innerHTML = '<b></b><i></i>';
  s.style.left = (rc.left + rc.width / 2) + 'px'; s.style.top = (rc.top + rc.height / 2) + 'px';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 700);
}

// Rangée de pastilles de filtre (style app de scores, pas des onglets soulignés).
const SEG_LABELS = { view: 'Période', circuit: 'Circuit', boardscope: 'Classement', rankview: 'Circuit' };
function segRow(items, cur, act) {
  const idx = Math.max(0, items.findIndex(([k]) => k === cur));

/* ---------- Colonne de droite (grand écran seulement) ----------
   Sur un écran large, plutôt que des marges vides : ce qu'on vient chercher

function sideView() {
  if (!S.session) return '';
  const out = [];
  const uid = S.session.user.id;
  if (S.tab !== 'board' && S.board && S.board.length) {
    let prev = null, rank = 0;
    const ranked = S.board.map((r, i) => { const k = r.total_points + '/' + r.exact_scores; if (k !== prev) { rank = i + 1; prev = k; } return { ...r, rank }; });
    const meIdx = ranked.findIndex(r => r.user_id === uid);
    const shown = ranked.slice(0, 5);
    if (meIdx >= 5) shown.push(ranked[meIdx]);
    const medal = r => r <= 3 ? `<span class="medal" style="--medal:${r === 1 ? 'var(--gold)' : r === 2 ? 'var(--silver)' : 'var(--bronze)'}">${r}</span>` : `<span class="rk">${r}</span>`;
    out.push(`<section class="sidecard">
      <h3>Entre amis</h3>
      <ol class="sidelist">${shown.map(r => `<li class="${r.user_id === uid ? 'me' : ''}">${medal(r.rank)}<span class="who">${esc(r.pseudo)}${r.user_id === uid ? ' <small>toi</small>' : ''}</span><b>${r.total_points}<small>pts</small></b></li>`).join('')}</ol>
      <button class="linkbtn" data-act="tab" data-tab="board">Tout le classement</button>

  }
  if (S.tab === 'matches') {
    const now = myStreakInfo().now;

    const balls = Array.from({ length: 10 }, (_, i) => `<i class="${i < now ? 'on' : ''}"></i>`).join('');
    out.push(`<section class="sidecard">
      <h3>Ta série</h3>
      <div class="sidestreak"><b>${now}</b><span>prono${now > 1 ? 's' : ''} gagnant${now > 1 ? 's' : ''} d'affilée</span></div>
      <div class="sideballs" aria-hidden="true">${balls}</div>
      <p class="hint">${pct > 0 ? `Ton prochain prono gagnant rapporte <b style="color:var(--ink)">+${pct} %</b>.` : `Encore ${Math.max(1, 3 - now)} prono${3 - now > 1 ? 's' : ''} gagnant${3 - now > 1 ? 's' : ''} pour débloquer le bonus.`}</p>
    </section>`);
    const scopes = new Map();
    for (const m of S.matches) {
      if (isLocked(m) || m.status !== 'scheduled') continue;

      out.push(`<section class="sidecard">
        <h3>Tes balles</h3>
        <ul class="sidebudget">${[...scopes.values()].slice(0, 6).map(m => {

          const label = m.circuit === 'PRO_A' ? (m.round || 'Pro A') : m.competition;
          return `<li style="${themeVarsCss(themeKeyFor(m))}"><span class="who"><i aria-hidden="true"></i>${esc(label)}</span><span class="dots" role="img" aria-label="${rem} balle${rem > 1 ? 's' : ''} sur ${stock}">${Array.from({ length: stock }, (_, i) => `<em class="${i < rem ? 'on' : ''}"></em>`).join('')}</span></li>`;
        }).join('')}</ul>
      </section>`);
    }
  }
  out.push(`<section class="sidecard">
    <h3>Barème</h3>
    <ul class="sidescale">
      <li><b>1 pt</b><span>bon vainqueur</span></li>
      <li><b class="hot">3 pts</b><span>score exact</span></li>
      <li><b>×2 à ×4</b><span>avec 1 à 3 balles, si gagnant</span></li>
      <li><b>+75 %</b><span>au plus, grâce à la série</span></li>
      <li><b>+5 pts</b><span>au plus, avec l'outsider (WTT)</span></li>
    </ul>
    <button class="linkbtn" data-act="tuto">Revoir le tuto</button>
  </section>`);
  return out.join('');
}

function tabView() {

// Ticker horizontal des matchs en direct, collé en haut de l'écran : s'inspire

/* --- Matchs ---
   Au lieu d'un gros bandeau de bienvenue en haut de l'écran (ancienne
   maquette), l'accueil mène directement à l'essentiel : deux tuiles de
   stats compactes, puis la liste groupée par compétition — comme on
   ouvrirait une vraie app de scores plutôt qu'un tableau de bord perso. */
function matchesView() {
  // "fresh" : la liste vient d'être ouverte ou filtrée (pas juste un prono posé
  // ailleurs sur la même liste) -> les rangées ont le droit de rejouer leur entrée.
  const fresh = S._freshMatches; S._freshMatches = false;
  const list = S.matches.filter(m => S.circuit === 'ALL' || m.circuit === S.circuit);
  const up = list.filter(m => (m.status === 'scheduled' || m.status === 'live') && !isAwaitingResult(m)).sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
  const doneAll = list.filter(m => m.status === 'finished' || m.status === 'cancelled' || isAwaitingResult(m));
  const done = doneAll.slice().sort((a, b) => new Date(b.starts_at) - new Date(a.starts_at)).slice(0, 60);
  let shown = S.view === 'upcoming' ? up : done;

  // Pro A : un onglet "journée" plutôt qu'un défilement infini. On choisit
  // automatiquement la journée la plus pertinente (la prochaine à venir,
  // sinon la dernière) tant que l'utilisateur n'a pas cliqué lui-même.
  let journeeRow = '';
  if (S.circuit === 'PRO_A') {
    const journeeOf = m => { const mm = /^Journée (\d+)$/.exec(m.round || ''); return mm ? +mm[1] : null; };
    const nums = [...new Set(list.map(journeeOf).filter(n => n !== null))].sort((a, b) => a - b);
    if (nums.length) {
      if (S.proJournee === null || !nums.includes(S.proJournee)) {
        const nextUp = up.map(journeeOf).find(n => n !== null);
        S.proJournee = nextUp ?? nums[nums.length - 1];
      }
      journeeRow = `<div class="journeerow" role="group" aria-label="Journée">
        ${nums.map(n => `<button class="jchip" data-act="journee" data-v="${n}" aria-pressed="${S.proJournee === n}">Journée ${n}</button>`).join('')}
      </div>`;
      shown = shown.filter(m => journeeOf(m) === S.proJournee);
    }
  }

  const streakInfo = myStreakInfo();
  let body = '';
  if (!shown.length) {
    body = `<div class="empty">${S.view === 'upcoming'
      ? (S.isAdmin ? "Aucun match à venir. Ajoute le premier dans l'onglet Admin." : (S.circuit === 'PRO_A' ? "Aucun match à venir pour cette journée." : "Aucun match à venir pour le moment. Ils apparaissent ici dès qu'ils sont ajoutés."))
      : (S.circuit === 'PRO_A' ? "Aucun match terminé pour cette journée." : "Aucun match terminé pour l'instant.")}</div>`;
  } else {
    // Groupé par compétition (comme un bandeau de championnat Flashscore),
    // puis par jour à l'intérieur de chaque compétition.
    const groups = [];
    for (const m of shown) {
      let g = groups[groups.length - 1];
      if (!g || g.competition !== m.competition) { g = { competition: m.competition, matches: [] }; groups.push(g); }
      g.matches.push(m);
    }
    let i = 0;
    body = groups.map(g => {
      const n = g.matches.length;
      let lastDay = '', rows = '';
      for (const m of g.matches) {
        const d = fmtDay(m.starts_at);
        if (d !== lastDay) { rows += `<div class="day">${esc(d)}</div>`; lastDay = d; }
        rows += matchRow(m, fresh, i++, streakInfo);
      }
      const m0 = g.matches[0];
      const tierName = m0.circuit === 'PRO_A' ? 'Pro A' : (m0.tier || 'WTT');
      return `<section class="compgroup" style="${themeVarsCss(themeKeyFor(m0))}"><div class="complabel">
        <div><h2 style="margin:0"><b>${esc(g.competition)}</b></h2><small><span class="tier"><i aria-hidden="true"></i>${esc(tierName)}</span><span>${n} match${n > 1 ? 's' : ''}</span></small></div>${groupBallesBudgetHtml(g.matches)}</div>
        <div class="complist">${rows}</div></section>`;
    }).join('');
  }
  const cnt = n => `<span class="cnt">${n}</span>`;
  return heroCard(up) + halloweenNotice() + recapNotice() + `<div class="filters">`
    + segRow([['upcoming', `À venir ${cnt(up.length)}`], ['done', `Terminés ${cnt(doneAll.length)}`]], S.view, 'view')
    + segRow([['ALL', 'Tous'], ['WTT', 'WTT'], ['PRO_A', 'Pro A']], S.circuit, 'circuit')
    + `</div>` + journeeRow + body;
}
// --- "Le récap est prêt" : dès qu'un tournoi WTT / une journée Pro A sur
// lequel tu as pronostiqué est entièrement joué, un bandeau le signale en
// haut de l'onglet Matchs (le récap restait sinon caché dans "Mon compte").
// Un seul à la fois (le plus récent), seulement s'il date de moins de 14
// jours, et plus jamais une fois ouvert ou fermé : souvenir local à cet
// appareil (comme spin_was_first), sans rien stocker côté serveur.
const RECAP_SEEN_KEY = 'spin_recap_seen';
function recapSeenList() {
  try { const v = JSON.parse(localStorage.getItem(RECAP_SEEN_KEY) || '[]'); return Array.isArray(v) ? v : []; }
  catch (e) { return []; }
}
function markRecapSeen(circuit, key) {
  try {
    const id = circuit + '|' + key;
    const list = recapSeenList().filter(x => x !== id);
    list.push(id);
    localStorage.setItem(RECAP_SEEN_KEY, JSON.stringify(list.slice(-60)));
  } catch (e) { /* stockage indisponible : le bandeau reviendra, sans gravité */ }
}
function pendingRecap() {
  const finished = myJudgedHistory();
  if (!finished || !finished.length || !S.allJudgedPreds || !S.accountBoard) return null;
  const seen = new Set(recapSeenList());
  const groups = new Map();
  for (const h of finished) {
    const m = h.matches, key = tournamentGroupKey(m), id = m.circuit + '|' + key;
    const g = groups.get(id) || { id, circuit: m.circuit, key, last: m.starts_at };
    if (m.starts_at > g.last) g.last = m.starts_at;
    groups.set(id, g);
  }
  const since = Date.now() - 14 * 864e5;
  return [...groups.values()]
    .filter(g => !seen.has(g.id) && new Date(g.last).getTime() >= since && isTournamentFinished(g.circuit, g.key))
    .sort((a, b) => new Date(b.last) - new Date(a.last))[0] || null;
}

// À l'affiche : le match du moment (en direct, sinon le prochain à pronostiquer,

function ordinalRank(board, mine) {
  let rank = 1, prev = null;
  for (let i = 0; i < board.length; i++) {
    const k = board[i].total_points + '/' + board[i].exact_scores;
    if (k !== prev) { rank = i + 1; prev = k; }
    if (board[i].user_id === mine.user_id) return rank + (rank === 1 ? 'er' : 'e');
  }
  return '';
}

// Génère les pastilles de score pour un camp (inchangé dans sa logique :
// toujours n scores possibles, le choisi marqué aria-pressed, data-act="pick"
// pour le câblage des clics) — seul le style de pastille change.
function chips(m, side, mine, disabled) {
  const n = m.wins_needed, out = [];
  for (let k = 0; k < n; k++) {
    const a = side === 'A' ? n : k, b = side === 'A' ? k : n;
    const sel = !!mine && mine.pred_a === a && mine.pred_b === b;
    const who = side === 'A' ? m.side_a : m.side_b;
    const flip = sel && S._justPicked && S._justPicked.id === m.id && S._justPicked.a === a && S._justPicked.b === b;
    out.push(`<button class="scorebtn${flip ? ' flip' : ''}" data-act="pick" data-id="${m.id}" data-a="${a}" data-b="${b}" aria-pressed="${sel}" aria-label="${esc(who)} gagne ${a} à ${b}" ${disabled ? 'disabled' : ''}>${a}–${b}</button>`);
  }
  return `<div class="scores">${out.join('')}</div>`;
}

// Une rangée dense par match (style SofaScore/Flashscore) : heure/statut à
// gauche, deux noms empilés au centre avec le score ou le prono à droite.
// Le panneau de prédiction (grille de pick'em) est toujours affiché sous la
// rangée pour un match à venir — pas replié, pour que le geste de prono
// reste visible et accessible d'un seul geste, comme demandé pour une appli
// entre copains plutôt qu'un produit pro surchargé d'options.
function matchRow(m, fresh, i, streakInfo) {
  streakInfo = streakInfo || { before: new Map(), now: 0 };
  const locked = isLocked(m), mine = S.myPreds[m.id];
  const awaiting = isAwaitingResult(m);
  const fin = m.status === 'finished', canc = m.status === 'cancelled', live = m.status === 'live' && !awaiting;
  const winA = fin && m.score_a > m.score_b, winB = fin && m.score_b > m.score_a;
  const ca = S.competitors[m.competitor_a_id], cb = S.competitors[m.competitor_b_id];
  const flag = flagHtml;
  const rk = c => {
    if (!c || !c.ranking) return '';
    return c.circuit === 'WTT' ? `<strong>#${c.ranking}</strong>` : c.ranking;
  };
  const nameBtn = (c, label) => c
    ? `<button class="namebtn" data-act="competitor" data-id="${c.id}">${esc(label)}</button>`
    : esc(label);

  let statusPill = '';
  if (fin) statusPill = '<span class="statuspill">Fini</span>';
  else if (canc) statusPill = `<span class="statuspill">${HALLOWEEN ? ico('ghost.f') : ''}Annulé</span>`;
  else if (awaiting) statusPill = '<span class="statuspill wait">En attente</span>';
  else if (live) statusPill = '<span class="statuspill live">Live</span>';

  const sideHtml = (c, label, side, isWinner, isLoser) => {
    const scoreOrPred = fin
      ? `<span class="msc${isWinner ? ' win' : ''}">${side === 'A' ? m.score_a : m.score_b}</span>`
      : '';
    return `<div class="mside${isLoser ? ' lose' : ''}">
      <span class="mname">${flag(c)}${nameBtn(c, label)}<span class="mrk">${rk(c)}</span></span>
      ${scoreOrPred}
    </div>`;
  };

  const rowStyle = `${themeVarsCss(themeKeyFor(m))}${fresh ? `;animation-delay:${Math.min(i, 10) * 35}ms` : ''}`;
  const timeCol = live
    ? `<span class="liv"><span class="livedotsm" aria-hidden="true"></span>LIVE</span>`
    : esc(new Date(m.starts_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }));

  let panel = '';
  if (!fin && !canc) {
    const showChips = true;
    const t = !locked ? trend(m) : null;
    const pickProb = (mine && t) ? Math.round(scoreProb(t.q, m.wins_needed, mine.pred_a, mine.pred_b) * 100) : null;
    const gauge = pickProb !== null ? `
      <div class="oddsgauge" role="img" aria-label="${pickProb} % de chances d'avoir le score ${mine.pred_a}–${mine.pred_b}">
        <div class="bar"><i style="--w:${pickProb}%;width:${pickProb}%"></i></div><b>${pickProb}%</b>
      </div>` : '';
    const status = awaiting
      ? `<span>${mine ? `Ton prono : <b>${mine.pred_a}–${mine.pred_b}</b>. ` : ''}Résultat pas encore reçu : les points arrivent dès qu'il est connu.</span>`
      : locked
      ? `<span>${mine ? `Ton prono : <b>${mine.pred_a}–${mine.pred_b}</b>` : "Trop tard, pas de prono."}</span>`
      : `<span>${mine ? `Prono : <b>${mine.pred_a}–${mine.pred_b}</b>, modifiable jusqu'au début du match.` : 'Touche un score pour pronostiquer.'}</span>`;
    // Pastille de série : seulement si elle offre vraiment un bonus (série
    // >= 3), pour ne pas surcharger chaque carte avec un chiffre à zéro.
    const streakTeaser = (!locked && streakInfo.now >= 3)
      ? `<span>${streakBadgeHtml(streakInfo.now, true)} si gagnant</span>` : '';
    panel = `<div class="predpanel${locked ? ' locked' : ''}">
      <div class="stage3d"><div class="table3d">
        <div class="pickside"><span class="pslabel">${flag(ca)}${esc(m.side_a)}</span>${chips(m, 'A', mine, locked)}</div>
        <div class="net" aria-hidden="true"></div>
        <div class="pickside"><span class="pslabel">${flag(cb)}${esc(m.side_b)}</span>${chips(m, 'B', mine, locked)}</div>
      </div></div>
      <div class="predstatus">${status}${streakTeaser}</div>
      ${gauge}
      ${ballesStepperHtml(m)}
    </div>`;
  } else {
    let foot, stamp = '';
    if (canc) foot = `<span>Match annulé : aucun point en jeu.</span>`;
    else {
      // Série AVANT ce match précis (pas la série actuelle) : c'est elle qui
      // a déterminé le bonus réellement appliqué sur ce prono, au moment où
      // il a été jugé — jamais recalculée rétroactivement avec la série
      // d'aujourd'hui. Vient de S.myHistory (voir myStreakInfo) ; 0 par
      // défaut tant qu'il n'est pas encore chargé (la vue SQL reste la seule
      // source de vérité pour les points réellement enregistrés).
      const myStreakBefore = streakInfo.before.get(m.id) || 0;
      const pt = points(m, mine, myStreakBefore);
      const det = mine ? pointsDetail(m, mine, myStreakBefore) : null;
      // Le nombre de points gagnés est l'info la plus attendue sur un match
      // fini : affiché en grand, dans un pavé façon tampon encreur, plutôt
      // que noyé dans la ligne de texte.
      if (pt !== null) {
        stamp = ptsBlock(pt, det);
      }
      const bonusBits = [];
      if (det && det.streakBonus) bonusBits.push(`bonus série +${det.streakBonus}`);
      if (det && det.ballesBonus) bonusBits.push(`bonus balles (${det.balles}) +${det.ballesBonus}`);
      if (det && det.bonus) bonusBits.push(`bonus outsider +${det.bonus}`);
      foot = `<span>${mine ? `Ton prono <b>${mine.pred_a}–${mine.pred_b}</b>` : `Tu n'as pas fait de prono.`}</span>
        ${bonusBits.length ? `<span>dont ${bonusBits.join(', ')}</span>` : ''}
        <span class="rlinks">
          <button class="friendstoggle" data-act="friends" data-id="${m.id}">${S.openFriends[m.id] ? 'Masquer' : 'Voir'} les pronos des amis</button>
          ${mine ? `<button class="friendstoggle" data-act="exportmatch" data-id="${m.id}">Partager en image</button>` : ''}
        </span>`;
    }
    let friends = '';
    if (S.openFriends[m.id]) {
      const rows = (S.friends[m.id] || []).map(r => ({ ...r, pt: points(m, r, r.user_id === S.session.user.id ? (streakInfo.before.get(m.id) || 0) : streakBeforeFor(r.user_id, m.id)) }))
        .sort((x, y) => (y.pt ?? -1) - (x.pt ?? -1));
      friends = rows.length
        ? `<ul class="friends">${rows.map(r => `<li><span>${esc(r.profiles && r.profiles.pseudo)}${r.user_id === S.session.user.id ? ' (toi)' : ''}</span><span>${r.pred_a}–${r.pred_b}${r.pt !== null ? ` : ${r.pt} pt${r.pt > 1 ? 's' : ''}` : ''}</span></li>`).join('')}</ul>`
        : `<p class="hint" style="margin-top:8px">Personne n'a fait de prono sur ce match.</p>`;
    }
    panel = `<div class="predpanel locked"><div class="predresult">${stamp}<div class="rtext">${foot}</div></div>${friends}</div>`;
  }

  return `
  <div class="mrow${live ? ' islive' : ''}${fresh ? ' enter' : ''}" data-mid="${m.id}" style="${rowStyle}">
    <div class="mrowhead">
      <div class="mtime">${timeCol}${!live ? statusPill : ''}</div>
      <div class="msides">
        ${sideHtml(ca, m.side_a, 'A', winA, winB)}
        ${sideHtml(cb, m.side_b, 'B', winB, winA)}
      </div>
      <div class="mright">${m.round ? roundLabel(m.round) : ''}</div>
    </div>
    ${panel}
  </div>`;
}

// Tuile des points d'un match jugé : le chiffre en grand, et ce qu'il veut dire.
function ptsBlock(pt, det) {
  const cls = pt === 0 ? 'p0' : (det && det.exact ? 'p3' : 'p1');
  const what = pt === 0 ? 'raté' : (det && det.exact ? 'score exact' : 'bon vainqueur');
  return `<div class="ptsblock ${cls}" aria-label="${pt} point${Math.abs(pt) > 1 ? 's' : ''}, ${what}"><b>${pt > 0 ? '+' : ''}${pt}</b><span>${what}</span></div>`;
}
// Étiquette du tour, à droite de la rangée : le tour lui-même en gros
// ("Quart de finale", "Journée 6"), le tableau en petit dessous.
function roundLabel(round) {
  const parts = String(round).split(/\s*(?:,|—)\s*/).filter(Boolean);
  const main = parts.length > 1 ? parts.slice(1).join(', ') : (parts[0] || '');
  const sub = parts.length > 1 ? parts[0] : '';
  const cap = main.charAt(0).toUpperCase() + main.slice(1);
  return `<span class="mround"><b>${esc(cap)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</span>`;
}

async function pick(id, a, b) {
  const m = S.matches.find(x => x.id === id);
  if (!m || isLocked(m)) { toast('Trop tard : le match a commencé.', true); keepRender(); return; }
  playSound('tick'); // retour tactile immédiat au tap, sans attendre la réponse réseau (toast() jouera le "confirm"/"error" une fois enregistré)
  const prev = S.myPreds[id];
  if (prev && !prev._pending && prev.pred_a === a && prev.pred_b === b) return;
  // Affiché tout de suite (la balle tombe sur le score), enregistré derrière ;
  // en cas d'échec, on remet l'ancien prono et on le dit.
  S.myPreds[id] = Object.assign({ balles_staked: 0 }, prev || {}, { match_id: id, pred_a: a, pred_b: b, _pending: true });
  // La balle tombe d'abord sur la tuile touchée ; à l'impact, la tuile bascule.
  dropBall(id, a, b);
  tutoOnPick();
  setTimeout(() => { S._justPicked = { id, a, b }; keepRender(); S._justPicked = null; }, reducedMotion() ? 0 : 280);
  const { data, error } = await sb.from('predictions')
    .upsert({ user_id: S.session.user.id, match_id: id, pred_a: a, pred_b: b }, { onConflict: 'user_id,match_id' })
    .select().single();
  if (error) {
    if (prev) S.myPreds[id] = prev; else delete S.myPreds[id];
    toast(friendlyError(error), true); keepRender(); return;
  }
  const cur = S.myPreds[id];
  if (cur && cur._pending && (cur.pred_a !== a || cur.pred_b !== b)) return; // un autre score a été touché entre-temps : il gagne
  S.myPreds[id] = data;
  toast(`Prono enregistré : ${a}–${b}`);
}
// Change la mise de balles sur un pronostic déjà posé (voir ballesStepperHtml
// / ballesStock). newVal est la valeur ABSOLUE visée (pas un delta) ; elle
// est re-plafonnée ici (jamais confiance aveugle dans les data-v du bouton
// cliqué) par le plafond par match ET le budget restant du tournoi -- la
// vérité finale reste de toute façon le déclencheur SQL (check_prediction,
// voir ajout-balles.sql), qui referait le même calcul côté base de données.
async function setBalles(id, newVal) {
  const m = S.matches.find(x => x.id === id);
  const mine = S.myPreds[id];
  if (!m || isLocked(m)) { toast('Trop tard : le match a commencé.', true); keepRender(); return; }
  if (!mine) { toast('Fais d’abord un prono sur ce match.', true); keepRender(); return; }
  if (mine._pending || !mine.id) { toast('Ton prono s’enregistre, réessaie dans une seconde.', true); return; }
  const cap = Math.min(BALLES_MAX_PER_MATCH, ballesRemaining(m, id));
  const v = Math.max(0, Math.min(newVal, cap));
  if (v === (mine.balles_staked || 0)) { keepRender(); return; }
  const { data, error } = await sb.from('predictions').update({ balles_staked: v }).eq('id', mine.id).select().single();
  if (error) { toast(friendlyError(error), true); return; }
  S.myPreds[id] = data;
  playSound('tick');
  toast(v > 0 ? `${v} balle${v > 1 ? 's' : ''} misée${v > 1 ? 's' : ''} sur ce match.` : 'Mise de balles retirée.');
  keepRender();
}
async function toggleFriends(id) {
  if (S.openFriends[id]) { S.openFriends[id] = false; keepRender(); return; }
  const { data, error } = await sb.from('predictions').select('user_id,pred_a,pred_b,balles_staked,profiles(pseudo)').eq('match_id', id);
  if (error) { toast(friendlyError(error), true); return; }
  S.friends[id] = data || []; S.openFriends[id] = true; keepRender();
}

/* --- Classement des amis : vraie table de standings, podium en évidence. --- */
function boardView() {
  const seg = segRow([['ALL', 'Général'], ['WTT', 'WTT'], ['PRO_A', 'Pro A']], S.boardScope, 'boardscope');
  const exportBtn = `<button class="btn small sec" data-act="exportboard">${ico('share-network')}Partager en image</button>`;
  if (S.board === null) return seg + '<div class="loading">Chargement…</div>';
  if (!S.board.length) return seg + `<div class="empty">Pas encore de points. Le classement se remplit dès que les premiers matchs sont terminés.</div>${rules()}`;
  let prev = null, rank = 0;
  const rows = S.board.map((r, i) => {
    const key = r.total_points + '/' + r.exact_scores;
    if (key !== prev) { rank = i + 1; prev = key; }
    const me = r.user_id === S.session.user.id;
    const topClass = rank === 1 ? ' top1' : rank === 2 ? ' top2' : rank === 3 ? ' top3' : '';
    return `<tr class="${me ? 'me' : ''}">
      <td class="rankcell${topClass}">${rankInner(rank)}</td>
      <td class="namecell"><div class="lbname">${esc(r.pseudo)}${me ? ' <span class="me-tag">toi</span>' : ''}</div>
        <div class="lbsub">${r.good_winners}/${r.matches_played} bon${r.good_winners > 1 ? 's' : ''} vainqueur${r.good_winners > 1 ? 's' : ''} · ${r.exact_scores} exact${r.exact_scores > 1 ? 's' : ''}</div></td>
      <td class="ptscell">${r.total_points}<small>pts</small></td></tr>`;
  }).join('');
  return `<div class="boardtools">${seg}${exportBtn}</div>${boardPodium(S.board)}<table class="standings"><thead><tr><th>Rang</th><th>Joueur</th><th class="num">Pts</th></tr></thead><tbody>${rows}</tbody></table>` + rules();
}
// Rang dans un tableau : pastille de médaille pour le podium.
const rankInner = r => (r >= 1 && r <= 3) ? `<span class="medal">${r}</span>` : r;
// Podium des trois premiers : marches en relief, médailles qui tombent en place.
function boardPodium(board) {
  if (!board || board.length < 3) return '';
  const uid = S.session && S.session.user.id;
  let prev = null, rank = 0;
  const top = board.slice(0, 3).map((r, i) => {
    const k = r.total_points + '/' + r.exact_scores;
    if (k !== prev) { rank = i + 1; prev = k; }
    return { ...r, rank };
  });
  const col = (r, place) => `<div class="podcol p${place}${r.user_id === uid ? ' me' : ''}">
    <span class="medalball" aria-label="${r.rank}${r.rank === 1 ? 'er' : 'e'}">${r.rank}</span>
