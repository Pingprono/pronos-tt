  paintStatTicket(ctx, gx, top + 14, tw, th, t, `${me.rank}${me.rank === 1 ? 'er' : 'e'}`, 'ma place', true);
  paintStatTicket(ctx, gx + tw + gap, top + 14, tw, th, t, String(me.pts), me.pts === 1 ? 'point' : 'points');
  paintStatTicket(ctx, gx, top + 14 + th + gap, tw, th, t, String(me.bestStreak), 'meilleure série');
  paintStatTicket(ctx, gx + tw + gap, top + 14 + th + gap, tw, th, t, String(me.exact), `score${me.exact > 1 ? 's' : ''} exact${me.exact > 1 ? 's' : ''}`);

  // Podium : trois marches aux couleurs des médailles.
  const baseY = h - 92, colW = 200, H = { 1: 128, 2: 98, 3: 76 };
  const order = [[podium[1], 2], [podium[0], 1], [podium[2], 3]];
  const x0 = (w - colW * 3 - 24) / 2;
  ctx.fillStyle = EX.ink; ctx.font = `700 22px ${EXPORT_DISPLAY}`; ctx.textAlign = 'left';
  ctx.fillText('Podium du tournoi', gx + 4, top + 14 + 2 * th + gap + 46);
  order.forEach(([row, place], i) => {
    if (!row) return;
    const x = x0 + i * (colW + 12), bh = H[place], y = baseY - bh;
    ctx.fillStyle = MEDALS[place]; roundRect(ctx, x, y, colW, bh + 4, 4); ctx.fill();
    ctx.fillStyle = EX.onMedal; ctx.textAlign = 'center'; ctx.font = `700 32px ${EXPORT_DISPLAY}`;
    ctx.fillText(String(place), x + colW / 2, y + 40);
    ctx.fillStyle = EX.ink;
    const ns = fitFont(ctx, esc0(row.pseudo), 700, 24, EXPORT_DISPLAY, colW - 10, 16);
    ctx.font = `700 ${ns}px ${EXPORT_DISPLAY}`; ctx.fillText(esc0(row.pseudo), x + colW / 2, y - 34);
    ctx.fillStyle = EX.ink2; ctx.font = `600 18px ${EXPORT_DISPLAY}`;
    ctx.fillText(`${row.pts} pts`, x + colW / 2, y - 10);
  });
  ctx.fillStyle = EX.ink; ctx.fillRect(gx, baseY, w - 2 * gx, 3);
  ctx.textAlign = 'left';
  paintExportFooter(ctx, w, h);
  const slug = String(key).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  downloadCanvas(canvas, `spin-recap-${slug || 'tournoi'}.png`);
}
// Petit nettoyage pour le texte dessiné sur <canvas> : contrairement au
// HTML, canvas n'a pas besoin d'échappement d'entités, juste d'une chaîne
// propre (évite "undefined"/"null" affichés tels quels).
function esc0(s) { return String(s ?? ''); }

/* ---------- Événements ---------- */
$app.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id ? Number(el.dataset.id) : null, v = el.dataset.v;
  if (act === 'authmode') { S.authMode = S.authMode === 'login' ? 'signup' : 'login'; render(); }
  else if (act === 'logout') { await sb.auth.signOut(); }
  else if (act === 'thememode') {
    S.themeMode = S.themeMode === 'light' ? 'dark' : (S.themeMode === 'dark' ? 'halloween' : 'light');
    try { localStorage.setItem('spin_theme_mode', S.themeMode); } catch (e) { /* ignore */ }
    navigate(render);
  }
  else if (act === 'soundtoggle') {
    S.soundOn = !S.soundOn;
    try { localStorage.setItem('spin_sound_on', S.soundOn ? '1' : '0'); } catch (e) { /* ignore */ }
    if (S.soundOn) playSound('tick'); // petit retour immédiat pour confirmer que le son est bien réactivé
    navigate(render);
  }
  else if (act === 'gotomatch') {
    const find = () => document.querySelector(`.mrow[data-mid="${id}"]`);
    let row = find();
    if (!row) { S.view = 'upcoming'; S.circuit = 'ALL'; S.proJournee = null; render(); row = find(); }
    if (row) {
      row.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'center' });
      row.classList.remove('spot'); void row.offsetWidth; row.classList.add('spot');
    }
  }
  else if (act === 'exportmatch') exportMatchImage(id);
  else if (act === 'exportboard') exportBoardImage();
  else if (act === 'exportrecap') exportRecapImage(el.dataset.key, el.dataset.circuit);
  else if (act === 'recap') { markRecapSeen(el.dataset.circuit, el.dataset.key); S.openRecap = { key: el.dataset.key, circuit: el.dataset.circuit }; S.recapAnimPlayed = false; navigate(render); }
  else if (act === 'hwdismiss') { try { localStorage.setItem(HW_KEY, '1'); } catch (e) { /* ignore */ } keepRender(); }
  else if (act === 'recapdismiss') { markRecapSeen(el.dataset.circuit, el.dataset.key); keepRender(); }
  else if (act === 'closerecap') { stopRecapRun(); S.openRecap = null; keepRender(); }
  else if (act === 'skiprecap') finishRecap();
  else if (act === 'tuto') startTuto();
  else if (act === 'replayrecap') { stopRecapRun(); S.recapAnimPlayed = false; keepRender(); }
  else if (act === 'tab') {
    if (el.dataset.tab !== S.tab) playSound('tick'); // tap discret, seulement quand on change vraiment d'onglet
    S.tab = el.dataset.tab;
    S._tabAt = Date.now();
    if (S.tab === 'matches') S._freshMatches = true;
    if (S.tab === 'board') { S.board = null; navigate(render); await loadBoard(); }
    if (S.tab === 'account') { S.myHistory = null; navigate(render); await loadAccount(); }
    navigate(render); window.scrollTo(0, 0);
  }
  else if (act === 'view') { S.view = v; S._freshMatches = true; navigate(render); }
  else if (act === 'circuit') { S.circuit = v; S._freshMatches = true; S.proJournee = null; navigate(render); }
  else if (act === 'journee') { S.proJournee = +v; S._freshMatches = true; navigate(render); }
  else if (act === 'boardscope') { S.boardScope = v; S.board = null; navigate(render); await loadBoard(); navigate(render); }
  else if (act === 'rankview') { S.rankView = v; navigate(render); }
  else if (act === 'rankgender') { S.rankGender = v; navigate(render); }
  else if (act === 'competitor') { S.openCompetitor = id; keepRender(); }
  else if (act === 'closecompetitor') { S.openCompetitor = null; keepRender(); }
  else if (act === 'badge') { S.openBadge = el.dataset.badge; S._newBadge = null; playSound('tick'); keepRender(); }
  else if (act === 'closebadge') closeBadge();
  else if (act === 'spider') spiderUp();
  else if (act === 'stop') { /* clic à l'intérieur de la fiche détail : ne pas la fermer */ }
  else if (act === 'pick') pick(id, Number(el.dataset.a), Number(el.dataset.b));
  else if (act === 'balles') setBalles(id, Number(v));
  else if (act === 'friends') toggleFriends(id);
  else if (act === 'adm-result') saveResult(id);
  else if (act === 'adm-cancel') cancelMatch(id);
  else if (act === 'adm-delete') deleteMatch(id);
  else if (act === 'adm-rank') saveRank(id);
  else if (act === 'adm-worldrank') saveWorldRank(id);
  else if (act === 'adm-roster') saveRoster(id);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.openCompetitor) { S.openCompetitor = null; keepRender(); }
  if (e.key === 'Escape' && S.openBadge) closeBadge();
  if (e.key === 'Escape' && S.openRecap) { stopRecapRun(); S.openRecap = null; keepRender(); }
});
$app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'authform') submitAuth(e.target);
  else if (e.target.id === 'addmatch') addMatch(e.target);
});
$app.addEventListener('change', e => {
  if (e.target.id === 'adm-circuit') { S.adminCircuit = e.target.value; keepRender(); }
});

/* ---------- Démarrage ---------- */
// Sert à rendre le site installable sur mobile (icône sur l'écran d'accueil,
// ouverture en plein écran). N'empêche pas le site de marcher si ça échoue
// (navigateur trop ancien, page ouverte en local) : on l'enregistre sans bloquer.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

if (window.SPLASH) SPLASH.onReveal = () => {
  if (S.session && !S.bootError && !S.openRecap) { S._tabAt = Date.now(); render(); }
};
// Ce qui doit attendre que l'écran d'ouverture soit parti (le tuto).
const afterSplash = cb => (window.SPLASH && SPLASH.active) ? SPLASH.whenDone(cb) : cb();

async function boot() {
  if (!window.supabase) {
    if (window.SPLASH) SPLASH.ready();
    $app.innerHTML = '<div class="auth"><h1>Oups</h1><p class="lead">Impossible de charger le service de connexion. Vérifie ta connexion internet et recharge la page.</p></div>';
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.onAuthStateChange((event, session) => { setTimeout(() => handleSession(session), 0); });
  const { data } = await sb.auth.getSession();
  handleSession(data.session);
}
boot();
</script>
</body>
