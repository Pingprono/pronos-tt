name: Rappels sur téléphone

# Envoie les rappels de SPIN (match sans prono, défis, récap prêt) aux
# téléphones abonnés. Toutes les 15 minutes, pas pile sur l'heure (GitHub
# est alors plus chargé et les lancements prennent du retard).
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: rappels
  cancel-in-progress: false

jobs:
  rappels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer l'outil d'envoi
        run: |
          mkdir robot
          cd robot
          npm init -y > /dev/null
          npm install web-push@3.6.7 --no-audit --no-fund

      - name: Ecrire le script
        run: |
          cat > robot/rappels.mjs <<'EOF'
          // Rappels sur téléphone pour SPIN. Lancé toutes les 15 minutes par GitHub
          // (fichier rappels.yml). Trois sortes de rappels, chacun envoyé une seule fois :
          //   - un match commence dans moins d'une heure et tu n'as pas fait ton prono
          //     (seulement pour un tournoi ou une journée où tu joues déjà) ;
          //   - un ami te propose un défi, ou accepte le tien ;
          //   - le récap d'un tournoi (ou d'une journée de Pro A) où tu as joué est prêt.
          // Ne touche jamais aux pronos ni aux points.

          const H = 3600e3, D = 24 * H;

          // --- Ce qu'il faut envoyer (calcul pur, testé à part) --------------------------------
          const groupKey = m => (m.circuit === 'WTT' ? (m.competition || 'WTT') : (m.round || 'Pro A'));
          const groupId = m => `${m.circuit}|${groupKey(m)}`;
          const hhmm = t => new Intl.DateTimeFormat('fr-FR', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit' }).format(new Date(t)).replace(':', ' h ');
          const vs = m => `${m.side_a} – ${m.side_b}`;

          export function plan({ now, subs, sent, matches, preds, duels, pseudo }) {
            const users = new Set(subs.map(s => s.user_id));
            const done = new Set(sent.map(s => `${s.user_id}|${s.kind}|${s.ref}`));
            const fresh = (u, kind, ref) => !done.has(`${u}|${kind}|${ref}`);
            const byId = new Map(matches.map(m => [m.id, m]));
            const predsOf = new Map();
            for (const p of preds) { if (!predsOf.has(p.user_id)) predsOf.set(p.user_id, new Set()); predsOf.get(p.user_id).add(p.match_id); }
            const out = [];

            // 1. Matchs qui commencent bientôt sans ton prono.
            const soon = matches.filter(m => m.status === 'scheduled' && new Date(m.starts_at) - now > 10 * 60e3 && new Date(m.starts_at) - now <= 75 * 60e3);
            for (const u of users) {
              const mine = predsOf.get(u) || new Set();
              const playing = new Set([...mine].map(id => byId.get(id)).filter(Boolean).map(groupId));
              const missing = soon.filter(m => !mine.has(m.id) && playing.has(groupId(m)) && fresh(u, 'match', String(m.id)))
                .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
              if (!missing.length) continue;
              const first = missing[0];
              out.push({ user_id: u, kind: 'match', refs: missing.map(m => String(m.id)), ttl: 3600, payload: {
                title: 'À toi de jouer',
                body: missing.length === 1 ? `${vs(first)} commence à ${hhmm(first.starts_at)} : tu n'as pas encore fait ton prono.`
                  : `${missing.length} matchs commencent dans moins d'une heure sans ton prono, dont ${vs(first)} à ${hhmm(first.starts_at)}.`,
                tag: 'spin-match', url: './' } });
            }

            // 2. Défis : proposés à toi, ou acceptés par ton ami.
            for (const d of duels || []) {
              const m = byId.get(d.match_id);
              if (!m) continue;
              const open = m.status === 'scheduled' && new Date(m.starts_at) > now;
              if (users.has(d.opponent) && !d.accepted_at && open && now - new Date(d.created_at) < 2 * D && fresh(d.opponent, 'duel', String(d.id)))
                out.push({ user_id: d.opponent, kind: 'duel', refs: [String(d.id)], ttl: 6 * 3600, payload: {
                  title: 'Nouveau défi', body: `${pseudo[d.challenger] || 'Un ami'} te propose un défi sur ${vs(m)}. Accepte-le avant le match.`, tag: `spin-duel-${d.id}`, url: './' } });
              if (users.has(d.challenger) && d.accepted_at && now - new Date(d.accepted_at) < 2 * D && fresh(d.challenger, 'duelok', String(d.id)))
                out.push({ user_id: d.challenger, kind: 'duelok', refs: [String(d.id)], ttl: 6 * 3600, payload: {
                  title: 'Défi accepté', body: `${pseudo[d.opponent] || 'Ton ami'} a accepté ton défi sur ${vs(m)}.`, tag: `spin-duel-${d.id}`, url: './' } });
            }

            // 3. Récap prêt : tous les matchs du tournoi (ou de la journée) sont joués,
            //    depuis moins de 2 jours. En WTT : une finale jouée, ou 3 jours sans nouveau match.
            const groups = new Map();
            for (const m of matches) { const g = groupId(m); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(m); }
            const ready = new Map();
            for (const [g, ms] of groups) {
              if (!ms.every(m => m.status === 'finished' || m.status === 'cancelled')) continue;
              const last = Math.max(...ms.map(m => new Date(m.starts_at).getTime()));
              let at = last;
              if (ms[0].circuit === 'WTT') {
                const fin = ms.find(m => /(^|[,—]\s*)finale$/i.test((m.round || '').trim()));
                at = fin ? new Date(fin.starts_at).getTime() : last + 3 * D;
              }
              if (at <= now && now - at < 2 * D) ready.set(g, groupKey(ms[0]));
            }
            for (const u of users) {
              const mine = predsOf.get(u) || new Set();
              const played = new Set([...mine].map(id => byId.get(id)).filter(m => m && m.status === 'finished').map(groupId));
              for (const [g, key] of ready) {
                if (!played.has(g) || !fresh(u, 'recap', g)) continue;
                out.push({ user_id: u, kind: 'recap', refs: [g], ttl: 24 * 3600, payload: {
                  title: 'Récap prêt', body: `Le récap de ${key} est prêt : ton rang, tes points et le podium.`, tag: `spin-recap-${g}`, url: './' } });
              }
            }
            return out;
          }

          // --- Lecture de la base, envoi -----------------------------------------------------------
          async function main() {
            const URL0 = (process.env.SUPABASE_URL || '').trim().replace(/\/+$/, '');
            const KEY = (process.env.SUPABASE_SERVICE_KEY || '').trim();
            const VPUB = (process.env.VAPID_PUBLIC_KEY || '').trim(), VPRIV = (process.env.VAPID_PRIVATE_KEY || '').trim();
            const SUBJ = (process.env.VAPID_SUBJECT || '').trim();
            if (!URL0 || !KEY) { console.error('ERREUR : les secrets SUPABASE_URL et SUPABASE_SERVICE_KEY manquent dans GitHub.'); process.exit(1); }
            if (!VPUB || !VPRIV || !/^(mailto:|https:)/.test(SUBJ)) { console.error('ERREUR : les secrets VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY et VAPID_SUBJECT (mailto:ton-adresse) manquent dans GitHub.'); process.exit(1); }
            const webpush = (await import('web-push')).default;
            webpush.setVapidDetails(SUBJ, VPUB, VPRIV);

            const HEAD = { apikey: KEY, 'Content-Type': 'application/json' };
            if (KEY.startsWith('eyJ')) HEAD.Authorization = `Bearer ${KEY}`;
            async function db(method, path, body, prefer) {
              const res = await fetch(`${URL0}/rest/v1/${path}`, { method, headers: { ...HEAD, ...(prefer ? { Prefer: prefer } : {}) }, body: body ? JSON.stringify(body) : undefined });
              if (!res.ok) throw new Error(`${method} ${path.split('?')[0]} : ${res.status} ${(await res.text()).slice(0, 200)}`);
              return res.status === 204 ? null : res.json().catch(() => null);
            }
            async function all(path) {
              const rows = [];
              for (let off = 0; ; off += 1000) {
                const page = await db('GET', `${path}${path.includes('?') ? '&' : '?'}limit=1000&offset=${off}`);
                rows.push(...page);
                if (page.length < 1000) return rows;
              }
            }
            const chunks = (arr, n) => { const o = []; for (let i = 0; i < arr.length; i += n) o.push(arr.slice(i, i + n)); return o; };

            const now = Date.now();
            const subs = await all('push_subscriptions?select=endpoint,user_id,p256dh,auth');
            if (!subs.length) { console.log('Aucun téléphone abonné aux rappels.'); return; }
            const users = [...new Set(subs.map(s => s.user_id))];
            const since = new Date(now - 30 * D).toISOString(), until = new Date(now + 2 * H).toISOString();
            const matches = await all(`matches?select=id,circuit,competition,round,side_a,side_b,starts_at,status&starts_at=gte.${since}&starts_at=lte.${until}&order=id`);
            const preds = [];
            for (const c of chunks(users, 80)) preds.push(...await all(`predictions?select=user_id,match_id,matches!inner(starts_at)&matches.starts_at=gte.${since}&user_id=in.(${c.join(',')})&order=id`));
            const sent = await all(`push_sent?select=user_id,kind,ref&sent_at=gte.${since}`);
            let duels = [];
            const t2 = new Date(now - 2 * D).toISOString();
            try { duels = await all(`duels?select=id,match_id,challenger,opponent,created_at,accepted_at&or=${encodeURIComponent(`(created_at.gte."${t2}",accepted_at.gte."${t2}")`)}&order=id`); }
            catch (e) { console.log('Défis absents : rien à rappeler de ce côté.'); }
            const ids = [...new Set(duels.flatMap(d => [d.challenger, d.opponent]))];
            const pseudo = {};
            for (const c of chunks(ids, 80)) for (const p of await all(`profiles?select=id,pseudo&id=in.(${c.join(',')})`)) pseudo[p.id] = p.pseudo;

            const todo = plan({ now, subs, sent, matches, preds, duels, pseudo });
            let ok = 0, gone = 0, fail = 0;
            for (const n of todo) {
              let delivered = false, dead = 0;
              const mine = subs.filter(x => x.user_id === n.user_id);
              for (const s of mine) {
                try {
                  await webpush.sendNotification({ endpoint: s.endpoint, keys: { p256dh: s.p256dh, auth: s.auth } }, JSON.stringify(n.payload), { TTL: n.ttl, urgency: 'normal' });
                  delivered = true; ok++;
                } catch (e) {
                  if (e.statusCode === 404 || e.statusCode === 410) { gone++; dead++; await db('DELETE', `push_subscriptions?endpoint=eq.${encodeURIComponent(s.endpoint)}`); }
                  else { fail++; console.log(`Envoi raté (${e.statusCode || '?'}) : ${String(e.body || e.message).slice(0, 120)}`); }
                }
              }
              // Noté comme envoyé une fois reçu (ou si les téléphones n'existent plus) ;
              // après une panne passagère, on réessaie au tour suivant.
              if (delivered || dead === mine.length) {
                await db('POST', 'push_sent', n.refs.map(ref => ({ user_id: n.user_id, kind: n.kind, ref })), 'resolution=ignore-duplicates,return=minimal');
              }
            }
            console.log(`Rappels : ${todo.length} à envoyer, ${ok} reçus par un téléphone, ${gone} téléphones désabonnés, ${fail} échecs. (${subs.length} téléphones abonnés)`);
          }

          if (!process.env.RAPPELS_TEST) main().catch(e => { console.error('ERREUR :', e.message); process.exit(1); });
          EOF

      - name: Envoyer les rappels
        working-directory: robot
        run: node rappels.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
