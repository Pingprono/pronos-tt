
Explorer · YML
name: Exploration des sites (a lancer une seule fois)
 
on:
  workflow_dispatch:
 
jobs:
  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
 
      - name: Preparer le navigateur
        run: |
          mkdir robot
          cd robot
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
 
      - name: Ecrire le script d'exploration
        run: |
          cat > robot/explore.mjs <<'EOF'
          // Robot d'exploration : ouvre quelques pages publiques comme un visiteur et
          // enregistre ce qu'elles affichent ainsi que les données qu'elles chargent.
          import { chromium } from 'playwright';
          import fs from 'node:fs';
 
          const OUT = 'out';
          fs.mkdirSync(OUT, { recursive: true });
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50);
 
          const PAGES = [
            { name: 'fftt-pro', url: 'https://www.fftt.com/pro/', clics: ['Calendrier', 'Classement', 'Pro A Messieurs'] },
            { name: 'wtt-resultats', url: 'https://www.worldtabletennis.com/results', clics: [] },
            { name: 'wtt-calendrier', url: 'https://www.worldtabletennis.com/events_calendar', clics: [] },
            { name: 'wtt-evenements', url: 'https://www.worldtabletennis.com/eventslist', clics: [] },
          ];
 
          const report = [];
          const browser = await chromium.launch();
          const context = await browser.newContext({
            locale: 'fr-FR',
            timezoneId: 'Europe/Paris',
            viewport: { width: 1280, height: 1600 },
          });
          context.setDefaultTimeout(30000);
 
          async function accepterCookies(page) {
            for (const label of ['Tout accepter', 'Accepter', 'Accept all', 'Accept', 'I agree']) {
              try {
                await page.getByRole('button', { name: label }).first().click({ timeout: 1500 });
                return;
              } catch {}
            }
          }
 
          async function snapshot(page, name, calls, withHtml) {
            const info = { name, url: page.url(), appelsReseau: calls.length };
            try {
              const text = await page.evaluate(() => document.body.innerText);
              fs.writeFileSync(`${OUT}/${name}.texte.txt`, `URL : ${page.url()}\n\n${text}`);
              if (withHtml) fs.writeFileSync(`${OUT}/${name}.html`, await page.content());
              const links = await page.evaluate(() =>
                [...document.querySelectorAll('a[href]')].map(a => ({ texte: a.innerText.trim().slice(0, 80), href: a.href })));
              fs.writeFileSync(`${OUT}/${name}.liens.json`, JSON.stringify(links, null, 2));
              await page.screenshot({ path: `${OUT}/${name}.png` });
            } catch (e) {
              info.erreur = String(e.message).split('\n')[0];
            }
            fs.writeFileSync(`${OUT}/${name}.reseau.json`, JSON.stringify(calls, null, 2));
            report.push(info);
            calls.length = 0;
          }
 
          for (const p of PAGES) {
            const page = await context.newPage();
            const calls = [];
            page.on('response', async res => {
              try {
                const req = res.request();
                if (!['xhr', 'fetch'].includes(req.resourceType())) return;
                const type = res.headers()['content-type'] || '';
                if (!/json|text|xml/i.test(type) || calls.length >= 80) return;
                const corps = (await res.text()).slice(0, 120000);
                calls.push({ methode: req.method(), url: res.url(), statut: res.status(), type, corps });
              } catch {}
            });
            try {
              await page.goto(p.url, { waitUntil: 'networkidle', timeout: 60000 });
              await sleep(4000);
              await accepterCookies(page);
              await sleep(1500);
            } catch (e) {
              report.push({ name: p.name, url: p.url, erreur: String(e.message).split('\n')[0] });
            }
            await snapshot(page, p.name, calls, true);
 
            for (const label of p.clics) {
              try {
                await page.getByText(label, { exact: false }).first().click({ timeout: 5000 });
                await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {});
                await sleep(3000);
                await snapshot(page, `${p.name}--${slug(label)}`, calls, false);
              } catch (e) {
                report.push({ name: `${p.name}--${label}`, erreur: 'clic impossible : ' + String(e.message).split('\n')[0] });
              }
            }
            await page.close();
          }
 
          fs.writeFileSync(`${OUT}/rapport.json`, JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          await browser.close();
          EOF
 
      - name: Lancer l'exploration
        working-directory: robot
        run: node explore.mjs
 
      - name: Sauvegarder les resultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exploration
          path: robot/out
          retention-days: 7
 
